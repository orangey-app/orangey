/**
 * The dice tray and the coin.
 *
 * Two dice styles. "flat" is the plain numbered square. "wireframe" draws the
 * die as the solid it actually is — a tetrahedron for a d4, a cube for a d6,
 * an octahedron, a pentagonal trapezohedron for the ten-siders, a dodecahedron
 * and an icosahedron — using the vertices-edges-project-draw technique from
 * the Rosetta Code rotating cube, with the orientation held as a quaternion so
 * the die can change axis mid-flight and still land flat (see
 * `src/core/polyhedra.ts`).
 *
 * Neither gives the answer away while it is moving: the dice cycle through
 * changing values and settle onto the real ones, and the coin shows nothing
 * until it lands. Both finish with a bounce whose size follows the Settle
 * setting, and both can be skipped straight to the landing at any moment —
 * the result was decided before the animation began.
 */


                                                              



                           
                  
                                                              
               
 

                   
                
                
                
     
                                                        
    
                                                                            
                                                                           
                                               
     
                  
                  
                
                    
                    
                                                                        
               
     
                                                                    
    
                                                                          
                         
     
               
 

/**
 * Put each die in a wrapper that flies it in. All dice launch from one point
 * below the middle of the tray, scatter to a random spot on the way, and
 * arrive at their own slot — so the scatter is random but the order they end
 * up in is not. Only transform is animated.
 */
function launch(tray             , wrappers               , feel              , durationMs        )       {
  const box = tray.getBoundingClientRect();
  const from = { x: box.left + box.width / 2, y: box.bottom + 30 };
  wrappers.forEach((w, i) => {
    const r = w.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const sx = from.x - cx;
    const sy = from.y - cy;
    const spread = feel.dice.spread;
    const mx = (Math.random() - 0.5) * box.width * 0.9 * spread + sx * 0.35;
    const my = -(20 + Math.random() * 70 * spread) - r.height * 0.3;
    w.style.setProperty("--sx", `${sx.toFixed(1)}px`);
    w.style.setProperty("--sy", `${sy.toFixed(1)}px`);
    w.style.setProperty("--mx", `${mx.toFixed(1)}px`);
    w.style.setProperty("--my", `${my.toFixed(1)}px`);
    w.style.setProperty("--flight", `${Math.round(durationMs)}ms`);
    w.style.animationDelay = `${Math.round(i * 30 * spread)}ms`;
    w.classList.add("flying");
  });
}

/**
 * The dice grouped by when they land, earliest first, each group with the
 * time it is thrown in. One group for an ordinary roll; more when something
 * exploded or was rerolled.
 */
function throwsOf(dice           , duration        )                                                           {
  const times = diceWaves(duration, dice.map((d) => d.wave));
  const byLanding = new Map                                                                ();
  times.forEach((t, i) => {
    const group = byLanding.get(t.landAt) ?? { throwAt: t.throwAt, landAt: t.landAt, indices: [] };
    group.indices.push(i);
    byLanding.set(t.landAt, group);
  });
  return [...byLanding.values()].sort((a, b) => a.landAt - b.landAt);
}

function createDiceTray()           {
  const el = h("div", { class: "dice-tray" });
  let finish                      = null;

  /**
   * How a die reads: dropped by a keep/drop, or a natural high or low.
   *
   * The flat tray and the wireframe tray want the same words on different
   * base classes, so the base is the only thing that differs.
   */
  const dieClasses = (die         , base        )         => {
    const classes = [base];
    // A rerolled die reads like a dropped one: it happened, it does not count.
    if (!die.kept) classes.push(die.rerolled ? "dropped rerolled" : "dropped");
    if (die.exploded) classes.push("exploded");
    if (die.kept && die.value === die.faceMax) classes.push("max");
    if (die.kept && die.value === die.faceMin) classes.push("min");
    return classes.join(" ");
  };

  /** What a face reads as: a Fate die is a sign, not a number. */
  const faceText = (die         , value = die.value)         => {
    if (!die.fate) return String(value);
    return value > 0 ? "+" : value < 0 ? "−" : "0";
  };

  const titleFor = (die         )         => {
    const what = die.fate
      ? `${die.value > 0 ? "plus" : die.value < 0 ? "minus" : "blank"} on a Fate die`
      : `${die.value} on a d${die.sides}`;
    if (die.rerolled) return `${what}, rerolled`;
    if (!die.kept) return `${die.value}, dropped`;
    return die.exploded ? `${what}, exploded` : what;
  };

  /** A face that is not the answer, for the tumble. */
  const tumbleFace = (die         )         =>
    die.fate ? faceText(die, Math.floor(Math.random() * 3) - 1) : String(1 + Math.floor(Math.random() * die.sides));

  /**
   * The wireframe dice this tray put in the shared animation loop.
   *
   * The loop is shared by every tray on the page — a board rolls several at
   * once — so a tray starting a roll may only take its own dice out of it.
   * Clearing the whole set left the other trays' dice drawn but never
   * stepped, which is how a board ended up with wireframes that sat still.
   */
  let mine            = [];

  /* ---- flat ------------------------------------------------------------- */

  function showFlat(dice           , feel              , duration        , bounce        )                {
    if (duration <= 0) {
      el.replaceChildren(
        ...dice.map((die) => h("div", { class: dieClasses(die, "die"), title: titleFor(die) }, faceText(die))),
      );
      return Promise.resolve();
    }

    // Tumbling: faces showing values that are not the answer. How fast they
    // tumble and how often the numbers change both come from the settings,
    // so a quick roll looks hurried rather than merely shorter.
    const tumbleCycle = Math.min(500, Math.max(140, duration / 3));
    const faceChange = Math.min(140, Math.max(45, duration / 10));

    const elements = dice.map((die) =>
      h("div", {
        class: "die rolling",
        style: {
          animationDelay: `${Math.round(Math.random() * 120 * feel.dice.spread)}ms`,
          animationDuration: `${Math.round(tumbleCycle)}ms`,
        }                                ,
        "aria-hidden": "true",
      }, tumbleFace(die)),
    );
    const wrappers = elements.map((e) => h("div", { class: "die-flight" }, e));
    el.replaceChildren(...wrappers);

    // A die an explosion or a reroll adds is not in the air until the throw
    // before it has landed: it waits, unseen, in the place it will land.
    const throws = throwsOf(dice, duration);
    const landed = new Set        ();
    const timers                                  = [];
    for (const t of throws) {
      const flight = t.indices.map((i) => wrappers[i]);
      if (t.throwAt === 0) {
        launch(el, flight, feel, t.landAt);
        continue;
      }
      for (const w of flight) w.classList.add("waiting");
      timers.push(setTimeout(() => {
        for (const w of flight) w.classList.remove("waiting");
        launch(el, flight, feel, t.landAt - t.throwAt);
      }, t.throwAt));
    }

    const spin = setInterval(() => {
      elements.forEach((node, i) => {
        if (!landed.has(i)) node.textContent = tumbleFace(dice[i]);
      });
    }, faceChange);

    return new Promise      ((resolve) => {
      /** Put these dice down on their real faces. */
      const put = (indices          ) => {
        indices.forEach((i, n) => {
          if (landed.has(i)) return;
          landed.add(i);
          const node = elements[i];
          const die = dice[i];
          wrappers[i].classList.remove("flying", "waiting");
          node.className = dieClasses(die, "die");
          node.textContent = faceText(die);
          node.removeAttribute("aria-hidden");
          node.title = titleFor(die);
          if (bounce > 0) {
            node.style.setProperty("--bounce", `${bounce}ms`);
            node.style.animationDelay = `${Math.round(n * 25 * feel.dice.spread)}ms`;
            node.classList.add("landing");
          }
        });
        vibrate(feel, 12);
      };
      /** The last throw is down: the roll is over once its bounce is. */
      const done = (lastCount        ) => {
        clearInterval(spin);
        for (const timer of timers) clearTimeout(timer);
        finish = null;
        if (bounce > 0) setTimeout(resolve, bounce + lastCount * 25 * feel.dice.spread);
        else resolve();
      };
      throws.forEach((t, k) => {
        timers.push(setTimeout(() => {
          put(t.indices);
          if (k === throws.length - 1) done(t.indices.length);
        }, t.landAt));
      });
      // Skipping puts every die down at once, the later throws included.
      finish = () => {
        const rest = dice.map((_, i) => i).filter((i) => !landed.has(i));
        put(rest);
        done(rest.length);
      };
    });
  }

  /* ---- wireframe -------------------------------------------------------- */

  function showWireframe(dice           , feel              , duration        , bounce        )                {
    const colours = readColours();
    const size = 92;
    const dpr = Math.min(3, globalThis.devicePixelRatio || 1);

    const slots = dice.map((die) => {
      const canvas = h("canvas", {
        class: "die-canvas",
        width: String(Math.round(size * dpr)),
        height: String(Math.round(size * dpr)),
        style: { width: `${size}px`, height: `${size}px` }                                ,
        "aria-hidden": "true",
      });
      const value = h("span", { class: "die-value" });
      const stage = h("div", { class: "die-stage" }, canvas, value);
      const caption = h("span", { class: "die-caption" });
      const slot = h("div", { class: "die-slot rolling", title: titleFor(die) }, stage, caption);
      const flight = h("div", { class: "die-flight" }, slot);
      return { slot, stage, canvas, value, caption, flight };
    });
    el.replaceChildren(...slots.map((s) => s.flight));

    // As in the flat tray: a later throw waits, unseen, where it will land.
    const throws = throwsOf(dice, duration);
    const timing = new Map                                             ();
    for (const t of throws) for (const i of t.indices) timing.set(i, t);
    const timers                                  = [];
    if (duration > 0) {
      for (const t of throws) {
        const flight = t.indices.map((i) => slots[i].flight);
        if (t.throwAt === 0) {
          launch(el, flight, feel, t.landAt);
          continue;
        }
        for (const f of flight) f.classList.add("waiting");
        timers.push(setTimeout(() => {
          for (const f of flight) f.classList.remove("waiting");
          launch(el, flight, feel, t.landAt - t.throwAt);
        }, t.throwAt));
      }
    }

    const start = performance.now();
    const wires            = dice.map((die, i) => {
      const solid = solidForSides(die.sides);
      const axes = pickTumbleAxes(solid);
      // Each die tumbles for its own flight: the whole duration for the first
      // throw, the gap before it lands for a later one.
      const when = timing.get(i) ?? { throwAt: 0, landAt: duration };
      const flight = Math.max(1, when.landAt - when.throwAt);
      // Two or three whole turns across the tumble, so the die reads as
      // rolling rather than shivering, whatever the duration is set to.
      const turns = 2 + Math.random() * 1.5;
      const base = (Math.PI * 2 * turns) / Math.max(0.2, flight / 1000);
      const from = start + when.throwAt;
      const schedule = bounceSchedule(flight, feel.dice.bounces);
      return {
        canvas: slots[i].canvas,
        ctx: slots[i].canvas.getContext("2d"),
        dpr,
        solid,
        q: quatFromAxisAngle(axes[0], Math.random() * Math.PI * 2),
        axes,
        speeds: [base * (Math.random() < 0.5 ? -1 : 1), base * 0.65 * (Math.random() < 0.5 ? -1 : 1)],
        bounceAt: schedule.bounceAt.map((t) => from + t),
        nextBounce: 0,
        nextAxis: 0,
        settleFrom: null,
        settleStart: from + schedule.settleStart,
        settleEnd: from + schedule.settleEnd,
        // Resting square-on to the viewer, allowing for the camera tilt, so
        // the face is seen undistorted and its number can sit inside it.
        rest: restQuaternion(solid, die.face % solid.faces.length, Math.random() * Math.PI * 2, VIEW_TILT),
        ink: colours.ink,
        accent: colours.accent,
        radius: size * 0.34,
        faceIndex: die.face % solid.faces.length,
        landed: false,
      };
    });

    // One size for every number in the tray, comfortable in the smallest
    // face present, so a d12 beside a d6 reads as a set rather than a jumble
    // of type sizes. Worked out once for all of them, whichever throw lands
    // first, so a later throw does not change the size of numbers already down.
    let fits                                             = null;
    let fitSize = Infinity;

    /** Put these dice down on their real faces. */
    const reveal = (indices          ) => {
      if (!fits) {
        fits = wires.map((wire, i) => fitValueToFace(wire, slots[i].value));
        fitSize = Math.min(...fits.map((f) => f?.size ?? Infinity));
      }
      indices.forEach((i, n) => {
        const wire = wires[i];
        if (wire.landed) return;
        const die = dice[i];
        active.delete(wire);
        wire.q = wire.rest;
        wire.landed = true;
        draw(wire);
        slots[i].flight.classList.remove("flying", "waiting");
        slots[i].slot.className = dieClasses(die, "die-slot");
        slots[i].value.textContent = faceText(die);
        slots[i].caption.textContent = faceText(die);
        const fit = fits [i];
        if (fit) {
          const label = slots[i].value;
          label.style.fontSize = `${Math.max(8, Number.isFinite(fitSize) ? fitSize : fit.size).toFixed(1)}px`;
          placeOnFace(label, fit.centre);
        }
        if (bounce > 0) {
          slots[i].stage.style.setProperty("--bounce", `${bounce}ms`);
          slots[i].stage.style.animationDelay = `${Math.round(n * 25 * feel.dice.spread)}ms`;
          slots[i].stage.classList.add("landing");
        }
      });
    };

    mine = wires;

    if (duration <= 0) {
      reveal(dice.map((_, i) => i));
      return Promise.resolve();
    }

    for (const wire of wires) active.add(wire);
    ensureLoop();

    return new Promise      ((resolve) => {
      const done = (lastCount        ) => {
        for (const timer of timers) clearTimeout(timer);
        finish = null;
        if (bounce > 0) setTimeout(resolve, bounce + lastCount * 25 * feel.dice.spread);
        else resolve();
      };
      throws.forEach((t, k) => {
        timers.push(setTimeout(() => {
          reveal(t.indices);
          vibrate(feel, 12);
          if (k === throws.length - 1) done(t.indices.length);
        }, t.landAt));
      });
      // Skipping puts every die down at once, the later throws included.
      finish = () => {
        const rest = wires.map((_, i) => i).filter((i) => !wires[i].landed);
        reveal(rest);
        vibrate(feel, 12);
        done(rest.length);
      };
    });
  }

  return {
    el,
    show(result, feel) {
      const dice            = result.terms.flatMap((t) =>
        (t.dice ?? []).map((d) => ({
          value: d.value,
          kept: d.kept,
          sides: t.sides ,
          faceMin: t.faceMin ?? 1,
          faceMax: t.faceMax ?? t.sides ,
          fate: t.fate === true,
          rerolled: d.rerolled === true,
          exploded: d.exploded === true,
          wave: d.wave ?? 0,
          // Fate runs -1..1, so its zero-based face is value + 1.
          face: t.fate ? d.value + 1 : d.value - 1,
        })),
      );
      const shown = dice.slice(0, 40);
      const duration = motionScale(feel.motion) === 0 ? 0 : diceDuration(feel);
      const bounce = bounceMs(feel);
      // Forty spinning solids is a lot of work for a phone, and forty tiny
      // wireframes are unreadable anyway, so a big handful stays flat.
      const wireframe = feel.dice.style === "wireframe" && shown.length <= WIREFRAME_DICE_LIMIT;
      for (const wire of mine) active.delete(wire);
      mine = [];
      return wireframe ? showWireframe(shown, feel, duration, bounce) : showFlat(shown, feel, duration, bounce);
    },
    skip() {
      finish?.();
    },
  };
}

/* -------------------------------------------------------------------------- */
/* wireframe dice                                                             */
/* -------------------------------------------------------------------------- */

/**
 * How a wireframe die tumbles.
 *
 * It spins about two of the solid's own diagonals at once. At every bounce one
 * of those two axes is swapped for another diagonal and given a new speed —
 * the other carries on — which is what stops the motion reading as a single
 * mechanical spin. Through the last bounce the orientation is interpolated
 * into a resting pose with a face flat and level, so the die ends the way a
 * real one does rather than frozen mid-tumble.
 */
                   
                            
     
                                        
    
                                                                           
                                                                         
                                              
     
                                       
              
               
                             
          
                                                                                 
                     
                           
                                                                        
                     
                                           
                     
                                                        
                  
                                                 
                    
                                                                              
                  
                                                               
                          
                      
                    
             
              
                 
                 
 

/**
 * The camera looks slightly down at the dice, the way you look at a table.
 * Without it a die at rest — which by definition has a face pointing straight
 * up — is seen exactly edge-on, and its top face is invisible.
 */
const VIEW_TILT = quatFromAxisAngle([1, 0, 0], 0.42);

const active = new Set         ();
let frameHandle                = null;
let lastFrame = 0;

function pump(now        )       {
  const dt = lastFrame === 0 ? 16 : Math.min(64, now - lastFrame);
  lastFrame = now;
  for (const die of active) step(die, now, dt / 1000);
  frameHandle = active.size > 0 ? requestAnimationFrame(pump) : null;
  if (active.size === 0) lastFrame = 0;
}

function ensureLoop()       {
  if (frameHandle === null) frameHandle = requestAnimationFrame(pump);
}

function step(die         , now        , dt        )       {
  if (now >= die.settleEnd) {
    die.q = die.rest;
    draw(die);
    active.delete(die);
    return;
  }

  if (now >= die.settleStart) {
    // The last bounce: ease from wherever the tumble had got to onto the
    // resting pose, so the die arrives flat instead of stopping dead.
    if (!die.settleFrom) die.settleFrom = die.q;
    const t = (now - die.settleStart) / (die.settleEnd - die.settleStart);
    // Smooth ease-out, no overshoot: the die is coming to rest, and the hop is
    // the wrapper's job.
    die.q = quatSlerp(die.settleFrom, die.rest, 1 - (1 - t) ** 3);
    draw(die);
    return;
  }

  while (die.nextBounce < die.bounceAt.length && now >= die.bounceAt[die.nextBounce]) {
    const axis = die.nextAxis;
    die.axes[axis] = die.solid.diagonals[Math.floor(Math.random() * die.solid.diagonals.length)];
    // Each bounce takes some energy out, and can reverse the spin.
    die.speeds[axis] = die.speeds[axis] * (0.55 + Math.random() * 0.3) * (Math.random() < 0.35 ? -1 : 1);
    die.nextAxis = axis === 0 ? 1 : 0;
    die.nextBounce++;
  }

  const a = quatFromAxisAngle(die.axes[0], die.speeds[0] * dt);
  const b = quatFromAxisAngle(die.axes[1], die.speeds[1] * dt);
  die.q = quatNormalize(quatMultiply(die.q, quatMultiply(a, b)));
  draw(die);
}

function draw(die         )       {
  const ctx = die.ctx;
  if (!ctx) return;
  const dpr = die.dpr;
  const w = die.canvas.width;
  const h = die.canvas.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.setTransform(dpr, 0, 0, dpr, w / 2, h / 2);

  const orientation = quatMultiply(VIEW_TILT, die.q);
  const points = die.solid.vertices.map((v) => project(rotateVec(orientation, v), die.radius));

  // Far edges first and fainter, so the solid reads as three-dimensional
  // without any shading.
  const edges = die.solid.edges
    .map(([a, b]) => ({ a, b, depth: (points[a].z + points[b].z) / 2 }))
    .sort((x, y) => x.depth - y.depth);

  ctx.lineCap = "round";
  for (const edge of edges) {
    const near = (edge.depth + 1) / 2; // 0 far, 1 near
    ctx.globalAlpha = 0.28 + near * 0.72;
    ctx.lineWidth = 0.9 + near * 0.8;
    ctx.strokeStyle = die.ink;
    ctx.beginPath();
    ctx.moveTo(points[edge.a].x, points[edge.a].y);
    ctx.lineTo(points[edge.b].x, points[edge.b].y);
    ctx.stroke();
  }

  // Once it has settled, outline the face being read: a wireframe is
  // see-through, so without this it is not obvious which polygon the number
  // belongs to.
  if (die.landed) {
    const face = die.solid.faces[die.faceIndex];
    if (face && face.length >= 3) {
      const centre = face.reduce(
        (a, i) => ({ x: a.x + points[i].x / face.length, y: a.y + points[i].y / face.length }),
        { x: 0, y: 0 },
      );
      const ordered = [...face].sort(
        (a, b) =>
          Math.atan2(points[a].y - centre.y, points[a].x - centre.x) -
          Math.atan2(points[b].y - centre.y, points[b].x - centre.x),
      );
      ctx.globalAlpha = 1;
      ctx.lineWidth = 2;
      ctx.strokeStyle = die.accent;
      ctx.beginPath();
      ordered.forEach((i, n) => (n === 0 ? ctx.moveTo(points[i].x, points[i].y) : ctx.lineTo(points[i].x, points[i].y)));
      ctx.closePath();
      ctx.stroke();
    }
  }

  ctx.fillStyle = die.accent;
  for (const p of points) {
    if (p.z < 0) continue;
    ctx.globalAlpha = 0.35 + ((p.z + 1) / 2) * 0.65;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.7, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/**
 * Size and place the number so it sits inside the face the die came to rest
 * showing: half the length of one of that face's sides, centred on it.
 *
 * The measurement is taken from the projected vertices rather than worked out
 * from the geometry, so it is right whatever the solid, the camera or the die
 * size happen to be. Two refinements to the plain rule, both of which only
 * ever make the number smaller:
 *
 *  - a kite has two short sides and two long ones, so the mean side is used;
 *    on a regular face every side is the same and the rule is unchanged;
 *  - a number of more than one digit is shrunk until it fits within the
 *    face's inscribed circle, because half a side of a triangle is wider than
 *    a triangle has room for once there are two digits in it.
 */
/**
 * Put a die's number on the middle of its face — the middle of the digits
 * actually drawn, not of the box they sit in.
 *
 * The box is as tall as the font, not as the digits: in a font whose 1 and 3
 * sit lower than its 8, "13" centred as a box hangs below the middle of the
 * face. The canvas measures the ink itself, so the number is moved by the
 * difference. If the dice font has not finished loading, the fallback's
 * shapes are measured now and the number is placed again once it has.
 */
let inkContext                                             ;
function placeOnFace(label             , centre                          )       {
  const ink = inkOffset(label);
  label.style.transform = `translate(${(centre.x - ink.x).toFixed(1)}px, ${(centre.y - ink.y).toFixed(1)}px)`;
  if (!ink.fontReady) void document.fonts?.load(ink.font, label.textContent ?? "").then(() => {
    const again = inkOffset(label);
    label.style.transform = `translate(${(centre.x - again.x).toFixed(1)}px, ${(centre.y - again.y).toFixed(1)}px)`;
  }, () => {});
}

function inkOffset(label             )                                                             {
  if (inkContext === undefined) inkContext = document.createElement("canvas").getContext("2d");
  const text = label.textContent ?? "";
  const style = getComputedStyle(label);
  const font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
  const fontReady = document.fonts?.check(font, text) ?? true;
  if (!inkContext || !text) return { x: 0, y: 0, font, fontReady };
  inkContext.font = font;
  const m = inkContext.measureText(text);
  // With line-height 1 the baseline sits (ascent - descent) / 2 below the
  // middle of the box; the ink's middle is measured from that baseline.
  const baseline = (m.fontBoundingBoxAscent - m.fontBoundingBoxDescent) / 2;
  const y = baseline + (m.actualBoundingBoxDescent - m.actualBoundingBoxAscent) / 2;
  const x = (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2 - m.width / 2;
  return { x, y, font, fontReady };
}

function fitValueToFace(die         , label             )                                                            {
  const face = die.solid.faces[die.faceIndex];
  if (!face || face.length < 3) return null;
  // The resting pose, not the current one: the number sits on the face the
  // die comes to rest on, and with dice landing in throws this is worked out
  // before every die in the tray has been turned to rest.
  const orientation = quatMultiply(VIEW_TILT, die.rest);
  const points = face.map((i) => {
    const p = project(rotateVec(orientation, die.solid.vertices[i]), die.radius);
    return { x: p.x, y: p.y };
  });

  const centre = points.reduce(
    (a, p) => ({ x: a.x + p.x / points.length, y: a.y + p.y / points.length }),
    { x: 0, y: 0 },
  );
  // Walk the vertices round the centre so that consecutive ones are the
  // polygon's actual sides; the face list is a set, not a loop.
  const ordered = [...points].sort(
    (a, b) => Math.atan2(a.y - centre.y, a.x - centre.x) - Math.atan2(b.y - centre.y, b.x - centre.x),
  );

  let sideTotal = 0;
  let inradius = Infinity;
  for (let i = 0; i < ordered.length; i++) {
    const a = ordered[i];
    const b = ordered[(i + 1) % ordered.length];
    const side = Math.hypot(b.x - a.x, b.y - a.y);
    sideTotal += side;
    if (side > 0) {
      // Distance from the centre to this side.
      const area = Math.abs((b.x - a.x) * (a.y - centre.y) - (a.x - centre.x) * (b.y - a.y));
      inradius = Math.min(inradius, area / side);
    }
  }
  const meanSide = sideTotal / ordered.length;
  if (!Number.isFinite(meanSide) || meanSide <= 0 || !Number.isFinite(inradius)) return null;

  let size = meanSide * 0.5;
  const digits = (label.textContent ?? "").length;
  if (digits > 1) {
    // Rough advance width per digit for the interface font, at font-size 1.
    const width = size * 0.62 * digits;
    const room = inradius * 1.7;
    if (width > room) size *= room / width;
  }

  return { size, centre };
}

function readColours()                                  {
  const style = getComputedStyle(document.documentElement);
  return {
    ink: style.getPropertyValue("--ink").trim() || "#23201c",
    accent: style.getPropertyValue("--accent").trim() || "#c96a1f",
  };
}

/**
 * The coin.
 *
 * It lived in `dice.ts` because both are "things that land on a number", but
 * it shares no code with the dice: the coin is a CSS animation on two
 * elements, and the dice are a canvas and a solid. Its own file says so.
 *
 * The toss is only transforms, so it runs on the compositor and a phone can
 * do it without dropping the rest of the page.
 */




                           
                  
                                                        
               
 

function createCoin()           {
  const disc = h("div", { class: "coin" }, "?");
  const flight = h("div", { class: "coin-flight" }, disc);
  const el = h("div", { class: "coin-wrap" }, flight);
  let finish                      = null;

  return {
    el,
    show(face, feel) {
      const duration = coinDuration(feel);
      const bounce = bounceMs(feel);
      if (duration <= 0 || motionScale(feel.motion) === 0) {
        disc.className = "coin";
        flight.className = "coin-flight";
        disc.textContent = face;
        return Promise.resolve();
      }

      // The toss: the coin rises along a parabola, shrinking as it goes away,
      // spinning about its own axis the whole time, and comes back down to
      // where it started. Only transforms are animated.
      disc.textContent = "";
      disc.className = "coin";
      flight.className = "coin-flight";
      void disc.offsetWidth; // restart the animations
      const size = disc.getBoundingClientRect().height || 96;
      disc.style.setProperty("--coin-duration", `${duration}ms`);
      disc.style.setProperty("--coin-flips", String(feel.coin.flips));
      flight.style.setProperty("--coin-duration", `${duration}ms`);
      flight.style.setProperty("--arc-h", `${(feel.coin.arc * size).toFixed(0)}px`);
      flight.style.setProperty("--travel", `${(feel.coin.arc > 0 ? size * 0.9 : 0).toFixed(0)}px`);
      flight.style.setProperty("--shrink", String(feel.coin.arc > 0 ? 0.62 : 1));
      disc.classList.add("flipping");
      flight.classList.add("tossing");

      return new Promise      ((resolve) => {
        const land = () => {
          clearTimeout(timer);
          disc.classList.remove("flipping");
          flight.classList.remove("tossing");
          disc.textContent = face;
          vibrate(feel, 12);
          finish = null;
          if (bounce > 0) {
            flight.style.setProperty("--bounce", `${bounce}ms`);
            void flight.offsetWidth;
            flight.classList.add("landing");
            setTimeout(resolve, bounce);
          } else {
            resolve();
          }
        };
        finish = land;
        const timer = setTimeout(land, duration);
      });
    },
    skip() {
      finish?.();
    },
  };
}

/**
 * The result panel: the largest thing on the screen, and the only place a
 * result is ever announced.
 *
 * Its height is reserved, not discovered. `reserve()` is called with the
 * longest outcome the current randomizer can produce, and from that the panel
 * fixes its type size and how many lines it keeps — so the card never grows
 * when a roll lands, and never grows again when a longer outcome comes up
 * later. An outcome that still does not fit is clipped with an ellipsis; the
 * spoken announcement is always the whole thing.
 *
 * The live region is updated when the animation ends (or immediately in
 * instant mode) so that a screen reader is never told the answer before the
 * table can see it.
 */



                                          

                              
                  
                                                              
                                                                               
                               
                                    
                               
     
                                                                            
                                                                          
                             
     
                                                                            
     
                                                                              
                                                                           
                        
     
                                                            
                                                                                       
                          
 

                               
                               
                 
                     
                                                                    
                 
                                                                                                     
                  
 

/** Beyond this many characters the result drops to the smaller type size. */
const RESULT_SMALL_AT = 18;
/** Beyond this many characters a second line is kept, so wrapping cannot push. */
const RESULT_TWO_LINES_AT = 12;

function resultLines(longest        )        {
  return longest.length > RESULT_TWO_LINES_AT ? 2 : 1;
}

function resultIsSmall(longest        )          {
  return longest.length > RESULT_SMALL_AT;
}

function createResultPanel(placeholder = "Ready")              {
  const value = h("div", { class: "result-value", text: placeholder });
  const slot = h("div", { class: "result-slot" }, value);
  const detail = h("div", { class: "result-detail" });
  const meta = h("div", { class: "result-meta" });
  const live = h("div", { class: "sr-only", role: "status", "aria-live": "polite", "aria-atomic": "true" });
  // The picture an outcome carries sits above its name: the table looks at the
  // picture, the name is what gets written down.
  const picture = h("img", { class: "result-picture", alt: "" });
  picture.hidden = true;
  // The cards of an offer. The row is laid out from the moment a randomizer
  // that offers is opened, with invisible stand-ins for every card, so the
  // panel is already as tall as it will be when the cards arrive.
  const cards = h("div", { class: "offer-cards", role: "group", "aria-label": "Choose one" });
  cards.hidden = true;
  let slots = 0;
  const el = h("div", { class: "result-panel" }, picture, slot, cards, detail, meta, live);

  /** The empty row: one invisible card per slot, holding the height. */
  function resetCards()       {
    setChildren(cards, ...Array.from({ length: slots }, () => standIn()));
  }
  const standIn = () => h("span", { class: "offer-card placeholder", "aria-hidden": "true" }, h("span", { class: "offer-text", text: "\u00a0" }));

  // Arrow keys walk the row; the digits 1 to 9 pick. On the play screen the
  // digits also work from anywhere, which the view handles; here they work
  // wherever this panel is, a board cell included, once focus is on a card.
  cards.addEventListener("keydown", (e) => {
    const all = [...cards.querySelectorAll                   ("button.offer-card")];
    const at = all.indexOf(document.activeElement                     );
    if (at < 0) return;
    const key = (e                 ).key;
    const step = key === "ArrowRight" || key === "ArrowDown" ? 1 : key === "ArrowLeft" || key === "ArrowUp" ? -1 : 0;
    if (step) {
      e.preventDefault();
      all[(at + step + all.length) % all.length].focus();
    } else if (/^[1-9]$/.test(key) && Number(key) <= all.length) {
      e.preventDefault();
      all[Number(key) - 1].click();
    }
  });

  function showPicture(id                    , alt        )       {
    if (!id) {
      picture.hidden = true;
      picture.removeAttribute("src");
      return;
    }
    const url = imageUrlSync(id);
    if (!url) {
      void imageUrl(id).then((ready) => {
        if (ready) showPicture(id, alt);
      });
      return;
    }
    (picture                    ).src = url;
    picture.alt = alt;
    picture.hidden = false;
  }

  return {
    el,
    show(outcome, { announce = true } = {}) {
      // A dice total is set in the dice's own numerals; a wheel's answer is not,
      // even when it holds a number ("3 wolves").
      el.classList.toggle("is-dice", outcome.kind === "dice");
      el.classList.remove("is-pending");
      value.textContent = outcome.text;
      value.classList.toggle("is-max", outcome.isMaximum === true);
      value.classList.toggle("is-min", outcome.isMinimum === true);
      value.title = outcome.text;
      detail.textContent = outcome.detail ?? "";
      meta.textContent = outcome.seed ? `seed ${outcome.seed}` : "";
      showPicture(outcome.image, outcome.text);
      // A pick keeps its cards on show, faded around the one taken; any
      // other answer empties the row.
      if (!outcome.offered) resetCards();
      if (announce) live.textContent = outcome.speak;
    },
    pending(text = "Rolling…") {
      el.classList.add("is-pending");
      resetCards();
      showPicture(undefined, "");
      value.textContent = text;
      value.classList.remove("is-max", "is-min");
      value.removeAttribute("title");
      detail.textContent = "";
      meta.textContent = "";
    },
    clear(text = placeholder) {
      el.classList.remove("is-pending");
      resetCards();
      showPicture(undefined, "");
      value.textContent = text;
      value.classList.remove("is-max", "is-min");
      value.removeAttribute("title");
      detail.textContent = "";
      meta.textContent = "";
    },
    reserve(longest, { seed = false, offer = 0 } = {}) {
      // Only when the count changes: this runs again whenever settings or
      // history change, and an offer on the table must not be swept away.
      if (offer !== slots) {
        slots = offer;
        cards.hidden = slots === 0;
        resetCards();
      }
      const lines = resultLines(longest);
      slot.classList.toggle("small", resultIsSmall(longest));
      el.style.setProperty("--result-lines", String(lines));
      // Full screen uses this: two lines of the largest type is a lot of a
      // short window, so the type there gives way rather than the wheel.
      el.classList.toggle("two-lines", lines === 2);
      el.classList.toggle("seeded", seed);
    },
    announce(text) {
      live.textContent = text;
    },
    offer(texts, { onPick, prompt, faceDown = false, flipMs, focus = false }) {
      el.classList.add("is-pending");
      showPicture(undefined, "");
      value.textContent = prompt;
      value.classList.remove("is-max", "is-min");
      value.removeAttribute("title");
      detail.textContent = "";
      meta.textContent = "";
      cards.hidden = false;
      cards.classList.toggle("flipping", flipMs > 0 && !faceDown);
      cards.style.setProperty("--offer-flip", `${flipMs}ms`);
      const made = texts.map((text, i) => {
        const card = h("button", {
          type: "button",
          class: faceDown ? "offer-card face-down" : "offer-card",
          style: `--i: ${i}`,
          ...(faceDown ? { disabled: true, "aria-label": `Card ${i + 1}, face down` } : { title: text }),
        },
          h("span", { class: "offer-key", "aria-hidden": "true", text: i < 9 ? String(i + 1) : "" }),
          h("span", { class: "offer-text", text: faceDown ? "" : text }),
        );
        card.addEventListener("click", () => {
          if (card.getAttribute("aria-disabled") === "true") return;
          onPick(i);
        });
        return card;
      });
      setChildren(cards, ...made, ...Array.from({ length: Math.max(0, slots - made.length) }, () => standIn()));
      // Said once the cards can be read, like any answer (P15).
      live.textContent = faceDown ? "" : `Choose one: ${texts.join(", ")}.`;
      if (focus && !faceDown) made[0]?.focus({ preventScroll: true });
    },
    chose(at) {
      const all = [...cards.querySelectorAll                   ("button.offer-card")];
      // A digit can pick a card other than the focused one; the keyboard
      // follows the pick, or the focus ring would sit on a card not taken.
      if (all.includes(document.activeElement                     )) all[at]?.focus({ preventScroll: true });
      all.forEach((card, i) => {
        card.classList.add(i === at ? "chosen" : "not-chosen");
        // aria-disabled rather than disabled: the card keeps the keyboard's
        // focus, which a disabled button would drop onto the page.
        card.setAttribute("aria-disabled", "true");
      });
    },
  };
}

/**
 * The Recent rolls panel: the last few rolls, wherever the table can see them.
 *
 * The panel belongs to a set of randomizers — the one a play screen has open,
 * the several a board shows — and both the rows and the Clear beside the
 * heading are about that set, so Clear removes what is in front of the user
 * and nothing behind it. No ids at all means the whole history, which is what
 * the quick play screen has in front of it.
 */





                                     
                                                                         
                      
                                                                                        
                          
                                              
                 
 

                                  
                  
                  
 

const RECENT_ROLLS_LIMIT = 8;

/**
 * The faint lines under a row's result, for this panel and the History view
 * alike: "3 wolves" stays the headline and the dice behind the 3 sit beneath.
 */
function rollDetailLines(row            )                {
  const { parts, from } = rollDetails(row);
  return [
    parts ? h("span", { class: "roll-note roll-parts", text: parts }) : null,
    from ? h("span", { class: "roll-note roll-from", text: from }) : null,
  ].filter((el)                        => el !== null);
}

/**
 * What Clear is about to take, named. An empty scope is the whole history.
 *
 * The count is every roll of those randomizers, not the few rows on screen:
 * the confirm is the last chance to see how much is going.
 */
function clearRollsPrompt(count        , scope        )         {
  if (!scope) return "Clear the whole history?";
  // "6 rolls of Forest Encounters", but "12 rolls from this board": a name
  // takes "of", a phrase that already points at the screen takes "from".
  const preposition = scope.startsWith("this ") ? "from" : "of";
  return `Clear ${count} roll${count === 1 ? "" : "s"} ${preposition} ${scope}?`;
}

function createRecentRolls(opts                    )                  {
  const limit = opts.limit ?? RECENT_ROLLS_LIMIT;
  const list = h("ul", { class: "history-list recent-rolls" });

  const scoped = () => rollsInScope(state.history, opts.ids());

  async function clearScope()                {
    const ids = opts.ids();
    const rows = scoped();
    if (rows.length === 0) {
      state.toast("There is nothing here to clear.");
      return;
    }
    // The app's own dialog rather than the browser's: it returns the keyboard
    // where it came from, and it looks like the rest of Orangey.
    const sure = await askConfirm("Clear these rolls", clearRollsPrompt(rows.length, ids.length === 0 ? "" : opts.scopeName()), {
      confirm: "Clear",
      danger: true,
    });
    if (sure) void state.clearHistoryFor(ids);
  }

  function refresh()       {
    setChildren(list,
      ...scoped().slice(0, limit).map((row) =>
        h("li", { class: row.struck ? "struck" : "" },
          h("span", { class: "when", text: formatTime(row.at) }),
          h("span", { class: "what" },
            h("span", { class: "name", text: row.randomizerName }),
            " ",
            h("span", { class: "detail", text: row.resultText }),
            ...rollDetailLines(row),
          ),
          button(row.struck ? "Unstrike" : "Strike", () => void state.setStruck(row.id, !row.struck), { class: "ghost" }),
        ),
      ),
    );
  }

  const el = h("div", { class: "card" },
    h("div", { class: "row" },
      h("h2", { text: "Recent rolls", style: { margin: "0" } }),
      h("div", { class: "spacer" }),
      button("Clear", () => void clearScope(), { class: "ghost danger" }),
      button("All history", () => navigate("#/history"), { class: "ghost" }),
    ),
    list,
  );

  refresh();
  return { el, refresh };
}

const DEFAULT_FACES                   = ["Heads", "Tails"];

function flip(faces                  , rng              )             {
  const side = rng.int(0, 1)         ;
  return { side, face: faces[side], faces, seed: rng.seed };
}

// ---- src/core/dice/evaluate.ts -----------------------------------
/**
 * Evaluate a parsed dice expression against a RandomSource.
 *
 * Every die is recorded individually, kept or dropped, so the UI can show
 * "4d6kh3 → [6, 5, 2̶, 4] = 15" and a screen reader can say the same thing.
 */

                                              
                                                                     


                          
                
                
                                                                             
                     
                                                     
                     
                                                               
                    
     
                                                                              
                                                                             
                                                                          
                                                                            
                                                                          
                  
     
                
 

                             
               
                                                          
               
                                     
                   
                 
     
                                                        
    
                                                                       
                                                                             
                                                                            
                                                          
     
                   
                   
                 
                                                                
                      
                                                                                  
                
                                          
                   
 

                             
                             
                
                        
                     
                      
                
                                                                               
              
              
                                                                            
                     
                     
                                                                               
                     
                
 

function keepIndices(values          , node          )            {
  const kept = values.map(() => true);
  if (!node.keep) return kept;
  const order = values.map((v, i) => ({ v, i }));
  const { mode, n } = node.keep;
  // Sort descending for "high" modes, ascending for "low" ones. Ties break by
  // index so the display order of equal dice is stable.
  const high = mode === "kh" || mode === "dh";
  order.sort((a, b) => (high ? b.v - a.v : a.v - b.v) || a.i - b.i);
  if (mode === "kh" || mode === "kl") {
    for (let k = n; k < order.length; k++) kept[order[k].i] = false;
  } else {
    for (let k = 0; k < n; k++) kept[order[k].i] = false;
  }
  return kept;
}

/** One face of this die, in the numbers a player reads. */
function drawFace(node          , rng              )         {
  return node.fate ? rng.int(1, 3) - 2 : rng.int(1, node.sides);
}

/** The highest face, which is what an exploding die explodes on. */
function topFace(node          )         {
  return node.fate ? 1 : node.sides;
}

/**
 * The lowest and highest a die of this node can finally come to rest on.
 *
 * An unlimited reroll removes faces from the possible outcomes entirely: a
 * `d6r1` can never end on a 1, so its floor is 2. `ro` rerolls once, so the
 * rerolled face can still come back and the range is unchanged.
 */
function faceRange(node          )                               {
  const faces = facesOf(node);
  const live = node.reroll && !node.reroll.once
    ? faces.filter((f) => !matchesCmp(f, node.reroll .cmp, node.reroll .n))
    : faces;
  const usable = live.length ? live : faces;
  return { min: Math.min(...usable), max: Math.max(...usable) };
}

function evalNode(node      , rng              )                                                      {
  if (node.kind === "const") return { value: node.value };

  // 1. The original dice, left to right, exactly as they always were. An
  //    expression with no new modifiers must draw in precisely this order
  //    and stop here, or every seeded roll ever recorded changes.
  const dice            = [];
  for (let i = 0; i < node.count; i++) dice.push({ value: drawFace(node, rng), kept: true });

  if (node.reroll || node.explode) {
    const top = topFace(node);
    let added = 0;
    // A queue, not a loop over a fixed array: an exploded die joins the end
    // and is then treated like any other, so it can reroll and explode too.
    for (let i = 0; i < dice.length; i++) {
      const die = dice[i];
      if (node.reroll) {
        let rerolls = 0;
        while (
          matchesCmp(die.value, node.reroll.cmp, node.reroll.n) &&
          rerolls < REROLL_CAP &&
          !(node.reroll.once && rerolls >= 1)
        ) {
          // The face that was thrown away stays visible, the way a dropped
          // die does: what happened at the table is part of the answer.
          dice.splice(i, 0, { value: die.value, kept: false, rerolled: true, exploded: die.exploded, ...(die.wave ? { wave: die.wave } : {}) });
          i++;
          die.value = drawFace(node, rng);
          // The replacement is thrown after the face it replaces has landed.
          die.wave = (die.wave ?? 0) + 1;
          rerolls++;
        }
      }
      if (node.explode && die.value === top && added < EXPLODE_CAP) {
        added++;
        // Thrown once the die that exploded has landed on its top face.
        dice.push({ value: drawFace(node, rng), kept: true, exploded: true, wave: (die.wave ?? 0) + 1 });
      }
    }
  }

  // 4. Keep and drop see only the dice that are still in play.
  const live = dice.filter((d) => !d.rerolled);
  const kept = keepIndices(live.map((d) => d.value), node);
  live.forEach((d, i) => {
    d.kept = kept[i];
  });

  // 5. A success pool counts rather than adds.
  let value        ;
  if (node.success) {
    for (const d of live) {
      if (d.kept) d.success = matchesCmp(d.value, node.success.cmp, node.success.n);
    }
    value = live.reduce((a, d) => a + (d.kept && d.success ? 1 : 0), 0);
  } else {
    value = live.reduce((a, d) => a + (d.kept ? d.value : 0), 0);
  }
  return { value, dice, sides: node.sides };
}

function boundsOf(node      )                               {
  if (node.kind === "const") return { min: node.value, max: node.value };
  let n = node.count;
  if (node.keep) n = node.keep.mode[0] === "k" ? node.keep.n : node.count - node.keep.n;
  // A success pool is a count of dice, whatever the faces say.
  if (node.success) return { min: 0, max: n };
  // Explosions are deliberately not in `max`: there is no ceiling, and a
  // made-up one would be worse than none. `openEnded` says so instead.
  const face = faceRange(node);
  return { min: n * face.min, max: n * face.max };
}

/**
 * The lowest and highest an expression can come to, without rolling it.
 *
 * Reserving the result panel's height needs the widest number that can turn
 * up, which used to be found by rolling the expression once on a throwaway
 * seeded source and reading the bounds off the result. That worked, but it
 * meant a roll happened to answer a layout question.
 */
function expressionBounds(input        )                                                   {
  let min = 0;
  let max = 0;
  const expr = parse(input);
  const openEnded = expr.terms.some((t) => t.node.kind === "dice" && t.node.explode === true);
  for (const t of expr.terms) {
    const b = boundsOf(t.node);
    if (t.sign > 0) {
      min += b.min;
      max += b.max;
    } else {
      min -= b.max;
      max -= b.min;
    }
  }
  return { min, max, openEnded };
}

function evaluate(expr            , rng              , input = expr.normalized)             {
  const terms               = expr.terms.map((t      ) => {
    const r = evalNode(t.node, rng);
    const node = t.node.kind === "dice" ? t.node : null;
    const face = node ? faceRange(node) : null;
    return {
      sign: t.sign,
      text: nodeText(t.node),
      dice: r.dice,
      sides: r.sides,
      faceMin: face?.min,
      faceMax: face?.max,
      fate: node?.fate,
      successes: node?.success !== undefined,
      value: r.value,
      subtotal: t.sign * r.value,
    };
  });

  let min = 0;
  let max = 0;
  for (const t of expr.terms) {
    const b = boundsOf(t.node);
    if (t.sign > 0) {
      min += b.min;
      max += b.max;
    } else {
      min -= b.max;
      max -= b.min;
    }
  }

  const total = terms.reduce((a, t) => a + t.subtotal, 0);
  const openEnded = expr.terms.some((t) => t.node.kind === "dice" && t.node.explode === true);

  /**
   * An extreme is "every kept die showed its face", term by term, and every
   * dice term has to agree.
   *
   * Exploded dice are left out of the maximum: they only exist because a die
   * already showed its top face, so counting them would make a maximum
   * harder to reach the better you rolled.
   */
  const diceTerms = terms.filter((t) => t.dice && t.dice.length);
  const extreme = (pick                            ) => diceTerms.length > 0 && diceTerms.every(pick);
  const isMaximum = extreme((t) => {
    const kept = t.dice .filter((d) => d.kept);
    if (!kept.length) return false;
    if (t.successes) return kept.every((d) => d.success === true);
    const original = kept.filter((d) => !d.exploded);
    return original.length > 0 && original.every((d) => d.value === t.faceMax);
  });
  const isMinimum = extreme((t) => {
    const kept = t.dice .filter((d) => d.kept);
    if (!kept.length) return false;
    if (t.successes) return kept.every((d) => d.success !== true);
    return kept.every((d) => d.value === t.faceMin);
  });

  return { input, expression: expr.normalized, terms, total, min, max, isMaximum, isMinimum, openEnded, seed: rng.seed };
}

function rollDice(input        , rng              )             {
  return evaluate(parse(input), rng, input);
}

// ---- src/core/dice/format.ts -------------------------------------
/** Turning a RollResult into the strings the UI and screen readers use. */

                                                            

/** A Fate die reads as a sign, not as a number between -1 and 1. */
function faceText(t            , value        )         {
  if (!t.fate) return String(value);
  return value > 0 ? "+1" : value < 0 ? "-1" : "0";
}

function dieText(t            , d                                                                          )         {
  const face = `${faceText(t, d.value)}${d.exploded ? "!" : ""}`;
  // A rerolled die reads like a dropped one: it happened, it does not count.
  return d.kept ? face : `(${face})`;
}

function termDetail(t            )         {
  if (!t.dice) return t.text;
  return `${t.text} [${t.dice.map((d) => dieText(t, d)).join(", ")}]`;
}

/**
 * Is the whole roll a count of successes?
 *
 * Only then does "= 3 successes" make sense. Mixing a success pool with a
 * constant or an ordinary term gives a number that is not a count of
 * anything, so it stays a plain total.
 */
function allSuccesses(r            )          {
  return r.terms.length > 0 && r.terms.every((t) => t.successes === true);
}

function totalWord(r            )         {
  if (!allSuccesses(r)) return String(r.total);
  return `${r.total} success${r.total === 1 ? "" : "es"}`;
}

/** One line for the history log: "4d6kh3 [6, 5, (2), 4] = 15". */
function formatResult(r            )         {
  const detail = r.terms
    .map((t, i) => `${i === 0 ? (t.sign < 0 ? "-" : "") : t.sign < 0 ? " - " : " + "}${termDetail(t)}`)
    .join("");
  return `${detail} = ${totalWord(r)}`;
}

/** Spoken form; dropped dice are named rather than shown in brackets. */
function speakResult(r            )         {
  const parts = r.terms.map((t) => {
    if (!t.dice) return `${t.sign < 0 ? "minus " : ""}${t.value}`;
    const kept = t.dice.filter((d) => d.kept).map((d) => faceText(t, d.value));
    const dropped = t.dice.filter((d) => !d.kept).map((d) => faceText(t, d.value));
    let s = `${t.text}: ${kept.join(", ")}`;
    if (dropped.length) s += `, dropping ${dropped.join(", ")}`;
    return `${t.sign < 0 ? "minus " : ""}${s}`;
  });
  return `${parts.join("; ")}. Total ${totalWord(r)}.`;
}

/** Compact form for the big result panel. */
function totalText(r            )         {
  return String(r.total);
}

// ---- src/core/number.ts ------------------------------------------
class NumberSpecError extends Error {}

function validateSpec(spec            )                {
  if (!Number.isFinite(spec.min) || !Number.isFinite(spec.max)) return "minimum and maximum must be numbers";
  if (spec.max < spec.min) return "the maximum must not be below the minimum";
  if (!Number.isInteger(spec.count) || spec.count < 1) return "how many must be a whole number of at least 1";
  if (spec.count > 1000) return "at most 1000 numbers at a time";
  if (spec.integer) {
    if (!Number.isInteger(spec.min) || !Number.isInteger(spec.max)) return "whole-number draws need whole-number bounds";
    const range = spec.max - spec.min + 1;
    if (spec.unique && spec.count > range) return `only ${range} whole numbers lie in that range`;
  } else if (spec.unique) {
    return "unique results need whole numbers";
  }
  return null;
}

/** Partial Fisher-Yates over the range: O(count), no rejection loop. */
function uniqueIntegers(min        , max        , count        , rng              )           {
  const range = max - min + 1;
  if (range <= 100000) {
    const pool = new Int32Array(range);
    for (let i = 0; i < range; i++) pool[i] = min + i;
    const out           = [];
    for (let k = 0; k < count; k++) {
      const j = rng.int(k, range - 1);
      const tmp = pool[k];
      pool[k] = pool[j];
      pool[j] = tmp;
      out.push(pool[k]);
    }
    return out;
  }
  const seen = new Set        ();
  const out           = [];
  while (out.length < count) {
    const v = rng.int(min, max);
    if (!seen.has(v)) {
      seen.add(v);
      out.push(v);
    }
  }
  return out;
}

function drawNumbers(spec            , rng              )               {
  const problem = validateSpec(spec);
  if (problem) throw new NumberSpecError(problem);

  let values          ;
  if (spec.integer) {
    values = spec.unique
      ? uniqueIntegers(spec.min, spec.max, spec.count, rng)
      : Array.from({ length: spec.count }, () => rng.int(spec.min, spec.max));
  } else {
    const span = spec.max - spec.min;
    values = Array.from({ length: spec.count }, () => {
      const f = rng.float();
      // float() is [0,1); to include the maximum we accept the exact endpoint
      // only when the draw lands in the top ulp-sized slice, which keeps the
      // distribution uniform rather than doubling the endpoint's chance.
      const t = spec.inclusiveMax ? f * (1 + Number.EPSILON) : f;
      return spec.min + Math.min(t, 1) * span;
    });
  }
  return { values, spec, seed: rng.seed, ...extremesOf(values, spec) };
}

/** Whether a draw is as high, or as low, as its range allows. */
function extremesOf(values          , spec            )                                             {
  if (!spec.integer || values.length === 0) return { isMaximum: false, isMinimum: false };
  return {
    isMaximum: values.every((v) => v === spec.max),
    isMinimum: values.every((v) => v === spec.min),
  };
}

function formatNumbers(r              )         {
  const fmt = (v        ) => (r.spec.integer ? String(v) : v.toFixed(4).replace(/0+$/, "").replace(/\.$/, ""));
  return r.values.map(fmt).join(", ");
}

/**

 *
 * The result is produced here, complete, before any animation starts
 * (decision D7) — the animation is only a way of arriving at it. That is what
 * lets "skip" be safe and what keeps the announced result and the drawn result
 * from ever disagreeing.
 */








                                                                                          
                                                           

                          
                           
                                                 
               
                                                                   
                  
                                    
                
                
                                          
                     
                                                                  
                 
                    
               
                     
                      
                      
                                                                            
                             
                                                                                  
                     
     
                                                                            
                                                                             
                                                                  
     
                    
     
                                                                          
                                                                             
                      
     
                     
 

function rollRandomizer(r            , rng              )          {
  switch (r.type) {
    case "board":
      // A board has no outcome of its own: the board screen rolls what is on
      // it, one randomizer at a time, and each records its own history row.
      throw new Error("a board is rolled one randomizer at a time");
    case "list":
      return rollList(r, rng);
    case "dice": {
      const result = rollDice(r.expression, rng);
      return {
        kind: "dice",
        text: String(result.total),
        detail: formatResult(result),
        speak: speakResult(result),
        seed: rng.seed,
        dice: result,
        isMaximum: result.isMaximum,
        isMinimum: result.isMinimum,
      };
    }
    case "coin": {
      const result = flip(r.faces, rng);
      return {
        kind: "coin",
        text: result.face,
        speak: `${r.name}: ${result.face}.`,
        seed: rng.seed,
        side: result.side,
        reaction: r.faceReactions?.[result.side] ?? undefined,
      };
    }
    case "number": {
      const result = drawNumbers(r, rng);
      const text = formatNumbers(result);
      return {
        kind: "number",
        text,
        detail: `${r.count > 1 ? `${r.count} numbers` : "one number"} between ${r.min} and ${r.max}`,
        speak: `${r.name}: ${text}.`,
        seed: rng.seed,
        numbers: result.values,
        isMaximum: result.isMaximum,
        isMinimum: result.isMinimum,
      };
    }
  }
}

/** `{2d4}` in an outcome's text. Braces are required, so nothing else is touched. */
const INLINE_DICE = /\{([^{}]{1,60})\}/g;

/**
 * Roll the dice written into an outcome's text.
 *
 * "{2d4} wolves" should arrive at the table as "3 wolves". The braces are the
 * whole of the opt-in: without them, "a d20 system" and "2d6 × 10 gp" are
 * prose that happens to mention dice, and rolling those would be a surprise.
 * Anything inside braces that does not parse is left exactly as typed, so a
 * typo shows itself rather than vanishing.
 *
 * Drawn from the same source as the pick, and only ever after it (P12): a
 * seeded session replays if and only if the draws happen in the same order.
 */
function expandInlineDice(text        , rng              , rolled          )         {
  return text.replace(INLINE_DICE, (whole, expression        ) => {
    const parsed = tryParse(expression);
    if (!parsed.ok) return whole;
    const result = evaluate(parsed.expression, rng, expression);
    rolled.push(formatResult(result));
    return String(result.total);
  });
}

function rollList(r                , rng              )          {
  return listOutcome(r, pickWeightedIndex(r.items, rng), rng);
}

/**
 * One outcome of a list, as the table sees it, once the pick is made.
 *
 * Shared by a single roll and an offer, so a card in an offer says exactly
 * what the same outcome would have said had it been rolled on its own. The
 * pick is the caller's; the only draws here are the dice in the text.
 */
function listOutcome(r                , index        , rng              )          {
  const item = r.items[index];
  const total = r.items.reduce((a, i) => a + (i.disabled || i.weight <= 0 ? 0 : i.weight), 0);
  const percent = total > 0 ? (item.weight / total) * 100 : 0;
  const pct = `${percent.toFixed(percent < 10 ? 1 : 0)}%`;
  // After the pick, never before it.
  const rolled           = [];
  const label = expandInlineDice(item.label, rng, rolled);
  const description = item.description ? expandInlineDice(item.description, rng, rolled) : undefined;
  const parts = [...rolled, description, pct].filter(Boolean);
  return {
    kind: "list",
    text: label,
    detail: parts.join(" · "),
    speak: `${r.name}: ${label}. Probability ${pct}.`,
    seed: rng.seed,
    itemIndex: index,
    image: item.image,
    reaction: item.reaction,
    ...(rolled.length ? { rolled } : {}),
  };
}

/**
 * Several outcomes from one list in one press.
 *
 * "Roll six wandering monsters" is one roll with six answers, not six rolls:
 * one history row, one landing, one line of text. There is no `itemIndex`,
 * so nothing chains, no picture shows and no tagged reaction fires — those
 * are all about a single winning outcome, and there is no single winner here.
 *
 * A bag draws without putting back and stops when the bag runs out; an
 * ordinary list can repeat itself, which is what "with replacement" means.
 */
function rollListMany(r                , n        , rng              , drawn                      )          {
  const bag = r.withoutReplacement === true;
  const pool = bag && drawn ? withoutDrawn(r.items, drawn) : r.items;
  const wanted = Math.max(1, Math.min(20, Math.trunc(n)));

  const indices           = bag
    ? drawWithoutReplacement(pool, Math.min(wanted, rollableIndices(pool).length), rng)
    : Array.from({ length: wanted }, () => pickWeightedIndex(pool, rng));

  const rolled           = [];
  const labels = indices.map((i) => expandInlineDice(r.items[i].label, rng, rolled));
  const text = labels.join(", ");
  return {
    kind: "list",
    text,
    detail: `${labels.length} outcome${labels.length === 1 ? "" : "s"}`,
    speak: `${r.name}: ${text}.`,
    seed: rng.seed,
    // Deliberately no itemIndex, image or reaction: see above.
    indices,
    ...(rolled.length ? { rolled } : {}),
  };
}

/**
 * Make a choice: draw `m` different outcomes for the player to pick from.
 *
 * Weighted and without putting back, from what is in play — the caller hands
 * over the list with drawn (bag) outcomes already marked, exactly as it would
 * for a single roll, so indices stay those of the original list. Fewer come
 * back when fewer can come up. A path of its own (P12): no existing roll
 * draws any differently for it.
 *
 * All the picks happen first and the dice written into the offered texts
 * after them, in the order drawn, which is the order a single roll uses too.
 */
function offerFromList(r                , m        , rng              )            {
  const wanted = Math.max(1, Math.trunc(m));
  const indices = drawWithoutReplacement(r.items, Math.min(wanted, rollableIndices(r.items).length), rng);
  return indices.map((index) => listOutcome(r, index, rng));
}

/**
 * The outcome a player picked from an offer, ready to land: its own text,
 * picture and reaction, and a detail line that says what else was offered.
 */
function chosenFromOffer(name        , offer                    , at        )          {
  const chosen = offer[at];
  const labels = offer.map((o) => o.text);
  const note = labels.length > 1 ? `chosen from ${labels.join(", ")}` : "the only one that could come up";
  // A single roll's detail ends with the outcome's odds, which say nothing
  // about a pick; the dice and the description before them still apply.
  const detail = chosen.detail ?? "";
  const cut = detail.lastIndexOf(" · ");
  const kept = cut < 0 ? "" : detail.slice(0, cut);
  return {
    ...chosen,
    detail: [kept, note].filter(Boolean).join(" · "),
    speak: `${name}: ${chosen.text}, ${note}.`,
    ...(labels.length > 1 ? { offered: labels } : {}),
  };
}

function whyCannotRoll(r            , drawn                      )                {
  if (r.type === "board") return r.entries.length ? null : "This board has nothing on it yet.";
  if (r.type !== "list") return null;
  if (r.items.length === 0) return "This randomizer has no outcomes yet.";
  if (!r.items.some(isRollable)) {
    return "No outcomes can come up: they are all disabled or weigh nothing.";
  }
  // An empty bag is its own answer: everything is still here, it has just
  // all been drawn, and the way out is Refill rather than editing anything.
  if (r.withoutReplacement && drawn && !withoutDrawn(r.items, drawn).some(isRollable)) {
    return "The bag is empty. Refill it to draw again.";
  }
  return null;
}

/**
 * The longest text this randomizer could ever put in the result panel.
 *
 * The panel reserves its height from this once, when the randomizer loads, so
 * that no roll ever changes the layout — we know every outcome in advance, so
 * there is no reason to discover the height one roll at a time. It is an upper
 * bound, not a prediction: dice report their widest total, a number draw its
 * widest row, a list its longest label.
 */
/** A label with every rollable `{expr}` at its maximum. */
function widestLabel(label        )         {
  return label.replace(INLINE_DICE, (whole, expression        ) => {
    try {
      return String(expressionBounds(expression).max);
    } catch {
      return whole;
    }
  });
}

function longestOutcome(r            )         {
  const longest = (texts          ) => texts.reduce((a, b) => (b.length > a.length ? b : a), "");
  switch (r.type) {
    case "list": {
      // Disabled outcomes cannot come up, but enabling one must not resize
      // the panel, so every label counts. Dice written into a label are
      // measured at their largest, since that is the widest it can ever read.
      return longest(r.items.map((i) => widestLabel(i.label)));
    }
    case "coin":
      return longest([...r.faces]);
    case "number": {
      const width = (v        ) => (r.integer ? String(Math.trunc(v)) : v.toFixed(4).replace(/0+$/, "").replace(/\.$/, ""));
      const widest = longest([width(r.min), width(r.max)]);
      return Array.from({ length: Math.max(1, Math.min(r.count, 100)) }, () => widest).join(", ");
    }
    case "board":
      // Each cell on a board sizes its own panel from its own randomizer.
      return "";
    case "dice": {
      try {
        const bounds = expressionBounds(r.expression);
        const widest = longest([String(bounds.min), String(bounds.max)]);
        // An exploding roll has no ceiling, so `max` is a floor. One more
        // character is not a guarantee, but it stops the common case — a
        // single explosion — from resizing the panel.
        return bounds.openEnded ? `${widest}0` : widest;
      } catch {
        return r.expression;
      }
    }
  }
}

// ---- src/ui/bag.ts -----------------------------------------------
/**
 * Bag mode: which outcomes have already been drawn.
 *
 * "Draw without putting back" is a property of the randomizer and lives in
 * its file; *what has been drawn so far* is not. It is like history: it
 * belongs to this device and this session of play, and two people rolling the
 * same shared wheel each have their own bag. Putting it in the file would
 * make every draw a write to the user's library and a change to sync.
 *
 * So the bag lives in the app database, keyed by randomizer id, with an
 * in-memory copy the roll path can read synchronously.
 */




const bags = new Map                     ();

function bagKey(randomizerId        )         {
  return `bag:${randomizerId}`;
}

/**
 * A randomizer that came out of a link has no file behind it, and its item
 * ids are made fresh on every load — so a stored bag could never match, and
 * storing one would only leave debris in the database. Those bags live for
 * as long as the page does.
 */
function isPersistent(randomizerId        )          {
  return state.library.findById(randomizerId) !== null;
}

/** Read the bag for a randomizer into memory. Safe to call more than once. */
async function bagLoad(randomizerId        )                {
  if (bags.has(randomizerId)) return;
  if (!isPersistent(randomizerId)) {
    bags.set(randomizerId, new Set());
    return;
  }
  const stored = await appdb.get          (bagKey(randomizerId));
  bags.set(randomizerId, new Set(Array.isArray(stored) ? stored : []));
}

function bagDrawn(randomizerId        )                      {
  return bags.get(randomizerId) ?? new Set        ();
}

/** Take an outcome out of the bag. Called at the landing, not at the start. */
function bagTake(randomizerId        , itemId        )       {
  const drawn = bags.get(randomizerId) ?? new Set        ();
  drawn.add(itemId);
  bags.set(randomizerId, drawn);
  if (isPersistent(randomizerId)) void appdb.set(bagKey(randomizerId), [...drawn]);
}

/** Everything goes back in. */
function bagRefill(randomizerId        )       {
  bags.set(randomizerId, new Set());
  if (isPersistent(randomizerId)) void appdb.set(bagKey(randomizerId), []);
}

// ---- src/ui/rolling.ts -------------------------------------------
/**
 * One roll, from the press to the landing.
 *
 * The play screen, a cell on a board and the editor's preview all roll the
 * same way, and used to say so in three places that had already begun to
 * drift apart. The order here is the contract (plan C10): the outcome is
 * decided first, nothing shows it until the animation has arrived, and the
 * answer, the announcement and the mascot's reaction all happen together at
 * the landing — never at the start.
 *
 * A caller supplies only what it has. The editor's preview has a wheel and
 * no dice tray, and rolls with `live: false`, so it neither writes history
 * nor tells the mascot: a person trying out a wheel they are building has
 * not rolled it.
 */

                                              

                                                                       
                                                          
                                                       
                                                     
                                                     





                                                      

                                
                             
                      
                                
                  
                  
                                                                            
                           
                                                                                  
                
                                           
                     
     
                                                                             
                                                                            
                                                                              
                                                                        
     
                                        
                                                                            
                    
                                                                                   
                           
     
                                                                        
    
                                                                           
                                                                            
                                                                          
     
                         
                                                                          
                       
                                                  
                      
                                                         
                          
     
                                                                          
                                                                           
     
                             
 

                         
                        
               
                            
                                                 
                            
                                                                                           
                  
                                                            
                             
                                                                               
                                  
 

function createRoller(opts               )         {
  let rolling = false;
  /**
   * A hidden roll that has happened but has not been shown yet: one outcome,
   * or the cards of an offer, face down.
   */
  let held 
                                                                                                    
                                                                                                            
           = null;
  /**
   * Cards on the table. The draw is done (P8: decided before anything moves);
   * nothing lands, is announced as an answer, or is recorded until a pick.
   */
  let offered                                                                                              = null;

  /** How long the cards take to turn over for this roll's feel. */
  const flipMs = () => OFFER_FLIP_MS * motionScale(opts.feel().motion);

  function lay(outcomes           , faceDown         )       {
    opts.result.offer(outcomes.map((o) => o.text), {
      onPick: (at) => void pick(at),
      prompt: faceDown ? "Rolled. Press Reveal." : "Choose one",
      faceDown,
      flipMs: flipMs(),
      focus: !faceDown && (opts.focusOffer?.() ?? false),
    });
  }

  async function pick(at        )                {
    if (!offered || !offered.outcomes[at]) return;
    const { outcomes, randomizer, bag } = offered;
    offered = null;
    opts.result.chose(at);
    // Once, through the ordinary landing: the answer, the announcement, the
    // mascot and the history row, as for any roll. The wheel stayed still
