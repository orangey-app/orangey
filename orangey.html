/* Colour, spacing and type tokens.
 *
 * Every scheme defines the same names; components only ever use var(--…).
 * No attribute means "follow the system": Orangey by day, Night in the dark.
 * data-scheme on <html> picks one explicitly.
 *
 * Brand: orange #f3a257, black #253122. Bright, never neon.
 */

:root {
  color-scheme: light dark;

  --brand-orange: #f3a257;
  --brand-black: #253122;

  --accent: #f3a257;
  --accent-ink: #253122;
  --accent-soft: #fde5cc;
  --accent-strong: #e0862f;

  --bg: #fff8ef;
  --bg-raised: #ffffff;
  --bg-sunken: #fbeedc;
  --border: #f0dcc3;
  --border-strong: #d9b98e;
  --ink: #253122;
  --ink-soft: #55604e;
  --ink-faint: #8a927f;

  --ok: #3f9c5a;
  --warn: #d38b1f;
  --error: #d64545;

  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 2px rgba(37, 49, 34, 0.08), 0 6px 18px rgba(37, 49, 34, 0.07);

  --gap: 12px;
  --pad: 16px;

  /* Arapey for everything that is read, the system font for the labels on
     wheel slices — small, dense and on strong colour — and Young Serif for the
     numbers on dice (digits and signs only). The two embedded fonts come from
     the build; see assets/fonts. */
  --font: "Orangey Text", Georgia, "Times New Roman", serif;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-dice: "Orangey Dice", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

/* Night: the brand black as the ground. */
:root[data-scheme="night"],
:root:not([data-scheme]) {
  @media (prefers-color-scheme: dark) {
    --bg: #253122;
    --bg-raised: #2f3d2c;
    --bg-sunken: #1b2419;
    --border: #3f4e3b;
    --border-strong: #5d6e58;
    --ink: #fff3e3;
    --ink-soft: #c9cfbf;
    --ink-faint: #8f9a88;
    --accent-soft: #4c3a26;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 6px 18px rgba(0, 0, 0, 0.35);
  }
}

:root[data-scheme="night"] {
  --bg: #253122;
  --bg-raised: #2f3d2c;
  --bg-sunken: #1b2419;
  --border: #3f4e3b;
  --border-strong: #5d6e58;
  --ink: #fff3e3;
  --ink-soft: #c9cfbf;
  --ink-faint: #8f9a88;
  --accent-soft: #4c3a26;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 6px 18px rgba(0, 0, 0, 0.35);
}

:root[data-scheme="orangey"] {
  /* Forces the light brand scheme even when the system is dark. Values are
     the :root defaults; the block exists so the attribute wins. */
  --bg: #fff8ef;
  --bg-raised: #ffffff;
  --bg-sunken: #fbeedc;
  --border: #f0dcc3;
  --border-strong: #d9b98e;
  --ink: #253122;
  --ink-soft: #55604e;
  --ink-faint: #8a927f;
  --accent-soft: #fde5cc;
  --shadow: 0 1px 2px rgba(37, 49, 34, 0.08), 0 6px 18px rgba(37, 49, 34, 0.07);
}

/* Meadow: a fresh green accent on a pale mint ground. */
:root[data-scheme="meadow"] {
  --accent: #5cc46a;
  --accent-ink: #163019;
  --accent-soft: #d8f3dc;
  --accent-strong: #3ea84e;
  --bg: #f4fbf3;
  --bg-raised: #ffffff;
  --bg-sunken: #e6f4e5;
  --border: #cfe6cf;
  --border-strong: #a3cba6;
  --ink: #1d2b1f;
  --ink-soft: #4d5e4f;
  --ink-faint: #849386;
  --shadow: 0 1px 2px rgba(29, 43, 31, 0.08), 0 6px 18px rgba(29, 43, 31, 0.07);
}

/* Ocean: a clear blue accent on a pale sky ground. */
:root[data-scheme="ocean"] {
  --accent: #3fa7e0;
  --accent-ink: #0f2a3a;
  --accent-soft: #d6eefb;
  --accent-strong: #2589c1;
  --bg: #f3f9fd;
  --bg-raised: #ffffff;
  --bg-sunken: #e4f1f9;
  --border: #cfe3f0;
  --border-strong: #9fc4da;
  --ink: #17262f;
  --ink-soft: #4b5d68;
  --ink-faint: #85959f;
  --shadow: 0 1px 2px rgba(23, 38, 47, 0.08), 0 6px 18px rgba(23, 38, 47, 0.07);
}

/* Berry: a warm pink accent on a blush ground. */
:root[data-scheme="berry"] {
  --accent: #e8679a;
  --accent-ink: #3a1224;
  --accent-soft: #fbdde8;
  --accent-strong: #cf477d;
  --bg: #fff5f8;
  --bg-raised: #ffffff;
  --bg-sunken: #fbe6ee;
  --border: #f1d2de;
  --border-strong: #dba7bd;
  --ink: #2c1b23;
  --ink-soft: #5e4a53;
  --ink-faint: #97858d;
  --shadow: 0 1px 2px rgba(44, 27, 35, 0.08), 0 6px 18px rgba(44, 27, 35, 0.07);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}

#app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }

/* ---- shell ---------------------------------------------------------------- */

.topbar {
  display: flex;
  align-items: center;
  gap: var(--gap);
  padding: 10px var(--pad);
  border-bottom: 1px solid var(--border);
  background: var(--bg-raised);
  position: sticky;
  top: 0;
  z-index: 20;
}

.brand {
  font-weight: 650;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--ink);
  text-decoration: none;
}
/* The mark is Orangey's head — the artwork of the logo tile without the
   tile, so it sits on any scheme's top bar. */
.brand .mark {
  display: block; width: 26px; height: 23px; flex: none;
}

.panes { display: flex; flex: 1; min-height: 0; }
.side {
  width: 300px;
  flex: none;
  border-right: 1px solid var(--border);
  background: var(--bg-raised);
  overflow: auto;
  padding: var(--pad);
}
.main { flex: 1; min-width: 0; overflow: auto; padding: var(--pad); }
.main-inner { max-width: 1100px; margin: 0 auto; }

.tabbar { display: none; }

@media (max-width: 1023px) {
  /* The tab bar covers this navigation on a small screen; Back stays. */
  .topbar button:not(.back) { display: none; }
  .side { display: none; }
  .side.is-active { display: block; width: 100%; border-right: 0; }
  .main.is-hidden { display: none; }
  .tabbar {
    display: flex;
    position: sticky;
    bottom: 0;
    border-top: 1px solid var(--border);
    background: var(--bg-raised);
    z-index: 20;
  }
  .tabbar button {
    flex: 1;
    border: 0;
    background: none;
    padding: 10px 4px 12px;
    color: var(--ink-soft);
    font: inherit;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-height: 52px;
  }
  .tabbar button[aria-current="page"] { color: var(--accent); }
  .tabbar .glyph { font-size: 18px; line-height: 1; }
}

/* ---- controls ------------------------------------------------------------- */

button, input, select, textarea { font: inherit; color: inherit; }

button {
  background: var(--bg-raised);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 7px 12px;
  cursor: pointer;
  min-height: 36px;
}
button:hover { background: var(--bg-sunken); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
button.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
button.danger-primary { background: var(--error); border-color: var(--error); color: #fff; }
button.ghost { border-color: transparent; background: none; }
button.ghost:hover { background: var(--bg-sunken); }
button.danger { color: var(--error); }

.icon-button {
  min-height: 32px;
  min-width: 32px;
  padding: 4px 6px;
  border-color: transparent;
  background: none;
  line-height: 1;
}
.icon-button:hover { background: var(--bg-sunken); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

input[type="text"], input[type="number"], input[type="search"], select, textarea {
  background: var(--bg-raised);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 7px 9px;
  min-height: 36px;
  width: 100%;
}
input[type="range"] { width: 100%; accent-color: var(--accent); }
textarea { min-height: 120px; resize: vertical; font-family: var(--mono); font-size: 13px; }

.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: var(--gap); }
.field-label { font-size: 14px; color: var(--ink-soft); font-weight: 550; }
.field-hint { font-size: 13px; color: var(--ink-faint); }
/* A setting that is only ever on or off: the box sits beside its label, not
   above it like the sliders. */
.feel-toggle { flex-direction: row; align-items: center; cursor: pointer; }
.feel-toggle input { cursor: pointer; }

.row { display: flex; gap: var(--gap); align-items: center; flex-wrap: wrap; }
.row.tight { gap: 6px; }
/* Space above a block, so a view does not have to carry a style object for
   it. Three sizes is all the app actually used across seventeen copies. */
.gap-s { margin-top: 8px; }
.gap-m { margin-top: 12px; }
.gap-l { margin-top: 14px; }
.bag-line { justify-content: flex-end; margin: 4px 0 2px; min-height: 28px; }
.bag-line[hidden] { display: none; }
.home-shortcuts[hidden] { display: none; }
.home-shortcuts h2 { font-size: 16px; margin: 0 0 6px; }
.shortcut-group + .shortcut-group { margin-top: 12px; }
/* input.roll-count, not .roll-count: the general rule for number inputs sets
   width: 100% and outranks a bare class, which pushed the field onto a line
   of its own below its "×". */
input.roll-count { width: 56px; }
.roll-count-field[hidden] { display: none; }
.slices-field[hidden] { display: none; }
.spacer { flex: 1; }
.muted { color: var(--ink-soft); }
.faint { color: var(--ink-faint); font-size: 14px; }
.card {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--pad);
  box-shadow: var(--shadow);
  margin-bottom: var(--gap);
}
h1 { font-size: 21px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 0 0 var(--gap); }
h3 { font-size: 14px; margin: var(--pad) 0 6px; color: var(--ink-soft); }

.segmented { display: inline-flex; align-self: flex-start; width: max-content; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; }
.segmented button { border: 0; border-radius: 0; background: var(--bg-raised); }
.segmented button + button { border-left: 1px solid var(--border); }
.segmented button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* ---- result --------------------------------------------------------------- */

.result-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: var(--pad);
  text-align: center;
  min-height: 128px;
  justify-content: center;
}
/* The slot carries the type size and the reserved height; the value inside it
   is clamped to that many lines and clipped with an ellipsis beyond. Both are
   set once per randomizer from its longest possible outcome, so a roll can
   never change the card's height. */
.result-slot {
  font-size: clamp(38px, 11vw, 76px);
  /* The last line's descenders sit in the padding below .result-value, so
     the slot makes room for it too. */
  height: calc(var(--result-lines, 1) * 1.05em + 0.16em);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
}
.result-slot.small { font-size: clamp(24px, 6vw, 40px); }
.result-value {
  font-size: inherit;
  font-weight: 680;
  line-height: 1.05;
  letter-spacing: -0.02em;
  word-break: break-word;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: var(--result-lines, 1);
  line-clamp: var(--result-lines, 1);
  overflow: hidden;
  /* The line is set tight, and the clip that limits an answer to its lines
     also cut off what hangs below them: the dice font's old-style 3, 4, 5, 7
     and 9 and Arapey's g, p and y reach about 0.2 em under the baseline,
     past the line box. The padding is inside the clip, so they keep it.
     Where the baseline falls differs by platform: 0.1 em was enough on
     Linux and 1.6 px short on Windows, hence the extra. */
  padding-bottom: 0.16em;
  max-width: 100%;
}
/* The detail line arrives with the first roll, so its room is kept from the
   start; the seed line only when a seed is set. */
.result-detail { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); min-height: 1.35em; }
.result-meta { font-size: 14px; color: var(--ink-faint); }
.result-panel.seeded .result-meta { min-height: 1.35em; }
.result-value.is-max { color: var(--ok); }
.result-value.is-min { color: var(--error); }

/* Make a choice: the offered outcomes as cards under the answer's slot. Every
   card is the same height — two lines, clipped — and the row holds invisible
   stand-ins from the moment the randomizer opens, so neither the cards
   arriving nor a longer label moves anything. */
.offer-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
  gap: 6px;
  width: 100%;
  margin: 4px 0 2px;
}
.offer-cards[hidden] { display: none; }
.offer-card {
  position: relative;
  height: calc(2 * 1.2em + 18px);
  padding: 9px 8px 9px 22px;
  font-size: 15px;
  line-height: 1.2;
  text-align: left;
  display: flex;
  align-items: center;
  min-width: 0;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--bg-raised);
}
.offer-card.placeholder { visibility: hidden; }
.offer-text {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
  word-break: break-word;
}
.offer-key { position: absolute; left: 7px; top: 6px; font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
button.offer-card:not([aria-disabled="true"]):hover { border-color: var(--accent); background: var(--accent-soft); }
.offer-card.face-down {
  background: repeating-linear-gradient(135deg, var(--accent-soft) 0 6px, var(--bg-raised) 6px 12px);
  opacity: 1;
}
.offer-card.chosen { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); font-weight: 650; }
.offer-card.not-chosen { opacity: 0.35; }
.offer-cards.flipping .offer-card:not(.placeholder) {
  /* The duration comes from feel.ts (OFFER_FLIP_MS), scaled by the motion
     setting; instant leaves this class off altogether. */
  animation: offer-in var(--offer-flip, 260ms) cubic-bezier(0.2, 0.8, 0.3, 1) both;
  animation-delay: calc(var(--i, 0) * var(--offer-flip, 260ms) / 3);
}
@keyframes offer-in {
  from { transform: rotateY(90deg); opacity: 0; }
  to { transform: none; opacity: 1; }
}
.cell .offer-card { font-size: 13px; }
.cell .offer-cards { grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); }

/* The quick wheel: a box of lines on the home screen, behind its own button
   in the preset row so the play card stays where a phone's thumb expects it. */
.quick-wheel[hidden] { display: none; }
/* The interface's own type rather than the mono of other text boxes: these
   are the options as the table will read them. 16px, or iOS zooms on focus. */
.quick-options { width: 100%; min-height: 6.5em; box-sizing: border-box; font-family: inherit; font-size: 16px; }
.quick-wheel-foot { margin-top: 6px; }
input.quick-offer, input.offer-input { width: 56px; }
.quick-too-long[hidden] { display: none; }
.quick-wheel-toggle[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); }

.quickbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--gap); }
.quickbar button { min-width: 54px; font-variant-numeric: tabular-nums; }
/* The same row, holding the way home instead of the presets, so opening a
   randomizer from the library does not shift everything below it. */
.home-bar .home-button { min-width: 0; }

/* ---- wheel ---------------------------------------------------------------- */

.wheel-wrap { position: relative; display: grid; place-items: center; padding: 8px 0 4px; }
.wheel-holder { width: 100%; max-width: min(72vw, 380px); }
.wheel-small .wheel-holder { max-width: 200px; }
/* The rotation is written as rotate(angle cx cy) on the group, which carries
   its own origin — a CSS transform-origin here would be applied on top of it
   and slide the wheel out of its own circle. */
.wheel-svg { display: block; width: 100%; height: auto; }
.wheel-pointer { filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3)); }
/* No font-size here: each label carries its own, sized to its slice, and a
   CSS font-size would override the attribute. The weight matches
   WHEEL_LABEL_WEIGHT in wheel.ts, which measures labels to fit them. */
.wheel-label { font-weight: 600; pointer-events: none; }
.ticker {
  height: 92px; overflow: hidden; position: relative; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--bg-sunken);
}
.ticker-strip { position: absolute; left: 0; right: 0; will-change: transform; }
.ticker-row { height: 46px; display: flex; align-items: center; padding: 0 14px; font-weight: 600; }
.ticker-marker {
  position: absolute; left: 0; right: 0; top: 23px; height: 46px;
  border-top: 2px solid var(--accent); border-bottom: 2px solid var(--accent); pointer-events: none;
}

/* ---- dice and coin -------------------------------------------------------- */

.dice-tray { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 56px; align-items: flex-end; }
.die {
  width: 46px; height: 46px; border-radius: 9px;
  display: grid; place-items: center;
  font-weight: 700; font-size: 18px;
  background: var(--bg-raised); border: 2px solid var(--border-strong);
  font-variant-numeric: tabular-nums;
}
/* Faded and dashed, not struck through: a line through a small old-style 2 reads as a Z. */
.die.dropped { opacity: 0.45; border-style: dashed; }
.die.max { border-color: var(--ok); color: var(--ok); }
.die.min { border-color: var(--error); color: var(--error); }
.die.rolling {
  /* animation-duration is set from the Feel settings when the roll starts. */
  animation: tumble 340ms linear infinite;
  color: var(--ink-faint);
  border-style: dashed;
}
@keyframes tumble {
  0% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-11px) rotate(90deg) scale(1.04); }
  50% { transform: translateY(0) rotate(180deg); }
  75% { transform: translateY(-7px) rotate(270deg) scale(0.98); }
  100% { transform: translateY(0) rotate(360deg); }
}

/* The wireframe dice: a canvas per die, the value revealed on it and under it
   once it lands. Only transform and opacity are animated. */
.die-slot { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.die-stage { position: relative; width: 92px; height: 92px; display: grid; place-items: center; }
.die-canvas { display: block; }
.die-value {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-weight: 650;
  /* Set from the geometry when the die lands: half the length of a side of
     the face it is showing. */
  font-size: 18px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  opacity: 0;
  transition: opacity 180ms cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
}
.die-slot:not(.rolling) .die-value { opacity: 1; }
.die-caption {
  font-size: 13px;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  min-height: 1.2em;
}
.die-slot.dropped { opacity: 0.55; }
.die-slot.dropped .die-value,
.die-slot.max .die-value { color: var(--ok); }
.die-slot.min .die-value { color: var(--error); }

/* The landing: a drop, a squash, one smaller hop, then rest. */
.die.landing { animation: land var(--bounce, 440ms) cubic-bezier(0.28, 0.9, 0.35, 1) both; }
.die-stage.landing { animation: land var(--bounce, 440ms) cubic-bezier(0.28, 0.9, 0.35, 1) both; }
@keyframes land {
  0% { transform: translateY(-18px) scaleY(1.08) scaleX(0.94); }
  35% { transform: translateY(0) scaleY(0.86) scaleX(1.12); }
  55% { transform: translateY(-8px) scaleY(1.05) scaleX(0.97); }
  75% { transform: translateY(0) scaleY(0.94) scaleX(1.05); }
  90% { transform: translateY(-2px) scaleY(1.01) scaleX(0.99); }
  100% { transform: none; }
}

.coin-wrap { display: grid; place-items: center; min-height: 120px; padding-top: 60px; }
.coin-flight { will-change: transform; }
.coin {
  width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 700; border: 3px solid var(--accent-strong); background: var(--accent);
  color: var(--accent-ink); transform-style: preserve-3d; margin: 0 auto;
}
.coin.flipping { animation: flip var(--coin-duration, 1100ms) cubic-bezier(0.3, 0, 0.2, 1); }
@keyframes flip {
  from { transform: rotateX(0); }
  to { transform: rotateX(calc(360deg * var(--coin-flips, 5))); }
}
/* The toss: a parabola sampled at eighths, so the wrapper follows the true
   curve between linear keyframes; the coin shrinks towards the apex to read
   as going away, and comes back to size as it lands. */
.coin-flight.tossing { animation: toss var(--coin-duration, 1100ms) linear both; }
@keyframes toss {
  0%    { transform: translate(calc(var(--travel, 0px) * -1), 0) scale(1); }
  12.5% { transform: translate(calc(var(--travel, 0px) * -0.875), calc(var(--arc-h, 0px) * -0.4375)) scale(calc(1 - (1 - var(--shrink, 1)) * 0.383)); }
  25%   { transform: translate(calc(var(--travel, 0px) * -0.75), calc(var(--arc-h, 0px) * -0.75)) scale(calc(1 - (1 - var(--shrink, 1)) * 0.707)); }
  37.5% { transform: translate(calc(var(--travel, 0px) * -0.625), calc(var(--arc-h, 0px) * -0.9375)) scale(calc(1 - (1 - var(--shrink, 1)) * 0.924)); }
  50%   { transform: translate(calc(var(--travel, 0px) * -0.5), calc(var(--arc-h, 0px) * -1)) scale(var(--shrink, 1)); }
  62.5% { transform: translate(calc(var(--travel, 0px) * -0.375), calc(var(--arc-h, 0px) * -0.9375)) scale(calc(1 - (1 - var(--shrink, 1)) * 0.924)); }
  75%   { transform: translate(calc(var(--travel, 0px) * -0.25), calc(var(--arc-h, 0px) * -0.75)) scale(calc(1 - (1 - var(--shrink, 1)) * 0.707)); }
  87.5% { transform: translate(calc(var(--travel, 0px) * -0.125), calc(var(--arc-h, 0px) * -0.4375)) scale(calc(1 - (1 - var(--shrink, 1)) * 0.383)); }
  100%  { transform: translate(0, 0) scale(1); }
}
.coin-flight.landing { animation: land var(--bounce, 440ms) cubic-bezier(0.28, 0.9, 0.35, 1) both; }

/* The dice fly in from one point below the tray, scatter, and arrive at
   their own slots. Ease-in-out: slow to leave the hand, slow to arrive. */
.die-flight { will-change: transform; }
.die-flight.flying { animation: throw var(--flight, 900ms) cubic-bezier(0.45, 0, 0.25, 1) both; }
/* A later throw — dice an explosion or a reroll added — is not in the air
   yet: it keeps its place in the row, unseen, until it is thrown. */
.die-flight.waiting { visibility: hidden; }
@keyframes throw {
  0%   { transform: translate(var(--sx, 0px), var(--sy, 0px)) scale(0.8); }
  45%  { transform: translate(var(--mx, 0px), var(--my, 0px)) scale(1.06); }
  100% { transform: translate(0, 0) scale(1); }
}

/* The result is not shown until the animation lands, so the slot holds its
   place with a muted note rather than the answer. */
.result-panel.is-pending .result-value { color: var(--ink-faint); font-weight: 550; opacity: 0.8; }

/* ---- library -------------------------------------------------------------- */

.tree { list-style: none; margin: 0; padding: 0; }
.tree li { list-style: none; }
.tree-row {
  display: flex; align-items: center; gap: 6px; width: 100%;
  padding: 5px 6px; border-radius: var(--radius-sm); border: 0; background: none;
  text-align: left; cursor: pointer; min-height: 34px;
}
.tree-row:hover { background: var(--bg-sunken); }
.tree-row[aria-current="true"] { background: var(--accent-soft); font-weight: 600; }
.tree-row.drop-target, .tree-holder.drop-target { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-soft); }
.tree-row.dragging { opacity: 0.4; }
.library-head { margin-bottom: 8px; }
.library-title { margin: 0; font-size: 16px; }
.library-foot { margin-top: 12px; }
.storage-badge {
  font-size: 13px; padding: 3px 9px; min-height: 26px; border-radius: 999px;
  border-color: var(--border); color: var(--ink-soft); background: var(--bg-sunken);
}
.storage-badge.memory { color: #fff; background: var(--error); border-color: var(--error); }
.storage-badge.fsa { color: var(--accent-ink); background: var(--accent-soft); border-color: var(--accent); }
.notice {
  background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 8px 10px;
  border-radius: var(--radius-sm); font-size: 14px; margin: 8px 0; line-height: 1.5;
}
.notice.danger { background: #fde4e4; border-left-color: var(--error); color: #6b1f1f; }
.menu {
  position: absolute; z-index: 60; min-width: 200px; padding: 6px;
  background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius-sm);
  box-shadow: var(--shadow); display: flex; flex-direction: column;
}
.menu-item { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 6px; min-height: 34px; }
.menu-item:hover, .menu-item:focus-visible { background: var(--bg-sunken); outline: none; }
.menu-item.danger { color: var(--error); }
.menu-rule { height: 1px; background: var(--border); margin: 4px 2px; }
.folder-pick { max-height: 50vh; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px; }
.tree-row .glyph { width: 18px; text-align: center; flex: none; }
.tree-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-row .count { margin-left: auto; color: var(--ink-faint); font-size: 13px; }
.tree ul { margin: 0; padding-left: 14px; border-left: 1px solid var(--border); }
.tree-file { display: flex; align-items: center; gap: 2px; flex-wrap: nowrap; }
.tree-file .tree-row { flex: 1; min-width: 0; }

.search-hit .why { color: var(--ink-faint); font-size: 13px; }

/* ---- outcome table -------------------------------------------------------- */

/* Two columns joined the table (a picture, and where an outcome sends you),
   so the minimum is wider than it was: below this the selects collapse to a
   sliver you cannot read, and the wrapper scrolls instead. */
.outcomes { width: 100%; min-width: 900px; border-collapse: collapse; }
.outcomes th {
  text-align: left; font-size: 13px; color: var(--ink-soft); font-weight: 600;
  padding: 4px 6px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg-raised);
}
.outcomes td { padding: 2px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.outcomes tr.disabled .label-cell input,
.outcomes tr.disabled .weight-cell input { opacity: 0.5; }
.outcomes tr.disabled .pct { text-decoration: line-through; }
.outcomes tr.dragging { opacity: 0.4; }
.outcomes tr.drop-target td { border-top: 2px solid var(--accent); }
.outcomes .handle { cursor: grab; color: var(--ink-faint); user-select: none; width: 22px; text-align: center; }
.outcomes .pct { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 14px; width: 58px; text-align: right; }
.outcomes input[type="text"], .outcomes input[type="number"] { min-height: 32px; padding: 4px 7px; }
.outcomes .weight-cell input { width: 68px; text-align: right; font-variant-numeric: tabular-nums; }
.outcomes .label-cell { min-width: 150px; }
.outcomes .label-cell input, .outcomes .desc-cell input { width: 100%; box-sizing: border-box; }
.outcomes .desc-cell { min-width: 130px; width: 30%; }
.outcomes .reaction-cell { width: 1%; white-space: nowrap; }

/* ---- the Orangey tag on an outcome ---------------------------------------- */

.reaction-control {
  min-height: 30px; min-width: 56px; padding: 2px 8px; font-size: 14px;
  border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--ink-faint);
}
.reaction-control.reaction-cheer { color: var(--ink); background: color-mix(in oklab, var(--accent) 22%, transparent); border-color: transparent; }
.reaction-control.reaction-wince { color: var(--ink); background: color-mix(in oklab, var(--ink) 12%, transparent); border-color: transparent; }
.reaction-control:hover { border-color: var(--ink-soft); }
.face-row { flex-wrap: nowrap; }
.face-row input { flex: 1; min-width: 0; }
.face-row .faint { white-space: nowrap; }

/* ---- my colours ------------------------------------------------------------- */

.my-colours { display: flex; flex-direction: column; gap: 4px; }
.my-colour { display: flex; align-items: center; gap: 10px; padding: 2px 0; }
.my-colour-swatch { width: 26px; height: 26px; border-radius: 7px; border: 1px solid rgba(0,0,0,0.12); flex: none; }
.my-colour-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.my-colour-hex { font-variant-numeric: tabular-nums; }
.colours-card input[type="color"], .swatch-add input[type="color"] { width: 44px; height: 36px; padding: 2px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg-raised); }
.add-colour-row, .swatch-add .row, .swatch-dialog .hex-row { flex-wrap: nowrap; }
.swatch-dialog .hex-row input[type="text"] { flex: 1; width: auto; min-width: 100px; }
.add-colour-row input[type="text"], .swatch-add input[type="text"] { flex: 1; width: auto; min-width: 120px; }
.swatch-grid-custom button { outline: 1px dashed var(--ink-faint); outline-offset: -3px; }
.swatch-grid-custom button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
/* The row actions stay reachable when a narrow screen scrolls the table. */
.outcomes .actions,
.outcomes th:last-child {
  white-space: nowrap;
  width: 1%;
  position: sticky;
  right: 0;
  background: var(--bg-raised);
  box-shadow: -6px 0 6px -6px rgba(0, 0, 0, 0.18);
}
.outcomes tbody tr:hover { background: var(--bg-sunken); }
.swatch {
  width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border-strong);
  padding: 0; cursor: pointer; flex: none;
}
.swatch.auto { position: relative; }
.swatch.auto::after {
  content: "A"; position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.85); text-shadow: 0 0 2px rgba(0,0,0,0.6);
}
.swatch-groups { max-height: 56vh; overflow: auto; padding-right: 4px; }
.swatch-group-title { margin: 10px 0 4px; font-size: 13px; }
.swatch-grid { display: flex; flex-wrap: wrap; gap: 5px; }
.swatch-grid button { width: 28px; height: 28px; border-radius: 7px; padding: 0; min-height: 0; border: 1px solid rgba(0,0,0,0.12); }
.swatch-grid button:hover { transform: scale(1.12); }
.swatch-name { min-height: 1.4em; margin-bottom: 4px; }
.swatch-grid button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }

.editor-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: var(--pad); align-items: start; }
/* minmax(0, 1fr), not 1fr: the outcome table has a minimum width and scrolls
   inside .table-scroll, but a plain 1fr track is at least as wide as its
   content, so on a phone the whole card grew to the table's width instead. */
@media (max-width: 900px) { .editor-layout { grid-template-columns: minmax(0, 1fr); } }
.table-scroll { max-height: 62vh; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); }

/* ---- misc ----------------------------------------------------------------- */

/* The settings and preview cards are made once and filled as there is
   something to say; until then they are empty, and an empty card is a
   rounded blank under the page. */
.importer > .card:empty { display: none; }
.report { font-family: var(--mono); font-size: 13px; line-height: 1.7; white-space: pre-wrap; margin: 0; }
.report .ok { color: var(--ok); }
.report .warn { color: var(--warn); }
.report .error { color: var(--error); }

.toasts { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--ink); color: var(--bg); padding: 9px 12px; border-radius: var(--radius);
  display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); font-size: 14px;
}
.toast button { background: none; border: 0; color: var(--bg); text-decoration: underline; padding: 2px 4px; min-height: 0; }

.history-list { list-style: none; margin: 0; padding: 0; }
.history-list li { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--border); }
.history-list .when { color: var(--ink-faint); font-variant-numeric: tabular-nums; font-size: 13px; flex: none; }
.history-list .what { flex: 1; min-width: 0; }
.history-list .what .name { font-weight: 600; }
.history-list .what .detail { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }
/* The dice behind an answer and the roll that led to it: under the headline,
   quieter than it, one line each. */
.history-list .what .roll-note { display: block; font-size: 13px; color: var(--ink-faint); }
.history-list .what .roll-parts { font-family: var(--mono); }

/* Full-screen result, for a link clicked from a slide or a projector.
   The chrome is hidden here rather than with the hidden attribute, which the
   class rules that set `display` would otherwise override. */
body.presenting .topbar,
body.presenting .side,
body.presenting .tabbar,
body.presenting .quickbar,
body.presenting .quick-wheel,
/* Everything after the play card, not after the first card: on the home
   screen the quick wheel's card comes first, and would take the play card
   with it. */
body.presenting .play > .play-card ~ .card,
body.presenting .present-button,
body.presenting .link-button,
body.presenting .edit-link {
  display: none !important;
}

body.presenting #app { height: 100dvh; overflow: hidden; }
body.presenting .panes { height: 100dvh; }
body.presenting .main { padding: 0; overflow: hidden; }
body.presenting .main-inner { max-width: none; height: 100%; display: flex; }
body.presenting .play { flex: 1; min-height: 0; display: flex; flex-direction: column; }
body.presenting .play > .card {
  flex: 1;
  min-height: 0;
  margin: 0;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  padding: clamp(12px, 3vw, 40px);
}
/* The stage gives way, not the result: the panel keeps the height it has
   reserved for two lines of the largest type, and the wheel takes what is
   left. Squeezing the panel instead let the answer overlap the wheel. */
body.presenting .stage { display: flex; justify-content: center; min-height: 0; flex: 1 1 auto; }
/* Full screen the wheel is sized by the height it is given, not by the width
   of the window: a width-driven square overflowed the space left above the
   result and drew over it. */
body.presenting .wheel-wrap { display: flex; align-items: stretch; justify-content: center; min-height: 0; padding: 0; }
body.presenting .wheel-holder {
  /* Stretched to the height the stage was given — a definite size, unlike a
     percentage against a flex-sized parent — and squared from there. */
  align-self: stretch;
  width: auto;
  height: auto;
  aspect-ratio: 1;
  max-height: min(44vh, 420px);
  max-width: 100%;
}
body.presenting .wheel-svg { height: 100%; width: 100%; }
body.presenting .result-panel { min-height: 0; padding: 4px; flex: none; }
body.presenting .result-slot { font-size: clamp(40px, 11vw, 150px); }
body.presenting .result-slot.small { font-size: clamp(30px, 7vw, 96px); }
/* Two reserved lines at the full-screen size would take a third of a laptop
   screen, so it steps down: still the largest thing on the wall, with the
   wheel above it left room to be seen. */
body.presenting .result-panel.two-lines .result-slot { font-size: min(clamp(36px, 8vw, 112px), 17vh); }
body.presenting .result-panel.two-lines .result-slot.small { font-size: min(clamp(28px, 6vw, 84px), 15vh); }
body.presenting .result-detail { font-size: clamp(13px, 1.5vw, 20px); }
/* Cards read from across the room, like the answer they stand in for. */
body.presenting .offer-card { font-size: clamp(15px, 1.8vw, 24px); }
body.presenting .roll-button { min-height: 60px; font-size: 20px; flex: none; }
body.presenting .leave-presenting {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 30;
  opacity: 0.5;
}
body.presenting .leave-presenting:hover,
body.presenting .leave-presenting:focus-visible { opacity: 1; }

.scheme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.scheme-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;
  padding: 10px; border-radius: var(--radius); min-height: 0;
}
.scheme-card[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.scheme-name { font-weight: 650; }
.scheme-swatch { width: 100%; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.08); }
.scheme-system .scheme-swatch { background: linear-gradient(90deg, #fff8ef 0 50%, #253122 50% 100%); }
.scheme-orangey .scheme-swatch { background: linear-gradient(90deg, #fff8ef 0 60%, #f3a257 60% 100%); }
.scheme-night .scheme-swatch { background: linear-gradient(90deg, #253122 0 60%, #f3a257 60% 100%); }
.scheme-meadow .scheme-swatch { background: linear-gradient(90deg, #f4fbf3 0 60%, #5cc46a 60% 100%); }
.scheme-ocean .scheme-swatch { background: linear-gradient(90deg, #f3f9fd 0 60%, #3fa7e0 60% 100%); }
.scheme-berry .scheme-swatch { background: linear-gradient(90deg, #fff5f8 0 60%, #e8679a 60% 100%); }

.animate-toggle { font-size: 14px; }
.feel-card .feel-section { margin-top: 8px; }

.link-dialog input[type="text"] { font-family: var(--mono); font-size: 12px; }
.warning {
  color: var(--warn);
  background: var(--bg-sunken);
  border-left: 3px solid var(--warn);
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: 14px;
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

dialog {
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-raised);
  color: var(--ink); box-shadow: var(--shadow); padding: var(--pad); max-width: min(560px, 92vw);
}
dialog::backdrop { background: rgba(0, 0, 0, 0.35); }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ---- Orangey the mascot ---------------------------------------------------
 * One SVG carries every pose; data-pose on the svg picks the arms, mouth and
 * left eye. Colours are the brand's, fixed: he is the same fruit in every
 * scheme. The wobble, hops and eye movement are written by mascot/view.ts;
 * only the blink is CSS.
 */
.mascot { display: block; width: 100%; height: 100%; }
.mascot-svg { display: block; width: 100%; height: 100%; overflow: visible; }
.mascot-svg .l { fill: none; stroke: #253122; stroke-width: 1.35; stroke-linecap: round; stroke-miterlimit: 10; }
.mascot-svg .d { fill: #253122; }
.mascot-svg .body, .logo-svg .body { fill: #f3a257; }
.mascot-svg .stem, .logo-svg .stem { fill: #a49533; }
.mascot-svg .eye, .logo-svg .eye { fill: #f5ecc2; }
/* The mark in the top bar: the same artwork, standing still. */
.logo-svg { display: block; width: 100%; height: 100%; }
.mascot-svg .mouth { fill: #f48067; }
.mascot-svg .arm, .mascot-svg .mouth, .mascot-svg .eyeLopen, .mascot-svg .eyeLsquint { opacity: 0; transition: opacity 90ms linear; }
.mascot-svg[data-pose="neutral"] .armE, .mascot-svg[data-pose="neutral"] .armF, .mascot-svg[data-pose="neutral"] .mIdle,
.mascot-svg[data-pose="surprised"] .armA, .mascot-svg[data-pose="surprised"] .armB, .mascot-svg[data-pose="surprised"] .mO,
.mascot-svg[data-pose="oops"] .armC, .mascot-svg[data-pose="oops"] .armD, .mascot-svg[data-pose="oops"] .mW, .mascot-svg[data-pose="oops"] .eyeLsquint,
.mascot-svg[data-pose="happy"] .armG, .mascot-svg[data-pose="happy"] .armH, .mascot-svg[data-pose="happy"] .mHappy,
.mascot-svg[data-pose="anticipate"] .armI, .mascot-svg[data-pose="anticipate"] .armJ, .mascot-svg[data-pose="anticipate"] .mAnt { opacity: 1; }
.mascot-svg[data-pose]:not([data-pose="oops"]) .eyeLopen { opacity: 1; }
.mascot-svg .lid { transform-box: fill-box; transform-origin: 50% 50%; }
.mascot-svg.blinking .lid { animation: mascot-blink 5.4s infinite; }
@keyframes mascot-blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(0.06); } 98% { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) { .mascot-svg.blinking .lid { animation: none; } }

.mascot-preview { width: 150px; height: 150px; flex: none; }
.mascot-preview-row { align-items: center; gap: 18px; }
.mascot-preview-controls { display: flex; flex-direction: column; gap: 8px; }
.mascot-rules { display: grid; gap: 6px; }
.row.wrap { flex-wrap: wrap; }

/* The one Orangey the app shows, in whichever slot is on screen. */
.result-panel { position: relative; }
.mascot-slot { position: absolute; left: 6px; bottom: 0; width: 88px; height: 88px; pointer-events: none; }
.mascot-slot-inline { position: static; width: 72px; height: 72px; }
.mascot-host { opacity: 0; transition: opacity 180ms ease; }
.mascot-host.is-visible { opacity: 1; }
body.presenting .mascot-slot { left: auto; right: 24px; bottom: 24px; width: 120px; height: 120px; }
@media (prefers-reduced-motion: reduce) { .mascot-host { transition: none; } }

/* ---- A roll struck through ------------------------------------------------
 * The roll happened, so the row keeps its place and its time; the line says
 * the table agreed not to count it, which is what a pencil through it on
 * paper says. Both the History screen and the Recent rolls panel draw it.
 */
.history-list li.struck .when,
.history-list li.struck .what { text-decoration: line-through; }
.history-list li.struck .name,
.history-list li.struck .detail { color: var(--ink-faint); }

/* ---- pictures on outcomes -------------------------------------------------
   The wheel carries a thumbnail; the answer carries the picture itself, sized
   so that it never pushes the name or the Roll button off a laptop screen. */

.result-picture {
  display: block; margin: 0 auto 6px; max-width: 100%; max-height: 18vh;
  border-radius: var(--radius); object-fit: contain;
}
body.presenting .result-picture { max-height: 40vh; }
.cell .result-picture { max-height: 22vh; }
.picture-cell { display: inline-flex; align-items: center; gap: 4px; }
.picture-thumb { width: 34px; height: 34px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); }
.picture-col { white-space: nowrap; }
.goes-to-cell { white-space: nowrap; }
/* The description is the column that gives way when the window is narrow, but
   it must not give way to nothing. */
.outcomes .desc-cell input { min-width: 130px; }
.outcomes th, .outcomes .goes-to-cell, .outcomes .picture-col { white-space: nowrap; }

/* ---- boards ----------------------------------------------------------------
   Several randomizers on one screen. The grid is sized by the cells rather
   than by a column count, so a board of two is not stretched across a desktop
   and a board of nine still fits a laptop. */

.board-grid {
  display: grid; gap: var(--gap);
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  margin-bottom: var(--gap);
}
.board-grid.board-empty { display: none; }
.cell-holder { position: relative; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; background: var(--bg-raised); }
/* Every cell in a row is as tall as the tallest, and its Roll sits at the
   bottom, so the buttons line up across the board whatever each cell shows —
   a percentage line, a dice breakdown, or nothing yet. */
.board-grid > .cell-holder, .board-grid > .chain-link.board-chain { display: flex; flex-direction: column; }
.board-grid > .cell-holder > .cell, .board-grid > .chain-link.board-chain > .cell { flex: 1 0 auto; }
.board-grid .cell-roll, .board-grid .chain-roll { margin-top: auto; }
.cell-holder.dragging { opacity: 0.5; }
.cell-name { font-size: 16px; margin: 0 0 6px; }
.cell-stage { display: grid; place-items: center; min-height: 120px; }
.cell-remove { position: absolute; top: 6px; right: 6px; padding: 2px 8px; line-height: 1; }
/* Taking a randomizer off the board is an edit; in play mode there is no ✕ to
   hit by accident. A chain's ✕ only closes what a roll opened, so it stays. */
.board:not(.board-editing) .cell-holder > .cell-remove { display: none; }
.board-editing .cell-holder { cursor: grab; }
.cell-missing { color: var(--ink-soft); }
.cell-roll { width: 100%; margin-top: 8px; }
.board-grid > .cell-holder > .cell, .board-grid > .chain-link.board-chain > .cell { margin-bottom: 8px; }
/* Opened by an outcome's link, not part of the board: dashed, so it reads as
   something that will go away rather than something that was put there. */
.board-grid > .chain-link.board-chain { position: relative; margin: 0; padding: 10px; box-shadow: none; border-style: dashed; }
/* A cell's answer is read from across a table, but there are several of them:
   between the play screen's huge type and the size of the cell it sits in. */
.cell .result-slot { font-size: clamp(20px, 3.4vw, 34px); min-height: 0; }
.cell .result-slot.small { font-size: clamp(16px, 2.6vw, 26px); }
.cell .result-detail { font-size: 12px; }
.cell .result-panel { padding: 0; }
body.presenting .cell .result-slot { font-size: clamp(24px, 4vw, 54px); }

/* ---- choosing a randomizer ------------------------------------------------
   The library, in a dialog: a tree while you browse, a flat list of matches
   while you type. */

.picker-dialog { border: 1px solid var(--border); border-radius: var(--radius); padding: var(--gap); width: min(520px, 92vw); }
.picker-dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
.picker-dialog h2 { margin-top: 0; }
.picker-new { flex-wrap: wrap; margin-bottom: 8px; }
.picker-tree { max-height: 46vh; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); margin: 8px 0; padding: 4px; display: grid; gap: 2px; }
.picker-row { width: 100%; text-align: left; justify-content: flex-start; }
.picker-taken { opacity: 0.45; }
.picker-note:empty { display: none; }
.goes-to { flex-wrap: nowrap; }
.goes-to-button { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.goes-to-button.missing { color: var(--error); }

.board-picker { border: 1px solid var(--border); border-radius: var(--radius); padding: var(--gap); max-width: 420px; }
.board-picker::backdrop { background: rgba(0, 0, 0, 0.35); }
.picker-list { list-style: none; margin: 0 0 var(--gap); padding: 0; display: grid; gap: 4px; max-height: 50vh; overflow-y: auto; }
.picker-choice { width: 100%; text-align: left; }

/* Full screen: the grid takes the height it is given, and the cells shrink to
   fit rather than pushing the button off the bottom. */
body.presenting .board .home-bar,
body.presenting .board .cell-remove { display: none; }
body.presenting .board-card { display: flex; flex-direction: column; min-height: 0; height: 100vh; }
body.presenting .board-grid { flex: 1; min-height: 0; overflow: auto; }

/* ---- an outcome that opens another randomizer ------------------------------
   The randomizer that opened sits beside the one that sent you there, so the
   table can see both at once. Anything earlier in the chain is an icon in the
   strip above, with the answer it gave.

   The chain's elements are siblings of the play card rather than a box around
   it, because the full-screen rules above are written against `.play > .card`.
   The two columns are a grid that exists only while something is open. */

.play.has-chain {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: var(--gap);
  align-items: start;
}
.play.has-chain > * { grid-column: 1 / -1; }
.play.has-chain > .play-card { grid-column: 1; }
.play.has-chain > .chain-open { grid-column: 2; }
/* The root has become an icon, so there is no first column to sit beside. */
.play.has-chain.chain-wide > .chain-open { grid-column: 1 / -1; }
@media (max-width: 720px) { .play.has-chain { display: block; } }

.chain-open { display: flex; gap: var(--gap); align-items: start; }
.chain-open > * { flex: 1 1 0; min-width: 0; }
.chain-link {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--pad);
  box-shadow: var(--shadow);
  margin-bottom: var(--gap);
}
.chain-from { margin: 0 0 6px; }
.chain-link .cell-name { margin-top: 0; }
.chain-roll { width: 100%; min-height: 44px; margin-top: 8px; }
.chain-note { margin: 0 0 var(--gap); }

.chain-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--gap); }
/* With nothing in it the strip's margin still showed, as a band across the
   top of the full-screen view. */
.chain-strip:empty { display: none; }
.chain-icon { display: flex; align-items: baseline; gap: 8px; max-width: 240px; }
.chain-icon-name { font-weight: 600; }
.chain-icon-answer { color: var(--ink-faint); font-size: 14px; }
.chain-icon-name,
.chain-icon-answer { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* The one-time Add to Home Screen notice on an iPhone or iPad in a tab. */
.home-screen-notice { margin: 8px var(--gap) 0; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-raised); }
.home-screen-notice p { margin: 0 0 8px; }

/* ---- type ------------------------------------------------------------------
   Arapey is the page's font (--font on body), Young Serif the numbers on
   dice, and the system font only the labels on wheel slices, which are
   small, dense and on strong colour. Arapey has no bold. Headings, names and
   answers are large enough to carry themselves, so nothing is faked there; the
   small interface weights — a primary button, the selected row, a field label
   — keep their browser-thickened bold, which at those sizes reads as
   emphasis rather than as a heavier face. */
h1, h2, h3, .brand, .board-name, .cell-name,
.result-panel:not(.is-dice) .result-value {
  font-synthesis: none;
}
.die, .die-value, .result-panel.is-dice .result-value {
  font-family: var(--font-dice);
  font-synthesis: none;
}
.wheel-label { font-family: var(--font-ui); }

</style>

<div id="app"></div>
<noscript>Orangey needs JavaScript: everything it does runs in your browser, and there is no server to do it instead.</noscript>
<script type="module">

// ---- src/ui/dom.ts -----------------------------------------------
/**
 * A very small DOM helper.
 *
 * Views build elements with `h`, keep references to the few nodes they update,
 * and update those in place. There is no virtual DOM and no re-render of whole
 * views: the outcome table has text fields in it, and nothing loses a user's
 * cursor faster than rebuilding the row they are typing in.
 */

                                                                         

                        
                 
                
                
                                                
                                   
                         
 

function applyProps(el         , props       )       {
  for (const [key, value] of Object.entries(props)) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") el.setAttribute("class", String(value));
    else if (key === "text") el.textContent = String(value);
    else if (key === "html") el.innerHTML = String(value);
    else if (key === "style" && typeof value === "object") Object.assign((el               ).style, value);
    else if (key === "style") el.setAttribute("style", String(value));
    else if (key === "dataset") Object.assign((el               ).dataset, value                          );
    else if (key.startsWith("on") && typeof value === "function") {
      el.addEventListener(key.slice(2).toLowerCase(), value                 );
    } else if (key === "value" && el instanceof HTMLInputElement) el.value = String(value);
    else if (key === "checked" && el instanceof HTMLInputElement) el.checked = value === true;
    else if (value === true) el.setAttribute(key, "");
    else el.setAttribute(key, String(value));
  }
}

function append(el         , children         )       {
  for (const child of children) {
    if (child === null || child === undefined || child === false) continue;
    if (Array.isArray(child)) append(el, child);
    else if (child instanceof Node) el.appendChild(child);
    else el.appendChild(document.createTextNode(String(child)));
  }
}

/**
 * Append children to an element, skipping nulls.
 *
 * Native `append()` stringifies null into the text "null", which is exactly
 * what a conditional child produces when the condition is false. Use this
 * wherever the children are built conditionally.
 */
function appendChildren(el         , ...children         )       {
  append(el, children);
}

function h                                       (
  tag   ,
  props               = null,
  ...children         
)                           {
  const el = document.createElement(tag);
  if (props) applyProps(el, props);
  append(el, children);
  return el;
}

const SVG_NS = "http://www.w3.org/2000/svg";

function s(tag        , props               = null, ...children         )             {
  const el = document.createElementNS(SVG_NS, tag)              ;
  if (props) {
    for (const [key, value] of Object.entries(props)) {
      if (value === null || value === undefined || value === false) continue;
      if (key.startsWith("on") && typeof value === "function") {
        el.addEventListener(key.slice(2).toLowerCase(), value                 );
      } else if (key === "text") el.textContent = String(value);
      else el.setAttribute(key, String(value));
    }
  }
  append(el, children);
  return el;
}

/**
 * Replace an element's children, skipping nulls.

 * `Element.replaceChildren` stringifies null into the text "null", which is
 * exactly what a conditional child produces when the condition is false.
 */
function setChildren(el         , ...children         )       {
  clear(el);
  append(el, children);
}

function clear(el         )       {

function on                                (

/**
 * When a roll happened, for a list that may span days.
 *
 * "14:32" is enough for this evening's game and useless for a session three
 * weeks ago, so anything but today carries its date as well.
 */
function formatWhen(at        )         {
  const when = new Date(at);
  const now = new Date();
  const sameDay =
    when.getFullYear() === now.getFullYear() && when.getMonth() === now.getMonth() && when.getDate() === now.getDate();
  if (sameDay) return formatTime(at);
  return `${when.toLocaleDateString(undefined, { day: "numeric", month: "short" })} ${formatTime(at)}`;
}

/** A small menu anchored under a button. Closes on Escape, outside click, or choice. */
function openMenu(anchor             , items            , label = "Menu")       {
  document.querySelector(".menu")?.remove();
  const menu = h("div", { class: "menu", role: "menu", "aria-label": label });
  const close = () => {
    menu.remove();
    document.removeEventListener("pointerdown", outside, true);
    document.removeEventListener("keydown", onKey, true);
    anchor.setAttribute("aria-expanded", "false");
  };
  const outside = (e       ) => {
    if (!menu.contains(e.target        ) && e.target !== anchor) close();
  };
  const onKey = (e               ) => {
    const buttons = [...menu.querySelectorAll                   ("button:not([disabled])")];
    const at = buttons.indexOf(document.activeElement                     );
    if (e.key === "Escape") {
      e.preventDefault();
      close();
      anchor.focus();
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      buttons[(at + 1) % buttons.length]?.focus();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      buttons[(at - 1 + buttons.length) % buttons.length]?.focus();
    }
  };
  for (const item of items) {
    if (item.separator) menu.appendChild(h("div", { class: "menu-rule", role: "separator" }));
    menu.appendChild(
      h("button", {
        type: "button",
        role: "menuitem",
        class: `menu-item${item.danger ? " danger" : ""}`,
        disabled: item.disabled ? true : undefined,
        onclick: () => {
          close();
          item.onSelect();
        },
      }, item.label),
    );
  }
  const rect = anchor.getBoundingClientRect();
  menu.style.top = `${rect.bottom + window.scrollY + 4}px`;
  menu.style.left = `${Math.min(rect.left + window.scrollX, window.innerWidth - 240)}px`;
  document.body.appendChild(menu);
  anchor.setAttribute("aria-expanded", "true");
  document.addEventListener("pointerdown", outside, true);
  document.addEventListener("keydown", onKey, true);
  (menu.querySelector("button:not([disabled])")                            )?.focus();
}

/**
 * Random sources.
 *
 * Two implementations of one interface (plan C4, decision D8):
 *   - CryptoSource  wraps crypto.getRandomValues; not reproducible, the default.
 *   - SeededSource  xoshiro128** driven by a string seed; reproducible, opt-in.
 *
 * Both produce unbiased integers by rejection sampling. Every result that
 * reaches an outcome comes from one of these and from nothing else.
 * `Math.random` is allowed for cosmetics only — the scatter of a wheel's
 * labels, the axes a die tumbles about — and never for anything a person
 * reads as the answer.
 */

                               
                                                            
                                        
                                                         
                  
                                                                                   
                         
 

class RangeError_ extends Error {}

const TWO32 = 4294967296;

function checkRange(min        , max        )       {
  if (!Number.isInteger(min) || !Number.isInteger(max)) {
    throw new RangeError_(`int() needs integer bounds, got ${min}..${max}`);
  }
  if (max < min) throw new RangeError_(`int() needs max >= min, got ${min}..${max}`);
  if (max - min + 1 > Number.MAX_SAFE_INTEGER) {
    throw new RangeError_("int() range is too large");
  }
}

/**
 * Unbiased integer from a source of uniform 32-bit words.
 *
 * The naive `min + (word % n)` is biased whenever n does not divide 2^32: the
 * low residues occur once more often than the high ones. We reject the tail
 * that causes it, so every value is equally likely at the cost of a rare extra
 * draw. Ranges wider than 2^32 are built from two words.
 */
function intFromWords(next              , min        , max        )         {
  checkRange(min, max);
  const n = max - min + 1;
  if (n === 1) return min;
  if (n <= TWO32) {
    const limit = TWO32 - (TWO32 % n);
    let x = next();
    while (x >= limit) x = next();
    return min + (x % n);
  }
  // Wide range: 53 bits, rejection on the same principle.
  const limit = Math.floor(Number.MAX_SAFE_INTEGER / n) * n;
  for (;;) {
    const hi = next() % 2097152; // 21 bits
    const x = hi * TWO32 + next();
    if (x < limit) return min + (x % n);
  }
}

function floatFromWords(next              )         {
  // 53 bits: 26 high + 27 low, the standard construction.
  const hi = next() >>> 6; // 26 bits
  const lo = next() >>> 5; // 27 bits
  return (hi * 134217728 + lo) / 9007199254740992;
}

/** The default source. Not reproducible: crypto RNGs cannot be seeded. */
class CryptoSource                         {
           seed = undefined;
  #buf = new Uint32Array(64);
  #i = this.#buf.length;

  #next = ()         => {
    if (this.#i >= this.#buf.length) {
      globalThis.crypto.getRandomValues(this.#buf);
      this.#i = 0;
    }
    return this.#buf[this.#i++];
  };

  int(min        , max        )         {
    return intFromWords(this.#next, min, max);
  }
  float()         {
    return floatFromWords(this.#next);
  }
}

/**
 * A string seed as two 32-bit words, to start the generator from.
 *
 * FNV-1a in the first half only; the second is a different mixing constant
 * over the same bytes, so the pair is not one hash cut in two. It is a seed
 * expander, not a hash function — do not use it for anything that needs
 * collision resistance.
 */
function seedHash64(s        )                   {
  const bytes = new TextEncoder().encode(s);
  let h1 = 0x811c9dc5 | 0;
  let h2 = 0x01000193 | 0;
  for (const b of bytes) {
    h1 = Math.imul(h1 ^ b, 0x01000193);
    h2 = Math.imul(h2 + b + 0x9e3779b9, 0x85ebca6b);
  }
  return [h1 >>> 0, h2 >>> 0];
}

/** A small stable hash for non-cryptographic use (wheel colour rotation, C8.3). */
function hash32(s        )         {
  return seedHash64(s)[0];
}

function splitmix32(seed        )               {
  let a = seed | 0;
  return () => {
    a = (a + 0x9e3779b9) | 0;
    let t = a ^ (a >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t = t ^ (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t = t ^ (t >>> 15)) >>> 0);
  };
}

/**
 * xoshiro128** — small, fast, and statistically sound for our purposes.
 * State is seeded through splitmix32 so that even a weak seed string
 * ("1", "a") produces a well-mixed state.
 */
class SeededSource                         {
           seed        ;
  #s             ;

  constructor(seed        ) {
    this.seed = seed;
    const [h1, h2] = seedHash64(seed);
    const mix = splitmix32(h1 ^ Math.imul(h2, 0x2545f491));
    this.#s = new Uint32Array([mix(), mix(), mix(), mix()]);
    if ((this.#s[0] | this.#s[1] | this.#s[2] | this.#s[3]) === 0) this.#s[0] = 1;
    for (let i = 0; i < 16; i++) this.#next(); // discard the first outputs
  }

  #next = ()         => {
    const s = this.#s;
    const r = Math.imul(rotl(Math.imul(s[1], 5), 7), 9) >>> 0;
    const t = (s[1] << 9) >>> 0;
    s[2] ^= s[0];
    s[3] ^= s[1];
    s[1] ^= s[2];
    s[0] ^= s[3];
    s[2] ^= t;
    s[3] = rotl(s[3], 11);
    return r;
  };

  int(min        , max        )         {
    return intFromWords(this.#next, min, max);
  }
  float()         {
    return floatFromWords(this.#next);
  }
}

function rotl(x        , k        )         {
  return ((x << k) | (x >>> (32 - k))) >>> 0;
}

/** Convenience: the source a roll should use given the current seed setting. */
function sourceFor(seed                           )               {
  return seed ? new SeededSource(seed) : new CryptoSource();
}

/**

 *
 * This is the part that is genuinely the browser's, not the user's: it never
 * holds anything that is not reconstructible, so losing it costs a little
 * convenience and no content (plan C5, decision D12).
 */

                                                  
                                                              

                               
             
             
                                                         
                              
                                                                      
                         
               
                     
                    
                
                                                                        
                                                                                     
     
                                                                             
                                                         
     
                   
     
                                                                    
                                                                              
                                                        
     
                    
 

                             
                         
                
 

                        
                     
                      
                          
                            
                       
                                             
                                   
                                                  
                  
                                                             
                         
                       
                 
                                                                           
                          
                                                                            
                                 
 

const DB_NAME = "orangey";
const DB_VERSION = 1;
const HISTORY_CAP = 5000;
/**
 * How many of those rolls the app holds in memory.
 *
 * The store keeps up to `HISTORY_CAP`; this is the recent slice the History
 * view and the Recent rolls panel work from. An export asks for the lot.
 */
const HISTORY_IN_MEMORY = 500;

/**
 * One connection per operation, closed when its transaction ends.
 *
 * Keeping a single connection open for the life of the page was tried and
 * withdrawn. Clearing the site's storage while a connection is held — a user
 * clearing site data, or the browser tests doing it between cases — left
 * every later IndexedDB open on the origin slow or failing, for the library
 * database as well as this one, and neither `onversionchange`, `onclose` nor
 * a retry prevented it. An open costs a few milliseconds; a preference that
 * silently stops saving costs the user their settings.
 */
function openDb()                       {
  return new Promise             ((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
      if (!db.objectStoreNames.contains("history")) {
        const store = db.createObjectStore("history", { keyPath: "id" });
        store.createIndex("at", "at");
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/**
 * Run one transaction on a connection of its own, and close the connection
 * however the transaction ends. `settle` decides what the caller is waiting
 * for: a read resolves with its request, a write only when it has committed.
 */
function withTransaction   (
  store        ,
  mode                    ,
  body                                                                                                                ,
)             {
  return openDb().then(
    (db) =>
      new Promise   ((resolve, reject) => {
        let t                ;
        try {
          t = db.transaction(store, mode);
        } catch (e) {
          db.close();
          reject(e);
          return;
        }
        t.addEventListener("complete", () => db.close());
        t.addEventListener("abort", () => {
          db.close();
          reject(t.error ?? new Error("transaction aborted"));
        });
        t.addEventListener("error", () => reject(t.error));
        body(t.objectStore(store), resolve, reject, t);
      }),
  );
}

/**
 * A read: the request's own result.
 *
 * Reads may resolve as soon as the request does — the value is already in
 * hand and the transaction has nothing left to do.
 */
function txRead   (store        , fn                                      )             {
  return withTransaction   (store, "readonly", (s, resolve, reject) => {
    const req = fn(s);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/**
 * A write: only once the transaction commits.
 *
 * A request that has succeeded is not yet durable; resolving on it meant
 * telling the app a preference was saved while it could still be rolled back.
 */
function txWrite(store        , fn                             )                {
  const write = withTransaction      (store, "readwrite", (s, resolve, _reject, t) => {
    fn(s);
    t.addEventListener("complete", () => resolve());
  });
  pendingWrites.add(write);
  const done = () => pendingWrites.delete(write);
  write.then(done, done);
  return write;
}

/**
 * Writes started and not yet committed or failed.
 *
 * A roll's history row is written a moment after the answer is on screen, so
 * "the roll has happened" and "the roll is stored" are two different times.
 * Whatever needs the second — a test about to close its page, above all —
 * waits for this rather than guessing how long a write takes.
 */
const pendingWrites = new Set               ();

/** Resolves once every write started so far has committed or failed. */
async function storageSettled()                {
  while (pendingWrites.size) await Promise.allSettled([...pendingWrites]);
}

const appdb = {
  async get   (key        )                         {
    try {
      return await txRead   ("kv", (s) => s.get(key)                 );
    } catch {
      return undefined;
    }
  },

  async set(key        , value         )                {
    try {
      await txWrite("kv", (s) => {
        s.put(value, key);
      });
    } catch {
      /* storage may be unavailable; the app keeps working in memory */
    }
  },

  async addHistory(entry              )                {
    try {
      await txWrite("history", (s) => {
        s.put(entry);
      });
      await this.trimHistory();
    } catch {
      /* ignore */
    }
  },

  /**
   * The most recent rolls, newest first.
   *
   * Through the `at` index backwards rather than `getAll()` then sort: the
   * store holds up to `HISTORY_CAP` entries, and reading five thousand of
   * them to show the last few hundred is work the index can avoid.
   */
  async history(limit = HISTORY_IN_MEMORY)                          {
    try {
      return await withTransaction                ("history", "readonly", (s, resolve, reject) => {
        const req = s.index("at").openCursor(null, "prev");
        const out                 = [];
        req.onsuccess = () => {
          const cursor = req.result;
          if (!cursor || out.length >= limit) {
            resolve(out);
            return;
          }
          out.push(cursor.value                );
          cursor.continue();
        };
        req.onerror = () => reject(req.error);
      });
    } catch {
      return [];
    }
  },

  async removeHistory(id        )                {
    try {
      await txWrite("history", (s) => {
        s.delete(id);
      });
    } catch {
      /* ignore */
    }
  },

  /** Several at once: clearing a randomizer's rolls is one transaction. */
  async removeHistoryMany(ids          )                {
    if (ids.length === 0) return;
    try {
      await txWrite("history", (s) => {
        for (const id of ids) s.delete(id);
      });
    } catch {
      /* ignore */
    }
  },

  async clearHistory()                {
    try {
      await txWrite("history", (s) => {
        s.clear();
      });
    } catch {
      /* ignore */
    }
  },

  /**
   * Keep the store to `HISTORY_CAP`, oldest first.
   *
   * Counting first means the usual case — every roll after the first few
   * thousand — costs one count and nothing else, where it used to read every
   * stored entry on every roll.
   */
  async trimHistory()                {
    try {
      const count = await txRead        ("history", (s) => s.count());
      if (count <= HISTORY_CAP) return;
      let over = count - HISTORY_CAP;
      await txWrite("history", (s) => {
        const req = s.index("at").openCursor();
        req.onsuccess = () => {
          const cursor = req.result;
          if (!cursor || over <= 0) return;
          cursor.delete();
          over--;
          cursor.continue();
        };
      });
    } catch {
      /* ignore */
    }
  },
};
