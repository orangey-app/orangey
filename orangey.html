    if (advance.note) state.toast(advance.note);
    for (const stale of chain.els.slice(from + 1)) stale.remove();
    chain.els.length = from + 1;
    chain.links = advance.links;
    for (let i = from + 1; i < chain.links.length; i++) {
      const surface = createChainSurface(chain.links[i], chain.links[i - 1].name, {
        onLanded: (outcome) => surface.cell && landed(entryId, surface.el, surface.cell.randomizer, outcome),
      });
      const close = button("✕", () => {
        const now = chains.get(entryId);
        const index = now ? now.els.indexOf(surface.el) : -1;
        if (index > 0) follow(entryId, index - 1, null);
      }, { class: "ghost cell-remove", "aria-label": `Close ${chain.links[i].name}` });
      surface.el.prepend(close);
      surface.el.classList.add("board-chain");
      chain.els[i - 1].after(surface.el);
      chain.els.push(surface.el);
    }
  }

  const heading = h("h1", { class: "board-name", text: board.name });
  const count = h("p", { class: "faint" });
  const addButton = button("Add…", () => void openPicker(), { class: "ghost add-to-board" });

  /**
   * Changing what is on the board happens in edit mode only.
   *
   * A board is played at a table, often on a projector, and one stray click
   * on a cell's ✕ used to take a randomizer off and save the board at once —
   * putting it back meant finding it in the library again. Play mode only
   * plays; Edit board brings out Add…, the ✕s and dragging. A chain's own ✕
   * is not a change to the board, so it stays. An empty board has nothing to
   * play, so it opens ready to edit.
   */
  let editing = board.entries.length === 0;
  const editButton = button("Edit board", () => setEditing(!editing), { class: "ghost edit-board" });
  function setEditing(on         )       {
    editing = on;
    editButton.textContent = on ? "Done" : "Edit board";
    editButton.setAttribute("aria-pressed", String(on));
    addButton.hidden = !on;
    el.classList.toggle("board-editing", on);
    for (const holder of grid.querySelectorAll             (".cell-holder")) holder.draggable = on;
  }
  const rollAll = button("Roll all", () => void rollEverything(), {
    class: "primary roll-all", style: { width: "100%", minHeight: "52px", fontSize: "17px" },
  });
  const shareButton = button("Share…", () => openShare(), { class: "ghost share-button" });
  const exitButton = button("Leave full screen", () => present(false), { class: "leave-presenting" });
  exitButton.hidden = true;
  const presentButton = button("Full screen", () => present(!isPresenting()), { class: "ghost present-button" });
  const present = (on         )       => {
    // A projector shows the table, not the board being rearranged.
    if (on) setEditing(false);
    setPresenting(on, { exitButton, presentButton });
  };

  const recent = createRecentRolls({
    ids: () => board.entries.map((e) => e.id),
    scopeName: () => "this board",
  });

  /** The randomizers this board points at, in order, with the gaps named. */
  function resolve()                                                                           {
    return board.entries.map((entry) => ({ entry, randomizer: state.library.findById(entry.id)?.randomizer ?? null }));
  }

  function render()       {
    const resolved = resolve();
    // Cells are rebuilt whenever the board changes, so their handles are
    // rebound with them rather than tracked.
    cells = [];
    // Rebuilt cells are fresh answers-to-be, so whatever they had opened goes.
    chains = new Map();
    setChildren(grid, ...resolved.map(({ entry, randomizer }) => {
      if (!randomizer) return wrap(entry, createMissingCell(entry.name));
      let holder                     = null;
      const cell = createCell(randomizer, { onLanded: (outcome) => holder && landed(entry.id, holder, randomizer, outcome) });
      cells.push(cell);
      // A cell of its own to roll: one roll on a board is often the point, and
      // only a cell's own roll follows an outcome's link.
      holder = wrap(entry, cell.el, cellRollButton(cell, "ghost cell-roll"));
      chains.set(entry.id, { links: [{ id: randomizer.id, name: randomizer.name, from: "", found: true }], els: [holder] });
      return holder;
    }));
    grid.classList.toggle("board-empty", resolved.length === 0);
    count.textContent = resolved.length === 0
      ? "Nothing on this board yet — press Add to put something on it."
      : `${resolved.length} randomizer${resolved.length === 1 ? "" : "s"}`;
    rollAll.disabled = cells.length === 0;
    built = signature();
    recent.refresh();
  }

  function wrap(entry                              , inner             , roll                     = null)              {
    const remove = button("✕", () => void removeEntry(entry.id), { class: "ghost cell-remove", "aria-label": `Take ${entry.name} off the board` });
    const holder = h("div", { class: "cell-holder", "data-entry": entry.id }, remove, inner, roll);
    holder.draggable = editing;
    holder.addEventListener("dragstart", (e) => {
      if (!editing) {
        e.preventDefault();
        return;
      }
      (e             ).dataTransfer?.setData("text/orangey-entry", entry.id);
      holder.classList.add("dragging");
    });
    holder.addEventListener("dragend", () => holder.classList.remove("dragging"));
    holder.addEventListener("dragover", (e) => e.preventDefault());
    holder.addEventListener("drop", (e) => {
      e.preventDefault();
      const moved = (e             ).dataTransfer?.getData("text/orangey-entry");
      if (moved && moved !== entry.id) void moveEntry(moved, entry.id);
    });
    return holder;
  }

  async function save(next                 )                {
    Object.assign(board, touch(next));
    state.library.save(node.path, board);
    await state.library.flush();
    render();
  }

  async function addEntry(r            )                {
    if (board.entries.some((e) => e.id === r.id)) return;
    if (board.entries.length >= BOARD_LIMIT) {
      state.toast(`A board holds at most ${BOARD_LIMIT} randomizers.`);
      return;
    }
    await save({ ...board, entries: [...board.entries, { id: r.id, name: r.name }] });
  }

  /**
   * Take one off, and offer it back. The randomizer itself is untouched — only
   * the board's reference to it goes — so Undo is a matter of putting the
   * entry back where it was.
   */
  async function removeEntry(id        )                {
    const at = board.entries.findIndex((e) => e.id === id);
    if (at < 0) return;
    const removed = board.entries[at];
    await save({ ...board, entries: board.entries.filter((e) => e.id !== id) });
    state.toast(`Took “${removed.name}” off the board`, "Undo", () => {
      if (board.entries.some((e) => e.id === removed.id) || board.entries.length >= BOARD_LIMIT) return;
      const entries = [...board.entries];
      entries.splice(Math.min(at, entries.length), 0, removed);
      void save({ ...board, entries });
    });
  }

  /** Drop one entry onto another: the dragged one takes the target's place. */
  async function moveEntry(movedId        , ontoId        )                {
    const entries = [...board.entries];
    const from = entries.findIndex((e) => e.id === movedId);
    const to = entries.findIndex((e) => e.id === ontoId);
    if (from < 0 || to < 0) return;
    const [moved] = entries.splice(from, 1);
    entries.splice(to, 0, moved);
    await save({ ...board, entries });
  }

  /**
   * What goes on the board: anything in the library, or something made here.
   * A board is usually assembled while thinking about tonight, and half of
   * what you want does not exist yet.
   */
  async function openPicker()                {
    const picked = await pickRandomizer({
      title: "Add to the board",
      taken: () => new Set(board.entries.map((e) => e.id)),
      allowNew: true,
      allowLink: true,
      allowNotation: true,
    });
    if (!picked) return;
    await addEntry(picked.randomizer);
    if (picked.fresh) {
      await state.library.flush();
      // Back from its editor returns to this board, not to the new
      // randomizer's own play screen, where there is no Back at all.
      navigate(editHash(picked.path, `#/r/${encodeURIComponent(node.path)}`));
    }
  }

  /**
   * Every cell at once, each at its own speed: a board is rolled to get all of
   * tonight's answers in one go, not to watch a sequence.
   */
  async function rollEverything()                {
    if (cells.some((c) => c.rolling)) {
      for (const cell of cells) cell.skip();
      return;
    }
    rollAll.textContent = "Skip";
    rollingAll = true;
    try {
      await Promise.all(cells.map((cell) => cell.roll()));
    } finally {
      rollingAll = false;
    }
    rollAll.textContent = "Roll all";
  }

  /**
   * A board is shared as a file, not inside a link.
   *
   * One randomizer fits in an address; a board is several of them, and the
   * link would outgrow what decks and chat apps carry. The link here opens
   * this board in the library it is already in — which is what a slide needs —
   * and the archive is what goes to someone else.
   */
  function openShare()       {
    // Where the keyboard came from, so it goes back there on close.
    const opener = document.activeElement                      ;
    const field = h("input", {
      type: "text", readonly: true, spellcheck: "false",
      "aria-label": "Link to this board in your library",
      value: slideLink(appBase(), board.id, { roll: false, present: false }),
    });
    const dialog = h("dialog", { class: "share-dialog" },
      h("h2", { text: "Share this board" }),
      h("p", { class: "faint", text: "A board points at the randomizers in your library rather than carrying copies, so it travels as a file. The link below opens it on a machine that already has them — your own, for a slide or a bookmark." }),
      field,
      h("div", { class: "row" },
        button("Copy", () => {
          (field                    ).select();
          void navigator.clipboard?.writeText((field                    ).value).catch(() => {});
          state.toast("Link copied");
        }, { class: "primary copy-link" }),
        button("Download the board and everything on it", () => {
          void exportBoardZip(board);
          (dialog                     ).close();
        }, { class: "export-board" }),
        h("span", { class: "spacer" }),
        button("Close", () => (dialog                     ).close()),
      ),
    );
    openDialog(dialog                     , opener);
    (field                    ).select();
  }


  const onKey = (e               ) => {
    if (isTyping(e)) return;
    if (e.key === "Escape" && isPresenting()) {
      present(false);
      return;
    }
    // On a cell's own Roll the key belongs to that button: a keyboard user
    // who tabbed to one cell meant that cell, not the whole board.
    if ((e.target                      )?.closest?.(".cell-roll, .chain-roll, .offer-card")) return;
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      void rollEverything();
    }
  };
  document.addEventListener("keydown", onKey);

  // The library tree drags a path as text/plain, so dropping a randomizer from
  // the sidebar onto the board is the same gesture as dropping it in a folder.
  grid.addEventListener("dragover", (e) => {
    if ((e             ).dataTransfer?.types.includes("text/plain")) e.preventDefault();
  });
  grid.addEventListener("drop", (e) => {
    const path = (e             ).dataTransfer?.getData("text/plain");
    if (!path) return;
    e.preventDefault();
    const dropped = state.library.find(path)?.randomizer;
    if (!dropped) return;
    if (!editing) {
      state.toast("Press Edit board to add to it.");
      return;
    }
    if (dropped.type === "board") {
      state.toast("A board cannot go on a board.");
      return;
    }
    void addEntry(dropped);
  });

  const el = h("div", { class: "board" },
    h("div", { class: "row home-bar" },
      button("← Home", () => navigate("#/"), { class: "ghost home-button" }),
      h("span", { class: "spacer" }),
      addButton, editButton, shareButton, presentButton, exitButton,
    ),
    h("div", { class: "card board-card" },
      heading,
      board.description ? h("p", { class: "faint", text: board.description }) : count,
      board.description ? count : null,
      grid,
      rollAll,
    ),
    recent.el,
  );

  /**
   * What the cells are built from: the entries, and the state of each
   * randomizer they point at. Rebuilding on every change of state would throw
   * away the results the cells are showing — including, one frame later, the
   * result of the roll that caused the change.
   */
  function signature()         {
    return resolve()
      .map(({ entry, randomizer }) => `${entry.id}:${randomizer ? randomizer.modified : "gone"}`)
      .join("|");
  }
  let built = "";
  function renderIfChanged()       {
    if (signature() === built) {
      recent.refresh();
      return;
    }
    render();
  }

  // A randomizer edited elsewhere, or deleted, changes what a board shows.
  const unsubscribe = state.subscribe(() => renderIfChanged(), ["library", "history"]);
  render();
  setEditing(editing);
  if (params.present) present(true);
  if (params.roll) requestAnimationFrame(() => void rollEverything());

  return {
    el,
    destroy() {
      document.removeEventListener("keydown", onKey);
      unsubscribe();
      if (isPresenting()) present(false);
    },
  };
}

// ---- src/import/listcsv.ts ---------------------------------------
/**
 * A list of outcomes as a spreadsheet.
 *
 * The importer has always been able to read a CSV; this is the other
 * direction, so a table can be taken out to a spreadsheet, edited by
 * whatever the group already uses, and brought back. The columns are exactly
 * the ones the import wizard recognises by name, so the round trip needs no
 * mapping step at all.
 */

                                                       

/** One cell, quoted only when it has to be. */
function csvCell(value        )         {
  return /[",\n]/.test(value) ? `"${value.replace(/"/g, '""')}"` : value;
}

function listCsv(items                     )         {
  const rows = [
    ["label", "weight", "description", "color"],
    ...items.map((i) => [i.label, String(i.weight), i.description ?? "", i.color ?? ""]),
  ];
  return rows.map((r) => r.map(csvCell).join(",")).join("\n");
}

// ---- src/ui/views/library.ts -------------------------------------
/**
 * The library: the folder tree, search, and everything you can do to a
 * randomizer that is not editing its contents.
 *
 * The tree is the library (decision D11) — there is no index file to fall out
 * of step with it — so every operation here is a plain file operation.
 *
 * Emphasis, top to bottom: the search box, the tree, and one primary action
 * (+ New). Storage, export and folder connection are secondary and live in
 * the header menu; import has a single entry point, the wizard.
 */




                                                            







                                       

function createLibraryView()       {
  const tree = h("div", { class: "tree-holder" });
  const searchInput = h("input", { type: "search", placeholder: "Search", "aria-label": "Search the library" });
  const results = h("div");
  const banner = h("div");
  let selectedFolder = "";
  let dragging                = null;

  /* ---- storage ---------------------------------------------------------- */

  const storageBadge = h("button", { class: "storage-badge", type: "button", "aria-label": "Where the library is stored" });
  function renderStorage()       {
    const kind = state.library.backend.kind;
    storageBadge.textContent = state.library.backend.label;
    storageBadge.className = `storage-badge ${kind}`;
    storageBadge.title = describeStorage(kind);
  }
  storageBadge.addEventListener("click", (e) => openStorageMenu(e.currentTarget               ));

  async function renderBanner()                {
    setChildren(banner);
    if (state.library.backend.kind === "memory") {
      banner.appendChild(h("div", { class: "notice danger", role: "alert" },
        h("strong", { text: "Nothing is being saved. " }),
        "This browser gave Orangey no storage, so the library will be gone when the page closes. Try the published copy, or another browser.",
      ));
    }
    if (state.folderNeedsPermission) {
      const name = (await rememberedFolderName()) ?? "your folder";
      banner.appendChild(h("div", { class: "notice", role: "status" },
        `Your library folder “${name}” needs permission again. `,
        button("Reconnect", async () => {
          const backend = await regrantFolder();
          if (!backend) {
            state.toast("The browser did not allow it.");
            return;
          }
          state.setLibrary(new LibraryService(backend));
          await state.library.refresh();
          state.folderNeedsPermission = false;
          state.emit();
          render();
        }, { class: "primary" }),
      ));
    }
  }

  function openStorageMenu(anchor             )       {
    const items             = [
      { label: "Export library as ZIP", onSelect: () => void exportLibraryZip() },
    ];
    if (canUseFolder()) {
      items.push({ label: "Use a folder on this computer…", onSelect: () => void openFolder() });
      if (state.library.backend.kind === "fsa") {
        items.push({ label: "Stop using that folder", onSelect: () => void stopUsingFolder() });
      }
    }
    items.push({ label: "About storage", onSelect: () => navigate("#/settings") });
    openMenu(anchor, items, "Library storage");
  }

  async function openFolder()                {
    if (await useFolder()) render();
  }

  /* ---- tree ------------------------------------------------------------- */

  function render()       {
    renderStorage();
    void renderBanner();
    const query = searchInput.value.trim();
    if (query) {
      const hits = state.library.search(query);
      setChildren(results,
        h("p", { class: "faint", text: `${hits.length} match${hits.length === 1 ? "" : "es"}` }),
        h("ul", { class: "tree" },
          ...hits.map((hit) =>
            h("li", {},
              h("button", { class: "tree-row search-hit", onclick: () => navigate(`#/r/${encodeURIComponent(hit.node.path)}`) },
                h("span", { class: "glyph", text: glyphFor(hit.node) }),
                h("span", { class: "name", text: hit.node.randomizer?.name ?? hit.node.name }),
                h("span", { class: "why", text: hit.reason === "name" ? "" : `${hit.reason}: ${hit.detail}` }),
              ),
            ),
          ),
        ),
      );
      tree.style.display = "none";
      return;
    }
    tree.style.display = "";
    setChildren(results);
    setChildren(tree, renderFolder(state.library.tree, 0));
  }

  function dropTargets(el             , folderPath        )       {
    el.addEventListener("dragover", (e) => {
      if (!dragging || dragging === folderPath || folderPath.startsWith(`${dragging}/`)) return;
      e.preventDefault();
      (e             ).dataTransfer .dropEffect = "move";
      el.classList.add("drop-target");
    });
    el.addEventListener("dragleave", () => el.classList.remove("drop-target"));
    el.addEventListener("drop", async (e) => {
      e.preventDefault();
      el.classList.remove("drop-target");
      const source = dragging;
      dragging = null;
      if (!source || parent(source) === folderPath) return;
      const name = state.library.find(source)?.randomizer?.name ?? basename(source);
      await state.library.move(source, folderPath);
      state.toast(`Moved “${name}” to ${folderPath || "the top level"}`);
      render();
    });
  }

  function draggable(el             , path        )       {
    el.draggable = true;
    el.addEventListener("dragstart", (e) => {
      dragging = path;
      (e             ).dataTransfer?.setData("text/plain", path);
      el.classList.add("dragging");
    });
    el.addEventListener("dragend", () => {
      dragging = null;
      el.classList.remove("dragging");
    });
  }

  function renderFolder(node             , depth        )              {
    const expanded = depth === 0 || state.prefs.expandedFolders.includes(node.path);
    const children = node.children ?? [];

    const row = h("button", {
      class: "tree-row folder-row",
      type: "button",
      "aria-expanded": String(expanded),
      "aria-current": selectedFolder === node.path ? "true" : "false",
      onclick: () => {
        selectedFolder = node.path;
        const list = state.prefs.expandedFolders;
        void state.savePrefs({ expandedFolders: expanded ? list.filter((p) => p !== node.path) : [...list, node.path] });
        render();
      },
      oncontextmenu: (e       ) => { e.preventDefault(); openFolderMenu(node, e.currentTarget               ); },
    },
      h("span", { class: "glyph", text: expanded ? "▾" : "▸" }),
      h("span", { class: "glyph", text: "📁" }),
      h("span", { class: "name", text: node.name }),
      h("span", { class: "count", text: String(children.length) }),
    );
    dropTargets(row, node.path);
    if (depth > 0) draggable(row, node.path);

    const list = h("ul", { class: "tree" },
      ...children.map((child) => h("li", {}, child.kind === "folder" ? renderFolder(child, depth + 1) : renderFile(child))),
    );
    if (!expanded) list.style.display = "none";

    if (depth === 0) {
      // The root accepts drops too, so a file can be moved back out of a folder.
      dropTargets(tree, "");
      return h("div", {}, list);
    }
    const more = iconButton(`More for ${node.name}`, "⋯", () => openFolderMenu(node, more));
    row.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      openFolderMenu(node, row);
    });
    return h("div", {}, h("div", { class: "tree-file" }, row, more), list);
  }

  function renderFile(node             )              {
    const name = node.randomizer?.name ?? basename(node.path);
    const favourite = node.randomizer ? state.prefs.favourites.includes(node.randomizer.id) : false;
    const row = h("button", {
      class: "tree-row",
      type: "button",
      onclick: () => navigate(`#/r/${encodeURIComponent(node.path)}`),
      oncontextmenu: (e       ) => { e.preventDefault(); openFileMenu(node, e.currentTarget               ); },
      onkeydown: (e       ) => {
        const key = (e                 ).key;
        if (key === "Delete") { e.preventDefault(); void confirmDelete(node, e.currentTarget               ); }
        else if (key === "F2") { e.preventDefault(); void renameNode(node, e.currentTarget               ); }
      },
    },
      h("span", { class: "glyph", text: glyphFor(node) }),
      h("span", { class: "name", text: name }),
      node.error ? h("span", { class: "why", text: "unreadable" }) : null,
      favourite ? h("span", { class: "count", text: "★" }) : null,
    );
    draggable(row, node.path);
    const more = iconButton(`More for ${name}`, "⋯", () => openFileMenu(node, more));
    // Right-click opens the same menu the ⋯ does, rather than a second one:
    // it is where people reach for "copy the link to this".
    row.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      openFileMenu(node, row);
    });
    return h("div", { class: "tree-file" }, row, more);
  }

  /**
   * The link that opens this randomizer in this library, by id — so renaming
   * or moving it later does not break what you pasted.
   */
  async function copyLinkTo(randomizer            )                {
    const link = slideLink(appBase(), randomizer.id, { roll: false, present: false });
    try {
      await navigator.clipboard.writeText(link);
      state.toast(`Link to "${randomizer.name}" copied`);
    } catch {
      // Clipboard permission can be refused; show it so it can be copied by hand.
      state.toast(link);
    }
  }

  function openFileMenu(node             , anchor             )       {
    const isFavourite = node.randomizer ? state.prefs.favourites.includes(node.randomizer.id) : false;
    openMenu(anchor, [
      { label: "Play", onSelect: () => navigate(`#/r/${encodeURIComponent(node.path)}`) },
      { label: "Edit", onSelect: () => navigate(`#/edit/${encodeURIComponent(node.path)}`) },
      { label: isFavourite ? "Remove from favourites" : "Add to favourites", onSelect: () => node.randomizer && state.toggleFavourite(node.randomizer.id) },
      ...(node.randomizer
        ? [{ label: "Copy link", onSelect: () => void copyLinkTo(node.randomizer ) }]
        : []),
      { label: "Rename…", onSelect: () => void renameNode(node, anchor), separator: true },
      { label: "Move to folder…", onSelect: () => void moveNode(node, anchor) },
      { label: "Duplicate", onSelect: async () => { await state.library.duplicate(node.path); render(); } },
      { label: "Export file", onSelect: () => void exportFile(node) },
      ...(node.randomizer?.type === "list"
        ? [{
            label: "Export as CSV",
            onSelect: () => {
              const r = node.randomizer                  ;
              download(`${slugify(r.name)}.csv`, `${listCsv(r.items)}\n`, "text/csv");
            },
          }]
        : []),
      ...(node.randomizer && isBoard(node.randomizer)
        ? [{ label: "Export board with its randomizers", onSelect: () => void exportBoardZip(node.randomizer                   ) }]
        : []),
      { label: "Delete…", onSelect: () => void confirmDelete(node, anchor), danger: true, separator: true },
    ], node.randomizer?.name ?? node.name);
  }

  function openFolderMenu(node             , anchor             )       {
    openMenu(anchor, [
      { label: "New wheel here", onSelect: () => void newRandomizer("list", node.path) },
      { label: "New folder here", onSelect: () => void newFolder(node.path) },
      { label: "Rename…", onSelect: () => void renameNode(node, anchor), separator: true },
      { label: "Move to folder…", onSelect: () => void moveNode(node, anchor) },
      { label: "Delete folder…", onSelect: () => void confirmDelete(node, anchor), danger: true, separator: true },
    ], node.name);
  }

  async function renameNode(node             , opener             )                {
    const current = node.randomizer?.name ?? node.name;
    const next = await askText(`Rename “${current}”`, { value: current, confirm: "Rename", opener });
    if (!next || next === current) return;
    await state.library.rename(node.path, next);
    render();
  }

  async function moveNode(node             , opener             )                {
    const folders = state.library.folderList().filter((f) => f.path !== node.path && !f.path.startsWith(`${node.path}/`));
    const target = await askFolder(`Move “${node.randomizer?.name ?? node.name}” to`, folders, parent(node.path), opener);
    if (target === null) return;
    await state.library.move(node.path, target);
    render();
  }

  async function confirmDelete(node             , opener             )                {
    const name = node.randomizer?.name ?? node.name;
    const inside = node.kind === "folder" ? state.library.files(node).length : 0;
    const ok = await askConfirm(`Delete “${name}”?`,
      node.kind === "folder"
        ? `The folder${inside ? ` and the ${inside} randomizer${inside === 1 ? "" : "s"} in it` : ""} will be deleted. This cannot be undone.`
        : "You can undo this straight afterwards.",
      { confirm: "Delete", danger: true, opener });
    if (!ok) return;

    // A file is read before it goes, so Undo can put exactly it back — same
    // path, same id, so every board entry and every "goes to" that pointed
    // at it works again. Its pictures are safe meanwhile: they are swept up
    // only when an editor closes, against the ids in use at that moment.
    const backup = node.kind === "file" ? await state.library.backend.read(node.path).catch(() => null) : null;
    await state.library.remove(node.path);
    render();
    if (backup === null) {
      state.toast(`Deleted “${name}”`);
      return;
    }
    state.toast(`Deleted “${name}”`, "Undo", () => {
      void (async () => {
        await state.library.backend.write(node.path, backup);
        await state.library.refresh();
        render();
      })();
    });
  }

  async function exportFile(node             )                {
    if (!node.randomizer) return;
    // Pictures are inlined on the way out: a file handed to someone has to
    // carry them, since the store they live in is this library.
    download(basename(node.path), serialize(wrap(await portableRandomizer(node.randomizer))), "application/json");
  }

  /**
   * A create that fails used to fail in silence: the name dialog closed and
   * nothing appeared, which on an iPad whose storage would not take a write
   * looked like a button that did nothing. Now it says so, with the reason.
   */
  function couldNotSave(error         )       {
    state.toast(`Could not save to this browser's storage: ${(error         ).message}`);
    return null;
  }

  async function newRandomizer(type                , folder = selectedFolder)                {
    const titles                                 = { list: "New wheel", dice: "New dice", coin: "New coin", number: "New number", board: "New board" };
    const name = await askText(titles[type], { label: "Name", value: titles[type], confirm: "Create", opener: newButton });
    if (!name) return;
    const path = await state.library.create(folder, emptyRandomizer(type, name)).catch(couldNotSave);
    if (!path) return;
    render();
    // A board is built on the board itself — there is nothing to edit in a
    // separate screen — so it opens where it is played.
    navigate(type === "board" ? `#/r/${encodeURIComponent(path)}` : `#/edit/${encodeURIComponent(path)}`);
  }

  async function newFolder(folder = selectedFolder)                {
    const name = await askText("New folder", { label: "Name", value: "New folder", confirm: "Create", opener: newButton });
    if (!name) return;
    const path = await state.library.createFolder(folder, name).catch(couldNotSave);
    if (!path) return;
    if (!state.prefs.expandedFolders.includes(folder)) void state.savePrefs({ expandedFolders: [...state.prefs.expandedFolders, folder] });
    selectedFolder = path;
    render();
  }

  /* ---- layout ----------------------------------------------------------- */

  const newButton = button("+ New", () =>
    openMenu(newButton, [
      { label: "Wheel", onSelect: () => void newRandomizer("list") },
      { label: "Dice", onSelect: () => void newRandomizer("dice") },
      { label: "Coin", onSelect: () => void newRandomizer("coin") },
      { label: "Number", onSelect: () => void newRandomizer("number") },
      { label: "Board", onSelect: () => void newRandomizer("board"), separator: true },
      { label: "Folder", onSelect: () => void newFolder() },
    ], "New"), { class: "primary new-button", "aria-haspopup": "menu", "aria-expanded": "false" });

  const el = h("div", { class: "library" },
    h("div", { class: "row tight library-head" },
      h("h2", { class: "library-title", text: "Library" }),
      h("div", { class: "spacer" }),
      storageBadge,
    ),
    banner,
    searchInput,
    tree,
    results,
    h("div", { class: "row tight library-foot" },
      newButton,
      button("Import…", () => navigate("#/import"), { class: "import-button" }),
    ),
  );

  searchInput.addEventListener("input", render);
  const unsubscribe = state.subscribe(render, ["library", "prefs"]);
  render();

  return { el, destroy: () => unsubscribe() };
}

function glyphFor(node             )         {

/**
 * Is this draft one the app could read back?
 *
 * `validateRandomizer` says whether a file is well formed, and it stays that
 * way: a file already on disk with an odd dice expression must still open, so
 * it can be fixed (P10). But an editor must not *write* something it could
 * not then load, which is a stricter question and a different one. This asks
 * it, without a DOM, so both editors and the tests can use the same answer.
 *
 * It returns a sentence for a person to read, or null when the draft is fine.
 */






/**
 * "randomizer.items[3].label" is precise and unreadable. The field at the end
 * is the part a person needs, with the index kept because it says which row.
 */
function readableField(path        )         {
  const tail = path.replace(/^randomizer\.?/, "");
  if (!tail) return "This randomizer";
  const at = tail.match(/\[(\d+)\]/);
  const field = tail.split(".").pop()?.replace(/\[\d+\]/, "") ?? tail;
  const name = field === "label" ? "outcome" : field;
  return at ? `Outcome ${Number(at[1]) + 1}'s ${name}` : `The ${name}`;
}

function draftProblem(model            )                {
  const check = new Check();
  if (!validateRandomizer(model, check) || !check.ok) {
    const issue = check.issues[0];
    return issue ? `${readableField(issue.path)} ${issue.message}` : "This randomizer is not valid";
  }
  if (model.type === "dice") {
    const parsed = tryParse(model.expression);
    if (!parsed.ok) return parsed.error.message;
  }
  if (model.type === "number") {
    const problem = validateSpec(model);
    if (problem) return problem;
  }
  return null;
}

/**
 * The colour cell: a grid of named palette swatches, a free hex field, and a
 * way back to the automatic colour (plan C8.2).
 */






/**
 * The palette, grouped by hue and ordered light to dark within each group,
 * so a colour can be found by eye rather than by scrolling a long strip.
 */
const HUE_GROUPS                             = [
  ["Reds", 345, 25],
  ["Oranges", 25, 65],
  ["Yellows", 65, 105],
  ["Greens", 105, 175],
  ["Teals & blues", 175, 265],
  ["Purples", 265, 310],
  ["Pinks", 310, 345],
];

function groupedPalette(colours                 = PALETTE)                                               {
  const with_ = colours.map((c) => {
    const lab = hexToOklab(c.hex);
    return { colour: c, hue: hueAngle(lab), chroma: chroma(lab), L: lab.L };
  });
  const neutral = with_.filter((c) => c.chroma < 0.035);
  const groups = HUE_GROUPS.map(([title, from, to]) => ({
    title,
    colours: with_
      .filter((c) => c.chroma >= 0.035 && (from < to ? c.hue >= from && c.hue < to : c.hue >= from || c.hue < to))
      .sort((a, b) => b.L - a.L)
      .map((c) => c.colour),
  })).filter((g) => g.colours.length > 0);
  if (neutral.length) groups.push({ title: "Neutrals", colours: neutral.sort((a, b) => b.L - a.L).map((c) => c.colour) });
  return groups;
}

                                      
                         
                    
                                       
                                             
                                   
                                                                                    
                                               
 

/** The name of a colour, from the user's own colours first, then the dictionary. */
function colourName(hex        , custom                          = [])         {
  const h = hex.toLowerCase();
  return custom.find((c) => c.hex === h)?.name ?? PALETTE.find((c) => c.hex.toLowerCase() === h)?.name ?? hex;
}

function openSwatchPicker(anchor             , opts                     )       {
  const dialog = h("dialog", { class: "swatch-dialog", "aria-label": "Choose a colour" });

  const custom = opts.custom ?? [];
  const grid = h("div", { class: "swatch-groups", role: "group", "aria-label": "Palette" });
  const nameOut = h("div", { class: "faint swatch-name", text: opts.current ? colourName(opts.current, custom) : "Automatic" });
  const groups = [...(custom.length ? [{ title: "My colours", colours: custom                   }] : []), ...groupedPalette()];
  for (const group of groups) {
    const row = h("div", { class: `swatch-grid${group.title === "My colours" ? " swatch-grid-custom" : ""}` });
    for (const colour of group.colours) {
      const b = button("", () => {
        opts.onPick(colour.hex);
        dialog.close();
      }, {
        style: { background: colour.hex },
        title: `${colour.name} ${colour.hex}`,
        "aria-label": colour.name,
        "aria-pressed": opts.current?.toLowerCase() === colour.hex.toLowerCase() ? "true" : "false",
        onmouseenter: () => { nameOut.textContent = `${colour.name} · ${colour.hex}`; },
        onfocus: () => { nameOut.textContent = `${colour.name} · ${colour.hex}`; },
      });
      row.appendChild(b);
    }
    grid.append(h("h3", { class: "swatch-group-title", text: group.title }), row);
  }

  const hexInput = h("input", {
    type: "text",
    value: opts.current ?? "",
    placeholder: opts.autoColor,
    "aria-label": "Colour as hex",
    spellcheck: "false",
  });
  const apply = () => {
    const v = hexInput.value.trim();
    if (v === "") {
      opts.onPick(null);
      dialog.close();
      return;
    }
    if (!isHex(v)) {
      hexInput.setAttribute("aria-invalid", "true");
      return;
    }
    opts.onPick(v.startsWith("#") ? v : `#${v}`);
    dialog.close();
  };
  hexInput.addEventListener("keydown", (e) => {
    if ((e                 ).key === "Enter") {
      e.preventDefault();
      apply();
    }
  });

  // Add to my colours: the browser's own picker plus a name. Saving also
  // applies it, because that is why anyone opens this dialog.
  let addRow                     = null;
  if (opts.onAddCustom) {
    const colourInput = h("input", { type: "color", value: isHex(opts.current ?? "") ? opts.current  : "#a33a30", "aria-label": "New colour" });
    const nameInput = h("input", { type: "text", placeholder: "Name it", maxlength: String(MAX_COLOUR_NAME), "aria-label": "Name for the new colour" });
    const full = custom.length >= MAX_CUSTOM_COLOURS;
    const save = () => {
      const name = nameInput.value.trim();
      if (!name) {
        nameInput.setAttribute("aria-invalid", "true");
        nameInput.focus();
        return;
      }
      const hex = colourInput.value.toLowerCase();
      opts.onAddCustom ({ name, hex });
      opts.onPick(hex);
      dialog.close();
    };
    nameInput.addEventListener("keydown", (e) => {
      if ((e                 ).key === "Enter") {
        e.preventDefault();
        save();
      }
    });
    addRow = h("div", { class: "field swatch-add gap-m" },
      h("span", { class: "field-label", text: "Add to my colours" }),
      h("div", { class: "row tight" }, colourInput, nameInput, button("Save", save, { class: "swatch-add-save" })),
      full ? h("span", { class: "field-hint", text: `You have ${MAX_CUSTOM_COLOURS} already; remove one in Settings to add another.` }) : null,
    );
    if (full) for (const c of addRow.querySelectorAll("input, button")) c.setAttribute("disabled", "");
  }

  appendChildren(
    dialog,
    h("h2", { text: "Colour" }),
    nameOut,
    grid,
    h("div", { class: "row hex-row gap-m" },
      hexInput,
      button("Use", apply, { class: "primary" }),
    ),
    addRow,
    h("div", { class: "row gap-m" },
      button("Back to automatic", () => {
        opts.onPick(null);
        dialog.close();
      }),
      h("div", { class: "spacer" }),
      button("Cancel", () => dialog.close()),
    ),
  );

  openDialog(dialog, anchor);
  (grid.querySelector("button")                      )?.focus();
}

 * One small button that cycles none → cheer → wince → none, so a row in the

const REACTION_LABELS                                           = {

const REACTION_TITLES                                           = {
  none: "Orangey does nothing special",

function nextReaction(current                                    )                         {
  if (!current) return OUTCOME_REACTIONS[0];
  const i = OUTCOME_REACTIONS.indexOf(current);
  return i < 0 || i === OUTCOME_REACTIONS.length - 1 ? null : OUTCOME_REACTIONS[i + 1];

/**
 * The picture an outcome can carry.
 *
 * A game master shows the table what they have met: the wheel lands on
 * "Owlbear" and there is an owlbear. The bytes live in the image store beside
 * the library, not in the randomizer's file, so a wheel of a dozen portraits
 * is still a small readable JSON.
 */





/**
 * A picture chosen by a person, cut down to something a screen can use: a
 * 4000px photograph from a phone is four megabytes of library for pixels
 * nobody sees.
 */
async function shrinkForWheel(file      )                      {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, IMAGE_MAX_EDGE / Math.max(bitmap.width, bitmap.height));
  if (scale === 1 && file.size < 400_000) {
    bitmap.close();
    return new Uint8Array(await file.arrayBuffer());
  }
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(bitmap.width * scale));
  canvas.height = Math.max(1, Math.round(bitmap.height * scale));
  const ctx = canvas.getContext("2d");
  if (!ctx) {
    bitmap.close();
    return new Uint8Array(await file.arrayBuffer());
  }
  ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close();
  // A photograph re-encoded as PNG is several times the size of the JPEG it
  // came from, and the library carries every byte of it. WebP is a fraction
  // of either. Anything that might have transparency stays PNG, where a
  // lossy round trip would show.
  const photo = file.type === "image/jpeg" || file.type === "image/webp";
  const type = photo ? "image/webp" : "image/png";
  const blob = await new Promise             ((resolve) => canvas.toBlob(resolve, type, 0.85));
  return blob ? new Uint8Array(await blob.arrayBuffer()) : new Uint8Array(await file.arrayBuffer());
}

                                     
                                                  
                                    
                                                        
                        
                                             
 

/** Add, replace or remove one outcome's picture. */
function pictureCell(opts                    )              {
  const holder = h("span", { class: "picture-cell" });
  const input = h("input", { type: "file", accept: "image/png,image/jpeg,image/webp,image/gif", style: { display: "none" }, "aria-label": `Picture for ${opts.subject()}` });

  input.addEventListener("change", () => {
    const file = (input                    ).files?.[0];
    (input                    ).value = "";
    if (!file) return;
    void (async () => {
      const id = await putImage(await shrinkForWheel(file));
      opts.onChange(id);
    })();
  });

  function render()       {
    const id = opts.current();
    holder.replaceChildren(input);
    if (!id) {
      holder.append(button("＋", () => input.click(), { class: "ghost icon-button add-picture", "aria-label": `Add a picture to ${opts.subject()}` }));
      return;
    }
    const url = imageUrlSync(id);
    if (!url) {
      // Not read from the store yet: show the slot, then fill it in. A null
      // answer means the picture is gone — say so and stop, because rendering
      // again would ask again, and get the same answer, for ever.
      void imageUrl(id).then((found) => {
        if (found) render();
        else renderMissing();
      });
      holder.append(h("span", { class: "faint", text: "…" }));
      return;
    }
    const thumb = h("img", { class: "picture-thumb", src: url, alt: `Picture for ${opts.subject()}` });
    thumb.addEventListener("click", () => input.click());
    holder.append(
      thumb,
      // The picture leaves the outcome; the bytes are swept up when the editor
      // closes, because the same picture may be on another outcome.
      button("✕", () => opts.onChange(undefined), { class: "ghost icon-button remove-picture", "aria-label": `Remove the picture from ${opts.subject()}` }),
    );
  }

  /**
   * The outcome still names a picture, but the store has not got it: the file
   * was deleted from the library folder, or an archive arrived without it.
   * The buttons stay, so it can be replaced or the reference dropped.
   */
  function renderMissing()       {
    holder.replaceChildren(
      input,
      h("span", { class: "faint picture-missing", text: "Picture missing", title: "The picture this outcome points at is not in the library" }),
      button("＋", () => input.click(), { class: "ghost icon-button add-picture", "aria-label": `Replace the missing picture for ${opts.subject()}` }),
      button("✕", () => opts.onChange(undefined), { class: "ghost icon-button remove-picture", "aria-label": `Remove the missing picture from ${opts.subject()}` }),
    );
  }

  render();
  return holder;
}

 * This is where a randomizer actually gets built, and where an imported table
 * lands, so it is built for fixing forty rows quickly: every row can be

/**
 * The Feel card in an editor: this randomizer's own animation settings,
 * merged over the global ones. Only the section for its type is shown — a
 * wheel gets the wheel controls — and one button returns it to the global
 * settings.
 */
function feelCard(get                  , set                                          , preview             )              {
  const card = h("div", { class: "card feel-card" });
  const render = () => {
    const model = get();
    const section = sectionFor(model.type);
    if (!section) {
      card.hidden = true;
      return;
    }
    const effective = effectiveFeel(state.prefs.feel, model.feel);
    const overridden = Object.keys(model.feel?.[section] ?? {}).length;
    const apply = (patch        ) => {
      const next = normalizeOverride({ ...(model.feel ?? {}), [section]: { ...(model.feel?.[section] ?? {}), ...patch } });
      set(next);
      render();
    };
    const controls =
      section === "wheel" ? wheelControls(effective.wheel, apply)
      : section === "dice" ? diceControls(effective.dice, apply)
      : coinControls(effective.coin, apply);
    setChildren(card,
      h("div", { class: "row" },
        h("h2", { text: "Feel", style: { margin: "0" } }),
        h("div", { class: "spacer" }),
        h("span", { class: "faint", text: overridden ? `${overridden} setting${overridden === 1 ? "" : "s"} set for this one` : "Using the global settings" }),
      ),
      h("p", { class: "faint", text: "Changes here are saved with this randomizer and apply only to it. Settings covers the defaults." }),
      controls,
      h("div", { class: "row tight" },
        preview ? button("Preview", preview, { class: "preview-feel" }) : null,
        overridden ? button("Use global settings", () => { set(normalizeOverride({ ...(model.feel ?? {}), [section]: undefined })); render(); }, { class: "ghost reset-feel" }) : null,
      ),
    );
  };
  render();
  return card;
}

/**
 * `from` is the address of the screen that opened this editor, if any; Back
 * returns there. See `referrer` in router.ts.

function createEditorView(node             , from         )       {
  const randomizer = node.randomizer ;
  if (randomizer.type !== "list") return createSimpleEditor(node);
  return createListEditor(node, randomizer, from);
}

function inLibrary(path        )          {
  return state.library.find(path)?.randomizer != null;
}

/**
 * The editor's own Back, which goes exactly where the top bar's does, so the
 * two can never disagree. It names the place when that is not simply this

 */
function editorBackButton()              {
  const there = referrer(currentRoute(), inLibrary);
  const target = there ? parseRoute(there) : null;
  const name = target && "path" in target ? state.library.find(target.path)?.randomizer?.name : undefined;
  return button(name ? `← Back to ${name}` : "← Back to play", () => navigate(backTarget(currentRoute(), null, inLibrary)), { class: "ghost" });

function formatWeight(n        )         {
  return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

/* -------------------------------------------------------------------------- */

function createListEditor(node             , initial                , from         )       {
  let model                 = structuredClone(initial);
  let selection = new Set        ();
  let filter = "";
  let sortBy                              = "none";

  const savedLabel = h("span", { class: "faint", text: "All changes saved" });

  /**
   * Save, unless the draft is one the app could not read back.
   *
   * The file on disk keeps the last good state and the draft stays in the
   * editor, marked invalid, so the half-typed weight or the empty label can
   * be finished rather than thrown away. `source` is the field whose handler
   * asked to save, which is the one to mark.
   */
  const save = (source              ) => {
    const problem = draftProblem(model);
    if (problem) {
      savedLabel.textContent = `Not saved: ${problem}`;
      source?.setAttribute("aria-invalid", "true");
      return;
    }
    for (const marked of el.querySelectorAll("[aria-invalid]")) marked.removeAttribute("aria-invalid");
    savedLabel.textContent = "Saving…";
    // Queue it and nothing more. The library debounces the write; flushing
    // here meant every keystroke serialised the whole file and waited for the
    // disk.
    model = { ...model, modified: new Date().toISOString() };
    state.library.save(node.path, model);
  };

  /**
   * A structural change: a button, not a keystroke.
   *
   * Typing is debounced by the library, but a press that also moves focus
   * fires `focusout` on mousedown — before the handler that changes anything
   * — so a blur alone would leave the change it made waiting on the timer.
   * These are rare and deliberate, so they go to disk at once.
   */
  const saveNow = (source              ) => {
    save(source);
    flushNow();
  };

  /** Put what is queued on disk now, and say how it went. */
  function flushNow()       {
    if (!state.library.hasUnsavedChanges) return;
    void state.library.flush().then(
      () => {
        if (!draftProblem(model)) savedLabel.textContent = "All changes saved";
      },
      () => {
        savedLabel.textContent = "Not saved";
      },
    );
  }

  const wheel = createWheel({
    items: () => model.items,
    id: () => model.id,
    slices: () => model.slices,
    onActivate: () => void rollNow(),
  });
  const result = createResultPanel("Try it");

  // ---- header --------------------------------------------------------------

  const nameInput = h("input", { type: "text", value: model.name, "aria-label": "Name" });
  nameInput.addEventListener("input", () => {
    model = { ...model, name: nameInput.value };
    save(nameInput);
  });
  nameInput.addEventListener("blur", async () => {
    if (!model.name.trim()) return;
    // Renaming moves the file. An invalid draft has not been written to the
    // old name, so moving it would carry the wrong contents to the new one.
    if (draftProblem(model)) return;
    await state.library.flush();
    const path = await state.library.rename(node.path, model.name);
    if (path !== node.path) navigate(editHash(path, from), true);
  });

  const descInput = h("input", { type: "text", value: model.description ?? "", "aria-label": "Description" });
  descInput.addEventListener("input", () => {
    model = { ...model, description: descInput.value || undefined };
    save(descInput);
  });

  // Bag mode. Editing the outcomes does not empty or refill the bag: what has
  // been drawn is per device and lives in the app database, not in the file.
  const bagToggle = h("input", { type: "checkbox", class: "bag-toggle", checked: model.withoutReplacement === true });
  bagToggle.addEventListener("change", () => {
    model = { ...model, withoutReplacement: bagToggle.checked || undefined };
    if (!bagToggle.checked) delete (model                                    ).withoutReplacement;
    saveNow(bagToggle);
  });
  const bagField = h("label", { class: "row tight" }, bagToggle, "Draw without putting back");

  // Make a choice. Empty is off. What is typed is kept in the draft even when
  // it is out of range, so it can be finished; `draftProblem` holds the file
  // at its last good state meanwhile, as for any other field.
  const offerInput = h("input", {
    type: "number", min: String(OFFER_MIN), max: String(OFFER_MAX), class: "offer-input",
    value: model.offer !== undefined ? String(model.offer) : "", placeholder: "–",
    "aria-label": "Offer this many outcomes to choose from",
  });
  offerInput.addEventListener("input", () => {
    const raw = offerInput.value.trim();
    model = { ...model, offer: raw === "" ? undefined : Number(raw) };
    if (raw === "") delete (model                      ).offer;
    // Cards drawn for the old number would not fit the row the new one lays out.
    previewRoller.discard();
    result.clear("Try it");
    save(offerInput);
  });
  const offerField = h("label", { class: "row tight offer-field" }, "Offer", offerInput, "to choose from");

  const viewToggle = h("div", { class: "segmented", role: "group", "aria-label": "How this looks when rolled" });
  const renderViewToggle = () => {
    setChildren(viewToggle, 
      ...(["wheel", "list"]         ).map((v) =>
        button(v === "wheel" ? "Wheel" : "List", () => {
          model = { ...model, view: v };
          saveNow();
          renderViewToggle();
          renderSlicesToggle();
        }, { "aria-pressed": model.view === v ? "true" : "false" }),
      ),
    );
  };
  renderViewToggle();

  // What a slice with a picture shows. Offered only where it changes
  // something — a wheel with at least one picture — and written to the file
  // only when it is not the default, so most files never carry it.
  const slicesGroup = h("div", { class: "segmented", role: "group", "aria-label": "Slices show" });
  const slicesField = h("div", { class: "row tight slices-field" }, h("span", { class: "faint", text: "Slices show" }), slicesGroup);
  const SLICE_NAMES = { pictures: "Pictures", names: "Names", both: "Both" }         ;
  const renderSlicesToggle = () => {
    slicesField.hidden = model.view !== "wheel" || !model.items.some((i) => i.image);
    const current = model.slices ?? "pictures";
    setChildren(slicesGroup,
      ...(["pictures", "names", "both"]         ).map((v) =>
        button(SLICE_NAMES[v], () => {
          model = { ...model, slices: v };
          if (v === "pictures") delete (model                       ).slices;
          saveNow();
          renderSlicesToggle();
          wheel.refresh();
        }, { "aria-pressed": current === v ? "true" : "false" }),
      ),
    );
  };

  // ---- table ---------------------------------------------------------------

  const tbody = h("tbody");
  const footer = h("div", { class: "faint" });
  const bulkBar = h("div", { class: "row tight gap-s" });

  const filterInput = h("input", { type: "search", placeholder: "Filter outcomes", "aria-label": "Filter outcomes" });
  filterInput.addEventListener("input", () => {
    filter = filterInput.value.trim().toLowerCase();
    rowLimit = ROW_BLOCK;
    renderRows();
  });

  const selectAll = h("input", { type: "checkbox", "aria-label": "Select all outcomes" });
  selectAll.addEventListener("change", () => {
    selection = selectAll.checked ? new Set(model.items.map((i) => i.id)) : new Set();
    renderRows();
  });

  function rowsToShow()                                      {
    const all = model.items.map((item, index) => ({ item, index }));
    const filtered = filter
      ? all.filter(({ item }) =>
          item.label.toLowerCase().includes(filter) || (item.description ?? "").toLowerCase().includes(filter))
      : all;
    if (sortBy === "label") return [...filtered].sort((a, b) => a.item.label.localeCompare(b.item.label));
    if (sortBy === "weight") return [...filtered].sort((a, b) => b.item.weight - a.item.weight);
    return filtered;
  }

  function updateFooter()       {
    const active = model.items.filter(isRollable).length;
    const total = model.items.reduce((a, i) => a + (isRollable(i) ? i.weight : 0), 0);
    const shown = rowsToShow().length;
    footer.textContent =
      `${model.items.length} outcome${model.items.length === 1 ? "" : "s"} · ${active} active · ` +
      `total weight ${formatWeight(total)}${filter ? ` · showing ${shown}` : ""}`;
  }

  /**
   * How many rows the table draws at once.
   *
   * An imported table can be thousands of outcomes, and a browser asked for
   * a thousand rows of eleven cells each — with an input in four of them —
   * stops being usable. The filter still searches every outcome; this is
   * only how many are on screen.
   */
  const ROW_BLOCK = 300;
  let rowLimit = ROW_BLOCK;

  /** The row an event happened in, and the outcome it belongs to. */
  function rowFor(target                    )                                                            {
    const tr = (target                  )?.closest?.("tr[data-item]")                      ;
    if (!tr) return null;
    const id = tr.dataset.item;
    const index = Number(tr.dataset.index);
    const item = model.items.find((i) => i.id === id);
    if (!item || !Number.isFinite(index)) return null;
    return { item, index, tr };
  }

  tbody.addEventListener("input", (e) => {
    const where = rowFor(e.target);
    if (!where) return;
    const el = e.target                    ;
    if (el.closest(".label-cell")) update(where.item.id, (i) => ({ ...i, label: el.value }), false, el);
    else if (el.closest(".weight-cell")) {
      const v = Number.parseFloat(el.value);
      if (Number.isFinite(v) && v >= 0) update(where.item.id, (i) => ({ ...i, weight: v }), false, el);
    } else if (el.closest(".desc-cell")) {
      update(where.item.id, (i) => ({ ...i, description: el.value || undefined }), false, el);
    }
  });

  tbody.addEventListener("change", (e) => {
    const where = rowFor(e.target);
    const el = e.target                    ;
    if (!where || !el.classList.contains("row-select")) return;
    if (el.checked) selection.add(where.item.id);
    else selection.delete(where.item.id);
    renderBulkBar();
  });

  tbody.addEventListener("keydown", (e) => {
    const where = rowFor(e.target);
    if (!where) return;
    const el = e.target               ;
    const field = el.closest(".weight-cell") ? "weight" : el.closest(".label-cell") ? "label" : null;
    if (field) onRowKey(e                 , where.item, where.index, field);
  });

  tbody.addEventListener("click", (e) => {
    const where = rowFor(e.target);
    if (!where) return;
    const el = e.target               ;
    const { item } = where;
    if (el.closest(".disable-button")) toggleDisabled(item.id);
    else if (el.closest(".duplicate-button")) duplicateItem(item.id);
    else if (el.closest(".delete-button")) deleteItems([item.id]);
    else if (el.closest(".clear-goes-to")) update(item.id, (i) => ({ ...i, goesTo: undefined }));
    else if (el.closest(".goes-to-button")) void chooseTarget(item);
    else {
      const swatch = el.closest(".swatch")                      ;
      if (!swatch) return;
      openSwatchPicker(swatch, {
        current: item.color ?? null,
        autoColor: wheel.colors()[where.index] ?? "#888888",
        custom: state.prefs.colours,
        onAddCustom: (colour) => state.addColour(colour),
        onPick: (hex) => update(item.id, (i) => ({ ...i, color: hex ?? undefined })),
      });
    }
  });

  tbody.addEventListener("dragstart", (e) => {
    const where = rowFor(e.target);
    if (!where) return;
    (e             ).dataTransfer?.setData("text/plain", where.item.id);
    where.tr.classList.add("dragging");
  });
  tbody.addEventListener("dragend", (e) => rowFor(e.target)?.tr.classList.remove("dragging"));
  tbody.addEventListener("dragover", (e) => {
    const where = rowFor(e.target);
    if (!where) return;
    e.preventDefault();
    where.tr.classList.add("drop-target");
  });
  tbody.addEventListener("dragleave", (e) => rowFor(e.target)?.tr.classList.remove("drop-target"));
  tbody.addEventListener("drop", (e) => {
    const where = rowFor(e.target);
    if (!where) return;
    e.preventDefault();
    where.tr.classList.remove("drop-target");
    const draggedId = (e             ).dataTransfer?.getData("text/plain");
    if (draggedId && draggedId !== where.item.id) moveItem(draggedId, where.index);
  });

  function renderRows(focusItemId         , focusField                     = "label")       {
    const percents = displayPercents(model.items);
    // Before the colours are read, not after: `refresh` is what recomputes
    // them, so asking first showed each row the colour its outcome had one
    // edit ago.
    wheel.refresh();
    // A picture added or removed decides whether the choice is offered at all.
    renderSlicesToggle();
    const colors = wheel.colors();
    const rows = rowsToShow();
    // If the one to focus is past the end of what is drawn, draw far enough
    // to include it: Enter on the last visible row must still reach the next.
    if (focusItemId) {
      const at = rows.findIndex(({ item }) => item.id === focusItemId);
      if (at >= rowLimit) rowLimit = Math.ceil((at + 1) / ROW_BLOCK) * ROW_BLOCK;
    }
    const visible = rows.slice(0, rowLimit);
    const hidden = rows.length - visible.length;
    setChildren(tbody, 
      ...visible.map(({ item, index }) => renderRow(item, index, percents[index], colors[index] ?? "#888888")),
      hidden > 0
        ? h("tr", { class: "more-rows" },
            h("td", { colspan: "11" },
              button(`Show ${Math.min(ROW_BLOCK, hidden)} more of ${hidden}`, () => {
                rowLimit += ROW_BLOCK;
                renderRows();
              }, { class: "ghost show-more-rows" }),
            ),
          )
        : null,
    );
    updateFooter();
    renderBulkBar();
    if (focusItemId) {
      const input = tbody.querySelector(`[data-item="${focusItemId}"] .${focusField}-cell input`);
      (input                           )?.focus();
    }
  }

  /** The buttons' work is done by the delegated click handler. */
  const noop = ()       => {};

  function renderRow(item          , index        , percent        , autoColor        )                      {
    const tr = h("tr", { dataset: { item: item.id, index: String(index) }, draggable: "true" });
    if (item.disabled) tr.classList.add("disabled");

    // No listeners on the row itself: `tbody` carries one of each for the
    // whole table (see `delegate` below). Forty rows used to mean six hundred
    // listeners, all of them torn down and rebuilt on every edit.
    const check = h("input", { type: "checkbox", class: "row-select", checked: selection.has(item.id), "aria-label": `Select ${item.label}` });

    const swatch = h("button", {
      class: `swatch${item.color ? "" : " auto"}`,
      type: "button",
      style: { background: item.color ?? autoColor },
      title: item.color ? `Colour ${item.color}` : "Automatic colour",
      "aria-label": item.color ? `Colour, currently ${item.color}` : "Colour, currently automatic",
    });

    const label = h("input", { type: "text", value: item.label, "aria-label": "Outcome" });
    const weight = h("input", { type: "number", min: "0", step: "any", value: String(item.weight), "aria-label": "Weight" });
    const description = h("input", {
      type: "text",
      value: item.description ?? "",
      "aria-label": "Description",
      placeholder: "—",
    });

    const reaction = reactionControl({
      current: item.reaction,
      subject: item.label,
      onChange: (next) => update(item.id, (i) => ({ ...i, reaction: next ?? undefined })),
    });

    const picture = pictureCell({
      current: () => item.image,
      subject: () => item.label,
      onChange: (id) => update(item.id, (i) => ({ ...i, image: id })),
    });

    // Where this outcome sends you. A table that points at another table is
    // how encounter tables have always been written. A dropdown of every
    // randomizer was fine with six of them; a real game has folders, so this
    // opens the library instead.
    const target = item.goesTo ? state.library.findById(item.goesTo) : null;
    const goesToLabel = item.goesTo
      ? (target?.randomizer?.name ?? "(not in your library)")
      : "—";
    const goesTo = h("span", { class: "row tight goes-to" },
      button(goesToLabel, noop, {
        class: `ghost goes-to-button${item.goesTo && !target ? " missing" : ""}`,
        "aria-label": `Where ${item.label} sends you: ${goesToLabel}`,
      }),
      ...(item.goesTo
        ? [iconButton(`Stop ${item.label} sending you anywhere`, "✕", noop, { class: "icon-button clear-goes-to" })]
        : []),
    );

    const disableButton = iconButton(
      item.disabled ? `Enable ${item.label}` : `Disable ${item.label}`,
      item.disabled ? "☐" : "☑",
      noop,
      { class: "icon-button disable-button" },
    );
    const duplicateButton = iconButton(`Duplicate ${item.label}`, "⧉", noop, {
      class: "icon-button duplicate-button",
    });
    const deleteButton = iconButton(`Delete ${item.label}`, "🗑", noop, {
      class: "icon-button danger delete-button",
    });

    tr.append(
      h("td", { class: "handle", title: "Drag to reorder" }, "⠿"),
      h("td", {}, check),
      h("td", {}, swatch),
      h("td", { class: "label-cell" }, label),
      h("td", { class: "weight-cell" }, weight),
      h("td", { class: "pct", text: `${percent.toFixed(1)}%` }),
      h("td", { class: "reaction-cell" }, reaction),
      h("td", { class: "picture-col" }, picture),
      h("td", { class: "goes-to-cell" }, goesTo),
      h("td", { class: "desc-cell" }, description),
      h("td", { class: "actions" }, disableButton, duplicateButton, deleteButton),
    );
    return tr;
  }

  /** Pick what this outcome sends you to, from the library or a link. */
  async function chooseTarget(item          )                {
    const picked = await pickRandomizer({
      title: `Where does "${item.label}" send you?`,
      taken: () => new Set([model.id]),
      allowNew: true,
      allowLink: true,
      allowNotation: true,
    });
    if (!picked) return;
    update(item.id, (i) => ({ ...i, goesTo: picked.randomizer.id }));
    // A randomizer made for this is empty, so it opens where you can fill it in.
    if (picked.fresh) {
      await state.library.flush();
      // Back from there returns here, to this editor, not to its play screen.
      navigate(editHash(picked.path, editHash(node.path, from)));
    }
  }

  function onRowKey(e               , item          , index        , field                    )       {
    const meta = e.ctrlKey || e.metaKey;
    if (e.key === "Enter" && !meta) {
      e.preventDefault();
      if (index === model.items.length - 1) addOutcome();
      else renderRows(model.items[index + 1].id, field);
      return;
    }
    if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
      e.preventDefault();
      moveItem(item.id, index + (e.key === "ArrowUp" ? -1 : 1));
      return;
    }
    if (meta && e.key.toLowerCase() === "d") {
      e.preventDefault();
      duplicateItem(item.id);
    }
  }

  // ---- mutations -----------------------------------------------------------

  function update(id        , fn                              , redraw = true, source              )       {
    model = { ...model, items: model.items.map((i) => (i.id === id ? fn(i) : i)) };
    save(source);
    if (redraw) {
      // Not typing: a colour, a reaction, a picture, a row disabled.
      flushNow();
      renderRows();
      return;
    }
    // Update only what does not steal the caret.
    const percents = displayPercents(model.items);
    for (const tr of tbody.querySelectorAll("tr")) {
      const idx = Number((tr               ).dataset.index);
      const cell = tr.querySelector(".pct");
      if (cell && Number.isFinite(idx)) cell.textContent = `${percents[idx].toFixed(1)}%`;
    }
    refreshWheelSoon();
    updateFooter();
  }

  /**
   * At most one wheel redraw per frame.
   *
   * Typing a label fires an input event per character, and each redraw lays
   * out and re-measures every slice. The screen only updates once a frame in
   * any case, so the ones in between were work nobody saw.
   */
  let wheelFrame = 0;
  function refreshWheelSoon()       {
    if (wheelFrame) return;
    wheelFrame = requestAnimationFrame(() => {
      wheelFrame = 0;
      wheel.refresh();
    });
  }

  function addOutcome()       {
    const item = makeItem("New outcome", 1);
    model = { ...model, items: [...model.items, item] };
    saveNow();
    renderRows(item.id, "label");
    const input = tbody.querySelector(`[data-item="${item.id}"] .label-cell input`)                           ;
    input?.select();
  }

  function toggleDisabled(id        )       {
    update(id, (i) => ({ ...i, disabled: i.disabled ? undefined : true }));
  }

  function duplicateItem(id        )       {
    const index = model.items.findIndex((i) => i.id === id);
    if (index < 0) return;
    const source = model.items[index];
    const copy           = { ...source, id: newId(), label: `${source.label} (copy)` };
    const items = [...model.items];
    items.splice(index + 1, 0, copy);
    model = { ...model, items };
    saveNow();
    renderRows(copy.id, "label");
  }

  function deleteItems(ids          )       {
    if (model.items.length - ids.length < 1) {
      state.toast("A randomizer needs at least one outcome.");
      return;
    }
    const removed = model.items
      .map((item, index) => ({ item, index }))
      .filter(({ item }) => ids.includes(item.id));
    model = { ...model, items: model.items.filter((i) => !ids.includes(i.id)) };
    for (const id of ids) selection.delete(id);
    saveNow();
    renderRows();
    const what = removed.length === 1 ? `"${removed[0].item.label}"` : `${removed.length} outcomes`;
    state.toast(`Deleted ${what}`, "Undo", () => {
      const items = [...model.items];
      for (const { item, index } of removed) items.splice(Math.min(index, items.length), 0, item);
      model = { ...model, items };
      saveNow();
      renderRows();
    });
  }

  function moveItem(id        , toIndex        )       {
    const from = model.items.findIndex((i) => i.id === id);
    const to = Math.max(0, Math.min(model.items.length - 1, toIndex));
    if (from < 0 || from === to) return;
    const items = [...model.items];
    const [moved] = items.splice(from, 1);
    items.splice(to, 0, moved);
    model = { ...model, items };
    saveNow();
    renderRows(id);
  }

  function renderBulkBar()       {
    if (selection.size === 0) {
      const sort = h("select", { "aria-label": "Sort view" },
        ...(["none", "label", "weight"]         ).map((o) =>
          h("option", { value: o, selected: o === sortBy }, o === "none" ? "list order" : `by ${o}`)),
      );
      sort.addEventListener("change", () => {
        sortBy = sort.value                 ;
        renderRows();
      });
      setChildren(bulkBar, 
        button("Add outcome", addOutcome, { class: "primary add-outcome" }),
        h("div", { class: "spacer" }),
        h("label", { class: "row tight faint" }, "Sort view", sort),
        sortBy !== "none"
          ? button("Apply order", () => {
              model = { ...model, items: rowsToShow().map(({ item }) => item) };
              sortBy = "none";
              saveNow();
              renderRows();
            })
          : null,
      );
      return;
    }
    const ids = [...selection];
    const bulk = (label        , fn                              , cls = "") =>
      button(label, () => {
        model = { ...model, items: model.items.map((i) => (selection.has(i.id) ? fn(i) : i)) };
        saveNow();
        renderRows();
      }, { class: cls });

    setChildren(bulkBar, 
      h("span", { class: "faint", text: `${ids.length} selected` }),
      bulk("Disable", (i) => ({ ...i, disabled: true })),
      bulk("Enable", (i) => ({ ...i, disabled: undefined })),
      bulk("Set weight to 1", (i) => ({ ...i, weight: 1 })),
      bulk("Cheer", (i) => ({ ...i, reaction: "cheer" }), "bulk-cheer"),
      bulk("Wince", (i) => ({ ...i, reaction: "wince" }), "bulk-wince"),
      bulk("No reaction", (i) => ({ ...i, reaction: undefined }), "bulk-no-reaction"),
      button("Delete", () => deleteItems(ids), { class: "danger" }),
      button("Clear selection", () => {
        selection = new Set();
        selectAll.checked = false;
        renderRows();
      }, { class: "ghost" }),
    );
  }

  // ---- try it --------------------------------------------------------------

  // A preview, not a roll: `live: false` keeps it out of history and says
  // nothing to Orangey, because trying out a wheel you are building is not
  // the table rolling it.
  const previewRoller = createRoller({
    randomizer: () => model,
    result,
    wheel: () => (model.view === "wheel" ? wheel : null),
    feel: () => effectiveFeel(state.prefs.feel, model.feel),
    live: false,
  });

  async function rollNow()                {
    // The labels change as they are typed, so the preview re-reserves its
    // height on every try rather than once at the start.
    const offer = model.offer !== undefined && Number.isInteger(model.offer) && model.offer >= OFFER_MIN && model.offer <= OFFER_MAX ? model.offer : 0;
    result.reserve(longestOutcome(model), { seed: state.prefs.seed !== null, offer });
    // Trying it again while cards are out deals a fresh hand: this is a
    // preview, and nothing it draws is kept.
    if (previewRoller.choosing) previewRoller.discard();
    await previewRoller.roll();
  }

  const feel = feelCard(
    () => model,
    (next) => {
      model = { ...model, feel: next };
      if (!next) delete (model                           ).feel;
      saveNow();
    },
    () => void rollNow(),
  );

  // ---- layout --------------------------------------------------------------

  const table = h("table", { class: "outcomes" },
    h("thead", {},
      h("tr", {},
        h("th", { "aria-label": "Reorder" }),
        h("th", {}, selectAll),
        h("th", { "aria-label": "Colour" }),
        h("th", { text: "Outcome" }),
        h("th", { text: "Weight" }),
        h("th", { class: "pct", text: "%" }),
        h("th", { text: "Orangey", title: "What the mascot does when this outcome comes up" }),
        h("th", { text: "Picture", title: "Shown when this outcome comes up" }),
        h("th", { text: "Goes to", title: "Rolling this outcome opens another randomizer beside the wheel" }),
        h("th", { text: "Description" }),
        h("th", { text: "Actions" }),
      ),
    ),
    tbody,
  );

  const el = h("div", { class: "editor" },
    h("div", { class: "row", style: { marginBottom: "12px" } },
      editorBackButton(),
      h("div", { class: "spacer" }),
      savedLabel,
    ),
    h("div", { class: "editor-layout" },
      h("div", { class: "card" },
        h("label", { class: "field" }, h("span", { class: "field-label", text: "Name" }), nameInput),
        h("label", { class: "field" }, h("span", { class: "field-label", text: "Description" }), descInput),
        h("div", { class: "row", style: { marginBottom: "12px" } }, viewToggle, bagField, offerField, slicesField, h("div", { class: "spacer" }), filterInput),
        h("div", { class: "table-scroll" }, table),
        bulkBar,
        h("div", { class: "gap-s" }, footer),
      ),
      h("div", {},
        h("div", { class: "card" },
          h("h2", { text: "Preview" }),
          wheel.el,
          result.el,
          button("Roll", () => void rollNow(), { class: "primary roll-button", style: { width: "100%" } }),
        ),
        feel,
      ),
    ),
  );

  renderRows();

  // Leaving a field is the moment a person expects their change to be safe,
  // and it is rare enough to write on. Typing is not.
  el.addEventListener("focusout", () => flushNow());

  const onKey = (e               ) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && state.undoLast()) e.preventDefault();
  };
  document.addEventListener("keydown", onKey);

  return {
    el,
    destroy() {
      document.removeEventListener("keydown", onKey);
      if (wheelFrame) cancelAnimationFrame(wheelFrame);
      const problem = draftProblem(model);
      if (problem) state.toast(`Your last change to ${model.name} was not saved: ${problem}`);
      // Pictures taken off an outcome are swept up when the editor closes,
      // not when the ✕ is pressed: the same picture may be on another outcome
      // or another randomizer, and undo may yet bring this one back.
      void state.library
        .flush()
        .then(() => pruneImages(usedImageIds(state.library.files().map((f) => f.randomizer ).filter(Boolean))))
        .catch(() => {});
    },
  };
}
