/** Dice, coin and number randomizers have a handful of fields each. */
function createSimpleEditor(node             )       {
  let model = structuredClone(node.randomizer )              ;
  const savedLabel = h("span", { class: "faint", text: "All changes saved" });
  const el = h("div");

  // As in the list editor: a draft the app could not read back is kept in the
  // editor and marked, and the file on disk keeps its last good state. Half a
  // dice expression is the ordinary way to type a whole one.
  const save = (source              ) => {
    const problem = draftProblem(model);
    if (problem) {
      savedLabel.textContent = `Not saved: ${problem}`;
      source?.setAttribute("aria-invalid", "true");
      return;
    }
    for (const marked of el.querySelectorAll("[aria-invalid]")) marked.removeAttribute("aria-invalid");
    savedLabel.textContent = "Saving…";
    model = { ...model, modified: new Date().toISOString() }              ;
    state.library.save(node.path, model);
  };

  function flushNow()       {
    if (!state.library.hasUnsavedChanges) return;
    void state.library.flush().then(
      () => {
        if (!draftProblem(model)) savedLabel.textContent = "All changes saved";
      },
      () => {
        savedLabel.textContent = "Not saved";
      },
    );
  }

  el.addEventListener("focusout", () => flushNow());

  const fields = h("div");
  const name = h("input", { type: "text", value: model.name, "aria-label": "Name" });
  name.addEventListener("input", () => {
    model = { ...model, name: name.value }              ;
    save(name);
  });

  if (model.type === "dice") {
    const expr = h("input", { type: "text", value: model.expression, "aria-label": "Dice expression" });
    expr.addEventListener("input", () => {
      model = { ...model, expression: expr.value }              ;
      save(expr);
    });
    fields.append(h("label", { class: "field" }, h("span", { class: "field-label", text: "Expression" }), expr));
  } else if (model.type === "coin") {
    const faceRows = h("div");
    const renderFaces = () => {
      const coin = model                  ;
      setChildren(faceRows, ...coin.faces.map((face, i) => {
        const input = h("input", { type: "text", value: face, "aria-label": `Face ${i + 1}` });
        input.addEventListener("input", () => {
          const faces = [...(model                  ).faces]                    ;
          faces[i] = input.value;
          model = { ...model, faces }              ;
          save(input);
        });
        const reaction = reactionControl({
          current: coin.faceReactions?.[i] ?? null,
          subject: face || `face ${i + 1}`,
          onChange: (next) => {
            const fr = [...(coin.faceReactions ?? [null, null])]                                                    ;
            fr[i] = next;
            const cleared = fr.every((r) => r === null);
            model = { ...model, faceReactions: cleared ? undefined : fr }              ;
            if (cleared) delete (model                  ).faceReactions;
            save();
            renderFaces();
          },
        });
        return h("label", { class: "field" },
          h("span", { class: "field-label", text: `Face ${i + 1}` }),
          h("div", { class: "row tight face-row" }, input, h("span", { class: "faint", text: "Orangey" }), reaction),
        );
      }));
    };
    renderFaces();
    fields.append(faceRows);
  } else if (model.type === "number") {
    const numberField = (key                         , label        ) => {
      const input = h("input", { type: "number", value: String((model         )[key]), "aria-label": label });
      input.addEventListener("input", () => {
        const v = Number.parseFloat(input.value);
        if (Number.isFinite(v)) {
          model = { ...model, [key]: v }              ;
          save(input);
        }
      });
      return h("label", { class: "field" }, h("span", { class: "field-label", text: label }), input);
    };
    const toggle = (key                                       , label        ) => {
      const input = h("input", { type: "checkbox", checked: (model         )[key]                       });
      input.addEventListener("change", () => {
        model = { ...model, [key]: input.checked }              ;
        save(input);
        flushNow();
      });
      return h("label", { class: "row tight" }, input, label);
    };
    fields.append(
      numberField("min", "Minimum"),
      numberField("max", "Maximum"),
      numberField("count", "How many"),
      toggle("integer", "Whole numbers"),
      toggle("unique", "No repeats"),
      toggle("inclusiveMax", "Include the maximum"),
    );
  }

  const feel = feelCard(
    () => model,
    (next) => {
      model = { ...model, feel: next }              ;
      if (!next) delete (model                           ).feel;
      save();
    },
  );

  el.append(
    h("div", { class: "card" },
      h("div", { class: "row", style: { marginBottom: "12px" } }, h("div", { class: "spacer" }), savedLabel),
      h("h1", { text: `Edit ${model.name}` }),
      h("label", { class: "field" }, h("span", { class: "field-label", text: "Name" }), name),
      fields,
      editorBackButton(),
    ),
    feel,
  );

  return {
    el,
    destroy() {
      const problem = draftProblem(model);
      if (problem) state.toast(`Your last change to ${model.name} was not saved: ${problem}`);
      void state.library.flush().catch(() => {});
    },
  };
}

// ---- src/import/parse.ts -----------------------------------------
/**
 * Delimited-text parsing (plan C7).
 *
 * RFC 4180 for the quoting rules — doubled quotes inside quoted fields,
 * delimiters and newlines allowed inside quotes — plus the practical bits:
 * a UTF-8 BOM, CRLF or LF, and a "delimiter" that is really a run of spaces.
 */

                                                      

const DELIMITERS              = [",", ";", "\t", "|", "  "];

function delimiterName(d           )         {
  return { ",": "comma", ";": "semicolon", "\t": "tab", "|": "pipe", "  ": "spaces" }[d];
}

function stripBom(text        )         {
  return text.charCodeAt(0) === 0xfeff ? text.slice(1) : text;
}

/** Split into rows of fields. Blank lines are dropped. */
function parseDelimited(text        , delimiter           )             {
  const src = stripBom(text).replace(/\r\n?/g, "\n");
  if (delimiter === "  ") return parseWhitespace(src);

  const rows             = [];
  let row           = [];
  let field = "";
  let quoted = false;
  let i = 0;

  const endField = () => {
    row.push(field);
    field = "";
  };
  const endRow = () => {
    endField();
    if (row.length > 1 || row[0].trim() !== "") rows.push(row);
    row = [];
  };

  while (i < src.length) {
    const ch = src[i];
    if (quoted) {
      if (ch === '"') {
        if (src[i + 1] === '"') {
          field += '"';
          i += 2;
          continue;
        }
        quoted = false;
        i++;
        continue;
      }
      field += ch;
      i++;
      continue;
    }
    if (ch === '"' && field.trim() === "") {
      quoted = true;
      field = "";
      i++;
      continue;
    }
    if (ch === delimiter) {
      endField();
      i++;
      continue;
    }
    if (ch === "\n") {
      endRow();
      i++;
      continue;
    }
    field += ch;
    i++;
  }
  if (field !== "" || row.length > 0) endRow();
  return rows.map((r) => r.map((f) => f.trim()));
}

function parseWhitespace(src        )             {
  return src
    .split("\n")
    .filter((l) => l.trim() !== "")
    .map((l) => l.trim().split(/\s{2,}|\t+/).map((f) => f.trim()));
}

/** Does this text look like JSON rather than a table? */
function looksLikeJson(text        )          {
  const t = stripBom(text).trim();
  return t.startsWith("{") || t.startsWith("[");
}

// ---- src/import/detect.ts ----------------------------------------
/**
 * Guessing the shape of pasted or dropped data (plan C7).
 *
 * Delimiter: the one that gives the most consistent column count over the
 * first 50 non-empty lines, with a bonus for producing more than one column at
 * all. Header: the first row is a header when it contains nothing that parses
 * as a number while some later row does — the usual "Name,Weight" case.
 */



                            
                       
                     
                   
                                                                                    
                     
 

function parseNumberLoose(s        )                {
  const t = s.trim().replace(/%$/, "").replace(/\s/g, "");
  if (t === "") return null;
  // Accept both 1,5 and 1.5 when the string is unambiguous.
  const normalized = /^-?\d+,\d+$/.test(t) ? t.replace(",", ".") : t;
  if (!/^-?(\d+\.?\d*|\.\d+)$/.test(normalized)) return null;
  const n = Number.parseFloat(normalized);
  return Number.isFinite(n) ? n : null;
}

/**
 * A roll range, as a published table writes one: `01-65`, `66–85`, `00`.
 *
 * Returns how many rolls the range covers, which is the outcome's weight.
 * `00` is 100 on a d100, the way every table in print means it. Deliberately
 * not part of `parseNumberLoose`: that one also decides delimiters and
 * headers, and a hyphen must not start looking numeric there.
 */
function parseRollRange(raw        )                {
  const m = /^\s*(\d{1,3})\s*[-–—]\s*(\d{1,3})\s*$/.exec(raw);
  if (!m) return null;
  const end = (v        ) => (/^0+$/.test(v) ? 100 : Number.parseInt(v, 10));
  const lo = end(m[1]);
  const hi = end(m[2]);
  if (hi < lo) return null;
  return hi - lo + 1;
}

function score(rows            )                                     {
  if (rows.length === 0) return { score: -1, columns: 0 };
  const counts = new Map                ();
  for (const r of rows) counts.set(r.length, (counts.get(r.length) ?? 0) + 1);
  let columns = 1;
  let best = 0;
  for (const [n, c] of counts) {
    if (c > best || (c === best && n > columns)) {
      best = c;
      columns = n;
    }
  }
  const consistency = best / rows.length;
  if (columns < 2) return { score: consistency * 0.2, columns };
  return { score: consistency * (1 + Math.min(columns, 4) / 10), columns };
}

function detect(text        )            {
  let bestDelimiter            = ",";
  let bestScore = -1;

  for (const d of DELIMITERS) {
    const rows = parseDelimited(text, d).slice(0, 50);
    const s = score(rows);
    if (s.score > bestScore) {
      bestScore = s.score;
      bestDelimiter = d;
    }
  }

  const rows = parseDelimited(text, bestDelimiter);
  return {
    delimiter: bestDelimiter,
    rows,
    hasHeader: guessHeader(rows),
    confidence: Math.max(0, Math.min(1, bestScore)),
  };
}

function guessHeader(rows            )          {
  if (rows.length < 2) return false;
  const first = rows[0];
  const firstHasNumber = first.some((c) => parseNumberLoose(c) !== null);
  if (firstHasNumber) return false;
  const laterHasNumber = rows.slice(1, 20).some((r) => r.some((c) => parseNumberLoose(c) !== null));
  if (laterHasNumber) return true;
  // No numbers anywhere: treat a first row of short, distinct, title-ish cells
  // as a header only if it looks like one.
  return first.every((c) => c.length > 0 && c.length <= 24) && new Set(first).size === first.length && rows.length > 3
    ? /name|label|title|option|outcome|weight|chance|prob|desc/i.test(first.join(" "))
    : false;
}

const LABEL_HINTS = /^(name|label|title|option|outcome|entry|item|result|thing)s?$/i;
// `d100`, `d%` and `roll` are what a printed table calls its range column.
const WEIGHT_HINTS = /^(weight|probability|prob|chance|odds|likelihood|freq(uency)?|%|percent(age)?|share|d\d+|d%|roll|range)s?$/i;
const DESC_HINTS = /^(desc(ription)?|notes?|detail|details|comment|text)s?$/i;
const COLOR_HINTS = /^(colou?r|hex)$/i;

                              
                
                        
                             
                       
 

/** Sensible defaults for the mapping step. */
function guessColumns(rows            , hasHeader         )              {
  const width = Math.max(...rows.map((r) => r.length), 1);
  const header = hasHeader ? rows[0] : [];
  const body = hasHeader ? rows.slice(1) : rows;

  const find = (re        ) => header.findIndex((h) => re.test(h.trim()));
  let label = find(LABEL_HINTS);
  let weight = find(WEIGHT_HINTS);
  let description = find(DESC_HINTS);
  const color = find(COLOR_HINTS);

  // A roll range counts as numeric here. `01-65` is not a number, but a
  // column of them is plainly not the labels either, and without this the
  // first column of a published d100 table gets taken for the outcome names.
  const numericShare = (col        ) => {
    const cells = body.map((r) => r[col] ?? "").filter((c) => c !== "");
    if (cells.length === 0) return 0;
    return cells.filter((c) => parseNumberLoose(c) !== null || parseRollRange(c) !== null).length / cells.length;
  };

  if (label < 0) {
    // The first mostly-non-numeric column is the label.
    label = 0;
    for (let c = 0; c < width; c++) {
      if (numericShare(c) < 0.5) {
        label = c;
        break;
      }
    }
  }
  if (weight < 0) {
    weight = -1;
    for (let c = 0; c < width; c++) {
      if (c !== label && numericShare(c) >= 0.8) {
        weight = c;
        break;
      }
    }
  }
  if (description < 0) {
    description = -1;
    for (let c = 0; c < width; c++) {
      if (c !== label && c !== weight && c !== color && numericShare(c) < 0.5) {
        description = c;
        break;
      }
    }
  }
  return {
    label,
    weight: weight >= 0 ? weight : null,
    description: description >= 0 ? description : null,
    color: color >= 0 ? color : null,
  };
}

// ---- src/import/map.ts -------------------------------------------
/**
 * Turning detected rows into outcomes, with a report the user reads before
 * anything is created (plan C7).
 *
 * Errors skip a row rather than abandoning the import: one bad weight in a
 * forty-row encounter table should not send you back to the spreadsheet.
 */





                          
                
                        
                             
                       
                                                                            
                            
 

                                                  

                             
                     
               
 

                               
                    
                       
                                                     
                  
 

const MARK                              = { ok: "✓", warn: "⚠", error: "✗" };

function renderReport(report                       )         {
  return report.map((l) => `${MARK[l.level]} ${l.text}`).join("\n");
}

function plural(n        , one        , many = `${one}s`)         {
  return `${n} ${n === 1 ? one : many}`;
}

function buildItems(rows            , hasHeader         , mapping         )               {
  const header = hasHeader ? rows[0] : [];
  const body = hasHeader ? rows.slice(1) : rows;
  const rowNumber = (i        ) => i + 1 + (hasHeader ? 1 : 0);

  const items             = [];
  /** Source row number for each produced item, for accurate reporting. */
  const sourceRows           = [];
  const badWeights           = [];
  const emptyLabels           = [];
  const badColors           = [];
  let missingDescriptions = 0;
  let defaultedWeights = 0;

  /**
   * A published encounter table gives a d100 range per row — `01-65` — and
   * the width of that range IS the weight. One cell that reads as a range
   * makes the column a range column; in one, a lone number such as `99` or
   * `00` means that single roll, so its weight is 1 rather than 99.
   */
  const isRangeColumn =
    mapping.weight !== null &&
    body.some((row) => {
      const raw = (row[mapping.weight          ] ?? "").trim();
      return raw !== "" && parseRollRange(raw) !== null;
    });

  body.forEach((row, i) => {
    const label = (row[mapping.label] ?? "").trim();
    if (label === "") {
      emptyLabels.push(rowNumber(i));
      return;
    }

    let weight = 1;
    if (mapping.weight !== null) {
      const raw = (row[mapping.weight] ?? "").trim();
      if (raw === "") {
        defaultedWeights++;
      } else if (isRangeColumn) {
        const span = parseRollRange(raw);
        if (span !== null) {
          weight = span;
        } else if (parseNumberLoose(raw) !== null) {
          weight = 1;
        } else {
          badWeights.push(`row ${rowNumber(i)} "${raw}"`);
          return;
        }
      } else {
        const n = parseNumberLoose(raw);
        if (n === null || n < 0) {
          badWeights.push(`row ${rowNumber(i)} "${raw}"`);
          return;
        }
        weight = n;
      }
    }

    const extra                    = {};
    if (mapping.description !== null) {
      const d = (row[mapping.description] ?? "").trim();
      if (d) extra.description = d;
      else missingDescriptions++;
    }
    if (mapping.color !== null) {
      const c = (row[mapping.color] ?? "").trim();
      if (c) {
        if (isHex(c)) extra.color = c.startsWith("#") ? c : `#${c}`;
        else badColors.push(rowNumber(i));
      }
    }
    if (mapping.extrasToMetadata) {
      const used = new Set([mapping.label, mapping.weight, mapping.description, mapping.color]);
      const metadata                         = {};
      row.forEach((cell, c) => {
        if (used.has(c) || !cell.trim()) return;
        metadata[(header[c] ?? `column ${c + 1}`).trim() || `column ${c + 1}`] = cell.trim();
      });
      if (Object.keys(metadata).length) extra.metadata = metadata;
    }

    items.push(makeItem(label, weight, extra));
    sourceRows.push(rowNumber(i));
  });

  const report               = [];
  report.push({ level: items.length ? "ok" : "error", text: `${plural(items.length, "entry", "entries")} ready` });

  const total = items.reduce((a, it) => a + it.weight, 0);
  if (items.length) {
    report.push({ level: "ok", text: `Weights valid (total ${round(total)})` });
  }
  if (isRangeColumn && items.length) {
    report.push({ level: "ok", text: "Weights read from roll ranges (for example 01–65 gives 65)" });
  }
  if (defaultedWeights) {
    report.push({ level: "warn", text: `${plural(defaultedWeights, "entry", "entries")} had no weight — using 1` });
  }
  if (missingDescriptions) {
    report.push({
      level: "warn",
      text: `${plural(missingDescriptions, "entry", "entries")} ${missingDescriptions === 1 ? "has" : "have"} no description`,
    });
  }

  // Duplicate labels are kept: a table may legitimately list the same
  // encounter twice to double its chance.
  const byLabel = new Map                  ();
  items.forEach((it, i) => {
    const key = it.label.toLowerCase();
    byLabel.set(key, [...(byLabel.get(key) ?? []), sourceRows[i]]);
  });
  const dupes = [...byLabel.entries()].filter(([, r]) => r.length > 1);
  for (const [key, rowsFor] of dupes.slice(0, 3)) {
    const label = items.find((it) => it.label.toLowerCase() === key) .label;
    report.push({
      level: "warn",
      text: `${plural(rowsFor.length - 1, "duplicate label")}: "${label}" (rows ${rowsFor.join(", ")}) — kept ${rowsFor.length === 2 ? "both" : "all"}`,
    });
  }
  if (dupes.length > 3) report.push({ level: "warn", text: `and ${dupes.length - 3} more duplicated labels — all kept` });

  if (badColors.length) {
    report.push({
      level: "warn",
      text: `${plural(badColors.length, "entry", "entries")} had an unreadable colour (${rowList(badColors)}) — using automatic colours`,
    });
  }
  if (emptyLabels.length) {
    report.push({ level: "error", text: `${plural(emptyLabels.length, "row")} had no label (${rowList(emptyLabels)}) — skipped` });
  }
  if (badWeights.length) {
    report.push({
      level: "error",
      text: `${plural(badWeights.length, "entry", "entries")} ${badWeights.length === 1 ? "has" : "have"} an invalid weight: ${badWeights.slice(0, 3).join(", ")} — will be skipped`,
    });
  }
  if (!items.length) report.push({ level: "error", text: "Nothing to import from this data" });

  return { items, report, usable: items.length > 0 };
}

function rowList(rows          )         {
  const shown = rows.slice(0, 5).join(", ");
  const more = rows.length > 5 ? `, and ${rows.length - 5} more` : "";
  return `${rows.length === 1 ? "row" : "rows"} ${shown}${more}`;
}

function round(n        )         {
  return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

/** Accept a pasted JSON array or {items:[...]} as well as a table. */
function itemsFromJson(text        )               {
  let doc         ;
  try {
    doc = JSON.parse(text);
  } catch (e) {
    return { items: [], report: [{ level: "error", text: `Not valid JSON (${(e         ).message})` }], usable: false };
  }
  const raw = Array.isArray(doc)
    ? doc
    : typeof doc === "object" && doc !== null && Array.isArray((doc                           ).items)
      ? ((doc                           ).items             )
      : null;
  if (!raw) {
    return { items: [], report: [{ level: "error", text: "Expected a list of outcomes, or an object with an items list" }], usable: false };
  }
  const items             = [];
  let skipped = 0;
  for (const entry of raw) {
    if (typeof entry === "string") {
      items.push(makeItem(entry, 1));
      continue;
    }
    if (typeof entry !== "object" || entry === null) {
      skipped++;
      continue;
    }
    const o = entry                           ;
    const label = typeof o.label === "string" ? o.label : typeof o.name === "string" ? o.name : null;
    if (!label) {
      skipped++;
      continue;
    }
    const weight = typeof o.weight === "number" && Number.isFinite(o.weight) && o.weight >= 0 ? o.weight : 1;
    const extra                    = {};
    if (typeof o.description === "string") extra.description = o.description;
    if (typeof o.color === "string" && isHex(o.color)) extra.color = o.color;
    if (o.disabled === true) extra.disabled = true;
    items.push(makeItem(label, weight, extra));
  }
  const report               = [
    { level: items.length ? "ok" : "error", text: `${plural(items.length, "entry", "entries")} ready` },
  ];
  if (skipped) report.push({ level: "error", text: `${plural(skipped, "entry", "entries")} had no label — skipped` });
  return { items, report, usable: items.length > 0 };
}

// ---- src/ui/views/importer.ts ------------------------------------
/**
 * The import wizard (plan C7).
 *
 * Paste or drop, check what was detected, map the columns, read the report,
 * then land in the editor with the table ready to fix — importing is the start
 * of building a wheel, not the end of it (decision D21).
 */
















                                       

/**
 * What the file picker offers. Extensions for the browsers that filter by
 * them, and the matching types for the ones that do not: iOS maps `accept` to
 * its own type identifiers and, given extensions alone, greys out the
 * `.orangey.json` and `.zip` files a person is there to pick.
 */
const IMPORT_ACCEPT = [
  ".csv", ".tsv", ".txt", ".json", ".zip",
  "text/csv", "text/tab-separated-values", "text/plain", "application/json", "application/zip", "application/x-zip-compressed",
].join(",");

function createImportView(initialText = "")       {
  let text = initialText;
  let detection                   = null;
  let mapping          = { label: 0, weight: null, description: null, color: null, extrasToMetadata: false };
  let outcome                      = null;

  const textarea = h("textarea", {
    placeholder: "Paste a table here, or drop a .csv, .tsv, .txt or .orangey.json file anywhere on this page",
    "aria-label": "Data to import",
  });
  textarea.value = text;
  // A pasted link is unmistakable, so it is read at once rather than waiting
  // for "Read it" — nobody pastes a link expecting to press a button next.
  textarea.addEventListener("paste", () => queueMicrotask(() => {
    if (LINK_PATTERN.test(textarea.value)) analyse();
  }));
  textarea.addEventListener("input", () => {
    if (LINK_PATTERN.test(textarea.value) && !linked && !linkProblem) analyse();
  });

  /** A link with a wheel inside it, pasted instead of a table. */
  let linked                                                     = null;
  let linkProblem                = null;
  /** Matches the payload in a link someone pasted, however it was wrapped. */
  const LINK_PATTERN = /#\/roll\?(?:[^\s]*?&)?w=([A-Za-z0-9_-]+)/;

  const settings = h("div", { class: "card" });
  const preview = h("div", { class: "card" });
  const nameInput = h("input", { type: "text", value: "Imported wheel", "aria-label": "Name" });
  const folderSelect = h("select", { "aria-label": "Folder" });

  function analyse()       {
    text = textarea.value;
    linked = null;
    linkProblem = null;
    if (!text.trim()) {
      detection = null;
      outcome = null;
      render();
      return;
    }
    const asLink = LINK_PATTERN.exec(text.trim());
    if (asLink) {
      detection = null;
      outcome = null;
      const payload = asLink[1];
      render();
      void decodeRandomizer(payload).then(
        (randomizer) => {
          if (textarea.value.trim() !== text.trim()) return;
          linked = { randomizer, payload };
          render();
        },
        (error         ) => {
          if (textarea.value.trim() !== text.trim()) return;
          linkProblem = (error         ).message;
          render();
        },
      );
      return;
    }
    if (looksLikeJson(text)) {
      detection = null;
      outcome = itemsFromJson(text);
      render();
      return;
    }
    detection = detect(text);
    mapping = { ...guessColumns(detection.rows, detection.hasHeader), extrasToMetadata: false };
    rebuild();
  }

  function rebuild()       {
    if (!detection) return;
    outcome = buildItems(detection.rows, detection.hasHeader, mapping);
    render();
  }

  function columnSelect(label        , current               , allowNone         , onChange                            )              {
    const header = detection?.hasHeader ? detection.rows[0] : [];
    const width = Math.max(...(detection?.rows ?? [[]]).map((r) => r.length), 1);
    const select = h("select", { "aria-label": label },
      allowNone ? h("option", { value: "" }, "— none —") : null,
      ...Array.from({ length: width }, (_, i) =>
        h("option", { value: String(i), selected: current === i }, header[i]?.trim() || `Column ${i + 1}`)),
    );
    select.addEventListener("change", () => {
      onChange(select.value === "" ? null : Number(select.value));
      rebuild();
    });
    return h("label", { class: "field" }, h("span", { class: "field-label", text: label }), select);
  }

  function render()       {
    setChildren(settings, );
    setChildren(preview, );
    if (linked || linkProblem) {
      settings.append(linkCard());
      return;
    }
    if (!outcome) {
      settings.append(h("p", { class: "faint", text: "Nothing to import yet." }));
      return;
    }

    if (detection) {
      const delimiterSelect = h("select", { "aria-label": "Separator" },
        ...([",", ";", "\t", "|", "  "]               ).map((d) =>
          h("option", { value: d, selected: detection .delimiter === d }, delimiterName(d))),
      );
      delimiterSelect.addEventListener("change", () => {
        const delimiter = delimiterSelect.value             ;
        const rows = parseDelimited(text, delimiter);
        detection = { delimiter, rows, hasHeader: guessHeader(rows), confidence: 1 };
        mapping = { ...guessColumns(rows, detection.hasHeader), extrasToMetadata: mapping.extrasToMetadata };
        rebuild();
      });

      const headerToggle = h("input", { type: "checkbox", checked: detection.hasHeader });
      headerToggle.addEventListener("change", () => {
        detection = { ...detection , hasHeader: headerToggle.checked };
        rebuild();
      });

      const extrasToggle = h("input", { type: "checkbox", checked: mapping.extrasToMetadata });
      extrasToggle.addEventListener("change", () => {
        mapping = { ...mapping, extrasToMetadata: extrasToggle.checked };
        rebuild();
      });

      settings.append(
        h("h2", { text: "How this was read" }),
        h("div", { class: "row" },
          h("label", { class: "field" }, h("span", { class: "field-label", text: "Separator" }), delimiterSelect),
          h("label", { class: "row tight" }, headerToggle, "First row is a header"),
        ),
        h("h3", { text: "Columns" }),
        h("div", { class: "row" },
          columnSelect("Outcome", mapping.label, false, (v) => (mapping = { ...mapping, label: v ?? 0 })),
          columnSelect("Weight", mapping.weight, true, (v) => (mapping = { ...mapping, weight: v })),
          columnSelect("Description", mapping.description, true, (v) => (mapping = { ...mapping, description: v })),
          columnSelect("Colour", mapping.color, true, (v) => (mapping = { ...mapping, color: v })),
        ),
        h("label", { class: "row tight" }, extrasToggle, "Keep other columns as extra information"),
      );
    }

    const rows = outcome.items.slice(0, 10);
    appendChildren(
      preview,
      h("h2", { text: "Check before creating" }),
      h("pre", { class: "report" },
        ...outcome.report.map((line) =>
          h("div", { class: line.level }, `${line.level === "ok" ? "✓" : line.level === "warn" ? "⚠" : "✗"} ${line.text}`)),
      ),
      rows.length
        ? h("table", { class: "outcomes gap-m" },
            h("thead", {}, h("tr", {}, h("th", { text: "Outcome" }), h("th", { text: "Weight" }), h("th", { text: "Description" }))),
            h("tbody", {},
              ...rows.map((item) =>
                h("tr", {}, h("td", { text: item.label }), h("td", { text: String(item.weight) }), h("td", { text: item.description ?? "" }))),
              outcome.items.length > 10
                ? h("tr", {}, h("td", { colspan: "3", class: "faint", text: `…and ${outcome.items.length - 10} more` }))
                : null,
            ),
          )
        : null,
      h("div", { class: "row gap-l" },
        h("label", { class: "field", style: { flex: "1" } }, h("span", { class: "field-label", text: "Name" }), nameInput),
        h("label", { class: "field" }, h("span", { class: "field-label", text: "Folder" }), folderSelect),
      ),
      button("Create and edit", () => void create(), { class: "primary", disabled: !outcome.usable }),
    );
  }

  /**
   * What a pasted link offers: roll it now without keeping it, or keep it. A
   * link is how a table reaches you from someone else's deck, so both are
   * reasonable and neither is assumed.
   */
  function linkCard()              {
    if (linkProblem) {
      return h("div", { class: "link-import", role: "status" },
        h("h2", { text: "That looks like an Orangey link, but it is damaged" }),
        h("p", { class: "faint", text: linkProblem }),
        h("p", { class: "faint", text: "Links are long, and a line break or a truncation on the way is usually the cause. Ask for it again, or paste the table itself." }),
      );
    }
    const { randomizer, payload } = linked ;
    const outcomes = randomizer.type === "list" ? `${randomizer.items.length} outcomes` : describeLinkType(randomizer);
    return h("div", { class: "link-import", role: "status" },
      h("h2", { text: "This is an Orangey link" }),
      h("p", {}, h("strong", { text: randomizer.name }), h("span", { class: "faint", text: ` · ${outcomes}` })),
      h("p", { class: "faint", text: "The randomizer is inside the link itself, so you can roll it without keeping it, or add it to your library and edit it like any other." }),
      h("div", { class: "row tight" },
        button("Add to my library", () => void saveLinked(), { class: "primary add-linked" }),
        button("Just roll it", () => navigate(`#/roll?w=${payload}`), { class: "open-linked" }),
      ),
    );
  }

  function describeLinkType(r            )         {
    switch (r.type) {
      case "dice":
        return r.expression;
      case "coin":
        return `${r.faces[0]} or ${r.faces[1]}`;
      case "number":
        return `${r.min} to ${r.max}`;
      case "list":
        return `${r.items.length} outcome${r.items.length === 1 ? "" : "s"}`;
      case "board":
        return `${r.entries.length} randomizer${r.entries.length === 1 ? "" : "s"}`;
    }
  }

  async function saveLinked()                {
    if (!linked) return;
    const { randomizer } = linked;
    const taken = state.library.findById(randomizer.id) !== null;
    const path = await state.library.create("", { ...randomizer, id: taken ? newId() : randomizer.id });
    state.toast(`Added “${randomizer.name}” to your library`);
    navigate(`#/edit/${encodeURIComponent(path)}`);
  }

  async function create()                {
    if (!outcome?.usable) return;
    const base = emptyRandomizer("list", nameInput.value.trim() || "Imported wheel")                  ;
    const randomizer                 = { ...base, items: outcome.items };
    const path = await state.library.create(folderSelect.value, randomizer);
    state.toast(`Created "${randomizer.name}" with ${outcome.items.length} outcomes`);
    const problems = outcome.report.filter((l) => l.level !== "ok").length;
    state.tell({ type: "import:done", ok: problems === 0, skipped: problems });
    navigate(`#/edit/${encodeURIComponent(path)}`);
  }

  function fillFolders()       {
    setChildren(folderSelect, 
      ...state.library.folders().map((f) => h("option", { value: f.path }, f.path || "Top level")),
    );
  }

  /** Three-way answer for a file that already exists in the library. */
  function askCollision(path        )                                            {
    return new Promise((resolve) => {
      let answered = false;
      const done = (v                                  ) => {
        if (answered) return;
        answered = true;
        resolve(v);
        dialog.close();
      };
      const dialog = h("dialog", { "aria-label": "Already in the library" },
        h("h2", { text: "Already in the library" }),
        h("p", { text: `“${path}” exists. What should happen to it?` }),
        h("div", { class: "row tight gap-l" },
          button("Replace", () => done("replace"), { class: "danger" }),
          button("Keep both", () => done("keep-both"), { class: "primary" }),
          button("Skip", () => done("skip")),
        ),
      );
      dialog.addEventListener("close", () => done("skip"));
      openDialog(dialog);
    });
  }

  /** Dropping a file anywhere on the page opens it here: outcomes, a
   *  randomizer file, or a whole library ZIP — one door for all of them. */
  async function handleFile(file      , quiet = false)                         {
    if (file.name.toLowerCase().endsWith(".zip")) {
      try {
        const entries = await readZip(new Uint8Array(await file.arrayBuffer()));
        const result = await state.library.importArchive(await absorbArchive(entries), askCollision);
        // A board arriving without one of its randomizers is worth saying now,
        // rather than leaving the person to find the gap on the board.
        const gaps = missingOnBoards(state.library)
          .map((b) => `${b.name} is missing ${b.missing.join(", ")}`)
          .join("; ");
        state.toast(
          `Imported ${result.added} file${result.added === 1 ? "" : "s"}` +
            `${result.replaced ? `, replaced ${result.replaced}` : ""}` +
            `${result.skipped ? `, skipped ${result.skipped}` : ""}` +
            `${result.failed ? `, ${result.failed} unreadable` : ""}` +
            `${gaps ? `. ${gaps}` : ""}`,
        );
        navigate("#/library");
      } catch (e) {
        state.toast(`That ZIP could not be read: ${(e         ).message}`);
      }
      return;
    }
    const content = await file.text();
    if (file.name.toLowerCase().endsWith(FILE_SUFFIX)) {
      try {
        const parsed = parseFile(content);
        // A file made for travelling carries its pictures inside it; they go
        // to the store now, so what lands in the library is an ordinary file.
        const randomizer = await absorbImages(parsed.file.randomizer);
        // A file dropped in twice, or one copied from another library, would
        // otherwise arrive sharing its id with a randomizer already here.
        const clash = state.library.findById(randomizer.id) !== null;
        // Into the folder chosen on this page: the dropdown is there, and a
        // file that always landed at the top level made it a lie.
        const path = await state.library.create(folderSelect.value, clash ? { ...randomizer, id: newId() } : randomizer);
        if (!quiet) state.toast(`Imported "${randomizer.name}"`);
        return path;
      } catch (e) {
        state.toast(`That file could not be read: ${(e         ).message}`);
        return;
      }
    }
    textarea.value = content;
    nameInput.value = file.name.replace(/\.[^.]+$/, "");
    analyse();
  }

  /**
   * Several files at once — a whole library's worth of `.orangey.json`
   * picked in one go, which on an iPad is the only way to bring them over,
   * since there is no drag and drop from another window there. One file
   * opens as it always did; several are counted and the library is shown.
   */
  async function handleFiles(files                )                {
    const list = Array.from(files);
    if (list.length === 1) {
      const path = await handleFile(list[0]);
      if (path) navigate(`#/r/${encodeURIComponent(path)}`);
      return;
    }
    let imported = 0;
    for (const file of list) {
      if (await handleFile(file, true)) imported++;
    }
    if (imported) {
      state.toast(`Imported ${imported} of ${list.length} files`);
      navigate("#/library");
    }
  }

  const dropZone = h("div", { class: "card" },
    h("h2", { text: "Import" }),
    h("p", { class: "faint", text: "Paste a table of outcomes, or drop a file anywhere on this page: a spreadsheet export (commas, semicolons, tabs, pipes and aligned columns all work), a .orangey.json randomizer, or a library ZIP." }),
    textarea,
    h("div", { class: "row gap-s" },
      button("Read it", analyse, { class: "primary" }),
      button("Clear", () => {
        textarea.value = "";
        analyse();
      }, { class: "ghost" }),
    ),
  );

  // Extensions and types both: iOS builds its file picker from the types it
  // can map, and given only extensions it greys out the very files asked for.
  const fileInput = h("input", {
    type: "file",
    multiple: "",
    accept: IMPORT_ACCEPT,
    "aria-label": "Choose files to import",
    style: { display: "none" },
  });
  fileInput.addEventListener("change", () => {
    const files = Array.from(fileInput.files ?? []);
    if (files.length) void handleFiles(files);
    fileInput.value = "";
  });

  const el = h("div", { class: "importer" },
    dropZone,
    h("div", { class: "row", style: { marginBottom: "12px" } }, button("Choose files…", () => fileInput.click()), fileInput),
    settings,
    preview,
  );

  const onDrop = (e           ) => {
    e.preventDefault();
    const files = Array.from(e.dataTransfer?.files ?? []);
    if (files.length) void handleFiles(files);
  };
  const onDragOver = (e           ) => e.preventDefault();
  document.addEventListener("drop", onDrop);
  document.addEventListener("dragover", onDragOver);

  fillFolders();
  if (initialText) analyse();
  else render();

  return {
    el,
    destroy() {
      document.removeEventListener("drop", onDrop);
      document.removeEventListener("dragover", onDragOver);
    },
  };
}

/**
 * An archive on its way in: the pictures first, then the randomizers.
 *
 * The pictures keep the ids they arrived with, because the randomizers beside
 * them name those ids and a fresh id would point every outcome at nothing. An
 * archive of single-file exports carries its pictures inline instead, so those
 * are absorbed here too and the entry is rewritten to name what was stored.
 */
async function absorbArchive(entries            )                                            {
  const files                                   = [];
  for (const entry of entries) {
    if (entry.bytes) {
      if (entry.path.startsWith(`${IMAGE_DIR}/`)) {
        await restoreImage(imageIdFromName(basename(entry.path)), entry.bytes);
      }
      continue;
    }
    const text = entry.text ?? "";
    if (!text.includes('"imageData"')) {
      files.push({ path: entry.path, text });
      continue;
    }
    try {
      files.push({ path: entry.path, text: serialize(wrap(await absorbImages(parseFile(text).file.randomizer))) });
    } catch {
      // Not readable: hand it over as it came, so the import counts it as the
      // one unreadable file it is rather than losing it silently.
      files.push({ path: entry.path, text });
    }
  }
  return files;
}

/**
 * History (plan C7/L). Append-only: a roll cannot honestly be un-rolled, so
 * there is "remove entry" and no undo (decision D13). A roll that the table
 * agreed not to count is struck instead: the line stays, drawn through.
 */








                                       

/**
 * The history as a spreadsheet. A struck roll is exported like any other,
 * with the column saying it was struck: the log of a session is only complete
 * if what the table set aside is in it too.
 *
 * `details` and `from` came later and are appended, never inserted: a sheet
 * that reads these columns by position keeps working.
 */
function historyCsv(rows              )         {
  const table = [
    ["time", "randomizer", "type", "result", "seed", "struck", "details", "from"],
    ...rows.map((e) => {
      const more = rollDetails(e);
      return [
        new Date(e.at).toISOString(),
        e.randomizerName,
        e.type,
        e.resultText,
        e.seed ?? "",
        e.struck ? "yes" : "",
        more.parts ?? "",
        e.from ? `${e.from.randomizerName} → ${e.from.label}` : "",
      ];
    }),
  ];
  return table.map((r) => r.map(csvCell).join(",")).join("\n");
}

function createHistoryView()       {
  const list = h("ul", { class: "history-list" });
  const summary = h("p", { class: "faint" });

  /** How many rolls the store holds, which may be more than are shown. */
  let stored                = null;

  function render()       {
    const shown = state.history.length;
    if (!shown) {
      summary.textContent = "No rolls yet.";
    } else if (stored !== null && stored > shown) {
      summary.textContent =
        `${stored} rolls kept on this device, showing the most recent ${shown}. An export includes all of them.`;
    } else {
      summary.textContent = `${shown} roll${shown === 1 ? "" : "s"} kept on this device`;
    }
    setChildren(list, 
      ...state.history.map((entry) =>
        h("li", { class: entry.struck ? "struck" : "" },
          h("span", { class: "when", text: formatWhen(entry.at) }),
          h("span", { class: "what" },
            h("span", { class: "name", text: entry.randomizerName }),
            " ",
            h("span", { class: "detail", text: entry.resultText }),
            entry.seed ? h("span", { class: "faint", text: ` · seed ${entry.seed}` }) : null,
            ...rollDetailLines(entry),
          ),
          button("Repeat", () => {
            if (entry.repeat?.kind === "randomizer") {
              const node = state.library.findById(entry.repeat.id);
              if (node) {
                navigate(`#/r/${encodeURIComponent(node.path)}`);
                return;
              }
            }
            state.toast("That randomizer is no longer in your library.");
          }, { class: "ghost" }),
          button(entry.struck ? "Unstrike" : "Strike", () => void state.setStruck(entry.id, !entry.struck), { class: "ghost" }),
          button("Copy", () => {
            const { parts } = rollDetails(entry);
            void navigator.clipboard?.writeText(`${entry.randomizerName}: ${entry.resultText}${parts ? ` (${parts})` : ""}`);
            state.toast("Copied");
          }, { class: "ghost" }),
          button("Remove", () => void state.removeHistory(entry.id), { class: "ghost danger" }),
        ),
      ),
    );
  }

  /**
   * Everything the store holds, not the recent slice held in memory: an
   * export of "my history" that quietly stopped at the most recent few
   * hundred would be wrong in the one way that matters.
   *
   * The rows in memory carry `struck`, which the stored ones may predate, so
   * the two are merged on id rather than one replacing the other.
   */
  async function allRows()                        {
    const known = new Map(state.history.map((row) => [row.id, row]));
    const rows = await appdb.history(HISTORY_CAP);
    return rows.map((row) => known.get(row.id) ?? row);
  }

  async function exportCsv()                {
    download("orangey-history.csv", `${historyCsv(await allRows())}\n`, "text/csv");
  }

  async function exportText()                {
    const text = (await allRows())
      .map((e) => {
        const { parts, from } = rollDetails(e);
        return `${formatWhen(e.at)}  ${e.randomizerName}  →  ${e.resultText}${parts ? `  (${parts})` : ""}${from ? `  [${from}]` : ""}`;
      })
      .join("\n");
    download("orangey-history.txt", `${text}\n`, "text/plain");
  }

  async function clearAll()                {
    if (await askConfirm("Clear the history", "Clear the whole history?", { confirm: "Clear", danger: true })) {
      void state.clearHistory();
    }
  }

  const el = h("div", {},
    h("div", { class: "card" },
      h("div", { class: "row" },
        h("h1", { text: "History", style: { margin: "0" } }),
        h("div", { class: "spacer" }),
        button("Export CSV", () => void exportCsv(), { class: "ghost" }),
        button("Export text", () => void exportText(), { class: "ghost" }),
        button("Clear", () => void clearAll(), { class: "ghost danger" }),
      ),
      summary,
      list,
    ),
  );

  render();
  // How many are really there, so the summary can say when it is showing a
  // slice. It arrives a moment after the list, which is soon enough.
  void appdb.history(HISTORY_CAP).then((rows) => {
    stored = rows.length;
    render();
  });
  const unsubscribe = state.subscribe(render, ["history"]);
  return { el, destroy: () => unsubscribe() };
}

  const strokes = fingers.map((d) => `<path class="l" d="M${x},${y}${d}"/>`).join("");

    ? `<path class="d" d="M20.51,72.82c-1.13-.45-1.6-1.56-1.05-2.48s1.91-1.3,3.04-.85,1.6,1.56,1.05,2.48-1.91,1.3-3.04.85Z"/>`
    : `<circle class="d" cx="${x}" cy="${y}" r="1.42"/>`;
  return strokes + dot;
}

function mascotArm(key         , d        , hx        , hy        , fingers                   , dotAsPath = false)         {
  return `<g class="arm arm${key}"><path class="l" d="${d}"/>${mascotHand(hx, hy, fingers, dotAsPath)}</g>`;

    eye("R") + eye("L") +

  );

function bodyPathFrom(points                                        )         {
  let d = "";
  for (let i = 0; i < 12; i++) {
    const [x, y] = points[i];
    if (i === 0) d = `M${x.toFixed(2)},${y.toFixed(2)}`;
    else {
      if (i % 3 === 1) d += "C";
      d += ` ${x.toFixed(2)},${y.toFixed(2)}`;
    }
  }
  const [x0, y0] = points[0];
  return `${d} ${x0.toFixed(2)},${y0.toFixed(2)}Z`;
}

/**
 * The springs under Orangey, and the field that bends his outline.
 *
 * Pure numbers, no DOM: this is what the unit tests exercise. The one rule
 * that matters more than any other is in the model: every spring's target is
 * zero in every state, so the resting shape is the drawing and the wobble is
 * a departure from it that always comes back.
 */



class MascotSpring {
  x = 0;
  v = 0;
  t = 0;
  lo                    ;
  hi                    ;
  k        ;
  c        ;

  constructor(k        , c        ) {
    this.k = k;
    this.c = c;
  }

  step(dt        )       {
    const a = -this.k * (this.x - this.t) - this.c * this.v;
    this.v += a * dt;
    this.x += this.v * dt;
    // A spring with no ceiling turns the fruit into a balloon.
    if (this.hi !== undefined && this.x > this.hi) {
      this.x = this.hi;
      if (this.v > 0) this.v = 0;
    }
    if (this.lo !== undefined && this.x < this.lo) {
      this.x = this.lo;
      if (this.v < 0) this.v = 0;
    }
  }

  kick(dv        )       {
    this.v += dv;
  }

  clamp(lo        , hi        )       {
    this.lo = lo;
    this.hi = hi;
    return this;
  }

  set(x        )       {
    this.x = x;
    this.t = x;
    this.v = 0;
    return this;
  }
}

/** The three body modes, each a scalar 0 at rest. */
                            
                                                  
                 
                                                      
                
                                                             
                
 

/**
 * Where a point of the drawing goes under the current modes. Identity when
 * every mode is zero, which is the property the tests pin; the base row
 * (y = MASCOT_BASE_Y) never moves under squash, so the feet stay planted.
 */
function mascotField(x        , y        , m           , gain        )                   {
  const s = m.squash * gain;
  const l = m.slosh * gain;
  const p = m.pinch * gain;
  const xr = x - MASCOT_CENTRE.x;
  const yr = y - MASCOT_CENTRE.y;
  const sin2 = (2 * xr * yr) / (xr * xr + yr * yr + 1e-6);
  return [
    x + 0.55 * s * xr + l * (MASCOT_BASE_Y - y) * 0.055 + p * sin2 * xr * 0.35,
    y - s * (y - MASCOT_BASE_Y) + p * sin2 * yr * 0.35,
  ];
}

// ---- src/ui/mascot/model.ts --------------------------------------
/**
 * Orangey's motion, as numbers.
 *
 * The model owns the springs and the state machine and produces, each frame,
 * everything the view needs to draw: the body path, the eye centres and
 * rotations, the limb angles, the whole-figure offset and tilt. It never
 * touches the DOM, so the tests can run it in Node for ten simulated seconds
 * and check the invariant that matters: at rest, he is the drawing.
 *
 * States live in a registry. A state is a pose (which drawn parts show) plus
 * an optional entry impulse and a per-frame driver that sets spring targets.
 * Adding an animation is registering a state; nothing else changes.
 */




                                 
                 
                                                                               
                                   
                                                                      
                                               
                                                             
                                                               
 

const MASCOT_STATE_REGISTRY = new Map                        ();
const MASCOT_WARNED = new Set        ();

function registerMascotState(name        , def                )       {
  MASCOT_STATE_REGISTRY.set(name, def);
}

function mascotStateNames()           {
  return [...MASCOT_STATE_REGISTRY.keys()];
}

/** Unknown names fall back to idle, once loudly, so a stale rule never breaks a session. */
function mascotStateDef(name        )                                        {
  const def = MASCOT_STATE_REGISTRY.get(name);
  if (def) return { name, def };
  if (!MASCOT_WARNED.has(name)) {
    MASCOT_WARNED.add(name);
    console.warn(`Orangey has no state called "${name}"; using idle.`);
  }
  const idle = MASCOT_STATE_REGISTRY.get("idle");
  if (!idle) throw new Error("the idle state is not registered");
  return { name: "idle", def: idle };
}

                           
                  
                  
                  
 

                              
                 
                   
                                                                                        
                  
               
                                                
                                                                                                        
                                                                      
                                 
 

class MascotModel {
  /* body modes — TRANSIENT ONLY: target 0 in every state, symmetric clamps */
           sq = new MascotSpring(168, 7.4).clamp(-0.09, 0.09);
           sl = new MascotSpring(96, 5.2).clamp(-0.06, 0.06);
           pn = new MascotSpring(240, 6.0).clamp(-0.16, 0.16);
  /* posture — carries the poses so that no pose deforms the silhouette */
           tilt = new MascotSpring(60, 4.6).clamp(-8, 8);
           crouch = new MascotSpring(120, 9.0).clamp(0, 6);
  /* face */
           eyeScale = new MascotSpring(210, 9.0).clamp(0.16, 1.45).set(1);
           mouthScale = new MascotSpring(210, 9.0).clamp(0.3, 1.35).set(1);
           eye                            = {
    L: { x: new MascotSpring(120, 9), y: new MascotSpring(120, 9), r: new MascotSpring(120, 9) },
    R: { x: new MascotSpring(120, 9), y: new MascotSpring(120, 9), r: new MascotSpring(120, 9) },
  };
           limb = {}                                 ;

  /* the hop: ballistic only while airborne; standing still is a real state */
  y = 0;
  vy = 0;
  grounded = true;

  /** How far the body modes are allowed to show: 0 none, 1 soft, 1.8 the owner's default. */
  gain = 1.8;
  /** Total simulated time, and time in the current state. */
  t = 0;
  stateT = 0;
  state = "";
  pose           = "neutral";
  /** Scratch for state drivers (the idle nudge clock, the happy hop clock). */
  scratch                         = {};
  /**
   * The only way a state may move the squash target: a zero-mean breath of
   * this amplitude. Reset every frame, so a state has to keep asking for it.
   */
  breath = 0;

  #prevSlosh = 0;
  #lastAx = 0;
  #random              ;

  constructor(random               = Math.random) {
    this.#random = random;
    for (const k of MASCOT_LIMB_KEYS) this.limb[k] = new MascotSpring(k === "L" || k === "R" ? 190 : 130, k === "L" || k === "R" ? 8.5 : 6.8).clamp(-18, 18);
    this.placeEyes("ec", true);
  }

  random()         {
    return this.#random();
  }

  launch(v        )       {
    this.vy = v;
    this.grounded = false;
  }

  placeEyes(placement              , snap         )       {
    for (const side of ["L", "R"]         ) {
      const [px, py, prot] = MASCOT_EYES[placement][side];
      const e = this.eye[side];
      e.x.t = px;
      e.y.t = py;
      // rotate the short way round: an ellipse is the same at 180°
      let target = prot;
      while (target - e.r.x > 90) target -= 180;
      while (target - e.r.x < -90) target += 180;
      e.r.t = target;
      if (snap) {
        e.x.set(px);
        e.y.set(py);
        e.r.set(prot);
      }
    }
  }

  setState(name        )       {
    const { name: resolved, def } = mascotStateDef(name);
    if (this.state === resolved) return;
    const first = this.state === "";
    this.state = resolved;
    this.stateT = 0;
    this.pose = def.pose;
    this.placeEyes(MASCOT_POSES[def.pose].eyes, first);
    // every state parks squash at zero; poses are crouch + tilt, never squash
    this.sq.t = 0;
    this.eyeScale.t = 1;
    this.mouthScale.t = 1;
    def.enter?.(this);
    if (!first) this.pn.kick(0.35);
  }

  step(dt        )       {
    this.t += dt;
    this.stateT += dt;
    const { def } = mascotStateDef(this.state);

    // drivers set targets; the squash target is derived, never set directly,
    // so its mean over any breath cycle is exactly zero
    this.sl.t = 0;
    this.tilt.t = 0;
    this.crouch.t = 0;
    this.breath = 0;
    def.drive?.(this, dt);
    this.sq.t = this.breath * Math.sin(this.t * 1.85);

    const limbTargets = def.limbs?.(this) ?? {};
    for (const k of MASCOT_LIMB_KEYS) this.limb[k].t = limbTargets[k] ?? 0;

    // the hop, integrated only while airborne
    if (!this.grounded) {
      this.vy += 1150 * dt;
      this.y += this.vy * dt;
      if (this.y >= 0) {
        const impact = this.vy;
        this.y = 0;
        if (impact > 60) this.vy = -impact * 0.35;
        else {
          this.vy = 0;
          this.grounded = true;
        }
        this.sq.kick(impact * 0.004);
        this.pn.kick(impact * 0.0012);
        this.limb.L.kick(-impact * 0.25);
        this.limb.R.kick(impact * 0.25);
      }
    }

    this.sq.step(dt);
    this.sl.step(dt);
    this.pn.step(dt);
    this.tilt.step(dt);
    this.crouch.step(dt);
    this.eyeScale.step(dt);
    this.mouthScale.step(dt);
    for (const side of ["L", "R"]         ) {
      this.eye[side].x.step(dt);
      this.eye[side].y.step(dt);
      this.eye[side].r.step(dt);
    }

    // limbs lag the body: the slosh's acceleration drives them
    const ax = (this.sl.x - this.#prevSlosh) / Math.max(dt, 1e-4);
    this.#prevSlosh = this.sl.x;
    const drive = (ax - this.#lastAx) * 0.01;
    this.#lastAx = ax;
    for (const k of MASCOT_LIMB_KEYS) {
      this.limb[k].kick(drive * (k === "L" || k === "R" ? 0.4 : 1));
      this.limb[k].step(dt);
    }
  }

  /** Everything at its target, no motion: the static pose instant mode draws. */
  freeze()       {
    this.sq.set(0);
    this.sl.set(0);
    this.pn.set(0);
    this.tilt.set(this.tilt.t);
    this.crouch.set(this.crouch.t);
    this.y = 0;
    this.vy = 0;
    this.grounded = true;
    this.eyeScale.set(this.eyeScale.t);
    this.mouthScale.set(this.mouthScale.t);
    this.placeEyes(MASCOT_POSES[this.pose].eyes, true);
    for (const k of MASCOT_LIMB_KEYS) this.limb[k].set(this.limb[k].t);
  }

  modes()            {
    return { squash: this.sq.x, slosh: this.sl.x, pinch: this.pn.x };
  }

  /** The deformation at a point of the drawing, as an offset. */
  ride(x        , y        )                             {
    const [fx, fy] = mascotField(x, y, this.modes(), this.gain);
    return { dx: fx - x, dy: fy - y };
  }

  frame()              {
    const m = this.modes();
    const points = MASCOT_BODY.map(([x, y]) => mascotField(x, y, m, this.gain));
    const eyes = {}                       ;
    for (const side of ["L", "R"]         ) {
      const e = this.eye[side];
      const { dx, dy } = this.ride(e.x.x, e.y.x);
      eyes[side] = { cx: e.x.x, cy: e.y.x, rot: e.r.x, dx, dy, scale: this.eyeScale.x };
    }
    const mouths = {}                         ;
    const mouthScale = this.pose === "oops" ? 1 : this.mouthScale.x;
    for (const k of MASCOT_MOUTH_KEYS) {
      const [cx, cy] = MASCOT_MOUTH_CENTRE[k];
      mouths[k] = { ...this.ride(cx, cy), scale: mouthScale };
    }
    const limbs = {}                           ;
    for (const k of MASCOT_LIMB_KEYS) limbs[k] = this.limb[k].x;
    const stemRide = this.ride(75.82, 37.82);
    return {
      pose: this.pose,
      bodyPath: bodyPathFrom(points),
      offsetY: this.y + this.crouch.x,
      tilt: this.tilt.x,
      stem: { ...stemRide, rot: -this.sl.x * this.gain * 34 },
      eyes,
      mouths,
      limbs,
    };
  }
}

const MASCOT_FEET_X = 96;
const MASCOT_FEET_Y = MASCOT_BASE_Y;

// ---- src/ui/mascot/view.ts ---------------------------------------
/**
 * Draws a MascotFrame into the SVG. Nothing here decides anything; it writes
 * attributes. Ten-odd setAttribute calls per frame on one small SVG.
 */




const f2 = (n        ) => n.toFixed(2);

class MascotView {
           el             ;
           svg               ;
  #root             ;
  #body                ;
  #stem             ;
  #eyeGroup                                ;
  #eyeEl                                      ;
  #mouth                               ;
  #limb                              ;
  #lastPose = "";

  constructor() {
    this.el = document.createElement("div");
    this.el.className = "mascot";
    this.el.setAttribute("aria-hidden", "true");
    this.el.innerHTML = mascotMarkup();
    this.svg = this.el.firstElementChild                 ;
    const q =                    (sel        ) => this.svg.querySelector(sel)     ;
    this.#root = q(".root");
    this.#body = q(".body");
    this.#stem = q(".stem");
    this.#eyeGroup = { L: q(".eyeL"), R: q(".eyeR") };
    this.#eyeEl = { L: q(".eyeL-el"), R: q(".eyeR-el") };
    this.#mouth = {}                                 ;
    for (const k of MASCOT_MOUTH_KEYS) this.#mouth[k] = q(`.mouth.${k}`);
    this.#limb = {}                                ;
    for (const k of MASCOT_LIMB_KEYS) this.#limb[k] = q(k === "L" ? ".legL" : k === "R" ? ".legR" : `.arm${k}`);
  }

  draw(frame             )       {
    if (frame.pose !== this.#lastPose) {
      this.#lastPose = frame.pose;
      this.svg.setAttribute("data-pose", frame.pose);
    }
    this.#body.setAttribute("d", frame.bodyPath);
    this.#root.setAttribute("transform", `translate(0,${f2(frame.offsetY)}) rotate(${f2(frame.tilt)} ${MASCOT_FEET_X} ${MASCOT_FEET_Y})`);
    this.#stem.setAttribute("transform", `translate(${f2(frame.stem.dx)},${f2(frame.stem.dy)}) rotate(${f2(frame.stem.rot)} 75.82 42.07)`);
    for (const side of ["L", "R"]         ) {
      const e = frame.eyes[side];
      const el = this.#eyeEl[side];
      el.setAttribute("cx", f2(e.cx));
      el.setAttribute("cy", f2(e.cy));
      el.setAttribute("transform", `rotate(${f2(e.rot)} ${f2(e.cx)} ${f2(e.cy)})`);
      this.#eyeGroup[side].setAttribute(
        "transform",
        `translate(${f2(e.dx)},${f2(e.dy)}) translate(${f2(e.cx)},${f2(e.cy)}) scale(${e.scale.toFixed(3)}) translate(${f2(-e.cx)},${f2(-e.cy)})`,
      );
    }
    for (const k of MASCOT_MOUTH_KEYS) {
      const m = frame.mouths[k];
      const [cx, cy] = MASCOT_MOUTH_CENTRE[k];
      this.#mouth[k].setAttribute(
        "transform",
        `translate(${f2(m.dx)},${f2(m.dy)}) translate(${cx},${cy}) scale(${m.scale.toFixed(3)}) translate(${-cx},${-cy})`,
      );
    }
    for (const k of MASCOT_LIMB_KEYS) {
      const [px, py] = MASCOT_PIVOT[k];
      this.#limb[k].setAttribute("transform", `rotate(${f2(frame.limbs[k])} ${px} ${py})`);
    }
  }

  setBlinking(on         )       {
    this.svg.classList.toggle("blinking", on);
  }
}

// ---- src/ui/mascot/ticker.ts -------------------------------------
/**
 * One requestAnimationFrame loop for every running mascot.
 *
 * It stops itself when nothing is subscribed and while the tab is hidden, so
 * a mascot standing in a background tab costs nothing. Each subscriber gets
 * the real frame delta, capped so a tab that was asleep does not wake up to
 * a single enormous step.
 */

                                          

const MAX_STEP = 1 / 24;

class MascotTickerImpl {
  #subs = new Set        ();
  #handle = 0;
  #last = 0;
  #onVisibility = () => {
    if (document.hidden) this.#stop();
    else this.#start();
  };

  add(fn        )             {
    this.#subs.add(fn);
    if (this.#subs.size === 1) document.addEventListener("visibilitychange", this.#onVisibility);
    this.#start();
    return () => this.remove(fn);
  }

  remove(fn        )       {
    this.#subs.delete(fn);
    if (this.#subs.size === 0) {
      this.#stop();
      document.removeEventListener("visibilitychange", this.#onVisibility);
    }
  }

  get running()          {
    return this.#handle !== 0;
  }

  get size()         {
    return this.#subs.size;
  }

  #start()       {
    if (this.#handle || this.#subs.size === 0 || document.hidden) return;
    this.#last = performance.now();
    const frame = (now        ) => {
      const dt = Math.min((now - this.#last) / 1000, MAX_STEP);
      this.#last = now;
      for (const fn of this.#subs) fn(dt);
      this.#handle = this.#subs.size ? requestAnimationFrame(frame) : 0;
    };
    this.#handle = requestAnimationFrame(frame);
  }

  #stop()       {
    if (this.#handle) cancelAnimationFrame(this.#handle);
    this.#handle = 0;
  }
}

const mascotTicker = new MascotTickerImpl();

// ---- src/ui/mascot/mascot.ts -------------------------------------
/**
 * One Orangey: a model, a view, and a place on the shared ticker.
 *
 * `createMascot` is the only thing the rest of the app needs. The host
 * (host.ts) owns the single instance the app shows; the settings panel may
 * make throwaway ones for its previews.
 */




                                              

                         
                           
                              
                               
                                                 
                                
                                                                                     
                                      
                                                                                       
                
                 
                  
 

                                
                 
                  
                       
                        
 

function createMascot(opts                = {})         {
  const model = new MascotModel(opts.random);
  const view = new MascotView();
  let motion              = opts.motion ?? "full";
  let unsubscribe                      = null;
  let destroyed = false;

  model.gain = opts.wobble ?? model.gain;

  const timeScale = () => (motion === "quick" ? 2.5 : 1);

  const tick = (dt        ) => {
    model.step(dt * timeScale());
    view.draw(model.frame());
  };

  function drawStill()       {
    model.freeze();
    view.draw(model.frame());
  }

  function resume()       {
    if (destroyed) return;
    if (motion === "instant") {
      pause();
      drawStill();
      return;
    }
    view.setBlinking(true);
    unsubscribe ??= mascotTicker.add(tick);
  }

  function pause()       {
    unsubscribe?.();
    unsubscribe = null;
    view.setBlinking(false);
  }

  const mascot         = {
    el: view.el,
    model,
    setState(name) {
      model.setState(name);
      if (motion === "instant") drawStill();
      else view.draw(model.frame());
    },
    setWobble(gain) {
      if (gain === model.gain) return;
      model.gain = gain;
      model.pn.kick(0.5);
    },
    setMotion(level) {
      motion = level;
      resume();
    },
    pause,
    resume,
    destroy() {
      destroyed = true;
      pause();
      view.el.remove();
    },
  };

  model.setState(opts.state ?? "idle");
  view.draw(model.frame());
  resume();
  return mascot;
}

// ---- src/ui/mascot/reactions.ts ----------------------------------
/**
 * What Orangey does about what happens — as a table.
 *
 * A reaction is: on this event, when this holds, play that state. The first
 * matching row wins. Every row has an id so the GM can switch it off in
 * Settings, and a salience so that a reaction only ever interrupts a held one
 * of lower salience — an Oops is never buried by a Reveal that lands a frame
 * later.
 *
 * Adding a trigger is adding a row. Nothing upstream names an animation;
 * nothing here names a randomizer.
 */

                                                                

                                 
             
                      
                                         
                                                                              
               
                                                 
                   
                                
                
 

const MASCOT_SALIENCE = { idle: 0, anticipate: 1, reveal: 2, happy: 3, oops: 4 }         ;

const isLand = (e             )                                                   => e.type === "roll:land";
const isImport = (e             )                                                     => e.type === "import:done";

const DEFAULT_REACTIONS                            = [
  { id: "roll-start", on: "roll:start", then: "anticipate", salience: MASCOT_SALIENCE.anticipate, label: "Watches the roll" },
  { id: "outcome-cheer", on: "roll:land", when: (e) => isLand(e) && e.summary.mood === "cheer", then: "happy", salience: MASCOT_SALIENCE.happy, label: "Cheers an outcome you tagged" },
  { id: "outcome-wince", on: "roll:land", when: (e) => isLand(e) && e.summary.mood === "wince", then: "oops", salience: MASCOT_SALIENCE.oops, label: "Winces at an outcome you tagged" },
  { id: "roll-max", on: "roll:land", when: (e) => isLand(e) && e.summary.extreme === "max", then: "happy", salience: MASCOT_SALIENCE.happy, label: "Cheers a maximum roll" },
  { id: "roll-min", on: "roll:land", when: (e) => isLand(e) && e.summary.extreme === "min", then: "oops", salience: MASCOT_SALIENCE.oops, label: "Winces at a minimum roll" },
  { id: "roll-land", on: "roll:land", then: "reveal", salience: MASCOT_SALIENCE.reveal, label: "Reacts when a roll lands" },
  { id: "roll-fail", on: "roll:fail", then: "oops", salience: MASCOT_SALIENCE.oops, label: "Winces when a roll cannot happen" },
  { id: "link-fail", on: "link:fail", then: "oops", salience: MASCOT_SALIENCE.oops, label: "Winces when a slide link points nowhere" },
  { id: "import-ok", on: "import:done", when: (e) => isImport(e) && e.ok, then: "happy", salience: MASCOT_SALIENCE.happy, label: "Cheers a clean import" },
  { id: "import-warn", on: "import:done", when: (e) => isImport(e) && !e.ok, then: "oops", salience: MASCOT_SALIENCE.oops, label: "Winces at an import with problems" },
];

/** The first matching reaction that is switched on, or null. */
function pickReaction(
  event             ,
  reactions                           ,
  isOn                          = () => true,
)                        {
  for (const r of reactions) {
    if (r.on !== event.type) continue;
    if (!isOn(r.id)) continue;
    if (r.when && !r.when(event)) continue;
    return r;
  }
  return null;
}

/**
 * May `next` take over from `held`? Higher salience interrupts; equal
 * restarts; lower waits. The host exempts a new roll from this: a fresh roll
 * always takes over, because it is the newest fact about the table.
 */
function mayInterrupt(held                       , next                )          {
  return held === null || next.salience >= held.salience;
}

// ---- src/ui/mascot/states.ts -------------------------------------
/**
 * The five states Orangey ships with.
 *
 * Each is a pose plus what he does in it. None of them sets the squash
 * target: idle asks for a zero-mean breath, and every other pose is carried
 * by crouch and tilt, so the silhouette is always the owner's drawing.
 *
 * To add a state: register it here (or anywhere that runs before the mascot
 * mounts), then name it in a reaction. Nothing else needs to change.
 */



/* Idle: breathes, tilts its head, hops once in a while. Eye contact. */
registerMascotState("idle", {
  pose: "neutral",
  enter(m) {
    m.scratch.nudgeAt = m.t + 2 + m.random() * 3;
  },
  drive(m) {
    m.breath = 0.02;
    m.sl.t = 0.008 * Math.sin(m.t * 0.72);
    m.tilt.t = 2.6 * Math.sin(m.t * 0.55);
    if (m.t > (m.scratch.nudgeAt ?? 0)) {
      m.launch(-120);
      m.tilt.kick(18 * (m.random() < 0.5 ? -1 : 1));
      m.scratch.nudgeAt = m.t + 4.2 + m.random() * 3.6;
    }
  },
});

/* Anticipate: sinks, leans back, rocks; the drawn squint looks at the wheel. */
registerMascotState("anticipate", {
  pose: "anticipate",
  drive(m) {
    m.sl.t = 0.032 * Math.sin(m.t * 11);
    m.tilt.t = -4.5 + 2.5 * Math.sin(m.t * 11);
    m.crouch.t = 2.5;
  },
  limbs(m) {
    return { I: 3 * Math.sin(m.t * 11), J: -3 * Math.sin(m.t * 11) };
  },
});

/* Reveal: the surprised pose, launched at the landing. Holds until told otherwise. */
registerMascotState("reveal", {
  pose: "surprised",
  enter(m) {
    m.eyeScale.t = 1.32;
    m.launch(-190);
    m.sq.kick(-1.0);
    m.pn.kick(1.1);
    m.eyeScale.kick(5);
    m.limb.A.kick(-7);
    m.limb.B.kick(4);
    m.tilt.kick(-46);
  },
  limbs() {
    return { A: -16 };
  },
});

/* Oops: sways, ducks, rubs the back of its head. */
registerMascotState("oops", {
  pose: "oops",
  enter(m) {
    m.eyeScale.t = 0.88;
    m.sq.kick(0.5);
    m.sl.kick(0.35);
  },
  drive(m) {
    m.sl.t = 0.028 * Math.sin(m.t * 2.4);
    m.tilt.t = 3.5;
    m.crouch.t = 1.5;
  },
  limbs(m) {
    return { D: -7 * Math.sin(m.t * 8.7) };
  },
});

/* Happy: arms up, a little dance, small repeated hops. Eye contact. */
registerMascotState("happy", {
  pose: "happy",
  enter(m) {
    m.eyeScale.t = 1.08;
    m.launch(-150);
    m.sq.kick(-0.8);
    m.pn.kick(0.9);
    m.limb.G.kick(-9);
    m.limb.H.kick(9);
    m.tilt.kick(30);
    m.scratch.lastHop = -1;
  },
  drive(m) {
    m.sl.t = 0.012 * Math.sin(m.t * 6);
    m.tilt.t = 3 * Math.sin(m.t * 6);
    const beat = Math.floor(m.t * 2);
    if (m.grounded && m.stateT > 0.9 && m.stateT < 2.6 && beat !== m.scratch.lastHop) {
      m.scratch.lastHop = beat;
      m.launch(-95);
    }
  },
  limbs(m) {
    return { G: -8 * Math.sin(m.t * 7.5), H: 8 * Math.sin(m.t * 7.5) };
  },
});

/** The names the reactions table may use, for validation and the settings panel. */
const MASCOT_BUILTIN_STATES = ["idle", "anticipate", "reveal", "oops", "happy"]         ;
                                                                     
function isMascotState(name         )                          {
  return typeof name === "string" && (MASCOT_BUILTIN_STATES                     ).includes(name);
}

/**
 * Which build this is, and where the other one lives.
 *
 * The site build serves `orangey.html` beside `index.html`, so Settings can
 * offer it as a download — fetched relatively, so it works wherever the app
 * is served from: the root of a domain, a project subpath, or a folder. The single-file build marks itself with a meta tag
 * at build time, and Settings says so instead of offering the file it
 * already is.
 */

const SINGLE_FILE_NAME = "orangey.html";

/** The GitHub home; releases carry the single file for people who want a copy. */
const REPO_URL = "https://github.com/orangey-app/orangey";

function isSingleFile(doc           = document)          {
  return doc.querySelector('meta[name="orangey-build"]')?.getAttribute("content") === "single";
}

function releasesUrl()         {
  return `${REPO_URL}/releases/latest`;
}
