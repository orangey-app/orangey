    // while the cards were out and now simply shows the pick.
    await land(randomizer, chosenFromOffer(randomizer.name, outcomes, at), bag, false);
  }

  function skip()       {
    opts.wheel()?.skip();
    opts.tray?.skip();
    opts.coin?.skip();
  }

  /** Whether this roll has anything to watch, which decides when to reveal. */
  function animates(randomizer          , outcome         , feel              )          {
    if (motionScale(feel.motion) === 0) return false;
    // A list shown as a list has nothing to animate, so it reveals at once.
    if (randomizer.type === "list") return opts.wheel() !== null && outcome.itemIndex !== undefined;
    if (randomizer.type === "dice") return opts.tray !== undefined && outcome.dice !== undefined;
    if (randomizer.type === "coin") return opts.coin !== undefined;
    return false;
  }

  async function roll()                {
    // A second press during a roll means "get on with it", not "roll again".
    if (rolling) {
      skip();
      return;
    }
    // Cards are out: the next thing that happens is a pick, not a roll.
    if (offered) return;
    // A second press after a hidden roll means "show the table".
    if (held) {
      const was = held;
      held = null;
      if (was.offer) {
        offered = { outcomes: was.offer, randomizer: was.randomizer, bag: was.bag };
        lay(was.offer, false);
        opts.onChoosing?.();
        return;
      }
      await land(was.randomizer, was.outcome, was.bag, false);
      return;
    }
    const randomizer = opts.randomizer();
    // Bag mode: the roll is made against what is still in the bag, and the
    // list as a whole is left alone — `withoutDrawn` only marks, so every
    // index, colour and chain target still points where it did.
    const bag = randomizer.type === "list" && randomizer.withoutReplacement ? bagDrawn(randomizer.id) : null;
    const rollable = bag && randomizer.type === "list"
      ? { ...randomizer, items: withoutDrawn(randomizer.items, bag) }
      : randomizer;

    const problem = whyCannotRoll(randomizer, bag ?? undefined);
    if (problem) {
      opts.result.clear(problem);
      if (opts.live) state.tell({ type: "roll:fail", source: randomizer.type, reason: problem });
      return;
    }

    // Make a choice: several outcomes drawn at once, and the player picks.
    // A wheel that offers is not spun and is not rolled several at a time.
    if (rollable.type === "list" && randomizer.type === "list" && randomizer.offer !== undefined && randomizer.offer >= 2) {
      let outcomes           ;
      try {
        outcomes = offerFromList(rollable, randomizer.offer, state.source());
      } catch (e) {
        const reason = (e         ).message;
        opts.result.clear(reason);
        if (opts.live) state.tell({ type: "roll:fail", source: randomizer.type, reason });
        return;
      }
      // One left in play is no choice: it lands like any roll, and says why.
      if (outcomes.length > 1) {
        if (opts.hidden?.()) {
          held = { offer: outcomes, randomizer, bag };
          lay(outcomes, true);
          opts.onHeld?.();
          return;
        }
        offered = { outcomes, randomizer, bag };
        lay(outcomes, false);
        opts.onChoosing?.();
        return;
      }
      const only = chosenFromOffer(randomizer.name, outcomes, 0);
      if (opts.hidden?.()) {
        held = { outcome: only, randomizer, bag };
        opts.result.pending("Rolled. Press Reveal.");
        opts.onHeld?.();
        return;
      }
      rolling = true;
      await land(randomizer, only, bag, true);
      return;
    }

    let outcome         ;
    try {
      const many = Math.max(1, Math.trunc(opts.count?.() ?? 1));
      outcome = many > 1 && rollable.type === "list"
        ? rollListMany(rollable, many, state.source(), bag ?? undefined)
        : rollRandomizer(rollable, state.source());
    } catch (e) {
      const reason = (e         ).message;
      opts.result.clear(reason);
      if (opts.live) state.tell({ type: "roll:fail", source: randomizer.type, reason });
      return;
    }

    // Hidden: it has been rolled, and that is all anybody may know yet.
    // Nothing lands, nothing is recorded, the bag keeps its outcome, and
    // navigating away without revealing throws the roll away.
    if (opts.hidden?.()) {
      held = { outcome, randomizer, bag };
      opts.result.pending("Rolled. Press Reveal.");
      opts.onHeld?.();
      return;
    }

    rolling = true;
    await land(randomizer, outcome, bag, true);
  }

  /**
   * The landing, in the order the whole app depends on (P8): the answer, the
   * announcement and the mascot's reaction together, once, at the end.
   *
   * `animated` is false for a reveal: the table has been waiting already, so
   * the answer arrives at once rather than after another spin.
   */
  async function land(
    randomizer          ,
    outcome         ,
    bag                            ,
    animated         ,
  )                {
    const feel = opts.feel();
    const willAnimate = animated && animates(randomizer, outcome, feel);
    rolling = true;
    opts.onStart?.(willAnimate);

    if (willAnimate) {
      opts.result.pending();
      if (opts.live) state.tell({ type: "roll:start", source: randomizer.type });
    } else {
      opts.result.show(outcome);
    }

    const wheel = opts.wheel();
    if (randomizer.type === "list" && wheel && outcome.itemIndex !== undefined) {
      await wheel.spinTo(outcome.itemIndex, willAnimate ? feel : { ...feel, motion: "instant" });
    } else if (randomizer.type === "dice" && opts.tray && outcome.dice) {
      await opts.tray.show(outcome.dice, willAnimate ? feel : { ...feel, motion: "instant" });
    } else if (randomizer.type === "coin" && opts.coin) {
      await opts.coin.show(outcome.text, willAnimate ? feel : { ...feel, motion: "instant" });
    }

    if (willAnimate) opts.result.show(outcome);
    // Out of the bag at the landing, never at the start: a skipped roll still
    // lands, so it still takes, and a roll that never arrived never did.
    if (bag && randomizer.type === "list") {
      const taken = outcome.indices ?? (outcome.itemIndex !== undefined ? [outcome.itemIndex] : []);
      for (const at of taken) bagTake(randomizer.id, randomizer.items[at].id);
      if (taken.length) opts.onBagChange?.();
    }
    if (opts.live) state.tell({ type: "roll:land", source: randomizer.type, summary: summarize(outcome) });
    rolling = false;
    opts.onEnd?.();
    opts.onLanded?.(outcome);
    if (opts.live) void state.record(randomizer, outcome, opts.from);
  }

  return {
    roll,
    skip,
    get rolling() {
      return rolling;
    },
    get holding() {
      return held !== null;
    },
    get choosing() {
      return offered !== null;
    },
    pick,
    discard() {
      held = null;
      offered = null;
    },
  };
}

// ---- src/ui/components/cell.ts -----------------------------------
/**
 * One randomizer on a board: its own wheel, dice or coin, its own result, and
 * its own Feel settings, in a cell small enough that several fit on a screen.
 *
 * It is the play screen's surface without the furniture — no presets, no link
 * dialog, no history panel — because a board carries those once for all of its
 * cells rather than once per cell.
 */

                                                                      








                                          
                                                         




                           
                  
                                                    
                        
                                            
               
                            
                                  
 

function createCell(
  randomizer            ,
  opts                                                                                    = {},
)           {
  const result = createResultPanel("Ready");
  const stage = h("div", { class: "stage cell-stage" });
  const tray = createDiceTray();
  const coin = createCoin();
  let wheel                                        = null;

  if (randomizer.type === "list" && randomizer.view === "wheel") {
    wheel = createWheel({
      items: () => {
        const r = randomizer                                         ;
        return r.withoutReplacement ? withoutDrawn(r.items, bagDrawn(r.id)) : r.items;
      },
      id: () => randomizer.id,
      onActivate: () => void roller.roll(),
      size: 260,
      slices: () => (randomizer                                         ).slices,
    });
    stage.append(wheel.el);
  } else if (randomizer.type === "dice") {
    stage.append(tray.el);
  } else if (randomizer.type === "coin") {
    stage.append(coin.el);
  }
  const offer = randomizer.type === "list" && randomizer.offer !== undefined && randomizer.offer >= 2 ? randomizer.offer : 0;
  result.reserve(longestOutcome(randomizer), { offer });

  const feelNow = () => effectiveFeel(state.prefs.feel, randomizer.feel, state.prefs.animationsOff);

  if (randomizer.type === "list" && randomizer.withoutReplacement) {
    void bagLoad(randomizer.id).then(() => wheel?.refresh());
  }

  const roller = createRoller({
    randomizer: () => randomizer            ,
    result,
    wheel: () => wheel,
    tray,
    coin,
    feel: feelNow,
    live: true,
    onStart: () => opts.onRoll?.(),
    onLanded: (outcome) => opts.onLanded?.(outcome),
    from: opts.from,
    // Several cells can offer at once after Roll all; the keyboard goes to a
    // cell's cards only when it was already in that cell.
    focusOffer: () => el.contains(document.activeElement) || (el.parentElement?.contains(document.activeElement) ?? false),
  });

  const el = h("div", { class: "cell", "data-randomizer": randomizer.id },
    h("h3", { class: "cell-name", text: randomizer.name }),
    stage,
    result.el,
  );

  return {
    el,
    roll: () => roller.roll(),
    skip: () => roller.skip(),
    get rolling() { return roller.rolling; },
    get randomizer() { return randomizer; },
  };
}

/**
 * A Roll button for one cell. Pressing it again while the cell is running
 * means "get to the answer", which is what the cell's own roll does with a
 * roll already in flight.
 */
function cellRollButton(cell          , className        )              {
  const roll = button("Roll", () => {
    const skipping = cell.rolling;
    const done = cell.roll();
    if (skipping) return;
    roll.textContent = "Skip";
    void done.then(() => { roll.textContent = "Roll"; });
  }, { class: className });
  return roll;
}

/** A cell for a randomizer the board points at but the library no longer has. */
function createMissingCell(name        )              {
  return h("div", { class: "cell cell-missing" },
    h("h3", { class: "cell-name", text: name }),
    h("p", { class: "faint", text: "This randomizer is not in your library any more. Remove it from the board, or import it again." }),
  );
}

// ---- src/ui/components/chain.ts ----------------------------------
/**
 * A chain of randomizers: an outcome that sends you to another one.
 *
 * An encounter table whose worst result says "roll on the treasure table" is
 * why this exists. The outcome carries `goesTo`, and when it comes up that
 * randomizer opens beside the wheel that sent you there — and waits. It does
 * not roll itself: the table decides when the second roll happens, the way it
 * would pick up a second set of dice.
 *
 * Only the two newest stay full size. A third opens and the first becomes an
 * icon in the strip above, carrying its name and the answer it gave, because
 * three wheels across a laptop are three wheels nobody can read. Clicking an
 * icon brings that one back.
 *
 * The rule is `advanceChain` and `chainPlacement`, which know nothing about
 * the DOM. What is full size, what is an icon, what a chain does when it
 * arrives somewhere it has already been, and what it does when the randomizer
 * an outcome points at has been deleted are all questions a test can ask
 * directly rather than by clicking.
 */

                                                            


                                          


/** How many randomizers in a chain keep their full size. The rest are icons. */
const CHAIN_FULL_SIZE = 2;

/** Where an outcome points, and what that outcome was called on the wheel. */
                              
             
                
 

                            
             
                                                                           
               
                                                                             
               
                                                                        
                 
 

                               
                     
                                                                   
                      
 

                                        

/** The randomizer this outcome sends you to, when it sends you anywhere. */
function chainTarget(r            , outcome         )                     {
  if (r.type !== "list" || outcome.itemIndex === undefined) return null;
  const item = r.items[outcome.itemIndex];
  return item?.goesTo ? { id: item.goesTo, label: item.label } : null;
}

/**
 * The chain after the randomizer at `from` has rolled.
 *
 * @param look  the library: what a target id resolves to, or null if it is gone
 */
function advanceChain(
  links                      ,
  from        ,
  target                    ,
  look                                         ,
)               {
  // Rolling a randomizer again answers its question again, so whatever its
  // last answer had opened is no longer part of the chain. At the root that
  // is all of it: a fresh spin of the wheel starts a fresh chain.
  const kept = links.slice(0, from + 1);
  if (!target) return { links: kept, note: null };

  const already = kept.find((link) => link.id === target.id);
  if (already) {
    // Following it would put the same randomizer on screen twice and lead
    // straight back here. Saying so is more use than a chain that circles.
    return { links: kept, note: `${already.name} is already open here, so the chain stops rather than going round again.` };
  }

  const found = look(target.id);
  return {
    links: [...kept, { id: target.id, name: found?.name ?? target.label, from: target.label, found: found !== null }],
    note: null,
  };
}

/** Which links are full size and which are icons, with `focus` full size. */
function chainPlacement(count        , focus        )              {
  const at = Math.min(Math.max(focus, 0), Math.max(count - 1, 0));
  // Full size is the randomizer in focus and the one that sent you to it: the
  // newest pair until an icon is clicked, and that icon's pair afterwards.
  return Array.from({ length: count }, (_, i) => (i <= at && i > at - CHAIN_FULL_SIZE ? "full" : "icon"));
}

/**
 * What a link past the root looks like: the line saying what sent you here,
 * then its own cell and Roll button — or, when the library no longer has it,
 * a gap that still says where the outcome meant to send you. The play screen
 * and a board both draw links with this, so they look the same.
 */
function createChainSurface(
  link           ,
  sender        ,
  opts                                            = {},
)                                             {
  const from = h("p", { class: "faint chain-from", text: `${sender} rolled ${link.from}` });
  const found = state.library.findById(link.id)?.randomizer ?? null;
  if (!found) {
    // The same tone as a board's gap: the outcome still comes up and still
    // says where it meant to send you.
    return {
      cell: null,
      el: h("div", { class: "chain-link cell cell-missing" },
        from,
        h("h3", { class: "cell-name", text: link.name }),
        h("p", { class: "faint", text: "This randomizer is not in your library any more. Import it again, or take the link off that outcome." }),
      ),
    };
  }
  // Its history row says what sent you here, so the two rolls read as one.
  const cell = createCell(found, { onLanded: opts.onLanded, from: { randomizerName: sender, label: link.from } });
  return { cell, el: h("div", { class: "chain-link" }, from, cell.el, cellRollButton(cell, "primary chain-roll")) };
}

/** The play screen, as the chain needs to see it: its root link, and its card. */
                            
                                                                                    
               
                 
                                                                   
                    
                                                                                
                                             
 

                            
                                                       
                     
                                                                         
                    
                                                
                    
                                                                            
                
                                                                                 
                        
                  
 

function createChainRow(root           )            {
  const strip = h("div", { class: "chain-strip" });
  const open = h("div", { class: "chain-open" });
  const note = h("p", { class: "chain-note warning" });

  let links              = [];
  /** Per link, in step with `links`. The root's surface is the play card. */
  let holders                         = [];
  let cells                      = [];
  let answers                    = [];
  let focus = 0;
  let stopped                = null;

  function reset()       {
    links = [{ id: root.id(), name: root.name(), from: "", found: true }];
    holders = [null];
    cells = [null];
    answers = [null];
    focus = 0;
    stopped = null;
    render();
  }

  /** The surface for a link past the root: its own cell, or what is missing. */
  function build(i        )       {
    const surface = createChainSurface(links[i], links[i - 1]?.name ?? "");
    cells[i] = surface.cell;
    holders[i] = surface.el;
  }

  function follow(from        , target                    )       {
    const advance = advanceChain(links, from, target, (id) => state.library.findById(id)?.randomizer ?? null);
    links = advance.links;
    stopped = advance.note;
    // Everything the rolled randomizer had opened is gone, surfaces and all:
    // a stale holder kept by index would show the previous chain's answer.
    holders.length = from + 1;
    cells.length = from + 1;
    answers.length = from + 1;
    for (let i = from + 1; i < links.length; i++) build(i);
    focus = links.length - 1;
    render();
  }

  function icon(link           , i        )              {
    return h("button", {
      type: "button",
      class: "chain-icon",
      title: `Show ${link.name} at full size again`,
      onclick: () => { focus = i; render(); },
    },
      h("span", { class: "chain-icon-name", text: link.name }),
      h("span", { class: "chain-icon-answer", text: answers[i] ?? "not rolled" }),
    );
  }

  function render()       {
    const places = chainPlacement(links.length, focus);
    setChildren(strip, ...links.map((link, i) => (places[i] === "icon" ? icon(link, i) : null)));
    strip.hidden = !places.includes("icon");
    setChildren(open, ...links.map((_, i) => (i > 0 && places[i] === "full" ? holders[i] : null)));
    root.card.hidden = places[0] !== "full";
    note.textContent = stopped ?? "";
    note.hidden = stopped === null;
    root.layout(open.children.length > 0, root.card.hidden);
  }

  /**
   * A roll can be started by the play screen's button, by a chain link's own,
   * by the space bar or by a click on the wheel itself, and every one of them
   * ends in `state.record`. The chain watches for the roll that was recorded
   * rather than wrapping the four ways of starting one.
   */
  let seen = state.lastOutcome;
  const unsubscribe = state.subscribe(() => {
    const last = state.lastOutcome;
    if (last === seen) return;
    seen = last;
    if (!last) return;
    const i = links.findIndex((link) => link.id === last.randomizer.id);
    if (i < 0) return;
    answers[i] = last.outcome.text;
    follow(i, chainTarget(last.randomizer, last.outcome));
  }, ["outcome"]);

  function rollNewest()          {
    const places = chainPlacement(links.length, focus);
    for (let i = links.length - 1; i > 0; i--) {
      const cell = cells[i];
      if (places[i] === "full" && cell) {
        void cell.roll();
        return true;
      }
    }
    return false;
  }

  reset();

  return {
    strip,
    open,
    note,
    reset,
    rollNewest,
    destroy() {
      unsubscribe();
    },
  };
}

// ---- src/ui/components/linkdialog.ts -----------------------------
/**
 * The dialog that hands over a link for a slide.
 *
 * Out of `play.ts` because it is a self-contained piece of explaining: two
 * kinds of link with different trade-offs, a size warning, and the awkward
 * truth that a copy of Orangey opened from a file cannot be linked to at all.
 * None of that is about playing.
 */

                                                            
                                                            





/**
 * Two kinds of link, side by side.
 *
 * "With the wheel inside" carries the randomizer in the address, so it
 * rolls on anyone's machine and keeps rolling whatever happens to the
 * library — frozen at today's version, and longer. "To my library" is short
 * and follows every edit, but only works where the library is. The first is
 * offered first, because it is what most people pasting into a deck mean.
 */
async function openLinkDialog(randomizer            , node                    )                {
  // Where the keyboard came from, so it goes back there on close.
  const opener = document.activeElement                      ;
  const base = appBase();
  const rollOnOpen = h("input", { type: "checkbox", checked: true });
  const fullScreen = h("input", { type: "checkbox", checked: true });
  const field = h("input", { type: "text", readonly: true, "aria-label": "Link to paste onto a slide", spellcheck: "false" });
  const note = h("p", { class: "faint link-note" });
  const sizeNote = h("p", { class: "warning link-size" });

  let payload                = null;
  try {
    payload = await encodeRandomizer(randomizer);
  } catch {
    payload = null;
  }
  const embeddedLength = payload === null ? Infinity : wheelLink(base, payload, { roll: true, present: true }).length;
  const canEmbed = payload !== null && embeddedLength <= LINK_HARD_LIMIT;
  const canLibrary = node?.randomizer != null;
  if (!canEmbed && !canLibrary) {
    state.toast("This randomizer is too big to put in a link, and it is not in your library.");
    return;
  }

  let kind                         = canEmbed ? "embedded" : "library";
  const kinds = h("div", { class: "segmented link-kinds", role: "group", "aria-label": "What the link carries" });

  const refresh = () => {
    const opts = { roll: rollOnOpen.checked, present: fullScreen.checked };
    field.value = kind === "embedded" && payload
      ? wheelLink(base, payload, opts)
      : slideLink(base, node .randomizer .id, opts);
    note.textContent = kind === "embedded"
      ? "The wheel travels inside the link, so it works for anyone who opens the deck, on any machine, with nothing installed. It is a snapshot: editing the wheel afterwards does not change decks you have already made."
      : "Short, and it follows every edit you make. It points at the randomizer's identity rather than its file name, so renaming it or moving it to another folder will not break the deck — but it only works on a device where this library is stored.";
    const tooLong = kind === "embedded" && field.value.length > LINK_SOFT_LIMIT;
    sizeNote.hidden = !tooLong;
    if (tooLong) {
      sizeNote.textContent = `This link is ${field.value.length} characters. Slides and PowerPoint will take it, but it is unwieldy to handle;${canLibrary ? " a link to your library would be a few dozen." : " trimming the table would shorten it."}`;
    }
    for (const b of kinds.querySelectorAll("button")) {
      b.setAttribute("aria-pressed", b.dataset.kind === kind ? "true" : "false");
    }
  };

  const kindButton = (value                        , label        ) => {
    const b = button(label, () => { kind = value; refresh(); }, { class: `link-kind-${value}` });
    b.dataset.kind = value;
    return b;
  };
  setChildren(kinds,
    canEmbed ? kindButton("embedded", "With the wheel inside") : null,
    canLibrary ? kindButton("library", "To my library") : null,
  );

  rollOnOpen.addEventListener("change", refresh);
  fullScreen.addEventListener("change", refresh);
  refresh();

  const copied = h("span", { class: "faint" });
  const dialog = h("dialog", { class: "link-dialog", "aria-label": "Link for a slide" },
    h("h2", { text: "Link for a slide" }),
    h("p", { class: "faint", text:
      `Put this on a shape or an image in Google Slides or PowerPoint. Clicking it during the presentation opens ${randomizer.name} and rolls it; closing the tab returns you to the deck.` }),
    kinds.children.length > 1 ? kinds : null,
    field,
    h("div", { class: "row tight gap-m" },
      h("label", { class: "row tight" }, rollOnOpen, "Roll as soon as it opens"),
      h("label", { class: "row tight" }, fullScreen, "Fill the screen"),
    ),
    isLinkableBase(base)
      ? null
      : h("p", { class: "warning", text:
          "This copy of Orangey is open from a file rather than a web address, so this link will not work from a slide — browsers refuse to follow a link from a web page to a local file. Open the published copy and make the link there." }),
    sizeNote,
    note,
    h("div", { class: "row gap-l" },
      button("Copy", async () => {
        try {
          await navigator.clipboard.writeText(field.value);
          copied.textContent = "Copied";
        } catch {
          field.select();
          copied.textContent = "Press Ctrl+C to copy";
        }
      }, { class: "primary copy-link" }),
      copied,
      h("div", { class: "spacer" }),
      button("Close", () => dialog.close()),
    ),
  );
  openDialog(dialog, opener);
  field.select();
}

// ---- src/ui/presenting.ts ----------------------------------------
/**
 * Full screen: one randomizer, or one board, filling the display.
 *
 * The play screen and a board both offer it and both used to carry their own
 * copy, which had already drifted — one of them swallowed the browser's
 * refusal silently and the other explained it in a comment. The class on
 * `body` is the single source of truth, so a view that is torn down while
 * presenting leaves nothing behind for the next one to trip over.
 */

                                     
                                     
                          
                                                    
                             
 

/**
 * The lock that keeps the display on while a wheel is on a projector.
 *
 * A table can go several minutes between rolls, which is long enough for a
 * laptop to dim and a phone to lock. The browser may refuse — it needs a
 * gesture, or the API may not exist at all — and that is fine: the worst case
 * is the screen behaving exactly as it did before.
 */
let wakeLock                          = null;

async function holdScreenAwake()                {
  if (wakeLock) return;
  try {
    wakeLock = (await navigator.wakeLock?.request("screen")) ?? null;
    // The browser drops it whenever the tab is hidden, so it has to be asked
    // for again when the tab comes back and the wheel is still up there.
    wakeLock?.addEventListener("release", () => {
      wakeLock = null;
    });
  } catch {
    wakeLock = null;
  }
}

function letScreenSleep()       {
  void wakeLock?.release().catch(() => {});
  wakeLock = null;
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && isPresenting()) void holdScreenAwake();
});

function isPresenting()          {
  return document.body.classList.contains("presenting");
}

function setPresenting(on         , controls                    )       {
  document.body.classList.toggle("presenting", on);
  controls.exitButton.hidden = !on;
  controls.presentButton.textContent = on ? "Leave full screen" : "Full screen";
  if (on) void holdScreenAwake();
  else letScreenSleep();
  if (on && document.documentElement.requestFullscreen) {
    void document.documentElement.requestFullscreen().catch(() => {
      /* the browser may refuse without a gesture; the layout still applies */
    });
  } else if (!on && document.fullscreenElement) {
    void document.exitFullscreen().catch(() => {});
  }
}

// ---- src/ui/views/play.ts ----------------------------------------
/**
 * The play surface: the screen a GM keeps open during a game.
 *
 * One tap to roll, the result in the largest type on screen, and nothing that
 * can be pressed by accident. The quick presets belong to the plain play
 * screen; with a randomizer open from the library they are replaced by a way
 * home, so that a stray press cannot swap out what the table is rolling.
 */




                                                            
















                                       


const PRESETS = [4, 6, 8, 10, 12, 20, 100];

/**
 * @param node     a randomizer from the library, or null
 * @param linked   a randomizer that arrived inside a link, when there is one
 * @param quick    the link is a quick wheel being typed at this table, not a
 *                 wheel someone sent: open the home screen with its text back
 */
function createPlayView(
  node                    ,
  params             = { roll: false, present: false },
  linked                    = null,
  quick = false,
)       {
  let randomizer             = node?.randomizer ?? linked ?? adHocDice("d20");
  /** Opened from the library or from a link: either way, one fixed randomizer. */
  const fixed = node !== null || (linked !== null && !quick);

  const result = createResultPanel(fixed ? "Ready" : "Pick something to roll");
  const stage = h("div", { class: "stage" });
  const rollButton = button("Roll", () => void doRoll(), { class: "primary roll-button", style: { width: "100%", minHeight: "52px", fontSize: "17px" } });

  /**
   * Roll behind the screen.
   *
   * Not a preference: it is a thing you do for one roll or one scene, and a
   * hidden roll that outlived the session it belonged to would be a nasty
   * surprise. Play screen only — a board's cells all roll at once, so there
   * is no "the" roll to hold back.
   */
  const hiddenBox = h("input", { type: "checkbox", class: "hidden-box", "aria-label": "Roll without showing the result" });
  hiddenBox.addEventListener("change", () => {
    if (!hiddenBox.checked && roller.holding) {
      roller.discard();
      result.clear("Ready");
      rollButton.textContent = "Roll";
    }
  });
  const hiddenToggle = h("label", { class: "row tight hidden-toggle faint" }, hiddenBox, "Hidden");

  // How many outcomes one press draws. Lists only: there is no sense in
  // "six" of a coin flip that is already one of two things.
  const countInput = h("input", {
    type: "number", min: "1", max: "20", value: "1", class: "roll-count", "aria-label": "How many to roll at once",
  });
  countInput.addEventListener("change", () => {
    countInput.value = String(rollCount());
    reserveResult();
  });
  const countField = h("label", { class: "row tight roll-count-field faint" }, "×", countInput);

  function rollCount()         {
    const n = Math.trunc(Number.parseInt(countInput.value, 10));
    return Number.isFinite(n) ? Math.max(1, Math.min(20, n)) : 1;
  }

  function updateHeaderControls()       {
    // A wheel that offers a choice is not also rolled six at a time: the two
    // answer different questions, and together they answer neither.
    const many = randomizer.type === "list" && !offerSize(randomizer);
    countField.hidden = !many;
    if (!many) countInput.value = "1";
  }

  let wheel                                        = null;
  const tray = createDiceTray();
  const coin = createCoin();

  function adHocDice(expression        )             {
    const r = emptyRandomizer("dice", expression)                                       ;
    r.expression = expression;
    return r;
  }

  function buildStage()       {
    wheel = null;
    setChildren(stage);
    if (randomizer.type === "list") {
      if (randomizer.view === "wheel") {
        wheel = createWheel({
          items: () => inPlay(),
          id: () => randomizer.id,
          slices: () => (randomizer.type === "list" ? randomizer.slices : undefined),
          onActivate: () => void doRoll(),
        });
        stage.append(wheel.el);
      } else {
        stage.append(renderOutcomeList());
      }
    } else if (randomizer.type === "dice") {
      stage.append(tray.el);
    } else if (randomizer.type === "coin") {
      stage.append(coin.el);
    }
  }

  /**
   * The outcomes as they stand for the next roll: in bag mode, the ones
   * already drawn are marked disabled rather than removed, so indices,
   * colours and chain targets all still line up.
   */
  function inPlay()             {
    if (randomizer.type !== "list") return [];
    if (!randomizer.withoutReplacement) return randomizer.items;
    return withoutDrawn(randomizer.items, bagDrawn(randomizer.id));
  }

  function renderOutcomeList()              {
    const items = inPlay();
    const percents = displayPercents(items);
    return h("ul", { class: "outcome-list" },
      ...items.map((item, i) =>
        h("li", { class: item.disabled ? "disabled muted" : "" },
          h("span", { text: item.label }),
          h("span", { class: "faint", text: ` ${percents[i].toFixed(1)}%` }),
        ),
      ),
    );
  }

  /** The settings this roll uses: global, this randomizer's own, and the play-time switch. */
  const feelNow = () => effectiveFeel(state.prefs.feel, randomizer.feel, state.prefs.animationsOff);

  const roller = createRoller({
    randomizer: () => randomizer            ,
    result,
    wheel: () => wheel,
    tray,
    coin,
    feel: feelNow,
    live: true,
    // While a roll runs the button offers to cut it short; pressing it again
    // is what `roller.roll()` reads as "skip".
    onStart: (willAnimate         ) => {
      rollButton.textContent = willAnimate ? "Skip" : "Roll";
      rollButton.disabled = false;
    },
    onEnd: () => {
      rollButton.textContent = "Roll";
      rollButton.disabled = false;
      // The quick wheel changed while this roll was spinning; redraw it now
      // rather than under the pointer.
      if (wheelStale) {
        wheelStale = false;
        wheel?.refresh();
      }
    },
    // The count changes at the landing; the wheel does not. Taking the
    // winning slice off the wheel the instant it wins would make it vanish
    // from under the pointer, so the wheel catches up on the next roll.
    onBagChange: () => {
      updateBagLine();
      if (randomizer.type === "list" && randomizer.view === "list") buildStage();
    },
    hidden: () => hiddenBox.checked,
    count: () => rollCount(),
    onHeld: () => {
      rollButton.textContent = "Reveal";
    },
    // Cards are out: the next press is on a card, so the button says so and
    // stays out of the way until one is taken.
    onChoosing: () => {
      rollButton.textContent = "Choose one";
      rollButton.disabled = true;
    },
    focusOffer: () => true,
  });

  const doRoll = ()                => {
    // The wheel drops what was drawn last time here, not when it was drawn.
    wheel?.refresh();
    return roller.roll();
  };

  const skip = ()       => roller.skip();

  // ---- quick wheel ---------------------------------------------------------

  /**
   * A wheel typed at the table: one option per line, rolled at once, kept
   * only if saved.
   *
   * It is a randomizer in the address like any wheel sent in a link, so a
   * phone that locks between rolls comes back to it, and Link and Save work
   * as they do for any other wheel. The address is rewritten in place, which
   * does not fire `hashchange`, so the screen is not rebuilt under the typing.
   * A preset or a dice expression replaces it outright: the text goes, and
   * the address returns to the plain play screen.
   */
  let quickModel                        = quick && linked?.type === "list" ? linked : null;
  let destroyed = false;
  let addressTimer                                           ;
  /** Encoding is asynchronous; only the newest one may write the address. */
  let addressTurn = 0;
  let wheelFrame = 0;
  /** The quick wheel changed during a spin and is redrawn when it lands. */
  let wheelStale = false;

  const quickArea = h("textarea", {
    class: "quick-options",
    rows: "4",
    placeholder: "Goblins\nBandits | 2\nNothing x3",
    "aria-label": "Quick wheel: one option per line",
    spellcheck: "false",
  });
  const quickOffer = h("input", {
    type: "number", min: String(OFFER_MIN), max: String(OFFER_MAX), class: "quick-offer",
    "aria-label": "Offer this many to choose from", placeholder: "–",
  });
  const quickTooLong = h("p", {
    class: "warning quick-too-long",
    text: "This wheel is too long for a link. It still rolls, but the address keeps the last version that fitted, so save it to keep it.",
  });
  quickTooLong.hidden = true;
  const quickCard = h("div", { class: "card quick-wheel" },
    quickArea,
    h("div", { class: "row tight quick-wheel-foot" },
      h("label", { class: "row tight quick-offer-field faint" }, "Offer", quickOffer, "to choose from"),
      h("span", { class: "spacer" }),
      h("span", { class: "faint quick-hint", text: "“| 3” or “x3” weighs a line" }),
    ),
    quickTooLong,
  );
  quickCard.hidden = true;
  const quickToggle = button("Quick wheel", () => setQuickOpen(quickCard.hidden === true), {
    class: "quick-wheel-toggle", "aria-expanded": "false",
  });

  function setQuickOpen(open         )       {
    quickCard.hidden = !open;
    quickToggle.setAttribute("aria-expanded", String(open));
    if (open) quickArea.focus({ preventScroll: true });
  }

  /** The offer typed beside the options, when it is one a file may hold. */
  function quickOfferValue()                     {
    const raw = quickOffer.value.trim();
    const n = Number(raw);
    const ok = raw !== "" && Number.isInteger(n) && n >= OFFER_MIN && n <= OFFER_MAX;
    if (raw !== "" && !ok) quickOffer.setAttribute("aria-invalid", "true");
    else quickOffer.removeAttribute("aria-invalid");
    return ok ? n : undefined;
  }

  function onQuickInput()       {
    const items = parseQuickOptions(quickArea.value);
    if (items.length === 0) {
      // Nothing typed is nothing to roll: back to the die the screen starts with.
      if (quickModel) {
        quickModel = null;
        setRandomizer(adHocDice("d20"));
      }
      scheduleAddress();
      return;
    }
    const now = nowIso();
    const next                 = {
      id: quickModel?.id ?? newId(),
      type: "list",
      name: "Quick wheel",
      view: "wheel",
      created: quickModel?.created ?? now,
      modified: now,
      items,
    };
    const offer = quickOfferValue();
    if (offer !== undefined) next.offer = offer;
    const onStage = quickModel !== null;
    quickModel = next;
    if (onStage) updateQuickInPlace(next);
    else setRandomizer(next);
    scheduleAddress();
  }

  /**
   * The wheel follows the typing without the screen being rebuilt: the same
   * stage, the same result, a redraw at most once a frame.
   */
  function updateQuickInPlace(next                )       {
    randomizer = next;
    // A roll held back or an offer on the table was drawn from the old
    // options; what it would land on is no longer on the wheel.
    if (roller.holding || roller.choosing) {
      roller.discard();
      result.clear("Ready");
      rollButton.textContent = "Roll";
      rollButton.disabled = false;
    }
    subtitle.textContent = describeType(next);
    reserveResult();
    updateHeaderControls();
    if (roller.rolling) {
      wheelStale = true;
      return;
    }
    cancelAnimationFrame(wheelFrame);
    wheelFrame = requestAnimationFrame(() => wheel?.refresh());
  }

  /** Throw the quick wheel away, as pressing a preset does. */
  function leaveQuick()       {
    if (!quickModel && !quickArea.value && !quickOffer.value) return;
    quickModel = null;
    quickArea.value = "";
    quickOffer.value = "";
    quickOffer.removeAttribute("aria-invalid");
    quickTooLong.hidden = true;
    setQuickOpen(false);
    void writeAddress();
  }

  function scheduleAddress()       {
    clearTimeout(addressTimer);
    addressTimer = setTimeout(() => void writeAddress(), QUICK_DEBOUNCE_MS);
  }

  /** Save what is typed into the address now, if the wait has not already. */
  const keepAddress = ()       => {
    if (addressTimer !== undefined) void writeAddress();
  };

  async function writeAddress()                {
    clearTimeout(addressTimer);
    addressTimer = undefined;
    const turn = ++addressTurn;
    // Only the play screen's own address is this view's to rewrite; a press
    // that has already taken the reader elsewhere wins.
    const here = currentRoute();
    if (destroyed || !(here.name === "play" || (here.name === "linked" && here.quick === true))) return;
    const model = quickModel;
    if (!model) {
      quickTooLong.hidden = true;
      if (here.name !== "play") history.replaceState(null, "", "#/");
      return;
    }
    let payload        ;
    try {
      payload = await encodeRandomizer(model);
    } catch {
      return;
    }
    if (turn !== addressTurn || destroyed) return;
    // Past the limit a link stops being something to paste about; the wheel
    // keeps rolling from memory, and the address keeps what last fitted.
    const tooLong = wheelLink(appBase(), payload).length > LINK_HARD_LIMIT;
    quickTooLong.hidden = !tooLong;
    if (!tooLong) history.replaceState(null, "", `#/roll?w=${payload}&quick=1`);
  }

  quickArea.addEventListener("input", onQuickInput);
  quickOffer.addEventListener("input", onQuickInput);
  quickArea.addEventListener("blur", keepAddress);
  quickOffer.addEventListener("blur", keepAddress);
  // A phone locks between rolls: whatever was typed last goes into the
  // address before the page is put away.
  window.addEventListener("pagehide", keepAddress);
  document.addEventListener("visibilitychange", keepAddress);

  // ---- quick bar -----------------------------------------------------------

  const expression = h("input", {
    type: "text",
    placeholder: "2d6 + 3",
    "aria-label": "Dice expression",
    spellcheck: "false",
    style: { maxWidth: "160px" },
  });
  const expressionError = h("span", { class: "faint" });
  expression.addEventListener("input", () => {
    const v = expression.value.trim();
    if (!v) {
      expressionError.textContent = "";
      expression.removeAttribute("aria-invalid");
      return;
    }
    const parsed = tryParse(v);
    expressionError.textContent = parsed.ok ? "" : parsed.error.message;
    if (parsed.ok) expression.removeAttribute("aria-invalid");
    else expression.setAttribute("aria-invalid", "true");
  });
  expression.addEventListener("keydown", (e) => {
    if ((e                 ).key !== "Enter") return;
    e.preventDefault();
    const parsed = tryParse(expression.value.trim());
    if (!parsed.ok) return;
    leaveQuick();
    setRandomizer(adHocDice(parsed.expression.normalized));
    void doRoll();
  });

  const quickbar = h("div", { class: "quickbar" },
    ...PRESETS.map((sides) =>
      button(`d${sides}`, () => {
        leaveQuick();
        setRandomizer(adHocDice(`d${sides}`));
        void doRoll();
      }, { class: "preset" }),
    ),
    button("Coin", () => {
      leaveQuick();
      setRandomizer(emptyRandomizer("coin", "Coin"));
      void doRoll();
    }),
    button("1–100", () => {
      leaveQuick();
      setRandomizer(emptyRandomizer("number", "Number"));
      void doRoll();
    }),
    quickToggle,
    expression,
    expressionError,
  );

  // With a randomizer open from the library the quick presets are replaced by
  // a way back to them: pressing one used to swap out the randomizer the table
  // was in the middle of, which is never what a press meant.
  const homeBar = h("div", { class: "quickbar home-bar" },
    button("← Home", () => navigate("#/"), { class: "ghost home-button", title: "Dice, coins and numbers" }),
  );

  function setRandomizer(next            )       {
    randomizer = next;
    title.textContent = next.type === "dice" ? (next                          ).expression : next.name;
    subtitle.textContent = next.description ?? describeType(next);
    editLink.style.display = node && next.id === node.randomizer?.id ? "" : "none";
    linkButton.hidden = !fixed && next !== quickModel;
    roller.discard();
    rollButton.textContent = "Roll";
    rollButton.disabled = false;
    reserveResult();
    result.clear("Ready");
    buildStage();
    updateBagLine();
    updateHeaderControls();
    // The bag is read from the app database, so it arrives a moment later;
    // until then the wheel simply shows everything, which is also what it
    // shows for a randomizer that does not use a bag at all.
    if (next.type === "list" && next.withoutReplacement) {
      void bagLoad(next.id).then(() => {
        if (randomizer.id !== next.id) return;
        updateBagLine();
        wheel?.refresh();
        if (next.view === "list") buildStage();
      });
    }
    // Nothing the old randomizer opened has anything to do with this one.
    chain.reset();
  }

  /** Fix the result panel's height from what this randomizer can produce. */
  function reserveResult()       {
    const one = longestOutcome(randomizer);
    const n = randomizer.type === "list" ? rollCount() : 1;
    const longest = n > 1 ? Array.from({ length: n }, () => one).join(", ") : one;
    result.reserve(longest, { seed: state.prefs.seed !== null, offer: offerSize(randomizer) });
  }

  const title = h("h1", { text: randomizer.type === "dice" ? (randomizer                          ).expression : randomizer.name });
  const subtitle = h("p", { class: "muted", text: randomizer.description ?? describeType(randomizer) });
  const editLink = button("Edit", () => node && navigate(`#/edit/${encodeURIComponent(node.path)}`), { class: "ghost edit-link" });
  editLink.style.display = node ? "" : "none";

  // A wheel that arrived in a link is nobody's until it is saved. The button
  // is one more quiet item in this row rather than anything that interrupts a
  // game: it is not offered at all in full screen, where the row is hidden.
  const saveAdHoc = button(linked && !quick ? "Save to my library" : "Save to library", async () => {
    // Keep the identity it came with when nothing here already has it, so a
    // slide link by id finds this copy afterwards.
    const taken = state.library.findById(randomizer.id) !== null;
    const path = await state.library.create("", { ...randomizer, id: taken ? newId() : randomizer.id });
    state.toast("Saved to your library");
    navigate(`#/r/${encodeURIComponent(path)}`);
  }, { class: "ghost save-randomizer" });

  // The panel is about whatever is open, so its Clear takes only those rolls.
  // The quick screen has no one randomizer open — every preset press is a new
  // ad-hoc one — so there it is about everything, which is also all the table
  // can see from here.
  const recent = createRecentRolls({
    ids: () => (fixed ? [randomizer.id] : []),
    scopeName: () => randomizer.name,
  });

  const header = h("div", { class: "row" }, h("div", {}, title, subtitle), h("div", { class: "spacer" }), editLink, node ? null : saveAdHoc);

  // Orangey's place: the corner of the result panel, where he can react to
  // the number without ever sitting on the Roll button.
  result.el.append(h("div", { class: "mascot-slot" }));
  /**
   * How much is left in the bag, and the way to put it all back.
   *
   * Only shown for a list that draws without putting back; for anything else
   * the row is hidden, so the card's height does not change under it.
   */
  const bagCount = h("span", { class: "faint bag-count" });
  const refillButton = button("Refill", () => {
    bagRefill(randomizer.id);
    result.clear();
    wheel?.refresh();
    if (randomizer.type === "list" && randomizer.view === "list") buildStage();
    updateBagLine();
  }, { class: "ghost refill-bag" });
  const bagLine = h("div", { class: "row tight bag-line" }, bagCount, refillButton);

  function updateBagLine()       {
    const on = randomizer.type === "list" && randomizer.withoutReplacement === true;
    bagLine.hidden = !on;
    if (!on || randomizer.type !== "list") return;
    const drawn = bagDrawn(randomizer.id);
    const total = randomizer.items.filter(isRollable).length;
    const left = withoutDrawn(randomizer.items, drawn).filter(isRollable).length;
    bagCount.textContent = `${left} of ${total} left`;
    refillButton.hidden = left === total;
  }

  /**
   * A way back to what you actually roll, on the screen you land on.
   *
   * The home screen offers dice presets and nothing else, so the wheel a
   * table has used all evening is three taps away behind the library. Only
   * here: with a randomizer open, this is the wrong thing to be looking at.
   */
  const shortcuts = h("div", { class: "card home-shortcuts" });

  function renderShortcuts()       {
    if (fixed) return;
    const seen = new Set        ();
    const pick = (id        ) => {
      if (seen.has(id)) return null;
      const node = state.library.findById(id);
      if (!node?.randomizer) return null;
      seen.add(id);
      return node;
    };

    const favourites = state.prefs.favourites.map(pick).filter((n) => n !== null);
    const recents = [...new Set(state.history.map(rollOwnerId).filter((id)               => id !== null))]
      .map(pick)
      .filter((n) => n !== null)
      .slice(0, 6);

    shortcuts.hidden = favourites.length === 0 && recents.length === 0;
    if (shortcuts.hidden) {
      setChildren(shortcuts);
      return;
    }
    const group = (heading        , nodes                   ) =>
      nodes.length
        ? h("div", { class: "shortcut-group" },
            h("h2", { text: heading }),
            h("div", { class: "row wrap" },
              ...nodes.map((n) =>
                button(n.randomizer .name, () => navigate(`#/r/${encodeURIComponent(n.path)}`), { class: "ghost shortcut" })),
            ),
          )
        : null;
    setChildren(shortcuts, group("Favourites", favourites), group("Recently rolled", recents));
  }

  const playCard = h("div", { class: "card play-card" }, header, stage, bagLine, result.el, rollButton);
  const el = h("div", { class: "play" },
    fixed ? homeBar : quickbar,
    fixed ? null : quickCard,
    playCard,
    ...(fixed ? [] : [shortcuts]),
    recent.el,
  );
  renderShortcuts();

  /**
   * An outcome that points at another randomizer opens it beside this one.
   *
   * The chain's elements are put in as siblings of the play card rather than
   * as a box around it: the full-screen rules are written against
   * `.play > .card`, and a wrapper would quietly take the projector with it.
   * The two columns are a grid on `.play` that exists only while something is
   * open, which is what the classes here say.
   */
  const chain = createChainRow({
    id: () => randomizer.id,
    name: () => randomizer.name,
    card: playCard,
    layout: (open, wide) => {
      el.classList.toggle("has-chain", open);
      el.classList.toggle("chain-wide", wide);
    },
  });
  el.insertBefore(chain.strip, playCard);
  el.insertBefore(chain.open, recent.el);
  el.insertBefore(chain.note, recent.el);

  reserveResult();
  buildStage();
  updateBagLine();
  updateHeaderControls();
  // Reopened from its address: the text comes back, normalised, and the card
  // is open so the table can go on typing.
  if (quickModel) {
    quickArea.value = quickText(quickModel.items);
    quickOffer.value = quickModel.offer !== undefined ? String(quickModel.offer) : "";
    quickCard.hidden = false;
    quickToggle.setAttribute("aria-expanded", "true");
  }
  if (randomizer.type === "list" && randomizer.withoutReplacement) {
    const opened = randomizer.id;
    void bagLoad(opened).then(() => {
      if (randomizer.id !== opened) return;
      updateBagLine();
      wheel?.refresh();
      if (randomizer.type === "list" && randomizer.view === "list") buildStage();
    });
  }
  // Settings can change the seed while this view is alive, and the seed line
  // is part of what the panel reserves room for.
  const unsubscribe = state.subscribe(() => {
    recent.refresh();
    reserveResult();
    renderShortcuts();
  }, ["history", "prefs", "library"]);

  /* ---- presenting, and links for slides -------------------------------- */

  const exitButton = button("Leave full screen", () => present(false), { class: "leave-presenting" });
  exitButton.hidden = true;
  const presentButton = button("Full screen", () => present(!isPresenting()), { class: "ghost present-button" });
  const present = (on         )       => setPresenting(on, { exitButton, presentButton });

  const linkButton = button("Link…", () => void openLinkDialog(randomizer, node), { class: "ghost link-button" });
  // A quick wheel is shareable the moment it exists. The link carries the
  // wheel, not the textarea: whoever opens it gets a wheel to roll.
  linkButton.hidden = !fixed && randomizer !== quickModel;

  // Switch animation off for now without touching the settings — after the
  // fortieth roll of the evening nobody wants to watch the wheel.
  const animateBox = h("input", { type: "checkbox", checked: !state.prefs.animationsOff, "aria-label": "Animate rolls" });
  animateBox.addEventListener("change", () => void state.savePrefs({ animationsOff: !animateBox.checked }));
  const animateToggle = h("label", { class: "row tight animate-toggle faint" }, animateBox, "Animate");

  header.append(hiddenToggle, countField, animateToggle, presentButton, linkButton, exitButton);

  if (params.present) present(true);
  if (params.roll) {
    // Wait a frame so the stage is laid out before the animation starts.
    requestAnimationFrame(() => void doRoll());
  }

  const onKey = (e               ) => {
    const typing = isTyping(e);
    if (e.key === "Escape") {
      // Mid-roll, Escape means "get to the answer"; otherwise it leaves the
      // full-screen view, which is the only way out on a projector.
      if (roller.rolling) skip();
      else if (isPresenting()) present(false);
      return;
    }
    if (typing) return;
    // Cards on the table: a digit takes that card, and a card's own Enter or
    // Space belongs to the card rather than to the Roll behind it.
    if (roller.choosing) {
      if (/^[1-9]$/.test(e.key)) {
        e.preventDefault();
        void roller.pick(Number(e.key) - 1);
        return;
      }
      if ((e.target                      )?.closest?.(".offer-card")) return;
    }
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      // A chain is rolled from its newest end: that is the randomizer the
      // table is waiting on, and the one behind it has already answered.
      if (!chain.rollNewest()) void doRoll();
    }
  };
  document.addEventListener("keydown", onKey);

  return {
    el,
    destroy() {
      document.removeEventListener("keydown", onKey);
      // An offer nobody picked, like a hidden roll nobody revealed, goes with
      // the screen; the quick wheel's address is only this screen's to write.
      roller.discard();
      destroyed = true;
      clearTimeout(addressTimer);
      cancelAnimationFrame(wheelFrame);
      window.removeEventListener("pagehide", keepAddress);
      document.removeEventListener("visibilitychange", keepAddress);
      // The full-screen class belongs to the app, which clears it before each
      // render: a view being torn down must not undo what the view replacing
      // it has already set up.
      chain.destroy();
      unsubscribe();
    },
  };
}

/** How many outcomes a roll of this offers to choose from; 0 when it lands on one. */
function offerSize(r            )         {
  return r.type === "list" && r.offer !== undefined && r.offer >= OFFER_MIN ? r.offer : 0;
}

function describeType(r            )         {
  switch (r.type) {
    case "list":
      return `${r.items.filter(isRollable).length} possible outcomes`;
    case "dice":
      return "Dice";
    case "coin":
      return `${r.faces[0]} or ${r.faces[1]}`;
    case "number":
      return `${r.min} to ${r.max}`;
    case "board":
      return `${r.entries.length} randomizer${r.entries.length === 1 ? "" : "s"}`;
  }
}

// ---- src/ui/components/picker.ts ---------------------------------
/**
 * Choosing a randomizer from the library.
 *
 * Used by a board (what goes on it) and by an outcome's "Goes to" (where it
 * sends you). Both used to offer a flat list of every randomizer, which is
 * fine with six and unusable with sixty: a real game has folders.
 *
 * The dialog shows the library as a tree, flattens to matches while you type,
 * takes a link someone sent you, and can make a new randomizer on the spot —
 * because the thing you want to put on a board often does not exist yet.
 */




                                                            



                                   
                         
               
                                                                                 
                 
 

                                
                
                                                                                
                            
                                        
                     
                                         
                      
                                                                         
                          
 

/**
 * Where dice made from typed notation live. A board entry is a reference to a
 * library randomizer (see ARCHITECTURE.md), so "2d6 + 3" typed on a board has
 * to become a file somewhere; one folder keeps them out of the way, and is the
 * only place they are reused from — a named "Attack roll" that happens to be
 * d20 + 5 is its own thing, and editing it should never change a board that
 * only asked for d20 + 5.
 */
const QUICK_DICE_FOLDER = "Dice";

const NEW_TYPES                           = [
  ["list", "New wheel"],
  ["dice", "New dice"],
  ["coin", "New coin"],
  ["number", "New number"],
];

function pickRandomizer(opts               )                                   {
  return new Promise((resolve) => {
    const taken = opts.taken?.() ?? new Set        ();
    let answered = false;
    const finish = (picked                         ) => {
      if (answered) return;
      answered = true;
      dialog.close();
      resolve(picked);
    };

    const list = h("div", { class: "picker-tree" });
    const search = h("input", { type: "search", placeholder: "Search your library", "aria-label": "Search your library" });
    const note = h("p", { class: "faint picker-note" });
    const open = new Set        ();

    function choose(node             )       {
      if (!node.randomizer) return;
      finish({ randomizer: node.randomizer, path: node.path, fresh: false });
    }

    /** One row: a folder you can open, or a randomizer you can choose. */
    function row(node             , depth        , where = "")              {
      if (node.kind === "folder") {
        const isOpen = open.has(node.path);
        const control = button(`${isOpen ? "▾" : "▸"} 📁 ${node.name}`, () => {
          if (isOpen) open.delete(node.path);
          else open.add(node.path);
          render();
        }, { class: "ghost picker-row picker-folder", style: { paddingLeft: `${8 + depth * 14}px` } });
        return control;
      }
      const already = node.randomizer ? taken.has(node.randomizer.id) : false;
      // The randomizer's name, not the file's: "Attack roll", not
      // "attack-roll.orangey.json".
      const shown = node.randomizer?.name ?? node.name;
      const label = where ? `${shown} — ${where}` : shown;
      const choice = button(label, () => choose(node), {
        class: `ghost picker-row picker-choice${already ? " picker-taken" : ""}`,
        style: { paddingLeft: `${8 + depth * 14}px` },
        ...(already ? { disabled: "", title: "Already there" } : {}),
      });
      return choice;
    }

    function walk(node             , depth        , out               )       {
      for (const child of node.children ?? []) {
        // A board cannot go on a board, and nothing can point at one: a board
        // is not something that rolls.
        if (child.kind === "file" && (!child.randomizer || child.randomizer.type === "board")) continue;
        out.push(row(child, depth));
        if (child.kind === "folder" && open.has(child.path)) walk(child, depth + 1, out);
      }
    }

    /** The typed text as dice notation, when this picker takes notation. */
    function typedNotation()                {
      const query = (search                    ).value.trim();
      return opts.allowNotation && query ? diceNotation(query) : null;
    }

    function render()       {
      const query = (search                    ).value.trim();
      const rows                = [];
      const notation = typedNotation();
      if (notation) {
        rows.push(button(`🎲 Add ${notation}`, () => void useNotation(notation), { class: "ghost picker-row picker-notation" }));
      }
      if (query) {
        // Typing flattens the tree: matches from every folder, each saying
        // which folder it came from.
        const seen = new Set        ();
        for (const hit of state.library.search(query)) {
          const r = hit.node.randomizer;
          if (!r || r.type === "board" || seen.has(hit.node.path)) continue;
          seen.add(hit.node.path);
          const folder = hit.node.path.includes("/") ? hit.node.path.slice(0, hit.node.path.lastIndexOf("/")) : "";
          rows.push(row(hit.node, 0, folder));
        }
        note.textContent = rows.length ? "" : `Nothing in your library matches "${query}".`;
      } else {
        walk(state.library.tree, 0, rows);
        note.textContent = rows.length ? "" : "Your library is empty.";
      }
      setChildren(list, ...rows);
    }

    search.addEventListener("input", render);
    search.addEventListener("keydown", (e) => {
      if ((e                 ).key !== "Enter") return;
      const notation = typedNotation();
      if (!notation) return;
      e.preventDefault();
      void useNotation(notation);
    });

    /**
     * Dice from typed notation: reuse one already made for the same
     * expression, or make it. One that is already taken here is not reused,
     * because a board holds each randomizer once and two "2d6" cells — one per
     * player — is a thing people want.
     */
    let making = false;
    async function useNotation(expression        )                {
      if (making) return;
      making = true;
      try {
        const folder = await quickDiceFolder();
        for (const child of state.library.find(folder)?.children ?? []) {
          const r = child.randomizer;
          if (r?.type === "dice" && !taken.has(r.id) && diceNotation(r.expression) === expression) {
            finish({ randomizer: r, path: child.path, fresh: false });
            return;
          }
        }
        const randomizer = { ...emptyRandomizer("dice", expression), expression }                  ;
        const path = await state.library.create(folder, randomizer);
        finish({ randomizer, path, fresh: false });
      } finally {
        making = false;
      }
    }

    /** The quick-dice folder, made the first time; any capitalisation counts. */
    async function quickDiceFolder()                  {
      const existing = state.library.tree.children?.find(
        (c) => c.kind === "folder" && c.name.toLowerCase() === QUICK_DICE_FOLDER.toLowerCase(),
      );
      return existing ? existing.path : state.library.createFolder("", QUICK_DICE_FOLDER);
    }

    async function makeNew(type              , title        )                {
      const name = await askText(title, { label: "Name", value: title, confirm: "Create" });
      if (!name) return;
      const randomizer = emptyRandomizer(type, name);
      const path = await state.library.create("", randomizer);
      finish({ randomizer, path, fresh: true });
    }

    async function useLink(raw        )                {
      const text = raw.trim();
      if (!text) return;
      const byId = /#\/id\/([^?&/]+)/.exec(text);
      const id = byId ? decodeURIComponent(byId[1]) : text.includes("/") || text.includes("?") ? null : text;
      if (id) {
        const node = state.library.findById(id);
        if (!node?.randomizer) {
          note.textContent = "That link points at something this library does not have.";
          return;
        }
        choose(node);
        return;
      }
      const embedded = /[?&]w=([^&]+)/.exec(text);
      if (!embedded) {
        note.textContent = "That does not look like a link to a randomizer.";
        return;
      }
      // A link with the wheel inside it is not a library item: it has to be
      // kept before anything can point at it.
      try {
        const randomizer = await decodeRandomizer(embedded[1]);
        const path = await state.library.create("", randomizer);
        note.textContent = "";
        finish({ randomizer, path, fresh: false });
        state.toast(`"${randomizer.name}" was saved to your library first, so this can point at it.`);
      } catch {
        note.textContent = "That link is damaged, so there is nothing to point at.";
      }
    }

    const linkField = h("input", { type: "text", placeholder: "…or paste a link", "aria-label": "Paste a link to a randomizer" });
    linkField.addEventListener("keydown", (e) => {
      if ((e                 ).key === "Enter") void useLink((linkField                    ).value);
    });

    const dialog = h("dialog", { class: "picker-dialog" },
      h("h2", { text: opts.title }),
      opts.allowNew
        ? h("div", { class: "row tight picker-new" },
            ...NEW_TYPES.map(([type, title]) => button(title, () => void makeNew(type, title), { class: "ghost picker-new-button" })),
          )
        : null,
      search,
      list,
      note,
      h("div", { class: "row" },
        opts.allowLink ? linkField : null,
        opts.allowLink ? button("Use link", () => void useLink((linkField                    ).value), { class: "ghost use-link" }) : null,
        h("span", { class: "spacer" }),
        button("Close", () => finish(null), { class: "picker-close" }),
      ),
    )                     ;

    // Where the keyboard came from, so it goes back there on close.
    const opener = document.activeElement                      ;
    dialog.addEventListener("close", () => finish(null));
    render();
    openDialog(dialog, opener);
    search.focus();
  });
}

// ---- src/ui/storage-actions.ts -----------------------------------
/**
 * The things you can do to where the library is kept.
 *
 * Both the library's storage badge and the Storage card in Settings offer
 * these, so they live here rather than in either view. Nothing here draws
 * anything: each returns whether something changed, and the caller re-renders.
 */


                                                                          









/** Whether this browser lets the library be a real folder (Chrome and Edge do). */
function canUseFolder()          {
  return canPickFolder();
}

                                                            

/** One sentence about where the library is, for a tooltip or a settings line. */
function describeStorage(kind        )         {
  switch (kind) {
    case "fsa":
      return "A folder on this computer. The files there are the library, so they are yours to back up, sync or keep in Git.";
    case "memory":
      return "Nothing is being saved. This browser gave Orangey no storage, so the library goes when the page closes.";
    case "idb":
      return "This browser's own storage (IndexedDB). It survives reloads and works offline, and goes if you clear this site's data.";
    default:
      return "This browser's own storage. It survives reloads and works offline, and goes if you clear this site's data.";
  }
}

/**
 * Whether the browser has promised to keep this site's data.
 *
 * Without it a browser may evict the library when the disk gets tight. Asking
 * is a separate step (`askToPersist`) because Firefox prompts for it, and a
 * permission prompt nobody asked for is worse than the risk.
 */
async function isPersisted()                          {
  try {
    if (!navigator.storage?.persisted) return null;
    return await navigator.storage.persisted();
  } catch {
    return null;
  }
}

async function askToPersist()                          {
  try {
    if (!navigator.storage?.persist) return null;
    return await navigator.storage.persist();
  } catch {
    return null;
  }
}

/**
 * Point the library at a folder on this computer, offering to copy what is
 * already there into it when the folder is empty.
 */
async function useFolder()                   {
  const backend = await pickFolder().catch(() => null);
  if (!backend) return false;
  const previous = state.library;
  const next = new LibraryService(backend);
  await next.refresh();
  if (next.files().length === 0 && previous.files().length > 0) {
    const copy = await askConfirm(
      "Copy your library into this folder?",
      `The folder is empty. Copy the ${previous.files().length} randomizers you have now into it?`,
      { confirm: "Copy" },
    );
    if (copy) {
      for (const file of previous.files()) {
        if (!file.randomizer) continue;
        const folder = parent(file.path);
        if (folder) await backend.mkdir(folder);
        await backend.write(file.path, serialize(wrap(file.randomizer)));
      }
      // The pictures go too, or every wheel that has one arrives in the new
      // folder pointing at nothing. They are not in the tree, so they are
      // copied straight from one backend to the other.
      const pictures = await previous.backend.list(IMAGE_DIR).catch(() => []);
      if (pictures.length) await backend.mkdir(IMAGE_DIR);
      for (const picture of pictures) {
        if (picture.kind !== "file") continue;
        const at = `${IMAGE_DIR}/${picture.name}`;
        await backend.writeBytes(at, await previous.backend.readBytes(at));
      }
      await next.refresh();
    }
  }
  state.setLibrary(next);
  state.folderNeedsPermission = false;
  void state.savePrefs({ backend: "fsa" });
  state.toast(`Library is now the folder “${backend.label}”`);
  return true;
}

async function stopUsingFolder()                {
  await forgetFolder();
  state.toast("Reload to go back to browser storage.");
}

/**
 * A copy of a randomizer that carries its pictures inside it.
 *
 * A bare .orangey.json has nowhere to put a picture except in itself, so the
 * outcomes swap their `image` id for the picture inline. That is what makes a
 * single exported file work on a machine that has never seen this library.
 */
async function portableRandomizer(r            )                      {
  if (r.type !== "list" || !r.items.some((i) => i.image)) return r;
  const items = await Promise.all(r.items.map(async (item) => {
    if (!item.image) return item;
    const { image: _image, ...rest } = item;
    const inline = await imageDataUrl(item.image);
    // A picture the store has lost takes the reference with it: an id that
    // resolves to nothing here will resolve to nothing there either.
    return inline ? { ...rest, imageData: inline } : rest;
  }));
  return { ...r, items };
}

/**
 * And the way back in: the pictures a file brought with it go to the store,
 * and the outcomes go back to naming ids.
 */
async function absorbImages(r            )                      {
  if (r.type !== "list" || !r.items.some((i) => i.imageData)) return r;
  const items = await Promise.all(r.items.map(async (item) => {
    if (!item.imageData) return item;
    const { imageData, ...rest } = item;
    try {
      return { ...rest, image: await putImageData(imageData) };
    } catch {
      // A picture that cannot be read loses the outcome nothing else: the
      // wheel still rolls, with one segment short of a picture.
      return rest;
    }
  }));
  return { ...r, items };
}

/** Every picture these randomizers point at. */
function usedImageIds(randomizers              )              {
  const ids = new Set        ();
  for (const r of randomizers) {
    if (r.type !== "list") continue;
    for (const item of r.items) if (item.image) ids.add(item.image);
  }
  return ids;
}

/**
 * The pictures for an archive, one entry each.
 *
 * An archive has room for files of its own, so it keeps them as pictures
 * rather than inlining them: the same picture on four wheels is packed once,
 * and anyone who opens the ZIP finds PNGs they can look at.
 */
async function pictureEntries(randomizers              )                      {
  const entries             = [];
  for (const id of usedImageIds(randomizers)) {
    const bytes = await imageBytes(id);
    if (!bytes) continue;
    // Its real name, so what comes out of the archive is a file the person's
    // computer will open rather than a JPEG called .png.
    const name = (await imageStoredName(id)) ?? `${id}.png`;
    entries.push({ path: `${IMAGE_DIR}/${name}`, bytes });
  }
  return entries;
}

/**
 * The files a board needs to work somewhere else: the board itself, and every
 * randomizer it points at.
 *
 * A board refers to randomizers by id rather than carrying copies, so it
 * travels as an archive: a link can hold one randomizer, not a table's worth.
 * A reference whose randomizer is gone is reported rather than packed, because
 * the person receiving it should know what is missing before they open it.
 */
function boardBundle(
  library                ,
  board                 ,
)                                                                   {
  const entries                                   = [];
  const missing           = [];
  const boardNode = library.findById(board.id);
  if (boardNode) entries.push({ path: boardNode.path, text: serialize(wrap(board)) });
  for (const entry of board.entries) {
    const node = library.findById(entry.id);
    if (!node?.randomizer) {
      missing.push(entry.name);
      continue;
    }
    entries.push({ path: node.path, text: serialize(wrap(node.randomizer)) });
  }
  return { entries, missing };
}

/**
 * Boards in the library that point at something no longer there.
 *
 * Used after importing an archive: someone who is handed a board and opens it
 * should be told a piece is missing then, not when the board draws a gap.
 */
function missingOnBoards(library                )                                        {
  return library
    .files()
    .map((f) => f.randomizer)
    .filter((r)                       => Boolean(r) && r .type === "board")
    .map((board) => ({
      name: board.name,
      missing: board.entries.filter((e) => !library.findById(e.id)).map((e) => e.name),
    }))
    .filter((b) => b.missing.length > 0);
}

async function exportBoardZip(board                 )                {
  const { entries, missing } = boardBundle(state.library, board);
  const packed = board.entries
    .map((e) => state.library.findById(e.id)?.randomizer)
    .filter((r)                  => Boolean(r));
  const zip = await createZip([...entries, ...(await pictureEntries(packed))]);
  downloadBytes(`${slugify(board.name)}.zip`, zip);
  const count = `${entries.length} file${entries.length === 1 ? "" : "s"}`;
  state.toast(
    missing.length
      ? `Exported ${count}. Missing from your library: ${missing.join(", ")}.`
      : `Exported ${count}: the board and everything on it.`,
  );
}

/** The whole tree as a ZIP: the backup that works in every browser. */
async function exportLibraryZip()                {
  const randomizers = state.library.files().map((f) => f.randomizer).filter((r)                  => Boolean(r));
  const entries = state.library
    .files()
    .filter((f) => f.randomizer)
    .map((f) => ({ path: f.path, text: serialize(wrap(f.randomizer )) }));
  const pictures = await pictureEntries(randomizers);
  const zip = await createZip([...entries, ...pictures]);
  downloadBytes("orangey-library.zip", zip);
  state.toast(
    `Exported ${entries.length} randomizer${entries.length === 1 ? "" : "s"}` +
      `${pictures.length ? ` and ${pictures.length} picture${pictures.length === 1 ? "" : "s"}` : ""}`,
  );
}

// ---- src/ui/views/board.ts ---------------------------------------
/**
 * A board: several randomizers on one screen.
 *
 * The case is a game master who rolls the same handful of things all evening —
 * an encounter table, the weather, a treasure wheel — and wants them in front
 * of them at once rather than swapping between library entries.
 *
 * A board points at randomizers by id rather than holding copies, so editing a
 * table updates every board it is on. The price is that a deleted randomizer
 * leaves a gap, which the board says plainly instead of quietly shrinking.
 */


                                                            





                                          




                                       

function createBoardView(node             , params                                        = {})       {
  const board = node.randomizer                   ;
  const grid = h("div", { class: "board-grid" });
  let cells             = [];

  /**
   * An outcome's `goesTo`, followed on a board.
   *
   * The same rules as the play screen (see chain.ts): the randomizer it points
   * at opens and waits, rolling a cell again replaces whatever its last answer
   * had opened, and a chain that would come back round stops and says so. On
   * a board the opened randomizer is a cell of its own, straight after the one
   * that sent you there, and is not saved: the board is still what it was.
   *
   * Per entry, `links` and `els` run in step; `els[0]` is the entry's own
   * holder and the rest are the cells its chain opened.
   */
  let chains = new Map                                                    ();
  /** Roll all answers every question afresh, so it follows no links. */
  let rollingAll = false;

  function landed(entryId        , el             , randomizer            , outcome         )       {
    const chain = chains.get(entryId);
    const at = chain ? chain.els.indexOf(el) : -1;
    // A cell whose chain was closed or rebuilt while it was in the air.
    if (!chain || at < 0) return;
    follow(entryId, at, rollingAll && at === 0 ? null : chainTarget(randomizer, outcome));
  }

  function follow(entryId        , from        , target                                )       {
    const chain = chains.get(entryId);
    if (!chain) return;
    const advance = advanceChain(chain.links, from, target, (id) => state.library.findById(id)?.randomizer ?? null);
