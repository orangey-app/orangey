/**
 * How the app feels when it rolls (plan C10, decision D22).
 *
 * Every animation timing in Orangey comes from here. Nothing else may hold a
 * duration: that is what makes the settings panel able to change all of them,
 * and it is checked by `npm run check`.
 *
 * A randomizer may carry an override for its own type's section (a wheel for
 * the wheel settings, dice for the dice settings), saved in its file; the
 * effective settings for a roll are the global ones with that merged on top.
 */

                                                                                                                                      

                                                                                                                                                                 

const DEFAULT_FEEL               = {
  motion: "full",
  wheel: { durationMs: 3200, turns: 6, curve: "standard", settleDegrees: 11 },
  dice: { style: "flat", tumbleMs: 900, bounces: 2, spread: 0.5 },
  coin: { flips: 5, durationMs: 1100, arc: 1.2 },
  haptics: false,
  // Out of the box he speaks up only for the moments that carry something:
  // an extreme, an outcome the game master tagged, a link that points nowhere,
  // an import that worked. Watching every roll and reacting to every ordinary
  // landing is available in Settings, off by default, because at the fortieth
  // roll of the evening it is noise. A rule is stored only when it is off, so
  // anyone who has already chosen keeps their choice.
  mascot: {
    presence: "triggers",
    wobble: 1.8,
    rules: { "roll-start": false, "roll-land": false, "roll-fail": false, "import-warn": false },
  },
};

/** The wobble control's three stops: none, soft, and the drawn maximum. */
const MASCOT_WOBBLE_STOPS = [0, 1, 1.8]         ;

/**
 * How long Orangey holds a reaction before fading back, by state. In "always"
 * presence he returns to idle; in "triggers" presence he fades out. A state
 * not listed here holds for the default.
 */
const MASCOT_HOLD_MS                         = {
  reveal: 1600,
  happy: 2600,
  oops: 2600,
  default: 2000,
};
/** A failed link is read slowly; give it a moment longer. */
const MASCOT_LINK_FAIL_HOLD_MS = 3200;
/**
 * Below this gap between "roll started" and "roll landed" the anticipation
 * pose would flash for a frame nobody sees, so it is skipped. Instant mode
 * lands immediately, which is the case this exists for.
 */
const MASCOT_ANTICIPATE_MIN_MS = 120;

const LIMITS = {
  wheelDuration: [400, 8000],
  turns: [1, 12],
  settleDegrees: [0, 30],
  tumble: [200, 3000],
  bounces: [0, 4],
  spread: [0, 1],
  coinFlips: [1, 12],
  coinDuration: [300, 3000],
  coinArc: [0, 2.5],
  mascotWobble: [0, 1.8],
}         ;

const clamp = (v         , [lo, hi]                           , fallback        )         => {
  const n = typeof v === "number" && Number.isFinite(v) ? v : fallback;
  return Math.min(hi, Math.max(lo, n));
};

const oneOf =                   (v         , allowed              , fallback   )    =>
  allowed.includes(v     ) ? (v     ) : fallback;

/** Older files and preferences stored the roll-back as a word. */
function settleFromLegacy(v         )          {
  if (v === "none") return 0;
  if (v === "slight") return 4;
  if (v === "bouncy") return 11;
  return v;
}

function normalizeWheel(raw         , base           )            {
  const w = (typeof raw === "object" && raw !== null ? raw : {})                           ;
  return {
    durationMs: clamp(w.durationMs, LIMITS.wheelDuration, base.durationMs),
    turns: Math.round(clamp(w.turns, LIMITS.turns, base.turns)),
    curve: oneOf(w.curve, ["gentle", "standard", "snappy"]         , base.curve),
    settleDegrees: clamp(w.settleDegrees ?? settleFromLegacy(w.settle), LIMITS.settleDegrees, base.settleDegrees),
  };
}

function normalizeDice(raw         , base          )           {
  const d = (typeof raw === "object" && raw !== null ? raw : {})                           ;
  return {
    style: oneOf(d.style, ["flat", "wireframe"]         , base.style),
    tumbleMs: clamp(d.tumbleMs, LIMITS.tumble, base.tumbleMs),
    bounces: Math.round(clamp(d.bounces, LIMITS.bounces, base.bounces)),
    spread: clamp(d.spread, LIMITS.spread, base.spread),
  };
}

function normalizeCoin(raw         , base          )           {
  const c = (typeof raw === "object" && raw !== null ? raw : {})                           ;
  return {
    flips: Math.round(clamp(c.flips, LIMITS.coinFlips, base.flips)),
    durationMs: clamp(c.durationMs, LIMITS.coinDuration, base.durationMs),
    arc: clamp(c.arc, LIMITS.coinArc, base.arc),
  };
}

function normalizeMascot(raw         , base            )             {
  const m = (typeof raw === "object" && raw !== null ? raw : {})                           ;
  // A rules object that is there is taken as it stands, empty included: that
  // is someone who has switched everything on. Only a missing one falls back
  // to what Orangey ships with.
  const rules                          = {};
  if (typeof m.rules === "object" && m.rules !== null) {
    for (const [id, on] of Object.entries(m.rules                           )) if (on === false) rules[id] = false;
  } else {
    Object.assign(rules, base.rules);
  }
  return {
    presence: oneOf(m.presence, ["hidden", "triggers", "always"]         , base.presence),
    wobble: clamp(m.wobble, LIMITS.mascotWobble, base.wobble),
    rules,
  };
}

/**
 * Load settings from storage. Everything is clamped, so a hand-edited or
 * corrupted preference cannot produce a forty-second spin that looks like the
 * app has hung.
 */
function normalizeFeel(raw         )               {
  const o = (typeof raw === "object" && raw !== null ? raw : {})                           ;
  return {
    motion: oneOf(o.motion, ["full", "quick", "instant"]         , DEFAULT_FEEL.motion),
    wheel: normalizeWheel(o.wheel, DEFAULT_FEEL.wheel),
    dice: normalizeDice(o.dice, DEFAULT_FEEL.dice),
    coin: normalizeCoin(o.coin, DEFAULT_FEEL.coin),
    haptics: o.haptics === true,
    mascot: normalizeMascot(o.mascot, DEFAULT_FEEL.mascot),
  };
}

/** How long a reaction holds, scaled like every other duration by the motion level. */
function mascotHoldMs(state        , feel              , event         )         {
  const base = event === "link:fail" ? MASCOT_LINK_FAIL_HOLD_MS : (MASCOT_HOLD_MS[state] ?? MASCOT_HOLD_MS.default);
  // instant mode still shows the reaction; it just does not animate it
  return base * (feel.motion === "quick" ? 0.4 : 1);
}

/** Is a reaction switched on? Absent means on. */
function mascotRuleOn(feel              , id        )          {
  return feel.mascot.rules[id] !== false;
}

/** A randomizer's override, cleaned: unknown keys dropped, values clamped. */
function normalizeOverride(raw         )                           {
  if (typeof raw !== "object" || raw === null) return undefined;
  const o = raw                           ;
  const out               = {};
  const keep =                   (section         , allowed             )                         => {
    if (typeof section !== "object" || section === null) return undefined;
    const src = section                           ;
    const part                          = {};
    for (const key of allowed) if (src[key          ] !== undefined) part[key          ] = src[key          ];
    return Object.keys(part).length ? (part              ) : undefined;
  };
  const wheel = keep           (o.wheel, ["durationMs", "turns", "curve", "settleDegrees"]);
  const dice = keep          (o.dice, ["style", "tumbleMs", "bounces", "spread"]);
  const coin = keep          (o.coin, ["flips", "durationMs", "arc"]);
  if (wheel) out.wheel = pickKeys(normalizeWheel({ ...DEFAULT_FEEL.wheel, ...wheel }, DEFAULT_FEEL.wheel), Object.keys(wheel));
  if (dice) out.dice = pickKeys(normalizeDice({ ...DEFAULT_FEEL.dice, ...dice }, DEFAULT_FEEL.dice), Object.keys(dice));
  if (coin) out.coin = pickKeys(normalizeCoin({ ...DEFAULT_FEEL.coin, ...coin }, DEFAULT_FEEL.coin), Object.keys(coin));
  return Object.keys(out).length ? out : undefined;
}

function pickKeys                  (obj   , keys          )             {
  const out                          = {};
  for (const k of keys) out[k] = (obj                           )[k];
  return out              ;
}

/** The settings a particular roll should use: global, with the override on top. */
function effectiveFeel(global              , override               , animationsOff = false)               {
  const merged               = {
    ...global,
    wheel: { ...global.wheel, ...(override?.wheel ?? {}) },
    dice: { ...global.dice, ...(override?.dice ?? {}) },
    coin: { ...global.coin, ...(override?.coin ?? {}) },
  };
  if (animationsOff) merged.motion = "instant";
  return normalizeFeel(merged);
}

/** Quick mode is the same animation at 0.4x; instant skips it entirely. */
function motionScale(motion             )         {
  return motion === "instant" ? 0 : motion === "quick" ? 0.4 : 1;
}

function wheelDuration(feel              )         {
  return feel.wheel.durationMs * motionScale(feel.motion);
}
function diceDuration(feel              )         {
  return feel.dice.tumbleMs * motionScale(feel.motion);
}
function coinDuration(feel              )         {
  return feel.coin.durationMs * motionScale(feel.motion);
}

/**
 * Ease-out exponent for each curve; higher means a sharper wind-down.
 *
 * Snappy was 5, which wound down so hard that a six-turn spin had 3° of 2340°
 * left by 70 % of its duration: the last third was a wheel standing still.
 */
function curveExponent(curve           )         {
  return curve === "gentle" ? 2 : curve === "snappy" ? 4 : 3;
}

/**
 * How many wireframe dice are worth animating at once. Above this the tray
 * falls back to flat dice: forty spinning solids is a lot of work for a phone,
 * and forty tiny wireframes are unreadable anyway.
 */
const WIREFRAME_DICE_LIMIT = 20;

/** The roll-back to use for one particular spin: a random share of the maximum. */
function settleForSpin(feel              , random               = Math.random)         {
  const max = feel.wheel.settleDegrees;
  if (max <= 0) return 0;
  return max * (0.5 + random() * 0.5);
}

/** 0 for no roll-back, otherwise how long a landing bounce lasts, in milliseconds. */
function bounceMs(feel              )         {
  const degrees = feel.wheel.settleDegrees;
  if (degrees <= 0) return 0;
  // 4° is a light hop, 11° the default, 30° a real bounce.
  const base = 220 + Math.min(1, degrees / 20) * 260;
  return base * motionScale(feel.motion);
}

/** The fraction of a spin that a roll-back of `degrees` represents. */
function overshootFraction(degrees        , deltaDegrees        )         {
  if (degrees <= 0 || deltaDegrees <= 0) return 0;
  return degrees / deltaDegrees;
}

/* ---- the spin curve -------------------------------------------------------
 * A wheel at rest has to be got moving, so the curve eases in as well as out.
 * The speed profile is a short sine ramp up followed by a power-law wind-down
 * whose exponent is the "curve" setting; integrating it gives the position,
 * normalised so the spin ends exactly on target. Both ends have zero speed.
 *
 * A roll-back is part of that profile, not something added after it. The
 * profile takes a single dip below zero near the end, so the wheel decelerates,
 * carries past where it is going to stop, turns once, and eases back. The dip's
 * size is solved for, so the wheel passes the target by exactly the roll-back
 * the settings ask for, whichever curve is in use.
 *
 * It used to be added on top of a finished curve, from a fixed three-quarters
 * of the way through. That addition starts moving at a speed of its own, so it
 * always stepped the wheel's speed up by about the same amount: invisible under
 * gentle, which is still turning at 7.3°/frame there, and a lurch under snappy,
 * which is down to 0.4°/frame with almost nothing left to travel.
 */
const RAMP_IN = 0.15;
const SAMPLES = 256;
/** The turn begins where the plain curve still has this many roll-backs to travel. */
const TURN_AT_ROLLBACKS = 4;
/**
  * The dip is the wind-down itself, scaled: speed = forward × (1 − depth × g),
  * with g rising smoothly from 0 to 1 over the turn. Above depth 1 the speed
  * crosses zero exactly once and stays below it, whatever the curve — a dip of
  * its own shape can be outrun by a slow wind-down's tail, which put a second
  * turn at the end of every gentle spin.
  */
const MAX_TURN_DEPTH = 64;
/** However large the roll-back, the wheel spends at least this much of the spin going forwards. */
const TURN_LIMITS                            = [0.5, 0.92];

const plainProfiles = new Map                         ();
/** Profiles with a roll-back are per spin, since the roll-back is drawn per spin. */
const settleProfiles = new Map                      ();
const SETTLE_CACHE_LIMIT = 32;

/** The wind-down, sampled as speeds; the area under it is the whole journey. */
function spinSpeeds(curve           )               {
  const n = curveExponent(curve);
  const speeds = new Float64Array(SAMPLES);
  for (let i = 0; i < SAMPLES; i++) {
    const t = (i + 0.5) / SAMPLES;
    const rampIn = t < RAMP_IN ? Math.sin((Math.PI * t) / (2 * RAMP_IN)) ** 2 : 1;
    speeds[i] = rampIn * (1 - t) ** (n - 1);
  }
  return speeds;
}

/** Speeds -> positions, normalised so the spin ends exactly on target. */
function spinTable(speeds              )                      {
  const table = new Float64Array(SAMPLES + 1);
  let acc = 0;
  for (let i = 0; i < SAMPLES; i++) {
    acc += speeds[i];
    table[i + 1] = acc;
  }
  // A dip deep enough to undo the whole journey would leave nothing to
  // normalise by; the caller falls back to a spin without one.
  if (!(acc > 0)) return null;
  for (let i = 0; i <= SAMPLES; i++) table[i] /= acc;
  return table;
}

function plainProfile(curve           )               {
  const cached = plainProfiles.get(curve);
  if (cached) return cached;
  // The plain wind-down is positive throughout, so this cannot fail.
  const table = spinTable(spinSpeeds(curve))                ;
  plainProfiles.set(curve, table);
  return table;
}

const sampleAt = (table              , t        )         => {
  const x = t * SAMPLES;
  const i = Math.floor(x);
  return table[i] + (table[Math.min(SAMPLES, i + 1)] - table[i]) * (x - i);
};

/** How far into the spin the wheel starts giving distance back. */
function turnStart(curve           , overshoot        )         {
  const table = plainProfile(curve);
  const want = 1 - TURN_AT_ROLLBACKS * overshoot;
  let t = TURN_LIMITS[1];
  for (let i = 0; i <= SAMPLES; i++) {
    if (table[i] >= want) {
      t = i / SAMPLES;
      break;
    }
  }
  return Math.min(TURN_LIMITS[1], Math.max(TURN_LIMITS[0], t));
}

/**
 * A profile whose highest point is exactly `overshoot` past the target.
 *
 * The dip's depth is found by bisection. Deeper always means further past the
 * target — the journey is normalised by a total the dip is subtracted from —
 * so the search cannot land on a different solution, which is what ruled out
 * fitting a damped spring to the tail instead.
 */
function settleProfile(curve           , overshoot        )               {
  const key = `${curve}:${overshoot.toFixed(6)}`;
  const cached = settleProfiles.get(key);
  if (cached) return cached;

  const forward = spinSpeeds(curve);
  const start = turnStart(curve, overshoot);
  const dip = new Float64Array(SAMPLES);
  for (let i = 0; i < SAMPLES; i++) {
    const t = (i + 0.5) / SAMPLES;
    const u = (t - start) / (1 - start);
    dip[i] = u <= 0 ? 0 : forward[i] * Math.sin((Math.PI * u) / 2) ** 2;
  }

  const combined = new Float64Array(SAMPLES);
  const peakFor = (depth        )                      => {
    for (let i = 0; i < SAMPLES; i++) combined[i] = forward[i] - depth * dip[i];
    return spinTable(combined);
  };
  const highest = (table              )         => {
    let top = 0;
    for (let i = 0; i <= SAMPLES; i++) if (table[i] > top) top = table[i];
    return top - 1;
  };

  let lo = 0;
  let hi = MAX_TURN_DEPTH;
  let best = plainProfile(curve);
  for (let i = 0; i < 40; i++) {
    const mid = (lo + hi) / 2;
    const table = peakFor(mid);
    if (table === null || highest(table) > overshoot) hi = mid;
    else {
      lo = mid;
      best = table;
    }
  }
  const settled = Float64Array.from(best);
  if (settleProfiles.size >= SETTLE_CACHE_LIMIT) settleProfiles.clear();
  settleProfiles.set(key, settled);
  return settled;
}

/** Position 0..1 along the spin at progress t, with no roll-back. */
function spinPosition(t        , curve           )         {
  if (t <= 0) return 0;
  if (t >= 1) return 1;
  return sampleAt(plainProfile(curve), t);
}

/**
 * Progress 0..1 -> eased 0..1.
 *
 * With a roll-back the wheel passes the target by `overshoot` (as a fraction of
 * the whole spin), turns once, and comes back to it. It still finishes exactly
 * on target: the result was decided before any of this started and cannot be
 * changed by how the wheel arrives.
 */
function easeSpin(t        , feel              , overshoot = feel.wheel.settleDegrees / 360)         {
  if (t <= 0) return 0;
  if (t >= 1) return 1;
  if (!(overshoot > 0)) return spinPosition(t, feel.wheel.curve);
  return sampleAt(settleProfile(feel.wheel.curve, overshoot), t);
}

function prefersReducedMotion()          {
  return typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
}

function vibrate(feel              , pattern                   )       {
  if (!feel.haptics) return;
  const nav = navigator                                                               ;
  try {
    nav.vibrate?.(pattern);
  } catch {
    /* not supported; nothing to do */
  }
}

/**
 * The `.orangey-settings.json` file: the settings worth carrying to another
 * device, and nothing that belongs to this browser alone.
 *
 * In: colour scheme, every Feel setting (the wheel, dice, coin, Orangey and
 * his rules), the seed, and the colours you added to the palette.
 * Out: which folder the library is in, which folders are open, favourites,
 * the storage backend, and the "starters were added" flag — those describe
 * this device, and loading them elsewhere would only confuse it.
 *
 * Same conventions as the randomizer files: two-space indent, LF, a fixed
 * key order, unknown keys refused rather than guessed at (settings are small
 * and a typo should be told, not silently dropped).
 */





const SETTINGS_FORMAT = "orangey-settings";
const SETTINGS_VERSION = 1;
const SETTINGS_FILE_NAME = "orangey-settings.json";

/** A colour the user added to the palette. */
                               
               
              
 

const MAX_CUSTOM_COLOURS = 64;
const MAX_COLOUR_NAME = 40;

                                   
                 
                     
                      
                                   
                          
 

                               
                                 
                  
                             
 

const KEY_ORDER                             = ["scheme", "feel", "seed", "reducedMotionOverridden", "colours"];

const SCHEMES = ["system", "orangey", "night", "meadow", "ocean", "berry"]         ;

/** Pick the portable part out of whatever preferences object the app holds. */
function portableSettings(prefs   
                  
                     
                       
                                    
                           
 )                   {
  return {
    scheme: prefs.scheme ?? "system",
    feel: normalizeFeel(prefs.feel),
    seed: prefs.seed ?? null,
    reducedMotionOverridden: prefs.reducedMotionOverridden ?? false,
    colours: normalizeColours(prefs.colours),
  };
}

function serializeSettings(settings                  )         {
  const ordered                          = {};
  for (const k of KEY_ORDER) ordered[k] = settings[k];
  const file               = { format: SETTINGS_FORMAT, version: SETTINGS_VERSION, settings: ordered                                };
  return `${JSON.stringify(file, null, 2)}\n`;
}

/**
 * Parse a settings file. Throws a ValidationError naming every problem. A
 * newer version is refused rather than guessed at — settings are cheap to
 * re-make, and a wrong guess about a timing would be felt on every roll.
 */
function parseSettings(text        )                   {
  let doc         ;
  try {
    doc = JSON.parse(text);
  } catch {
    throw new ValidationError([{ path: "file", message: "not JSON" }]);
  }
  const check = new Check();
  if (!check.object("file", doc)) throw new ValidationError(check.issues);
  const o = doc                           ;
  if (o.format !== SETTINGS_FORMAT) check.fail("file.format", `expected "${SETTINGS_FORMAT}"`);
  if (typeof o.version !== "number") check.fail("file.version", "expected a number");
  else if (o.version > SETTINGS_VERSION) check.fail("file.version", `made by a newer Orangey (version ${o.version}); this one reads up to ${SETTINGS_VERSION}`);
  if (!check.object("file.settings", o.settings)) throw new ValidationError(check.issues);
  const s = o.settings                           ;

  if (s.scheme !== undefined) check.oneOf("settings.scheme", s.scheme, SCHEMES);
  if (s.seed !== undefined && s.seed !== null) check.string("settings.seed", s.seed, { max: 200 });
  if (s.reducedMotionOverridden !== undefined) check.boolean("settings.reducedMotionOverridden", s.reducedMotionOverridden);
  if (s.feel !== undefined && !check.object("settings.feel", s.feel)) { /* reported */ }
  if (s.colours !== undefined && check.array("settings.colours", s.colours)) {
    const cs = s.colours             ;
    if (cs.length > MAX_CUSTOM_COLOURS) check.fail("settings.colours", `at most ${MAX_CUSTOM_COLOURS} colours`);
    cs.forEach((c, i) => {
      const p = `settings.colours[${i}]`;
      if (!check.object(p, c)) return;
      const cc = c                           ;
      check.string(`${p}.name`, cc.name, { min: 1, max: MAX_COLOUR_NAME });
      if (!isHex(cc.hex)) check.fail(`${p}.hex`, "expected a colour like #a33a30");
    });
  }
  for (const k of Object.keys(s)) if (!(KEY_ORDER            ).includes(k)) check.fail(`settings.${k}`, "not a setting Orangey knows");
  if (!check.ok) throw new ValidationError(check.issues);

  return {
    scheme: (s.scheme                      ) ?? "system",
    // normalizeFeel clamps every timing into its limits, exactly as on load
    feel: normalizeFeel(s.feel),
    seed: (s.seed                             ) ?? null,
    reducedMotionOverridden: (s.reducedMotionOverridden                       ) ?? false,
    colours: normalizeColours(s.colours                              ),
  };
}

/** Keep only well-formed colours, lower-case hex, no duplicates, capped. */
function normalizeColours(raw         )                 {
  if (!Array.isArray(raw)) return [];
  const out                 = [];
  const seen = new Set        ();
  for (const c of raw) {
    if (typeof c !== "object" || c === null) continue;
    const { name, hex } = c                           ;
    if (typeof name !== "string" || !name.trim() || !isHex(hex)) continue;
    const h = (hex.startsWith("#") ? hex : `#${hex}`).toLowerCase();
    if (seen.has(h)) continue;
    seen.add(h);
    out.push({ name: name.trim().slice(0, MAX_COLOUR_NAME), hex: h });
    if (out.length >= MAX_CUSTOM_COLOURS) break;
  }
  return out;
}

/**
 * What the app tells the mascot.
 *
 * Randomizers emit facts; they never name an animation. The reactions table
 * (reactions.ts) turns a fact into a state, and the host plays it. Keeping
 * this vocabulary small and generic is what lets a new randomizer type join
 * without the mascot knowing it exists: it produces an Outcome, the Outcome is
 * summarised, and everything downstream already works.
 */

                                          
                                                                             

                                           

                              
                           
     
                                                                           
                                                                               
                                                                              
                            
     
                   
     
                                                                             
                                                                           
                                                 
     
                               
                                              
               
 

                         
                                                      
                                                                           
                                                                     
                                     
                                                          

                                                  

function summarize(outcome         )              {
  const extreme          = outcome.isMaximum ? "max" : outcome.isMinimum ? "min" : null;
  return { kind: outcome.kind, extreme, mood: outcome.reaction ?? null, text: outcome.text };
}

/** A tiny bus: one EventTarget, one event name, the payload in `detail`. */
const MASCOT_EVENT = "orangey:mascot";

function emitMascotEvent(target             , event             )       {
  target.dispatchEvent(new CustomEvent(MASCOT_EVENT, { detail: event }));
}

function onMascotEvent(target             , handler                              )             {
  const listener = (e       ) => handler((e                            ).detail);
  target.addEventListener(MASCOT_EVENT, listener);
  return () => target.removeEventListener(MASCOT_EVENT, listener);
}

// ---- src\ui\state.ts ---------------------------------------------
/**
 * Application state: preferences, the open library, history, and the toast
 * queue. Views subscribe to changes; nothing here touches the DOM.
 */








                                                         




                                         


/**
 * A history entry as the app holds it. Striking a roll does not remove it —
 * the roll happened, and a line through it says so — so the flag rides along
 * in the record IndexedDB already keeps. An entry written before this existed
 * arrives without the field, which reads as not struck.
 */
                                                  
                   
 

/**
 * The randomizer a row came from. A dice roll carries its expression rather
 * than an id in `repeat`, so for those the id on the entry is what says which
 * randomizer rolled it.
 */
function rollOwnerId(row            )                {
  return row.repeat?.kind === "randomizer" ? row.repeat.id : row.randomizerId;
}

/** The rows belonging to these randomizers; no ids at all means all of them. */
function rollsInScope(rows              , ids          )               {
  if (ids.length === 0) return rows;
  const wanted = new Set(ids);
  return rows.filter((row) => {
    const owner = rollOwnerId(row);
    return owner !== null && wanted.has(owner);
  });
}

/**
 * What changed. A view says which of these it cares about, so typing in the
 * editor no longer redraws the history panel and a toast no longer redraws
 * the library tree.
 *
 * A subscriber that names no topics hears everything, which keeps any caller
 * that was missed correct rather than silently stale.
 */
                                                                                

                        
             
               
                       
                      
                                        
 

const DEFAULT_PREFS        = {
  theme: "system",
  feel: DEFAULT_FEEL,
  seed: null,
  lastPath: null,
  expandedFolders: [],
  favourites: [],
  backend: "opfs",
  reducedMotionOverridden: false,
  seeded: false,
  animationsOff: false,
  scheme: "orangey",
  colours: [],
};

class AppState {
  prefs        = { ...DEFAULT_PREFS };
  library = new LibraryService(new MemoryBackend());
  history               = [];
  lastOutcome                                                      = null;
  toasts          = [];
  ready = false;
  /** A folder was chosen before, but the browser wants a click to reopen it. */
  folderNeedsPermission = false;
  /**
   * Facts for the mascot (and anything else that wants them). Views emit;
   * the mascot host listens. Nothing on this bus ever writes app state.
   */
           events = new EventTarget();

  #listeners = new Set                                                    ();
  /** The save-failure toast currently on screen, if there is one. */
  #saveErrorToast                = null;
  /** Undoes the previous library's change subscription when one is swapped in. */
  #unwatchLibrary                      = null;

  /**
   * Take a library and listen to it.
   *
   * Every place that swaps the backend goes through here, so a failed write
   * always has somebody to tell, the image store follows the library, and a
   * change to the tree reaches the views that draw it.
   */
  setLibrary(library                )       {
    this.#unwatchLibrary?.();
    this.library = library;
    useImageStore(library.backend);
    this.#unwatchLibrary = library.onChange(() => this.emit("library"));
    library.onError(() => {
      // One toast, not one per keystroke: while the last one is still on
      // screen a further failure has nothing new to say.
      if (this.#saveErrorToast && this.toasts.some((t) => t.id === this.#saveErrorToast)) return;
      this.#saveErrorToast = this.toast("Could not save your changes", "Retry", () => {
        void this.library.flush().catch(() => {});
      });
    });
  }

  subscribe(fn            , topics               )             {
    const entry = { fn, topics: topics ? new Set(topics) : null };
    this.#listeners.add(entry);
    return () => this.#listeners.delete(entry);
  }

  /** Tell the subscribers who asked for any of these. No topics tells everyone. */
  emit(...topics              )       {
    for (const { fn, topics: wanted } of this.#listeners) {
      if (!wanted || topics.length === 0 || topics.some((t) => wanted.has(t))) fn();
    }
  }

  async load()                {
    const stored = await appdb.get                ("prefs");
    this.prefs = { ...DEFAULT_PREFS, ...stored, feel: normalizeFeel(stored?.feel), colours: normalizeColours(stored?.colours) };

    // Respect the system setting on first run, but let an explicit choice win
    // from then on (plan C10).
    if (!this.prefs.reducedMotionOverridden && prefersReducedMotion()) {
      this.prefs.feel = { ...this.prefs.feel, motion: "instant" };
    }

    // Storage, in order of preference: the folder the user chose last time
    // (if the browser still allows it without asking), the origin-private
    // filesystem, IndexedDB — which a page opened from disk does get — and
    // only then memory, which the UI flags loudly because nothing survives.
    let backend                        = null;
    const remembered = await reopenFolder();
    if (remembered && remembered !== "ask") backend = remembered;
    this.folderNeedsPermission = remembered === "ask";
    backend ??= await openOpfs();
    backend ??= await IndexedDbBackend.open();
    backend ??= new MemoryBackend();
    this.setLibrary(new LibraryService(backend));
    await this.library.refresh();

    // First run: a few real randomizers, so the app is not an empty page.
    // Only ever once per browser, and only into an empty library.
    // ?noseed lets the test suite start from a genuinely empty library.
    const noSeed = new URLSearchParams(location.search).has("noseed");
    if (!noSeed && !this.prefs.seeded && backend.kind !== "memory" && this.library.files().length === 0) {
      for (const starter of starters()) {
        if (starter.folder) await backend.mkdir(starter.folder);
        await this.library.create(starter.folder, starter.randomizer);
      }
      this.prefs.seeded = true;
      await appdb.set("prefs", this.prefs);
    }
    this.history = await appdb.history(HISTORY_IN_MEMORY);
    this.ready = true;

    // The editor no longer writes on every keystroke, so something has to
    // catch the last one when the page goes away. `pagehide` covers closing
    // and navigating; `visibilitychange` covers a phone being locked or the
    // tab being switched, which on mobile is often the only one that fires.
    const flushNow = () => void this.library.flush().catch(() => {});
    addEventListener("pagehide", flushNow);
    addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") flushNow();
    });

    this.applyTheme();
    this.emit();
  }

  applyTheme()       {
    const root = document.documentElement;
    root.removeAttribute("data-theme");
    if (!this.prefs.scheme || this.prefs.scheme === "system") root.removeAttribute("data-scheme");
    else root.setAttribute("data-scheme", this.prefs.scheme);
  }

  async savePrefs(patch                )                {
    this.prefs = { ...this.prefs, ...patch };
    this.applyTheme();
    this.emit("prefs");
    await appdb.set("prefs", this.prefs);
  }

  setFeel(patch                       )       {
    void this.savePrefs({ feel: normalizeFeel({ ...this.prefs.feel, ...patch }) });
  }

  /** Add a colour to the palette; a hex already there just gets the new name. */
  addColour(colour              )       {
    const next = normalizeColours([...this.prefs.colours.filter((c) => c.hex !== colour.hex.toLowerCase()), colour]);
    void this.savePrefs({ colours: next });
  }

  removeColour(hex        )       {
    void this.savePrefs({ colours: this.prefs.colours.filter((c) => c.hex !== hex.toLowerCase()) });
  }

  /** The settings worth carrying to another device, as a file's text. */
  exportSettings()         {
    return serializeSettings(portableSettings(this.prefs));
  }

  /** Apply a settings file. Throws a ValidationError; nothing changes on failure. */
  async importSettings(text        )                {
    const s = parseSettings(text);
    this.resetSeedSequence();
    await this.savePrefs({ scheme: s.scheme, feel: s.feel, seed: s.seed, reducedMotionOverridden: s.reducedMotionOverridden, colours: s.colours });
  }

  /** The source the next roll should use: seeded when a seed is set. */
  source()               {
    return this.prefs.seed ? new SeededSource(this.#nextSeedStep()) : new CryptoSource();
  }

  /**
   * A seeded session must not repeat the same number forever, so the seed is
   * advanced per roll: seed "847193" gives 847193#1, #2, ... The user shares
   * the base seed and everyone sees the same sequence.
   */
  #seedStep = 0;
  #nextSeedStep()         {
    this.#seedStep += 1;
    return `${this.prefs.seed}#${this.#seedStep}`;
  }

  resetSeedSequence()       {
    this.#seedStep = 0;
  }

  get seedPosition()         {
    return this.#seedStep;
  }

  tell(event             )       {
    emitMascotEvent(this.events, event);
  }

  async record(randomizer            , outcome         )                {
    this.lastOutcome = { outcome, randomizer };
    const entry             = {
      id: newId(),
      at: Date.now(),
      randomizerId: randomizer.id,
      randomizerName: randomizer.name,
      type: randomizer.type,
      resultText: outcome.detail && outcome.kind === "dice" ? outcome.detail : outcome.text,
      speakText: outcome.speak,
      seed: this.prefs.seed ? `${this.prefs.seed}#${this.#seedStep}` : undefined,
      repeat:
        randomizer.type === "dice"
          ? { kind: "dice", expression: randomizer.expression }
          : { kind: "randomizer", id: randomizer.id },
    };
    this.history = [entry, ...this.history].slice(0, HISTORY_IN_MEMORY);
    this.emit("history", "outcome");
    await appdb.addHistory(entry);
  }

  async removeHistory(id        )                {
    this.history = this.history.filter((h) => h.id !== id);
    this.emit("history");
    await appdb.removeHistory(id);
  }

  async clearHistory()                {
    this.history = [];
    this.emit("history");
    await appdb.clearHistory();
  }

  /**
   * Clear the rolls of particular randomizers — what a Recent rolls panel has
   * in front of the user — and nothing else. No ids means the whole history.
   *
   * Memory holds the most recent rolls only, so the store is walked as well:
   * an older roll of the same randomizer is part of what was asked for.
   */
  async clearHistoryFor(ids          )                {
    if (ids.length === 0) {
      await this.clearHistory();
      return;
    }
    const doomed = new Set(rollsInScope(this.history, ids).map((row) => row.id));
    this.history = this.history.filter((row) => !doomed.has(row.id));
    this.emit("history");
    const stored = await appdb.history(HISTORY_CAP);
    await appdb.removeHistoryMany(rollsInScope(stored, ids).map((row) => row.id));
  }

  /**
   * Strike a roll through, or take the line off again. The entry goes back to
   * the store whole, because the store keeps records rather than fields.
   */
  async setStruck(id        , struck         )                {
    const row = this.history.find((entry) => entry.id === id);
    if (!row || row.struck === struck) return;
    const next             = { ...row, struck };
    this.history = this.history.map((entry) => (entry.id === id ? next : entry));
    this.emit("history");
    await appdb.addHistory(next);
  }

  toast(text        , actionLabel         , action             , ms = 10000)         {
    const toast        = { id: newId(), text, actionLabel, action };
    toast.timer = setTimeout(() => this.dismissToast(toast.id), ms);
    this.toasts = [...this.toasts, toast].slice(-3);
    this.emit("toasts");
    return toast.id;
  }

  dismissToast(id        )       {
    const toast = this.toasts.find((t) => t.id === id);
    if (toast?.timer) clearTimeout(toast.timer);
    this.toasts = this.toasts.filter((t) => t.id !== id);
    this.emit("toasts");
  }

  /** Run the most recent toast's action; wired to Ctrl/Cmd+Z. */
  undoLast()          {
    const toast = this.toasts[this.toasts.length - 1];
    if (!toast?.action) return false;
    toast.action();
    this.dismissToast(toast.id);
    return true;
  }

  toggleFavourite(id        )       {
    const favourites = this.prefs.favourites.includes(id)
      ? this.prefs.favourites.filter((f) => f !== id)
      : [...this.prefs.favourites, id];
    void this.savePrefs({ favourites });
  }
}

// ---- src\ui\router.ts --------------------------------------------
/**
 * Hash routing.
 *
 * Hashes rather than paths so that the single-file build works when opened
 * straight from disk, where there is no server to rewrite URLs. Everything
 * after the hash also stays on the device: browsers never send a fragment to
 * the server, so a link that carries settings — or, later, a whole wheel —
 * tells the host nothing.
 */

                   
                                        
                                                            
                                                    
                                                                                 
                                                           
                                                      
                                           
                                          
                                           
                                             

                             
                                                               
                
                                                        
                   
 

const NO_PARAMS             = { roll: false, present: false };

function readParams(query        )             {
  const search = new URLSearchParams(query);
  const on = (key        ) => {
    if (!search.has(key)) return false;
    const value = (search.get(key) ?? "").toLowerCase();
    return value !== "0" && value !== "false" && value !== "no";
  };
  return { roll: on("roll"), present: on("present") };
}

/**
 * `decodeURIComponent` throws on a malformed escape ("%", "%zz"), and a throw
 * from the router leaves the app with nothing rendered at all. A bad address
 * is a bad address: treat it as one rather than as a fatal error.
 */
function decodeArg(raw        )                {
  try {
    return decodeURIComponent(raw);
  } catch (e) {
    if (e instanceof URIError) return null;
    throw e;
  }
}

function parseRoute(hash        )        {
  const clean = hash.replace(/^#\/?/, "");
  const queryAt = clean.indexOf("?");
  const withoutQuery = queryAt < 0 ? clean : clean.slice(0, queryAt);
  const query = queryAt < 0 ? "" : clean.slice(queryAt + 1);
  const params = queryAt < 0 ? NO_PARAMS : readParams(query);

  const [head, ...rest] = withoutQuery.split("/");
  const arg = decodeArg(rest.join("/"));
  switch (head) {
    case "roll": {
      // The payload is base64url, which URLSearchParams leaves alone, but a
      // deck program may have escaped it on the way in.
      const w = new URLSearchParams(query).get("w") ?? "";
      return w ? { name: "linked", payload: w, params } : { name: "play", params };
    }
    case "r":
      return arg ? { name: "randomizer", path: arg, params } : { name: "play", params };
    case "id":
      return arg ? { name: "byId", id: arg, params } : { name: "play", params };
    case "edit":
      return arg ? { name: "edit", path: arg, params } : { name: "library", params };
    case "library":
      return { name: "library", params };
    case "import":
      return { name: "import", params };
    case "history":
      return { name: "history", params };
    case "settings":
      return { name: "settings", params };
    default:
      return { name: "play", params };
  }
}

/**
 * Where Back goes: an editor returns to the randomizer it edits; anywhere
 * else returns to the one last played, if it is still in the library, and
 * otherwise to the plain play screen. A route, not browser history, so it
 * never bounces between two settings pages or out of the app.
 */
function backTarget(route       , lastPath               , exists                           )         {
  if (route.name === "edit") return `#/r/${encodeURIComponent(route.path)}`;
  if (lastPath && exists(lastPath)) return `#/r/${encodeURIComponent(lastPath)}`;
  return "#/";
}

                                   
                 
                    
 

/**
 * A link to paste onto a slide.
 *
 * It addresses the randomizer by its id rather than by its path, because a
 * link on a slide outlives any tidying up of the library: renaming a wheel or
 * moving it to another folder changes its file name, and would otherwise
 * quietly break every deck that pointed at it.
 */
function slideLink(base        , id        , options                   = {})         {
  const query           = [];
  if (options.roll) query.push("roll=1");
  if (options.present) query.push("present=1");
  const suffix = query.length ? `?${query.join("&")}` : "";
  return `${stripHash(base)}#/id/${encodeURIComponent(id)}${suffix}`;
}

/**
 * A link with the wheel inside it. Longer than a library link and frozen at
 * today's version, but it works for anyone, anywhere — see model/link.ts.
 */
function wheelLink(base        , payload        , options                   = {})         {
  const query = [`w=${payload}`];
  if (options.roll) query.push("roll=1");
  if (options.present) query.push("present=1");
  return `${stripHash(base)}#/roll?${query.join("&")}`;
}

function stripHash(url        )         {
  const at = url.indexOf("#");
  return at < 0 ? url : url.slice(0, at);
}

/** Where this copy of Orangey is being served from. */
function appBase()         {
  return stripHash(`${location.origin}${location.pathname}${location.search}`);
}

/**
 * A link from a slide has to be an https one: browsers refuse to follow a
 * link from a web page to a local file, so a deck cannot open a downloaded
 * copy of Orangey. The dialog says so rather than handing over a link that
 * will silently do nothing.
 */
function isLinkableBase(base        )          {
  return /^https?:\/\//i.test(base);
}

function navigate(hash        , replace = false)       {
  if (replace) history.replaceState(null, "", hash);
  else location.hash = hash;
  if (replace) window.dispatchEvent(new HashChangeEvent("hashchange"));
}

function currentRoute()        {
  return parseRoute(location.hash);
}

// ---- src\core\dice\grammar.ts ------------------------------------
/**
 * Dice notation, 0.1 subset (docs/DICE.md is the normative description).
 *
 *   expr     := term (("+" | "-") term)*
 *   term     := dice | integer
 *   dice     := [count] "d" sides [keepdrop]
 *   count    := integer 1..100        (default 1)
 *   sides    := integer 2..1000 | "%" (= 100)
 *   keepdrop := ("kh" | "kl" | "dh" | "dl") integer
 *
 * Whitespace is ignored, case is ignored. Anything else is a ParseError that
 * points at the offending character, because "invalid expression" with no
 * position is useless when you are typing at a table.
 */

const MAX_COUNT = 100;
const MAX_SIDES = 1000;

                                                 

                           
               
                
                
                                       
 
                            
                
                
 
                                        

                       
               
             
 
                             
                
                                                                       
                     
 

class ParseError extends Error {
           position        ;
           input        ;
  constructor(message        , position        , input        ) {
    super(message);
    this.name = "ParseError";
    this.position = position;
    this.input = input;
  }
  /** A caret line for display under a monospace input. */
  caret()         {
    return `${this.input}\n${" ".repeat(Math.max(0, this.position))}^`;
  }
}

class Cursor {
  i = 0;
  src        ;
  constructor(src        ) {
    this.src = src;
  }
  get done()          {
    this.ws();
    return this.i >= this.src.length;
  }
  ws()       {
    while (this.i < this.src.length && /\s/.test(this.src[this.i])) this.i++;
  }
  peek()         {
    this.ws();
    return this.src[this.i] ?? "";
  }
  take()         {
    this.ws();
    return this.src[this.i++] ?? "";
  }
  fail(msg        , at = this.i)        {
    throw new ParseError(msg, at, this.src);
  }
  integer(what        )         {
    this.ws();
    const start = this.i;
    while (this.i < this.src.length && /[0-9]/.test(this.src[this.i])) this.i++;
    if (this.i === start) this.fail(`expected ${what}`, start);
    return Number.parseInt(this.src.slice(start, this.i), 10);
  }
}

function parseDiceOrConst(c        )       {
  c.ws();
  const start = c.i;
  let count                = null;
  if (/[0-9]/.test(c.peek())) count = c.integer("a number");

  if (c.peek().toLowerCase() !== "d") {
    if (count === null) c.fail("expected a number or a die such as d20", start);
    return { kind: "const", value: count };
  }
  c.take(); // 'd'

  let sides        ;
  if (c.peek() === "%") {
    c.take();
    sides = 100;
  } else {
    sides = c.integer("the number of sides, e.g. d20");
  }

  const n = count ?? 1;
  if (n < 1 || n > MAX_COUNT) c.fail(`a roll may use 1 to ${MAX_COUNT} dice, not ${n}`, start);
  if (sides < 2 || sides > MAX_SIDES) {
    c.fail(`dice have 2 to ${MAX_SIDES} sides, not ${sides}`, start);
  }

  const node           = { kind: "dice", count: n, sides };

  // "4d6 kh3" is how people write it, and DICE.md promises it works.
  c.ws();
  const two = c.src.slice(c.i, c.i + 2).toLowerCase();
  if (two === "kh" || two === "kl" || two === "dh" || two === "dl") {
    const at = c.i;
    c.i += 2;
    const k = c.integer(`how many dice to ${two[0] === "k" ? "keep" : "drop"}`);
    if (k < 1) c.fail("that count must be at least 1", at);
    if (two[0] === "k" && k > n) c.fail(`cannot keep ${k} of ${n} dice`, at);
    if (two[0] === "d" && k >= n) c.fail(`cannot drop ${k} of ${n} dice`, at);
    node.keep = { mode: two            , n: k };
  }
  return node;
}

function nodeText(node      )         {
  if (node.kind === "const") return String(node.value);
  const base = `${node.count === 1 ? "" : node.count}d${node.sides}`;
  return node.keep ? `${base}${node.keep.mode}${node.keep.n}` : base;
}

function parse(input        )             {
  const c = new Cursor(input);
  if (c.done) throw new ParseError("type an expression, for example 2d6 + 3", 0, input);

  const terms         = [];
  let sign         = 1;
  if (c.peek() === "-") {
    c.take();
    sign = -1;
  } else if (c.peek() === "+") c.take();

  terms.push({ sign, node: parseDiceOrConst(c) });

  while (!c.done) {
    const op = c.take();
    if (op !== "+" && op !== "-") c.fail(`expected + or -, found "${op}"`, c.i - 1);
    terms.push({ sign: op === "-" ? -1 : 1, node: parseDiceOrConst(c) });
  }

  const normalized = terms
    .map((t, i) => (i === 0 ? `${t.sign < 0 ? "-" : ""}${nodeText(t.node)}` : ` ${t.sign < 0 ? "-" : "+"} ${nodeText(t.node)}`))
    .join("");
  return { terms, normalized };
}

/** Validate without throwing; for live feedback in the expression field. */
function tryParse(input        )                                                                          {
  try {
    return { ok: true, expression: parse(input) };
  } catch (e) {
    if (e instanceof ParseError) return { ok: false, error: e };
    throw e;
  }
}

// ---- src\core\palette-assign.ts ----------------------------------
/**
 * Assigning colours to outcomes (plan C8.3).
 *
 * Requirements, in priority order:
 *   1. two segments that touch never look alike — including the wrap-around
 *      pair, because a wheel is a cycle and the last slice touches the first;
 *   2. the assignment is stable, so the same wheel shows the same colours on
 *      every reload and a GM can say "the green one";
 *   3. it terminates for any number of outcomes, even far more than the pool
 *      holds, by relaxing the threshold rather than looping forever.
 *
 * An explicitly chosen colour always wins and is never moved.
 */




/**
 * Thresholds. T was set from the palette's own distance distribution: with a
 * muted pool the median pair sits near 0.18, so a bar of 0.15 rejects the
 * pairs that actually read as "the same colour twice" while still leaving
 * roughly two thirds of the pool available at every step. A higher bar looked
 * better on paper and forced the wheel to alternate between extremes.
 */
const DEFAULT_THRESHOLDS = {
  /** Minimum OKLab distance between touching segments. */
  T: 0.15,
  /** Minimum hue separation (degrees) for two colourful neighbours... */
  hue: 25,
  /** ...unless their lightness differs by at least this much. */
  lightness: 0.12,
  /** Chroma below which a colour counts as neutral and the hue rule is moot. */
  neutralChroma: 0.04,
  /** Distance required after simulating deuteranopia, as a fraction of T. */
  cvdFactor: 0.6,
  /** Soft rule: do not reuse a colour within this many segments. */
  recentWindow: 6,
}         ;

                                                   

                                 
              
               
                 
                                                    
             
 

function toCandidate(hex        )                 {
  const oklab = hexToOklab(hex);
  return {
    hex,
    oklab,
    chroma: chroma(oklab),
    cvd: rgbToOklab(simulateDeuteranopia(hexToRgb(hex))),
  };
}

/**
 * Are these two safe to put side by side?
 *
 * Two colours pass when they are far enough apart overall AND, if both are
 * colourful, they differ clearly in hue or clearly in lightness — that second
 * clause is what rejects "two dark blues" that a plain distance check lets
 * through. The same test is then repeated through a deuteranopia simulation at
 * a lower bar, which is what stops a red/green pair that is obvious to most
 * people and identical to some.
 */
function distinct(a                , b                , t             = DEFAULT_THRESHOLDS, scale = 1)          {
  const T = t.T * scale;
  if (deltaE(a.oklab, b.oklab) < T) return false;
  if (a.chroma > t.neutralChroma && b.chroma > t.neutralChroma) {
    const hueOk = hueDifference(a.oklab, b.oklab) >= t.hue;
    const lightOk = Math.abs(a.oklab.L - b.oklab.L) >= t.lightness;
    if (!hueOk && !lightOk) return false;
  }
  if (deltaE(a.cvd, b.cvd) < T * t.cvdFactor) return false;
  return true;
}

                              
                                                                                     
                                       
                                                                                 
             
                                    
                         
                                              
                   
                          
 

                               
                                                                  
                   
                                                                     
                
                                                                                    
                              
 

/**
 * Deterministic given (id, fixed colours, pool). Adding an outcome at the end
 * does not recolour the ones before it, because the walk is left to right and
 * only the new tail is affected.
 */
function assignColors(input             )               {
  const t = input.thresholds ?? DEFAULT_THRESHOLDS;
  const n = input.fixed.length;
  const pool = input.pool;
  const cyclic = input.cyclic ?? true;
  if (n === 0) return { colors: [], scale: 1, clashes: [] };
  if (pool.length === 0) throw new Error("colour pool is empty");

  const offset = pool.length > 0 ? hash32(input.id) % pool.length : 0;
  const rotated = [...pool.slice(offset), ...pool.slice(0, offset)];

  for (const scale of [1, 0.8, 0.64, 0.5]) {
    const chosen                            = new Array(n).fill(null);
    let cursor = 0;
    let ok = true;

    for (let i = 0; i < n && ok; i++) {
      const fixedHex = input.fixed[i];
      if (fixedHex) {
        chosen[i] = toCandidate(fixedHex);
        continue;
      }
      const neighbours                   = [];
      if (i > 0 && chosen[i - 1]) neighbours.push(chosen[i - 1] );
      // Look ahead to a fixed colour so we do not paint ourselves into a corner.
      if (i + 1 < n && input.fixed[i + 1]) neighbours.push(toCandidate(input.fixed[i + 1] ));
      if (cyclic && i === n - 1 && chosen[0]) neighbours.push(chosen[0] );

      const recent = new Set        ();
      for (let k = Math.max(0, i - t.recentWindow); k < i; k++) {
        if (chosen[k]) recent.add(chosen[k] .hex);
      }

      let picked                        = null;
      // Two passes: first honouring the "not seen recently" soft rule, then
      // without it. The hard neighbour rule applies in both.
      for (const honourRecent of [true, false]) {
        for (let step = 0; step < rotated.length; step++) {
          const c = rotated[(cursor + step) % rotated.length];
          if (honourRecent && recent.has(c.hex)) continue;
          if (neighbours.every((nb) => distinct(c, nb, t, scale))) {
            picked = c;
            cursor = (cursor + step + 1) % rotated.length;
            break;
          }
        }
        if (picked) break;
      }
      if (!picked) ok = false;
      else chosen[i] = picked;
    }

    if (ok) {
      const colors = chosen.map((c) => c .hex);
      return { colors, scale, clashes: findClashes(colors, cyclic, t, scale) };
    }
  }

  // Last resort: never fail, take the locally best colour at each step.
  const chosen                   = [];
  for (let i = 0; i < n; i++) {
    const fixedHex = input.fixed[i];
    if (fixedHex) {
      chosen.push(toCandidate(fixedHex));
      continue;
    }
    const prev = chosen[i - 1];
    let best = rotated[0];
    let bestScore = -1;
    for (const c of rotated) {
      const score = prev ? deltaE(c.oklab, prev.oklab) : 1;
      if (score > bestScore) {
        bestScore = score;
        best = c;
      }
    }
    chosen.push(best);
  }
  const colors = chosen.map((c) => c.hex);
  return { colors, scale: 0.5, clashes: findClashes(colors, cyclic, t, 0.5) };
}

function findClashes(colors          , cyclic         , t = DEFAULT_THRESHOLDS, scale = 1)                     {
  const cands = colors.map(toCandidate);
  const out                     = [];
  const last = cyclic ? colors.length : colors.length - 1;
  for (let i = 0; i < last; i++) {
    const j = (i + 1) % colors.length;
    if (i === j) continue;
    if (!distinct(cands[i], cands[j], t, scale)) out.push([i, j]);
  }
  return out;
}

/**
 * Wheel geometry: weights in, arcs out (plan C4).
 *
 * Angles are degrees measured clockwise from twelve o'clock. The pointer sits
 * at three o'clock, because labels are written along the radius, reading
 * outwards: whatever lands under a pointer on the right arrives horizontal and
 * reads left to right towards it. The wheel rotates; the pointer never moves.
 */

                                             


                          
                                               
                
                     
                   
                   
                                     
                
 

                                
                                                                            
                    
                                                             
                      
 

/**
 * One segment per rollable outcome, in list order. Disabled outcomes and
 * zero-weight outcomes take no space at all — the remaining segments simply
 * grow to fill the wheel.
 */
function layout(items                     , opts                = {})            {
  const pad = opts.padAngle ?? 0.25;
  const shares = normalize(items);
  const live           = [];
  for (let i = 0; i < items.length; i++) if (isRollable(items[i])) live.push(i);
  if (live.length === 0) return [];

  // With one live outcome a gap would leave a visible seam in a full circle.
  const usePad = live.length > 1 ? pad : 0;
  let angle = opts.startAngle ?? 0;
  const out            = [];
  for (const index of live) {
    const span = shares[index] * 360;
    // A slice thinner than the gap would otherwise end before it starts; the
    // gap never takes more than half of it.
    const gap = Math.min(usePad, span / 2);
    const start = angle + gap / 2;
    const end = angle + span - gap / 2;
    out.push({ index, startAngle: start, endAngle: end, midAngle: (start + end) / 2, share: shares[index] });
    angle += span;
  }
  return out;
}

/** Where the pointer sits, in the same degrees as the segments: three o'clock. */
const POINTER_ANGLE = 90;

/**
 * The most a winning label may lean away from horizontal when the wheel stops.
 * Only an outcome taking nearly half the wheel or more is affected: its
 * landing point is kept this close to the segment's middle, so the label under
 * the pointer never tips over past vertical.
 */
const MAX_LANDING_TILT = 75;

const rad = (deg        ) => ((deg - 90) * Math.PI) / 180;

function pointOnCircle(cx        , cy        , r        , deg        )                   {
  return [cx + r * Math.cos(rad(deg)), cy + r * Math.sin(rad(deg))];
}

/**
 * SVG path for an annular segment. `inner` of 0 gives a pie slice.
 * A segment spanning the whole circle is drawn as two arcs, because a single
 * 360° arc collapses to nothing in SVG.
 */
function arcPath(seg         , cx        , cy        , outer        , inner = 0)         {
  const span = seg.endAngle - seg.startAngle;
  if (span >= 359.999) {
    const p = (r        ) => `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx - 0.001} ${cy - r} Z`;
    return inner > 0 ? `${p(outer)} ${p(inner)}` : p(outer);
  }
  const large = span > 180 ? 1 : 0;
  const [x1, y1] = pointOnCircle(cx, cy, outer, seg.startAngle);
  const [x2, y2] = pointOnCircle(cx, cy, outer, seg.endAngle);
  if (inner <= 0) {
    return `M ${cx} ${cy} L ${x1} ${y1} A ${outer} ${outer} 0 ${large} 1 ${x2} ${y2} Z`;
  }
  const [x3, y3] = pointOnCircle(cx, cy, inner, seg.endAngle);
  const [x4, y4] = pointOnCircle(cx, cy, inner, seg.startAngle);
  return `M ${x1} ${y1} A ${outer} ${outer} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${inner} ${inner} 0 ${large} 0 ${x4} ${y4} Z`;
}

                           
                                                           
                   
                                                                               
                       
                   
 

/**
 * Plan a spin that ends with the pointer inside `segment`.
 *
 * The result is decided before this is called (decision D7); all this does is
 * choose a pleasant-looking way to arrive there. The landing point is drawn
 * uniformly within the segment but kept clear of both edges, so the pointer
 * never appears to sit exactly on a boundary — which looks like a bug even
 * when it is not — and within MAX_LANDING_TILT of the middle, so the winning
 * label arrives readable.
 */
function planSpin(
  segment         ,
  rng              ,
  opts                                                                    = {},
)           {
  const turns = Math.max(0, Math.round(opts.turns ?? 6));
  const margin = opts.edgeMargin ?? 0.06;
  const span = segment.endAngle - segment.startAngle;
  // Half the window the landing may fall in, measured from the middle: clear
  // of both edges, and never so far from the middle that the label tips over.
  const half = Math.min(span / 2 - span * margin, MAX_LANDING_TILT);
  const landing = segment.midAngle - half + rng.float() * Math.max(0, 2 * half);

  const current = opts.currentRotation ?? 0;
  // Rotation that brings `landing` under the pointer, then whole turns on top,
  // always forwards from where the wheel is now.
  const base = ((POINTER_ANGLE - landing - current) % 360 + 360) % 360;
  return { rotation: current + base + turns * 360, landingAngle: landing, segment };
}

/** Which segment is under the pointer at a given rotation. For tests. */
function segmentAtPointer(segments                    , rotation        )                 {
  const at = (((POINTER_ANGLE - rotation) % 360) + 360) % 360;
  for (const s of segments) {
    const start = ((s.startAngle % 360) + 360) % 360;
    const end = start + (s.endAngle - s.startAngle);
    if ((at >= start && at <= end) || (at + 360 >= start && at + 360 <= end)) return s;
  }
  return null;
}

/** Room for one label written along a segment's radius. */
                                  
                   
                                                                                    
                
                                                                                          
                
                                                                            
                 
 

/**
 * How much text a slice can carry along its radius.
 *
 * Along the radius the length is bounded by the wheel, not by the slice; the
 * slice only has to be as wide as the letters are tall. A slice narrows towards
 * the hub, so the text is anchored at the rim and may run inwards only as far
 * as the slice is still `lineHeight` × the font size wide. Returns null when not
 * even a few letters would fit — the list and the result panel name the slice
 * instead.
 */
function radialLabelRoom(
  span        ,
  opts                                                                        ,
)                         {
  const lineHeight = opts.lineHeight ?? 1.15;
  const fontSize = span >= 40 ? 13 : span >= 20 ? 12 : span >= 12 ? 11 : span >= 8.5 ? 10 : 9;
  // Chord width of the slice at radius r is 2 r sin(span / 2); past a half
  // circle the slice is wider than its chord, so cap the half-angle at 90°.
  const halfSine = Math.sin((Math.min(span, 180) * Math.PI) / 360);
  const narrowest = halfSine > 0 ? (lineHeight * fontSize) / (2 * halfSine) : Infinity;
  const inner = Math.max(opts.hub, narrowest);
  const length = opts.outer - inner;
  // A rough average advance for a semibold sans is 0.6 em.
  if (length < (opts.minChars ?? 3) * 0.6 * fontSize) return null;
  return { fontSize, outer: opts.outer, inner, length };
}

/**
 * The longest start of `label` that fits in `width`, with an ellipsis when
 * anything had to go. `measure` returns a string's advance at the font in use.
 */
function fitLabelToWidth(label        , width        , measure                          )         {
  if (measure(label) <= width) return label;
  const chars = Array.from(label);
  let lo = 0;
  let hi = chars.length;
  // Binary search on the kept prefix length; `lo` always fits.
  while (lo < hi) {
    const mid = Math.ceil((lo + hi) / 2);
    if (measure(`${chars.slice(0, mid).join("").trimEnd()}…`) <= width) lo = mid;
    else hi = mid - 1;
  }
  return lo === 0 ? "…" : `${chars.slice(0, lo).join("").trimEnd()}…`;
}

                               
                                                                        
                
                           
              
                                                
                
 

/**
 * Which slice of a long list the ticker should actually build.
 *
 * A list of five thousand outcomes is five thousand rows of DOM, so the strip
 * is capped. Capping it at the first `size` rows works until the winner is
 * beyond them: the strip then scrolls to a row that was never built and the
 * ticker lands on nothing. So the window follows the winner instead, with a
 * few rows of run-up in front of it for the roll to travel through.
 */
function tickerWindow(liveCount        , position        , size = 80, tail = 3)               {
  const start = Math.max(0, position - tail);
  const end = Math.min(liveCount, start + size);
  return { start, end, local: position - start };
}

 * Look a pool entry up by name. A name that is no longer in the palette — the
 * palette has just been replaced and the pool not yet rebuilt — is skipped
 * rather than fatal, so `scripts/curate-palette.mjs` can load the module and
 * rebuild the pool.
 */
const byName = (n        )                      => PALETTE.find((p) => p.name === n) ?? null;
const isColor = (c                     )                    => c !== null;

/**
 * The ordered pool the wheel draws from.
 *
 * Derived from PALETTE by `scripts/curate-palette.mjs`, which drops anything
 * too pale, too dark, too grey or too close to a colour already kept, then
 * orders what remains so that consecutive entries are far apart — the assigner
 * usually gets a good colour on its first try that way.
 *
 * Curation rules (re-verified by tests/unit/palette.test.ts, so replacing
 * PALETTE cannot silently degrade the wheel):
 *   - every entry carries a 4.5:1 label with at most 6 lightness nudges
 *   - lightness within 0.28..0.78, chroma at least 0.025
 *   - no two entries closer than 0.05 in OKLab
 */
const SEGMENT_POOL                 = [
  "Blue Violet", "Benzol Green", "Violet Red", "Golden Yellow",
  "Deep Lyons Blue", "Green", "Pansy Purple", "Vinaceous Cinnamon",
  "Dark Tyrian Blue", "Olive Yellow", "Red Violet", "Orange",
  "Blue", "Mars Brown / Tobacco", "Ecru", "Violet Blue",
  "Apricot Orange", "Slate Color", "Eosine Pink", "Diamine Green",
  "Eupatorium Purple", "Light Porcelain Green", "Vandyke Red", "Grayish Lavender - B",
  "Dark Slate Purple", "Oil Green", "Rosolanc Purple", "Dusky Green",
  "Coral Red", "Helvetia Blue", "Sulphine Yellow", "Vistoris Lake",
  "Cerulian Blue", "Jasper Red", "Dark Soft Violet", "Isabella Color",
  "Brown", "Lilac", "Pistachio Green", "Pomegranite Purple",
  "Warm Gray", "Pale Raw Umber", "Light Mauve", "Khaki",
  "Veronia Purple", "Ochraceous Salmon", "Deep Grayish Olive", "Indian Lake",
  "Artemesia Green", "Hydrangea Red", "Olympic Blue", "Grenadine Pink",
  "Olive Green", "Dull Blue Violet", "Eugenia Red | A", "Antwarp Blue",
  "Burnt Sienna", "Laelia Pink", "Buffy Citrine", "Purple Drab",
  "Old Rose", "Andover Green", "Etruscan Red", "Dark Medici Blue",
  "Vinaceous Tawny", "Light Brown Drab", "Ochre Red", "Light Grayish Olive",
  "Raw Sienna", "Sudan Brown", "Orange Citrine",
].map(byName).filter(isColor);

                                                 
               
                 
 

let cachedPool                     = null;

function pool()              {
  if (!cachedPool) {
    cachedPool = SEGMENT_POOL.map((c) => {
      const oklab = hexToOklab(c.hex);
      return { ...c, oklab, chroma: chroma(oklab) };
    });
  }
  return cachedPool;
}

/** Curation report, used by the test and by `npm run check`. */
function curate(minDistance = 0.05)                                              {
  const problems           = [];
  const p = pool();
  let closest = Infinity;
  for (let i = 0; i < p.length; i++) {
    const label = labelFor(p[i].hex);
    if (p[i].oklab.L < 0.28 || p[i].oklab.L > 0.78) problems.push(`${p[i].name} is outside the segment lightness band`);
    if (label.nudges > 6) problems.push(`${p[i].name} cannot carry a 4.5:1 label`);
    if (p[i].chroma < 0.025) problems.push(`${p[i].name} is too close to grey for a segment`);
    for (let j = i + 1; j < p.length; j++) {
      const d = deltaE(p[i].oklab, p[j].oklab);
      if (d < closest) closest = d;
      if (d < minDistance) problems.push(`${p[i].name} and ${p[j].name} are only ${d.toFixed(3)} apart`);
    }
  }
  return { problems, closestPair: closest };
}
