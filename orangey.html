/** The complete SVG for one Orangey, all poses present, selected by data-pose. */
function mascotMarkup()         {
  return (
    `<svg class="mascot-svg" viewBox="${MASCOT_VIEWBOX}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">` +
    `<g class="root">${MASCOT_BACK_LIMBS}<path class="body" d=""/>${MASCOT_FRONT_LIMBS}${MASCOT_FACE}</g></svg>`
  );
}

/** The body at rest, exactly as drawn — the invariant every test pins. */
function mascotRestingBodyPath()         {
  return bodyPathFrom(MASCOT_BODY.map(([x, y]) => [x, y]                    ));
}

/**
 * The app's mark: his head alone, tight to the drawn outline plus two units
 * of air. The logo tile in assets/mascot/logo.svg is this artwork on the
 * brand black square; the square belongs to the icons, which are square
 * canvases, not to a mark sitting on a coloured bar.
 */
const MASCOT_LOGO_VIEWBOX = "12.59 23.85 130.71 116.09";

/** The tile the icons are drawn on, from logo.svg. */
const MASCOT_LOGO_TILE = 155.91;

/**
 * Orangey's head as the logo: the same body, stem and three-quarter eyes as
 * every pose, with no mouth and no limbs. It is built from the constants
 * above rather than from a second copy of the paths, so redrawing him
 * reaches the top bar, the favicon and the installed icon at once.
 *
 * It is deliberately not a `mascot-svg`: that class means an animated
 * Orangey, and counting them is how the tests prove there is only ever one.
 */
function mascotLogoMarkup()         {
  const eye = (side         ) => {
    const [cx, cy, rot] = MASCOT_EYES.tq[side];
    return `<ellipse class="eye" cx="${cx}" cy="${cy}" rx="${MASCOT_EYE_RX}" ry="${MASCOT_EYE_RY}" transform="rotate(${rot} ${cx} ${cy})"/>`;
  };
  return (
    `<svg class="logo-svg" viewBox="${MASCOT_LOGO_VIEWBOX}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">` +
    `<path class="body" d="${mascotRestingBodyPath()}"/>` +
    `<ellipse class="stem" cx="${MASCOT_STEM.cx}" cy="${MASCOT_STEM.cy}" rx="${MASCOT_STEM.rx}" ry="${MASCOT_STEM.ry}"/>` +
    eye("R") + eye("L") +
    `</svg>`
  );
}

function bodyPathFrom(points                                        )         {
  let d = "";
  for (let i = 0; i < 12; i++) {
    const [x, y] = points[i];
    if (i === 0) d = `M${x.toFixed(2)},${y.toFixed(2)}`;
    else {
      if (i % 3 === 1) d += "C";
      d += ` ${x.toFixed(2)},${y.toFixed(2)}`;
    }
  }
  const [x0, y0] = points[0];
  return `${d} ${x0.toFixed(2)},${y0.toFixed(2)}Z`;
}

// ---- src\ui\mascot\springs.ts ------------------------------------
/**
 * The springs under Orangey, and the field that bends his outline.
 *
 * Pure numbers, no DOM: this is what the unit tests exercise. The one rule
 * that matters more than any other is in the model: every spring's target is
 * zero in every state, so the resting shape is the drawing and the wobble is
 * a departure from it that always comes back.
 */



class MascotSpring {
  x = 0;
  v = 0;
  t = 0;
  lo                    ;
  hi                    ;
  k        ;
  c        ;

  constructor(k        , c        ) {
    this.k = k;
    this.c = c;
  }

  step(dt        )       {
    const a = -this.k * (this.x - this.t) - this.c * this.v;
    this.v += a * dt;
    this.x += this.v * dt;
    // A spring with no ceiling turns the fruit into a balloon.
    if (this.hi !== undefined && this.x > this.hi) {
      this.x = this.hi;
      if (this.v > 0) this.v = 0;
    }
    if (this.lo !== undefined && this.x < this.lo) {
      this.x = this.lo;
      if (this.v < 0) this.v = 0;
    }
  }

  kick(dv        )       {
    this.v += dv;
  }

  clamp(lo        , hi        )       {
    this.lo = lo;
    this.hi = hi;
    return this;
  }

  set(x        )       {
    this.x = x;
    this.t = x;
    this.v = 0;
    return this;
  }
}

/** The three body modes, each a scalar 0 at rest. */
                            
                                                  
                 
                                                      
                
                                                             
                
 

/**
 * Where a point of the drawing goes under the current modes. Identity when
 * every mode is zero, which is the property the tests pin; the base row
 * (y = MASCOT_BASE_Y) never moves under squash, so the feet stay planted.
 */
function mascotField(x        , y        , m           , gain        )                   {
  const s = m.squash * gain;
  const l = m.slosh * gain;
  const p = m.pinch * gain;
  const xr = x - MASCOT_CENTRE.x;
  const yr = y - MASCOT_CENTRE.y;
  const sin2 = (2 * xr * yr) / (xr * xr + yr * yr + 1e-6);
  return [
    x + 0.55 * s * xr + l * (MASCOT_BASE_Y - y) * 0.055 + p * sin2 * xr * 0.35,
    y - s * (y - MASCOT_BASE_Y) + p * sin2 * yr * 0.35,
  ];
}

// ---- src\ui\mascot\model.ts --------------------------------------
/**
 * Orangey's motion, as numbers.
 *
 * The model owns the springs and the state machine and produces, each frame,
 * everything the view needs to draw: the body path, the eye centres and
 * rotations, the limb angles, the whole-figure offset and tilt. It never
 * touches the DOM, so the tests can run it in Node for ten simulated seconds
 * and check the invariant that matters: at rest, he is the drawing.
 *
 * States live in a registry. A state is a pose (which drawn parts show) plus
 * an optional entry impulse and a per-frame driver that sets spring targets.
 * Adding an animation is registering a state; nothing else changes.
 */




                                 
                 
                                                                               
                                   
                                                                      
                                               
                                                             
                                                               
 

const MASCOT_STATE_REGISTRY = new Map                        ();
const MASCOT_WARNED = new Set        ();

function registerMascotState(name        , def                )       {
  MASCOT_STATE_REGISTRY.set(name, def);
}

function mascotStateNames()           {
  return [...MASCOT_STATE_REGISTRY.keys()];
}

/** Unknown names fall back to idle, once loudly, so a stale rule never breaks a session. */
function mascotStateDef(name        )                                        {
  const def = MASCOT_STATE_REGISTRY.get(name);
  if (def) return { name, def };
  if (!MASCOT_WARNED.has(name)) {
    MASCOT_WARNED.add(name);
    console.warn(`Orangey has no state called "${name}"; using idle.`);
  }
  const idle = MASCOT_STATE_REGISTRY.get("idle");
  if (!idle) throw new Error("the idle state is not registered");
  return { name: "idle", def: idle };
}

                           
                  
                  
                  
 

                              
                 
                   
                                                                                        
                  
               
                                                
                                                                                                        
                                                                      
                                 
 

class MascotModel {
  /* body modes — TRANSIENT ONLY: target 0 in every state, symmetric clamps */
           sq = new MascotSpring(168, 7.4).clamp(-0.09, 0.09);
           sl = new MascotSpring(96, 5.2).clamp(-0.06, 0.06);
           pn = new MascotSpring(240, 6.0).clamp(-0.16, 0.16);
  /* posture — carries the poses so that no pose deforms the silhouette */
           tilt = new MascotSpring(60, 4.6).clamp(-8, 8);
           crouch = new MascotSpring(120, 9.0).clamp(0, 6);
  /* face */
           eyeScale = new MascotSpring(210, 9.0).clamp(0.16, 1.45).set(1);
           mouthScale = new MascotSpring(210, 9.0).clamp(0.3, 1.35).set(1);
           eye                            = {
    L: { x: new MascotSpring(120, 9), y: new MascotSpring(120, 9), r: new MascotSpring(120, 9) },
    R: { x: new MascotSpring(120, 9), y: new MascotSpring(120, 9), r: new MascotSpring(120, 9) },
  };
           limb = {}                                 ;

  /* the hop: ballistic only while airborne; standing still is a real state */
  y = 0;
  vy = 0;
  grounded = true;

  /** How far the body modes are allowed to show: 0 none, 1 soft, 1.8 the owner's default. */
  gain = 1.8;
  /** Total simulated time, and time in the current state. */
  t = 0;
  stateT = 0;
  state = "";
  pose           = "neutral";
  /** Scratch for state drivers (the idle nudge clock, the happy hop clock). */
  scratch                         = {};
  /**
   * The only way a state may move the squash target: a zero-mean breath of
   * this amplitude. Reset every frame, so a state has to keep asking for it.
   */
  breath = 0;

  #prevSlosh = 0;
  #lastAx = 0;
  #random              ;

  constructor(random               = Math.random) {
    this.#random = random;
    for (const k of MASCOT_LIMB_KEYS) this.limb[k] = new MascotSpring(k === "L" || k === "R" ? 190 : 130, k === "L" || k === "R" ? 8.5 : 6.8).clamp(-18, 18);
    this.placeEyes("ec", true);
  }

  random()         {
    return this.#random();
  }

  launch(v        )       {
    this.vy = v;
    this.grounded = false;
  }

  placeEyes(placement              , snap         )       {
    for (const side of ["L", "R"]         ) {
      const [px, py, prot] = MASCOT_EYES[placement][side];
      const e = this.eye[side];
      e.x.t = px;
      e.y.t = py;
      // rotate the short way round: an ellipse is the same at 180°
      let target = prot;
      while (target - e.r.x > 90) target -= 180;
      while (target - e.r.x < -90) target += 180;
      e.r.t = target;
      if (snap) {
        e.x.set(px);
        e.y.set(py);
        e.r.set(prot);
      }
    }
  }

  setState(name        )       {
    const { name: resolved, def } = mascotStateDef(name);
    if (this.state === resolved) return;
    const first = this.state === "";
    this.state = resolved;
    this.stateT = 0;
    this.pose = def.pose;
    this.placeEyes(MASCOT_POSES[def.pose].eyes, first);
    // every state parks squash at zero; poses are crouch + tilt, never squash
    this.sq.t = 0;
    this.eyeScale.t = 1;
    this.mouthScale.t = 1;
    def.enter?.(this);
    if (!first) this.pn.kick(0.35);
  }

  step(dt        )       {
    this.t += dt;
    this.stateT += dt;
    const { def } = mascotStateDef(this.state);

    // drivers set targets; the squash target is derived, never set directly,
    // so its mean over any breath cycle is exactly zero
    this.sl.t = 0;
    this.tilt.t = 0;
    this.crouch.t = 0;
    this.breath = 0;
    def.drive?.(this, dt);
    this.sq.t = this.breath * Math.sin(this.t * 1.85);

    const limbTargets = def.limbs?.(this) ?? {};
    for (const k of MASCOT_LIMB_KEYS) this.limb[k].t = limbTargets[k] ?? 0;

    // the hop, integrated only while airborne
    if (!this.grounded) {
      this.vy += 1150 * dt;
      this.y += this.vy * dt;
      if (this.y >= 0) {
        const impact = this.vy;
        this.y = 0;
        if (impact > 60) this.vy = -impact * 0.35;
        else {
          this.vy = 0;
          this.grounded = true;
        }
        this.sq.kick(impact * 0.004);
        this.pn.kick(impact * 0.0012);
        this.limb.L.kick(-impact * 0.25);
        this.limb.R.kick(impact * 0.25);
      }
    }

    this.sq.step(dt);
    this.sl.step(dt);
    this.pn.step(dt);
    this.tilt.step(dt);
    this.crouch.step(dt);
    this.eyeScale.step(dt);
    this.mouthScale.step(dt);
    for (const side of ["L", "R"]         ) {
      this.eye[side].x.step(dt);
      this.eye[side].y.step(dt);
      this.eye[side].r.step(dt);
    }

    // limbs lag the body: the slosh's acceleration drives them
    const ax = (this.sl.x - this.#prevSlosh) / Math.max(dt, 1e-4);
    this.#prevSlosh = this.sl.x;
    const drive = (ax - this.#lastAx) * 0.01;
    this.#lastAx = ax;
    for (const k of MASCOT_LIMB_KEYS) {
      this.limb[k].kick(drive * (k === "L" || k === "R" ? 0.4 : 1));
      this.limb[k].step(dt);
    }
  }

  /** Everything at its target, no motion: the static pose instant mode draws. */
  freeze()       {
    this.sq.set(0);
    this.sl.set(0);
    this.pn.set(0);
    this.tilt.set(this.tilt.t);
    this.crouch.set(this.crouch.t);
    this.y = 0;
    this.vy = 0;
    this.grounded = true;
    this.eyeScale.set(this.eyeScale.t);
    this.mouthScale.set(this.mouthScale.t);
    this.placeEyes(MASCOT_POSES[this.pose].eyes, true);
    for (const k of MASCOT_LIMB_KEYS) this.limb[k].set(this.limb[k].t);
  }

  modes()            {
    return { squash: this.sq.x, slosh: this.sl.x, pinch: this.pn.x };
  }

  /** The deformation at a point of the drawing, as an offset. */
  ride(x        , y        )                             {
    const [fx, fy] = mascotField(x, y, this.modes(), this.gain);
    return { dx: fx - x, dy: fy - y };
  }

  frame()              {
    const m = this.modes();
    const points = MASCOT_BODY.map(([x, y]) => mascotField(x, y, m, this.gain));
    const eyes = {}                       ;
    for (const side of ["L", "R"]         ) {
      const e = this.eye[side];
      const { dx, dy } = this.ride(e.x.x, e.y.x);
      eyes[side] = { cx: e.x.x, cy: e.y.x, rot: e.r.x, dx, dy, scale: this.eyeScale.x };
    }
    const mouths = {}                         ;
    const mouthScale = this.pose === "oops" ? 1 : this.mouthScale.x;
    for (const k of MASCOT_MOUTH_KEYS) {
      const [cx, cy] = MASCOT_MOUTH_CENTRE[k];
      mouths[k] = { ...this.ride(cx, cy), scale: mouthScale };
    }
    const limbs = {}                           ;
    for (const k of MASCOT_LIMB_KEYS) limbs[k] = this.limb[k].x;
    const stemRide = this.ride(75.82, 37.82);
    return {
      pose: this.pose,
      bodyPath: bodyPathFrom(points),
      offsetY: this.y + this.crouch.x,
      tilt: this.tilt.x,
      stem: { ...stemRide, rot: -this.sl.x * this.gain * 34 },
      eyes,
      mouths,
      limbs,
    };
  }
}

const MASCOT_FEET_X = 96;
const MASCOT_FEET_Y = MASCOT_BASE_Y;

// ---- src\ui\mascot\view.ts ---------------------------------------
/**
 * Draws a MascotFrame into the SVG. Nothing here decides anything; it writes
 * attributes. Ten-odd setAttribute calls per frame on one small SVG.
 */




const f2 = (n        ) => n.toFixed(2);

class MascotView {
           el             ;
           svg               ;
  #root             ;
  #body                ;
  #stem             ;
  #eyeGroup                                ;
  #eyeEl                                      ;
  #mouth                               ;
  #limb                              ;
  #lastPose = "";

  constructor() {
    this.el = document.createElement("div");
    this.el.className = "mascot";
    this.el.setAttribute("aria-hidden", "true");
    this.el.innerHTML = mascotMarkup();
    this.svg = this.el.firstElementChild                 ;
    const q =                    (sel        ) => this.svg.querySelector(sel)     ;
    this.#root = q(".root");
    this.#body = q(".body");
    this.#stem = q(".stem");
    this.#eyeGroup = { L: q(".eyeL"), R: q(".eyeR") };
    this.#eyeEl = { L: q(".eyeL-el"), R: q(".eyeR-el") };
    this.#mouth = {}                                 ;
    for (const k of MASCOT_MOUTH_KEYS) this.#mouth[k] = q(`.mouth.${k}`);
    this.#limb = {}                                ;
    for (const k of MASCOT_LIMB_KEYS) this.#limb[k] = q(k === "L" ? ".legL" : k === "R" ? ".legR" : `.arm${k}`);
  }

  draw(frame             )       {
    if (frame.pose !== this.#lastPose) {
      this.#lastPose = frame.pose;
      this.svg.setAttribute("data-pose", frame.pose);
    }
    this.#body.setAttribute("d", frame.bodyPath);
    this.#root.setAttribute("transform", `translate(0,${f2(frame.offsetY)}) rotate(${f2(frame.tilt)} ${MASCOT_FEET_X} ${MASCOT_FEET_Y})`);
    this.#stem.setAttribute("transform", `translate(${f2(frame.stem.dx)},${f2(frame.stem.dy)}) rotate(${f2(frame.stem.rot)} 75.82 42.07)`);
    for (const side of ["L", "R"]         ) {
      const e = frame.eyes[side];
      const el = this.#eyeEl[side];
      el.setAttribute("cx", f2(e.cx));
      el.setAttribute("cy", f2(e.cy));
      el.setAttribute("transform", `rotate(${f2(e.rot)} ${f2(e.cx)} ${f2(e.cy)})`);
      this.#eyeGroup[side].setAttribute(
        "transform",
        `translate(${f2(e.dx)},${f2(e.dy)}) translate(${f2(e.cx)},${f2(e.cy)}) scale(${e.scale.toFixed(3)}) translate(${f2(-e.cx)},${f2(-e.cy)})`,
      );
    }
    for (const k of MASCOT_MOUTH_KEYS) {
      const m = frame.mouths[k];
      const [cx, cy] = MASCOT_MOUTH_CENTRE[k];
      this.#mouth[k].setAttribute(
        "transform",
        `translate(${f2(m.dx)},${f2(m.dy)}) translate(${cx},${cy}) scale(${m.scale.toFixed(3)}) translate(${-cx},${-cy})`,
      );
    }
    for (const k of MASCOT_LIMB_KEYS) {
      const [px, py] = MASCOT_PIVOT[k];
      this.#limb[k].setAttribute("transform", `rotate(${f2(frame.limbs[k])} ${px} ${py})`);
    }
  }

  setBlinking(on         )       {
    this.svg.classList.toggle("blinking", on);
  }
}

// ---- src\ui\mascot\ticker.ts -------------------------------------
/**
 * One requestAnimationFrame loop for every running mascot.
 *
 * It stops itself when nothing is subscribed and while the tab is hidden, so
 * a mascot standing in a background tab costs nothing. Each subscriber gets
 * the real frame delta, capped so a tab that was asleep does not wake up to
 * a single enormous step.
 */

                                          

const MAX_STEP = 1 / 24;

class MascotTickerImpl {
  #subs = new Set        ();
  #handle = 0;
  #last = 0;
  #onVisibility = () => {
    if (document.hidden) this.#stop();
    else this.#start();
  };

  add(fn        )             {
    this.#subs.add(fn);
    if (this.#subs.size === 1) document.addEventListener("visibilitychange", this.#onVisibility);
    this.#start();
    return () => this.remove(fn);
  }

  remove(fn        )       {
    this.#subs.delete(fn);
    if (this.#subs.size === 0) {
      this.#stop();
      document.removeEventListener("visibilitychange", this.#onVisibility);
    }
  }

  get running()          {
    return this.#handle !== 0;
  }

  get size()         {
    return this.#subs.size;
  }

  #start()       {
    if (this.#handle || this.#subs.size === 0 || document.hidden) return;
    this.#last = performance.now();
    const frame = (now        ) => {
      const dt = Math.min((now - this.#last) / 1000, MAX_STEP);
      this.#last = now;
      for (const fn of this.#subs) fn(dt);
      this.#handle = this.#subs.size ? requestAnimationFrame(frame) : 0;
    };
    this.#handle = requestAnimationFrame(frame);
  }

  #stop()       {
    if (this.#handle) cancelAnimationFrame(this.#handle);
    this.#handle = 0;
  }
}

const mascotTicker = new MascotTickerImpl();

// ---- src\ui\mascot\mascot.ts -------------------------------------
/**
 * One Orangey: a model, a view, and a place on the shared ticker.
 *
 * `createMascot` is the only thing the rest of the app needs. The host
 * (host.ts) owns the single instance the app shows; the settings panel may
 * make throwaway ones for its previews.
 */




                                              

                         
                           
                              
                               
                                                 
                                
                                                                                     
                                      
                                                                                       
                
                 
                  
 

                                
                 
                  
                       
                        
 

function createMascot(opts                = {})         {
  const model = new MascotModel(opts.random);
  const view = new MascotView();
  let motion              = opts.motion ?? "full";
  let unsubscribe                      = null;
  let destroyed = false;

  model.gain = opts.wobble ?? model.gain;

  const timeScale = () => (motion === "quick" ? 2.5 : 1);

  const tick = (dt        ) => {
    model.step(dt * timeScale());
    view.draw(model.frame());
  };

  function drawStill()       {
    model.freeze();
    view.draw(model.frame());
  }

  function resume()       {
    if (destroyed) return;
    if (motion === "instant") {
      pause();
      drawStill();
      return;
    }
    view.setBlinking(true);
    unsubscribe ??= mascotTicker.add(tick);
  }

  function pause()       {
    unsubscribe?.();
    unsubscribe = null;
    view.setBlinking(false);
  }

  const mascot         = {
    el: view.el,
    model,
    setState(name) {
      model.setState(name);
      if (motion === "instant") drawStill();
      else view.draw(model.frame());
    },
    setWobble(gain) {
      if (gain === model.gain) return;
      model.gain = gain;
      model.pn.kick(0.5);
    },
    setMotion(level) {
      motion = level;
      resume();
    },
    pause,
    resume,
    destroy() {
      destroyed = true;
      pause();
      view.el.remove();
    },
  };

  model.setState(opts.state ?? "idle");
  view.draw(model.frame());
  resume();
  return mascot;
}

// ---- src\ui\mascot\reactions.ts ----------------------------------
/**
 * What Orangey does about what happens — as a table.
 *
 * A reaction is: on this event, when this holds, play that state. The first
 * matching row wins. Every row has an id so the GM can switch it off in
 * Settings, and a salience so that a reaction only ever interrupts a held one
 * of lower salience — an Oops is never buried by a Reveal that lands a frame
 * later.
 *
 * Adding a trigger is adding a row. Nothing upstream names an animation;
 * nothing here names a randomizer.
 */

                                                                

                                 
             
                      
                                         
                                                                              
               
                                                 
                   
                                
                
 

const MASCOT_SALIENCE = { idle: 0, anticipate: 1, reveal: 2, happy: 3, oops: 4 }         ;

const isLand = (e             )                                                   => e.type === "roll:land";
const isImport = (e             )                                                     => e.type === "import:done";

const DEFAULT_REACTIONS                            = [
  { id: "roll-start", on: "roll:start", then: "anticipate", salience: MASCOT_SALIENCE.anticipate, label: "Watches the roll" },
  { id: "outcome-cheer", on: "roll:land", when: (e) => isLand(e) && e.summary.mood === "cheer", then: "happy", salience: MASCOT_SALIENCE.happy, label: "Cheers an outcome you tagged" },
  { id: "outcome-wince", on: "roll:land", when: (e) => isLand(e) && e.summary.mood === "wince", then: "oops", salience: MASCOT_SALIENCE.oops, label: "Winces at an outcome you tagged" },
  { id: "roll-max", on: "roll:land", when: (e) => isLand(e) && e.summary.extreme === "max", then: "happy", salience: MASCOT_SALIENCE.happy, label: "Cheers a maximum roll" },
  { id: "roll-min", on: "roll:land", when: (e) => isLand(e) && e.summary.extreme === "min", then: "oops", salience: MASCOT_SALIENCE.oops, label: "Winces at a minimum roll" },
  { id: "roll-land", on: "roll:land", then: "reveal", salience: MASCOT_SALIENCE.reveal, label: "Reacts when a roll lands" },
  { id: "roll-fail", on: "roll:fail", then: "oops", salience: MASCOT_SALIENCE.oops, label: "Winces when a roll cannot happen" },
  { id: "link-fail", on: "link:fail", then: "oops", salience: MASCOT_SALIENCE.oops, label: "Winces when a slide link points nowhere" },
  { id: "import-ok", on: "import:done", when: (e) => isImport(e) && e.ok, then: "happy", salience: MASCOT_SALIENCE.happy, label: "Cheers a clean import" },
  { id: "import-warn", on: "import:done", when: (e) => isImport(e) && !e.ok, then: "oops", salience: MASCOT_SALIENCE.oops, label: "Winces at an import with problems" },
];

/** The first matching reaction that is switched on, or null. */
function pickReaction(
  event             ,
  reactions                           ,
  isOn                          = () => true,
)                        {
  for (const r of reactions) {
    if (r.on !== event.type) continue;
    if (!isOn(r.id)) continue;
    if (r.when && !r.when(event)) continue;
    return r;
  }
  return null;
}

/**
 * May `next` take over from `held`? Higher salience interrupts; equal
 * restarts; lower waits. The host exempts a new roll from this: a fresh roll
 * always takes over, because it is the newest fact about the table.
 */
function mayInterrupt(held                       , next                )          {
  return held === null || next.salience >= held.salience;
}

// ---- src\ui\mascot\states.ts -------------------------------------
/**
 * The five states Orangey ships with.
 *
 * Each is a pose plus what he does in it. None of them sets the squash
 * target: idle asks for a zero-mean breath, and every other pose is carried
 * by crouch and tilt, so the silhouette is always the owner's drawing.
 *
 * To add a state: register it here (or anywhere that runs before the mascot
 * mounts), then name it in a reaction. Nothing else needs to change.
 */



/* Idle: breathes, tilts its head, hops once in a while. Eye contact. */
registerMascotState("idle", {
  pose: "neutral",
  enter(m) {
    m.scratch.nudgeAt = m.t + 2 + m.random() * 3;
  },
  drive(m) {
    m.breath = 0.02;
    m.sl.t = 0.008 * Math.sin(m.t * 0.72);
    m.tilt.t = 2.6 * Math.sin(m.t * 0.55);
    if (m.t > (m.scratch.nudgeAt ?? 0)) {
      m.launch(-120);
      m.tilt.kick(18 * (m.random() < 0.5 ? -1 : 1));
      m.scratch.nudgeAt = m.t + 4.2 + m.random() * 3.6;
    }
  },
});

/* Anticipate: sinks, leans back, rocks; the drawn squint looks at the wheel. */
registerMascotState("anticipate", {
  pose: "anticipate",
  drive(m) {
    m.sl.t = 0.032 * Math.sin(m.t * 11);
    m.tilt.t = -4.5 + 2.5 * Math.sin(m.t * 11);
    m.crouch.t = 2.5;
  },
  limbs(m) {
    return { I: 3 * Math.sin(m.t * 11), J: -3 * Math.sin(m.t * 11) };
  },
});

/* Reveal: the surprised pose, launched at the landing. Holds until told otherwise. */
registerMascotState("reveal", {
  pose: "surprised",
  enter(m) {
    m.eyeScale.t = 1.32;
    m.launch(-190);
    m.sq.kick(-1.0);
    m.pn.kick(1.1);
    m.eyeScale.kick(5);
    m.limb.A.kick(-7);
    m.limb.B.kick(4);
    m.tilt.kick(-46);
  },
  limbs() {
    return { A: -16 };
  },
});

/* Oops: sways, ducks, rubs the back of its head. */
registerMascotState("oops", {
  pose: "oops",
  enter(m) {
    m.eyeScale.t = 0.88;
    m.sq.kick(0.5);
    m.sl.kick(0.35);
  },
  drive(m) {
    m.sl.t = 0.028 * Math.sin(m.t * 2.4);
    m.tilt.t = 3.5;
    m.crouch.t = 1.5;
  },
  limbs(m) {
    return { D: -7 * Math.sin(m.t * 8.7) };
  },
});

/* Happy: arms up, a little dance, small repeated hops. Eye contact. */
registerMascotState("happy", {
  pose: "happy",
  enter(m) {
    m.eyeScale.t = 1.08;
    m.launch(-150);
    m.sq.kick(-0.8);
    m.pn.kick(0.9);
    m.limb.G.kick(-9);
    m.limb.H.kick(9);
    m.tilt.kick(30);
    m.scratch.lastHop = -1;
  },
  drive(m) {
    m.sl.t = 0.012 * Math.sin(m.t * 6);
    m.tilt.t = 3 * Math.sin(m.t * 6);
    const beat = Math.floor(m.t * 2);
    if (m.grounded && m.stateT > 0.9 && m.stateT < 2.6 && beat !== m.scratch.lastHop) {
      m.scratch.lastHop = beat;
      m.launch(-95);
    }
  },
  limbs(m) {
    return { G: -8 * Math.sin(m.t * 7.5), H: 8 * Math.sin(m.t * 7.5) };
  },
});

/** The names the reactions table may use, for validation and the settings panel. */
const MASCOT_BUILTIN_STATES = ["idle", "anticipate", "reveal", "oops", "happy"]         ;
                                                                     
function isMascotState(name         )                          {
  return typeof name === "string" && (MASCOT_BUILTIN_STATES                     ).includes(name);
}

/**
 * Which build this is, and where the other one lives.
 *
 * The site build serves `orangey.html` beside `index.html`, so Settings can
 * offer it as a download — fetched relatively, so it works wherever the app
 * is served from: the root of a domain, a project subpath, or a folder. The single-file build marks itself with a meta tag
 * at build time, and Settings says so instead of offering the file it
 * already is.
 */

const SINGLE_FILE_NAME = "orangey.html";

/** The GitHub home; releases carry the single file for people who want a copy. */
const REPO_URL = "https://github.com/orangey-app/orangey";

function isSingleFile(doc           = document)          {
  return doc.querySelector('meta[name="orangey-build"]')?.getAttribute("content") === "single";
}

function releasesUrl()         {
  return `${REPO_URL}/releases/latest`;
}

// ---- src\ui\mascot\host.ts ---------------------------------------
/**
 * The one Orangey the app shows.
 *
 * There is a single host, and it owns a single mascot element — so "one
 * Orangey however many dice" is true by construction, not by discipline. It
 * listens to the app's mascot events, looks each one up in the reactions
 * table, and plays the result under the GM's presence setting:
 *
 *   hidden    — nothing mounted, events ignored, zero cost
 *   triggers  — mounted but invisible; a reaction shows him, plays, holds,
 *               fades out again
 *   always    — visible and idling; reactions play over the idle
 *
 * Every duration used here comes from feel.ts. The host never writes any
 * app state: it reads events and moves an element.
 */

                                                               





                               
                                               
                                   
                    
 

                                    
                   
                           
                                        
                                                                
                        
                                            
 

const REAL_TIMERS               = {
  set: (fn, ms) => setTimeout(fn, ms),
  clear: (h) => clearTimeout(h                                 ),
  now: () => (typeof performance !== "undefined" ? performance.now() : Date.now()),
};

/** How long an anticipation may hold with no landing before he gives up. Not a tuning: a safety net. */
const ANTICIPATE_SAFETY_MULTIPLIER = 6;

class MascotHost {
           reactions                           ;
  #bus             ;
  #feel                    ;
  #timers              ;
  #factory                                 ;
  #mascot                = null;
  #slot                     = null;
  #unsubscribe                      = null;
  #held                        = null;
  #holdTimer          = null;
  #pendingAnticipate          = null;
  #visible = false;
  #presence                 = "hidden";
  /** For tests and the debug hook: what was played, in order. */
           played           = [];

  constructor(opts                   ) {
    this.#bus = opts.bus;
    this.#feel = opts.feel;
    this.reactions = opts.reactions ?? DEFAULT_REACTIONS;
    this.#timers = opts.timers ?? REAL_TIMERS;
    this.#factory = opts.factory ?? createMascot;
    this.#unsubscribe = onMascotEvent(this.#bus, (e) => this.handle(e));
    this.applyFeel();
  }

  get presence()                 {
    return this.#presence;
  }

  get state()         {
    return this.#mascot?.model.state ?? "";
  }

  get visible()          {
    return this.#visible;
  }

  get el()                     {
    return this.#mascot?.el ?? null;
  }

  /** Put him in a slot; each surface that may show him has one. Idempotent. */
  mount(slot             )       {
    this.#slot = slot;
    if (this.#presence === "hidden") return;
    this.#ensure();
    if (this.#mascot && this.#mascot.el.parentElement !== slot) slot.appendChild(this.#mascot.el);
    if (this.#visible) this.#mascot?.resume();
  }

  /** Off screen: nothing to draw into, so the ticker is released too. */
  unmount()       {
    this.#slot = null;
    this.#mascot?.el.remove();
    this.#mascot?.pause();
  }

  get mounted()          {
    return this.#slot !== null && this.#mascot?.el.parentElement === this.#slot;
  }

  /** Called whenever settings change: presence, wobble or motion may differ. */
  applyFeel()       {
    const feel = this.#feel();
    const presence = feel.mascot.presence;
    if (presence !== this.#presence) {
      this.#presence = presence;
      this.#clearHold();
      if (presence === "hidden") {
        this.#mascot?.destroy();
        this.#mascot = null;
        this.#visible = false;
        return;
      }
      this.#ensure();
      if (this.#slot) this.mount(this.#slot);
      this.#setVisible(presence === "always");
      this.#mascot?.setState("idle");
    }
    if (this.#mascot) {
      this.#mascot.setWobble(feel.mascot.wobble);
      this.#mascot.setMotion(feel.motion);
      if (!this.#visible) this.#mascot.pause();
    }
  }

  handle(event             )       {
    if (this.#presence === "hidden") return;
    const feel = this.#feel();
    const reaction = pickReaction(event, this.reactions, (id) => mascotRuleOn(feel, id));
    if (!reaction) return;

    // A landing cancels a not-yet-shown anticipation: in instant mode the gap
    // is a frame, and nobody should see a pose flash for a frame.
    if (reaction.on !== "roll:start" && this.#pendingAnticipate !== null) {
      this.#timers.clear(this.#pendingAnticipate);
      this.#pendingAnticipate = null;
    }

    if (reaction.on === "roll:start") {
      if (this.#pendingAnticipate !== null) return;
      // a new roll starting also ends whatever he was doing about the last one
      this.#clearHold();
      this.#pendingAnticipate = this.#timers.set(() => {
        this.#pendingAnticipate = null;
        this.#play(reaction, mascotHoldMs("anticipate", feel) * ANTICIPATE_SAFETY_MULTIPLIER);
      }, MASCOT_ANTICIPATE_MIN_MS);
      return;
    }

    // A new roll is the freshest fact about the table and always takes his
    // attention; salience only arbitrates between everything else (an import
    // finishing while an Oops is held, a link failing during a celebration).
    const freshRoll = reaction.on === "roll:land";
    if (!freshRoll && !mayInterrupt(this.#held, reaction)) return;
    this.#play(reaction, mascotHoldMs(reaction.then, feel, event.type));
  }

  destroy()       {
    this.#unsubscribe?.();
    this.#unsubscribe = null;
    this.#clearHold();
    if (this.#pendingAnticipate !== null) this.#timers.clear(this.#pendingAnticipate);
    this.#mascot?.destroy();
    this.#mascot = null;
  }

  #ensure()       {
    if (this.#mascot) return;
    const feel = this.#feel();
    this.#mascot = this.#factory({ state: "idle", wobble: feel.mascot.wobble, motion: feel.motion });
    this.#mascot.el.classList.add("mascot-host");
  }

  #play(reaction                , holdMs        )       {
    this.#ensure();
    if (!this.#mascot) return;
    this.#clearHold();
    this.#held = reaction;
    this.played.push(reaction.then);
    this.#setVisible(true);
    this.#mascot.resume();
    this.#mascot.setState(reaction.then);
    this.#holdTimer = this.#timers.set(() => this.#release(), holdMs);
  }

  #release()       {
    this.#holdTimer = null;
    this.#held = null;
    if (!this.#mascot) return;
    if (this.#presence === "always") {
      this.#mascot.setState("idle");
    } else {
      this.#setVisible(false);
      this.#mascot.setState("idle");
      this.#mascot.pause();
    }
  }

  #clearHold()       {
    if (this.#holdTimer !== null) this.#timers.clear(this.#holdTimer);
    this.#holdTimer = null;
    this.#held = null;
  }

  #setVisible(on         )       {
    this.#visible = on;
    this.#mascot?.el.classList.toggle("is-visible", on);
  }
}

// ---- src\ui\app.ts -----------------------------------------------
/**
 * The shell: layout, routing, the tab bar, toasts and global shortcuts.
 */

















const SHORTCUTS                     = [
  ["Space or Enter", "Roll"],
  ["Esc", "Skip the animation"],
  ["/", "Search the library"],
  ["?", "This list"],
  ["Alt + ↑ / ↓", "Reorder an outcome"],
  ["Ctrl/Cmd + D", "Duplicate an outcome"],
  ["Ctrl/Cmd + Z", "Undo the last deletion"],
];

function mountApp(root             )             {
  // The one Orangey. It listens to the bus, plays the reactions table, and
  // sits in whichever view offers a slot — only Play does.
  const mascot = new MascotHost({ bus: state.events, feel: () => state.prefs.feel });
  state.subscribe(() => mascot.applyFeel(), ["prefs"]);

  const main = h("div", { class: "main" }, h("div", { class: "main-inner" }));
  const side = h("div", { class: "side" });
  const toasts = h("div", { class: "toasts" });
  let sideView              = null;
  let mainView              = null;
  let mobilePane                  = "main";

  const tabbar = h("div", { class: "tabbar", role: "tablist" });

  // Back: to the randomizer you were playing. Every screen but Play shows
  // it, because Settings, History and Import otherwise had no obvious way
  // out. It is a route, not browser history, so it never bounces between
  // two settings pages or out of the app.
  const back = button("← Back", () => navigate(backTarget(currentRoute(), state.prefs.lastPath, (p) => state.library.find(p)?.randomizer != null)), { class: "ghost back", title: "Back to play" });

  const topbar = h("div", { class: "topbar" },
    h("a", { class: "brand", href: "#/" }, h("span", { class: "mark", html: mascotLogoMarkup() }), "Orangey"),
    back,
    h("div", { class: "spacer" }),
    button("Library", () => navigate("#/library"), { class: "ghost" }),
    button("Import", () => navigate("#/import"), { class: "ghost" }),
    button("History", () => navigate("#/history"), { class: "ghost" }),
    button("Settings", () => navigate("#/settings"), { class: "ghost" }),
  );

  root.append(topbar, h("div", { class: "panes" }, side, main), tabbar, toasts);

  function setMain(view      )       {
    mainView?.destroy?.();
    mainView = view;
    const inner = main.querySelector(".main-inner") ;
    setChildren(inner, view.el);
    main.scrollTop = 0;
    const slot = view.el.querySelector             (".mascot-slot");
    if (slot) mascot.mount(slot);
    else mascot.unmount();
  }

  function ensureSide()       {
    if (sideView) return;
    sideView = createLibraryView();
    setChildren(side, sideView.el);
  }

  function renderRoute()       {
    const route        = currentRoute();
    // Full screen is chrome, so the app owns it: clear it here, before the
    // incoming view is built, and whatever that view asks for survives.
    document.body.classList.remove("presenting");
    ensureSide();

    switch (route.name) {
      case "play":
        setMain(createPlayView(null, route.params));
        break;
      case "randomizer": {
        const node = state.library.find(route.path);
        if (!node?.randomizer) {
          setMain(missing(route.path));
          break;
        }
        setMain(isBoard(node.randomizer) ? createBoardView(node, route.params) : createPlayView(node, route.params));
        void state.savePrefs({ lastPath: route.path });
        break;
      }
      case "byId": {
        // Links on slides address a randomizer by id, so that renaming or
        // moving it does not quietly break every deck that points at it.
        const node = state.library.findById(route.id);
        if (!node?.randomizer) {
          setMain(missingId(route.id));
          state.tell({ type: "link:fail", id: route.id });
          break;
        }
        setMain(isBoard(node.randomizer) ? createBoardView(node, route.params) : createPlayView(node, route.params));
        void state.savePrefs({ lastPath: node.path });
        break;
      }
      case "linked": {
        // The wheel is in the address. Decoding is a decompression, so it is
        // a promise; it takes about a millisecond, and the view swaps in when
        // it lands — unless the reader has already gone somewhere else.
        const { payload } = route;
        const stillHere = () => {
          const now = currentRoute();
          return now.name === "linked" && now.payload === payload;
        };
        setMain({ el: h("div", { class: "card", "aria-busy": "true" }, h("p", { class: "faint", text: "Opening the link…" })) });
        void decodeRandomizer(payload).then(
          (randomizer) => {
            if (!stillHere()) return;
            setMain(createPlayView(null, route.params, randomizer));
          },
          (error         ) => {
            if (!stillHere()) return;
            setMain(brokenLink(error));
            state.tell({ type: "link:fail", id: "embedded" });
          },
        );
        break;
      }
      case "edit": {
        const node = state.library.find(route.path);
        if (!node?.randomizer) {
          setMain(missing(route.path));
          break;
        }
        if (node.readOnly) {
          setMain({ el: h("div", { class: "card" }, h("p", { text: "This file was made with a newer Orangey, so it is open for reading only." })) });
          break;
        }
        setMain(createEditorView(node));
        break;
      }
      case "library":
        // On a wide screen the library is already in the sidebar, and a
        // second copy in the main pane is two trees of the same files that
        // both have to be kept in step. On a narrow one the sidebar is
        // hidden, so the main pane is the only place it can be.
        setMain(sidebarVisible() ? libraryIsOnTheLeft() : createLibraryView());
        break;
      case "import":
        setMain(createImportView());
        break;
      case "history":
        setMain(createHistoryView());
        break;
      case "settings":
        setMain(createSettingsView());
        break;
    }
    renderTabs(route);
    back.hidden = route.name === "play" || route.name === "randomizer" || route.name === "byId" || route.name === "linked";
  }

  function missingId(id        )       {
    return {
      el: h("div", { class: "card play-card" },
        h("h1", { text: "Not in this library" }),
        h("p", { class: "faint", text:
          "This link points at a randomizer that is not stored in this browser. Links to your own library only work on a device where you keep that library — ask whoever made the deck to send you the file, or import it here." }),
        h("p", { class: "faint", text: `Its identifier is ${id}.` }),
        h("div", { class: "row" },
          button("Open the library", () => navigate("#/library"), { class: "primary" }),
          h("div", { class: "spacer" }),
          h("div", { class: "mascot-slot mascot-slot-inline" }),
        ),
      ),
    };
  }

  function brokenLink(error         )       {
    const why = error instanceof ValidationError
      ? error.issues.map((i) => i.message).join("; ")
      : (error         ).message;
    return {
      el: h("div", { class: "card play-card broken-link" },
        h("h1", { text: "This link did not survive the trip" }),
        h("p", { class: "faint", text:
          "The wheel is meant to travel inside the link itself, and this one arrived damaged — usually a line break or a truncation somewhere between the deck and here." }),
        h("p", { class: "faint", text: why }),
        h("div", { class: "row" },
          button("Open the library", () => navigate("#/library"), { class: "primary" }),
          h("div", { class: "spacer" }),
          h("div", { class: "mascot-slot mascot-slot-inline" }),
        ),
      ),
    };
  }

  function missing(path        )       {
    return {
      el: h("div", { class: "card" },
        h("h1", { text: "Not here any more" }),
        h("p", { class: "faint", text: `Nothing was found at ${path}.` }),
        button("Open the library", () => navigate("#/library"), { class: "primary" }),
      ),
    };
  }

  function renderTabs(route       )       {
    const tabs                             = [
      ["Play", "🎲", "#/"],
      ["Library", "📁", "#/library"],
      ["History", "🕘", "#/history"],
      ["Settings", "⚙", "#/settings"],
    ];
    setChildren(tabbar, 
      ...tabs.map(([label, glyph, hash]) => {
        const active =
          (hash === "#/" && (route.name === "play" || route.name === "randomizer" || route.name === "linked" || route.name === "byId")) ||
          (hash === "#/library" && (route.name === "library" || route.name === "edit")) ||
          (hash === "#/history" && route.name === "history") ||
          (hash === "#/settings" && route.name === "settings");
        return h("button", {
          "aria-current": active ? "page" : "false",
          onclick: () => {
            mobilePane = "main";
            applyPanes();
            navigate(hash);
          },
        }, h("span", { class: "glyph", text: glyph }), label);
      }),
    );
  }

  /** Read from the stylesheet rather than repeating its breakpoint here. */
  function sidebarVisible()          {
    return getComputedStyle(side).display !== "none";
  }

  function libraryIsOnTheLeft()       {
    return {
      el: h("div", { class: "card" },
        h("h1", { text: "Your library" }),
        h("p", { class: "faint", text: "It is in the panel on the left: every folder and randomizer you have, with search at the top. Choose one to play it." }),
      ),
    };
  }

  function applyPanes()       {
    side.classList.toggle("is-active", mobilePane === "side");
    main.classList.toggle("is-hidden", mobilePane === "side");
  }

  function renderToasts()       {
    setChildren(toasts, 
      ...state.toasts.map((toast) =>
        h("div", { class: "toast", role: "status" },
          h("span", { text: toast.text }),
          toast.action ? button(toast.actionLabel ?? "Undo", () => {
            toast.action?.();
            state.dismissToast(toast.id);
          }) : null,
          button("✕", () => state.dismissToast(toast.id), { "aria-label": "Dismiss" }),
        ),
      ),
    );
  }

  function showShortcuts()       {
    const dialog = h("dialog", { "aria-label": "Keyboard shortcuts" },
      h("h2", { text: "Keyboard shortcuts" }),
      h("table", {},
        h("tbody", {},
          ...SHORTCUTS.map(([keys, what]) =>
            h("tr", {}, h("td", { style: { paddingRight: "16px" } }, h("kbd", { text: keys })), h("td", { text: what }))),
        ),
      ),
      button("Close", () => dialog.close(), { class: "primary", style: { marginTop: "12px" } }),
    );
    dialog.addEventListener("close", () => dialog.remove());
    document.body.appendChild(dialog);
    dialog.showModal();
  }

  document.addEventListener("keydown", (e) => {
    const target = e.target                      ;
    const typing = target && ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName);
    if (typing) return;
    if (e.key === "?") {
      e.preventDefault();
      showShortcuts();
    } else if (e.key === "/") {
      e.preventDefault();
      mobilePane = "side";
      applyPanes();
      (side.querySelector('input[type="search"]')                           )?.focus();
    }
  });

  window.addEventListener("hashchange", renderRoute);
  state.subscribe(renderToasts, ["toasts"]);
  renderRoute();
  renderToasts();
  return mascot;
}

// ---- src\main.ts -------------------------------------------------
async function start()                {
  const root = document.getElementById("app");
  if (!root) throw new Error("no #app element");
  root.replaceChildren(document.createTextNode("Loading…"));
  await state.load();
  root.replaceChildren();
  const mascot = mountApp(root);

  // Restore the last thing that was open, so reopening the tab mid-game does
  // not drop the GM back at a blank screen.
  if (!location.hash && state.prefs.lastPath && state.library.find(state.prefs.lastPath)) {
    navigate(`#/r/${encodeURIComponent(state.prefs.lastPath)}`);
  }

  // A debug handle for the browser test suite. Opt-in via ?debug so that an
  // ordinary session has nothing extra attached to the window.
  if (new URLSearchParams(location.search).has("debug")) {
    (globalThis                                      ).orangey = {
      state,
      rollRandomizer,
      effectiveFeel,
      decodeRandomizer,
      navigate,
      appBase,
      slideLink,
      backends: { IndexedDbBackend, MemoryBackend },
      mascot,
      mascotTicker,
      // The image store, so a browser test can put a picture in without a
      // file input. Behind ?debug like everything else here.
      images: { putImage, putImageData, imageUrl, imageUrlSync, imageDataUrl, pruneImages },
    };
  }
}

void start();
