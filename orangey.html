      h("div", { class: "field" },
        h("span", { class: "field-label", text: "A copy of everything" }),
        h("div", { class: "row tight" },
          button("Export library as ZIP", () => void exportLibraryZip(), { class: "export-library" }),
        ),
        h("span", { class: "field-hint", text: "Every randomizer as ordinary JSON files in one archive. The Import page takes it back." }),
      ),
    );
  }

  /* ---- Orangey ---------------------------------------------------------- */

  function mascotCard(f              )              {
    const m = f.mascot;
    const setMascot = (patch                                 ) => setFeel({ mascot: { ...m, ...patch } });

    previewMascot?.destroy();
    previewMascot = createMascot({ state: "idle", wobble: m.wobble, motion: f.motion });
    const previewBox = h("div", { class: "mascot-preview" }, previewMascot.el);

    const presenceOptions                                     = [
      ["hidden", "Hidden", "Never shown."],
      ["triggers", "On triggers", "Appears when something happens — a roll, a maximum, a minimum, a failed link — and goes again."],
      ["always", "Always", "Sits by the result between rolls."],
    ];
    const wobbleLabel = (v        ) => (v === 0 ? "None" : v === 1 ? "Soft" : "More");

    return h("div", { class: "card mascot-card" },
      h("h2", { text: "Orangey" }),
      h("p", { class: "faint", text: "The mascot. Whether he appears is the game master's choice; what he reacts to is yours to switch." }),
      h("div", { class: "field" },
        h("span", { class: "field-label", text: "Presence" }),
        h("div", { class: "segmented", role: "group", "aria-label": "Presence" },
          ...presenceOptions.map(([key, label]) =>
            button(label, () => setMascot({ presence: key }), { "aria-pressed": m.presence === key ? "true" : "false" })),
        ),
        h("span", { class: "field-hint", text: presenceOptions.find(([k]) => k === m.presence)?.[2] ?? "" }),
      ),
      h("div", { class: "field" },
        h("span", { class: "field-label", text: "Wobble" }),
        h("div", { class: "segmented", role: "group", "aria-label": "Wobble" },
          ...MASCOT_WOBBLE_STOPS.map((v) =>
            button(wobbleLabel(v), () => setMascot({ wobble: v }), { "aria-pressed": m.wobble === v ? "true" : "false" })),
        ),
        h("span", { class: "field-hint", text: "However much he wobbles, at rest he is the drawing." }),
      ),
      h("div", { class: "row mascot-preview-row" },
        previewBox,
        h("div", { class: "mascot-preview-controls" },
          h("span", { class: "field-label", text: "Preview" }),
          h("div", { class: "row tight wrap" },
            ...MASCOT_BUILTIN_STATES.map((name) =>
              button(name[0].toUpperCase() + name.slice(1), () => previewMascot?.setState(name), { class: `preview-mascot preview-mascot-${name}` })),
          ),
        ),
      ),
      h("div", { class: "field" },
        h("span", { class: "field-label", text: "Reacts to" }),
        h("div", { class: "mascot-rules" },
          ...DEFAULT_REACTIONS.map((r) =>
            h("label", { class: "row tight" },
              checkbox(m.rules[r.id] !== false, (on) => {
                const rules = { ...m.rules };
                if (on) delete rules[r.id];
                else rules[r.id] = false;
                setMascot({ rules });
              }, { "data-rule": r.id }),
              r.label,
            )),
        ),
      ),
      button("Reset Orangey", () => setMascot(DEFAULT_FEEL.mascot), { class: "ghost" }),
    );
  }

  function checkbox(value         , onChange                      , extra                         = {})                   {
    const input = h("input", { type: "checkbox", checked: value, ...extra });
    input.addEventListener("change", () => onChange(input.checked));
    return input;
  }

  function seedInput()                   {
    const input = h("input", { type: "text", value: state.prefs.seed ?? "", placeholder: "none", "aria-label": "Seed" });
    input.addEventListener("change", () => {
      const seed = input.value.trim() || null;
      state.resetSeedSequence();
      void state.savePrefs({ seed });
      state.toast(seed ? `Seeded rolls: ${seed}` : "Back to ordinary random rolls");
    });
    return input;
  }

  render();
  void isPersisted().then((value) => {
    if (value === persisted) return;
    persisted = value;
    render();
  });
  return {
    el: container,
    destroy() {
      previewMascot?.destroy();
      previewMascot = null;
    },
  };
}

// ---- src/ui/mascot/host.ts ---------------------------------------
/**
 * The one Orangey the app shows.
 *
 * There is a single host, and it owns a single mascot element — so "one
 * Orangey however many dice" is true by construction, not by discipline. It
 * listens to the app's mascot events, looks each one up in the reactions
 * table, and plays the result under the GM's presence setting:
 *
 *   hidden    — nothing mounted, events ignored, zero cost
 *   triggers  — mounted but invisible; a reaction shows him, plays, holds,
 *               fades out again
 *   always    — visible and idling; reactions play over the idle
 *
 * Every duration used here comes from feel.ts. The host never writes any
 * app state: it reads events and moves an element.
 */

                                                               





                               
                                               
                                   
                    
 

                                    
                   
                           
                                        
                                                                
                        
                                            
 

const REAL_TIMERS               = {
  set: (fn, ms) => setTimeout(fn, ms),
  clear: (h) => clearTimeout(h                                 ),
  now: () => (typeof performance !== "undefined" ? performance.now() : Date.now()),
};

/** How long an anticipation may hold with no landing before he gives up. Not a tuning: a safety net. */
const ANTICIPATE_SAFETY_MULTIPLIER = 6;

class MascotHost {
           reactions                           ;
  #bus             ;
  #feel                    ;
  #timers              ;
  #factory                                 ;
  #mascot                = null;
  #slot                     = null;
  #unsubscribe                      = null;
  #held                        = null;
  #holdTimer          = null;
  #pendingAnticipate          = null;
  #visible = false;
  #presence                 = "hidden";
  /** For tests and the debug hook: what was played, in order. */
           played           = [];

  constructor(opts                   ) {
    this.#bus = opts.bus;
    this.#feel = opts.feel;
    this.reactions = opts.reactions ?? DEFAULT_REACTIONS;
    this.#timers = opts.timers ?? REAL_TIMERS;
    this.#factory = opts.factory ?? createMascot;
    this.#unsubscribe = onMascotEvent(this.#bus, (e) => this.handle(e));
    this.applyFeel();
  }

  get presence()                 {
    return this.#presence;
  }

  get state()         {
    return this.#mascot?.model.state ?? "";
  }

  get visible()          {
    return this.#visible;
  }

  get el()                     {
    return this.#mascot?.el ?? null;
  }

  /** Put him in a slot; each surface that may show him has one. Idempotent. */
  mount(slot             )       {
    this.#slot = slot;
    if (this.#presence === "hidden") return;
    this.#ensure();
    if (this.#mascot && this.#mascot.el.parentElement !== slot) slot.appendChild(this.#mascot.el);
    if (this.#visible) this.#mascot?.resume();
  }

  /** Off screen: nothing to draw into, so the ticker is released too. */
  unmount()       {
    this.#slot = null;
    this.#mascot?.el.remove();
    this.#mascot?.pause();
  }

  get mounted()          {
    return this.#slot !== null && this.#mascot?.el.parentElement === this.#slot;
  }

  /** Called whenever settings change: presence, wobble or motion may differ. */
  applyFeel()       {
    const feel = this.#feel();
    const presence = feel.mascot.presence;
    if (presence !== this.#presence) {
      this.#presence = presence;
      this.#clearHold();
      if (presence === "hidden") {
        this.#mascot?.destroy();
        this.#mascot = null;
        this.#visible = false;
        return;
      }
      this.#ensure();
      if (this.#slot) this.mount(this.#slot);
      this.#setVisible(presence === "always");
      this.#mascot?.setState("idle");
    }
    if (this.#mascot) {
      this.#mascot.setWobble(feel.mascot.wobble);
      this.#mascot.setMotion(feel.motion);
      if (!this.#visible) this.#mascot.pause();
    }
  }

  handle(event             )       {
    if (this.#presence === "hidden") return;
    const feel = this.#feel();
    const reaction = pickReaction(event, this.reactions, (id) => mascotRuleOn(feel, id));
    if (!reaction) return;

    // A landing cancels a not-yet-shown anticipation: in instant mode the gap
    // is a frame, and nobody should see a pose flash for a frame.
    if (reaction.on !== "roll:start" && this.#pendingAnticipate !== null) {
      this.#timers.clear(this.#pendingAnticipate);
      this.#pendingAnticipate = null;
    }

    if (reaction.on === "roll:start") {
      if (this.#pendingAnticipate !== null) return;
      // a new roll starting also ends whatever he was doing about the last one
      this.#clearHold();
      this.#pendingAnticipate = this.#timers.set(() => {
        this.#pendingAnticipate = null;
        this.#play(reaction, mascotHoldMs("anticipate", feel) * ANTICIPATE_SAFETY_MULTIPLIER);
      }, MASCOT_ANTICIPATE_MIN_MS);
      return;
    }

    // A new roll is the freshest fact about the table and always takes his
    // attention; salience only arbitrates between everything else (an import
    // finishing while an Oops is held, a link failing during a celebration).
    const freshRoll = reaction.on === "roll:land";
    if (!freshRoll && !mayInterrupt(this.#held, reaction)) return;
    this.#play(reaction, mascotHoldMs(reaction.then, feel, event.type));
  }

  destroy()       {
    this.#unsubscribe?.();
    this.#unsubscribe = null;
    this.#clearHold();
    if (this.#pendingAnticipate !== null) this.#timers.clear(this.#pendingAnticipate);
    this.#mascot?.destroy();
    this.#mascot = null;
  }

  #ensure()       {
    if (this.#mascot) return;
    const feel = this.#feel();
    this.#mascot = this.#factory({ state: "idle", wobble: feel.mascot.wobble, motion: feel.motion });
    this.#mascot.el.classList.add("mascot-host");
  }

  #play(reaction                , holdMs        )       {
    this.#ensure();
    if (!this.#mascot) return;
    this.#clearHold();
    this.#held = reaction;
    this.played.push(reaction.then);
    this.#setVisible(true);
    this.#mascot.resume();
    this.#mascot.setState(reaction.then);
    this.#holdTimer = this.#timers.set(() => this.#release(), holdMs);
  }

  #release()       {
    this.#holdTimer = null;
    this.#held = null;
    if (!this.#mascot) return;
    if (this.#presence === "always") {
      this.#mascot.setState("idle");
    } else {
      this.#setVisible(false);
      this.#mascot.setState("idle");
      this.#mascot.pause();
    }
  }

  #clearHold()       {
    if (this.#holdTimer !== null) this.#timers.clear(this.#holdTimer);
    this.#holdTimer = null;
    this.#held = null;
  }

  #setVisible(on         )       {
    this.#visible = on;
    this.#mascot?.el.classList.toggle("is-visible", on);
  }
}

/**
 * The shell: layout, routing, the tab bar, toasts and global shortcuts.
 */









                                      









const SHORTCUTS                     = [
  ["Space or Enter", "Roll (on a board, roll all)"],
  ["Esc", "Skip the animation"],
  ["/", "Search the library"],
  ["?", "This list"],
  ["Delete / F2", "Delete or rename the focused library entry"],
  ["Alt + ↑ / ↓", "Reorder an outcome"],
  ["Ctrl/Cmd + D", "Duplicate an outcome"],
  ["Ctrl/Cmd + Z", "Undo the last deletion"],
];

function mountApp(root             )             {
  // The one Orangey. It listens to the bus, plays the reactions table, and
  // sits in whichever view offers a slot — only Play does.
  const mascot = new MascotHost({ bus: state.events, feel: () => state.prefs.feel });
  state.subscribe(() => mascot.applyFeel(), ["prefs"]);

  const main = h("div", { class: "main" }, h("div", { class: "main-inner" }));
  const side = h("div", { class: "side" });
  const toasts = h("div", { class: "toasts" });
  let sideView              = null;
  let mainView              = null;
  let mobilePane                  = "main";

  const tabbar = h("div", { class: "tabbar", role: "tablist" });

  // Back: to the randomizer you were playing. Every screen but Play shows
  // it, because Settings, History and Import otherwise had no obvious way
  // out. It is a route, not browser history, so it never bounces between
  // two settings pages or out of the app.
  const back = button("← Back", () => navigate(backTarget(currentRoute(), state.prefs.lastPath, (p) => state.library.find(p)?.randomizer != null)), { class: "ghost back", title: "Back to play" });

  const topbar = h("div", { class: "topbar" },
    h("a", { class: "brand", href: "#/" }, h("span", { class: "mark", html: mascotLogoMarkup() }), "Orangey"),
    back,
    h("div", { class: "spacer" }),
    button("Library", () => navigate("#/library"), { class: "ghost" }),
    button("Import", () => navigate("#/import"), { class: "ghost" }),
    button("History", () => navigate("#/history"), { class: "ghost" }),
    button("Settings", () => navigate("#/settings"), { class: "ghost" }),
  );

  root.append(topbar, h("div", { class: "panes" }, side, main), tabbar, toasts);

  // On an iPhone or iPad in a browser tab, Safari will clear the library of a
  // site left unopened for a week, and Add to Home Screen is what stops it.
  // Said once, where it cannot be missed, and never again once dismissed —
  // and never at all anywhere else. Settings keeps the same advice.
  const advice = storageAdvice(storageEnv());
  if (advice.homeScreenNotice && !state.prefs.homeScreenNoticeSeen) {
    const notice = h("div", { class: "home-screen-notice", role: "note" },
      h("p", { text: advice.note ?? "" }),
      h("div", { class: "row tight" },
        button("Got it", () => {
          notice.remove();
          void state.savePrefs({ homeScreenNoticeSeen: true });
        }, { class: "primary dismiss-notice" }),
      ),
    );
    topbar.after(notice);
  }

  function setMain(view      )       {
    mainView?.destroy?.();
    mainView = view;
    const inner = main.querySelector(".main-inner") ;
    setChildren(inner, view.el);
    main.scrollTop = 0;
    const slot = view.el.querySelector             (".mascot-slot");
    if (slot) mascot.mount(slot);
    else mascot.unmount();
  }

  function ensureSide()       {
    if (sideView) return;
    sideView = createLibraryView();
    setChildren(side, sideView.el);
  }

  function renderRoute()       {
    const route        = currentRoute();
    // Full screen is chrome, so the app owns it: clear it here, before the
    // incoming view is built, and whatever that view asks for survives.
    document.body.classList.remove("presenting");
    ensureSide();

    switch (route.name) {
      case "play":
        setMain(createPlayView(null, route.params));
        break;
      case "randomizer": {
        const node = state.library.find(route.path);
        if (!node?.randomizer) {
          setMain(missing(route.path));
          break;
        }
        setMain(isBoard(node.randomizer) ? createBoardView(node, route.params) : createPlayView(node, route.params));
        void state.savePrefs({ lastPath: route.path });
        break;
      }
      case "byId": {
        // Links on slides address a randomizer by id, so that renaming or
        // moving it does not quietly break every deck that points at it.
        const node = state.library.findById(route.id);
        if (!node?.randomizer) {
          setMain(missingId(route.id));
          state.tell({ type: "link:fail", id: route.id });
          break;
        }
        setMain(isBoard(node.randomizer) ? createBoardView(node, route.params) : createPlayView(node, route.params));
        void state.savePrefs({ lastPath: node.path });
        break;
      }
      case "linked": {
        // The wheel is in the address. Decoding is a decompression, so it is
        // a promise; it takes about a millisecond, and the view swaps in when
        // it lands — unless the reader has already gone somewhere else.
        const { payload } = route;
        const stillHere = () => {
          const now = currentRoute();
          return now.name === "linked" && now.payload === payload;
        };
        setMain({ el: h("div", { class: "card", "aria-busy": "true" }, h("p", { class: "faint", text: "Opening the link…" })) });
        void decodeRandomizer(payload).then(
          (randomizer) => {
            if (!stillHere()) return;
            setMain(createPlayView(null, route.params, randomizer, route.quick === true));
          },
          (error         ) => {
            if (!stillHere()) return;
            setMain(brokenLink(error));
            state.tell({ type: "link:fail", id: "embedded" });
          },
        );
        break;
      }
      case "edit": {
        const node = state.library.find(route.path);
        if (!node?.randomizer) {
          setMain(missing(route.path));
          break;
        }
        if (node.readOnly) {
          setMain({ el: h("div", { class: "card" }, h("p", { text: "This file was made with a newer Orangey, so it is open for reading only." })) });
          break;
        }
        setMain(createEditorView(node, route.from));
        break;
      }
      case "library":
        // On a wide screen the library is already in the sidebar, and a
        // second copy in the main pane is two trees of the same files that
        // both have to be kept in step. On a narrow one the sidebar is
        // hidden, so the main pane is the only place it can be.
        setMain(sidebarVisible() ? libraryIsOnTheLeft() : createLibraryView());
        break;
      case "import":
        setMain(createImportView());
        break;
      case "history":
        setMain(createHistoryView());
        break;
      case "settings":
        setMain(createSettingsView());
        break;
    }
    renderTabs(route);
    back.hidden = route.name === "play" || route.name === "randomizer" || route.name === "byId" || route.name === "linked";
  }

  /**
   * A card that explains why there is nothing to roll.
   *
   * Three near-identical copies of this had already drifted apart — only two
   * of them gave Orangey somewhere to stand. `play-card` and `broken-link`
   * are what the browser tests select on, so they stay.
   */
  function explainCard(opts                                                                                )       {
    return {
      el: h("div", { class: `card${opts.extraClass ? ` ${opts.extraClass}` : ""}` },
        h("h1", { text: opts.title }),
        ...opts.paragraphs.map((text) => h("p", { class: "faint", text })),
        opts.mascot
          ? h("div", { class: "row" },
              button("Open the library", () => navigate("#/library"), { class: "primary" }),
              h("div", { class: "spacer" }),
              h("div", { class: "mascot-slot mascot-slot-inline" }),
            )
          : button("Open the library", () => navigate("#/library"), { class: "primary" }),
      ),
    };
  }

  function missingId(id        )       {
    return explainCard({
      title: "Not in this library",
      paragraphs: [
        "This link points at a randomizer that is not stored in this browser. Links to your own library only work on a device where you keep that library — ask whoever made the deck to send you the file, or import it here.",
        `Its identifier is ${id}.`,
      ],
      extraClass: "play-card",
      mascot: true,
    });
  }

  function brokenLink(error         )       {
    const why = error instanceof ValidationError
      ? error.issues.map((i) => i.message).join("; ")
      : (error         ).message;
    return explainCard({
      title: "This link did not survive the trip",
      paragraphs: [
        "The wheel is meant to travel inside the link itself, and this one arrived damaged — usually a line break or a truncation somewhere between the deck and here.",
        why,
      ],
      extraClass: "play-card broken-link",
      mascot: true,
    });
  }

  function missing(path        )       {
    return explainCard({
      title: "Not here any more",
      paragraphs: [`Nothing was found at ${path}.`],
    });
  }

  function renderTabs(route       )       {
    const tabs                             = [
      ["Play", "🎲", "#/"],
      ["Library", "📁", "#/library"],
      ["History", "🕘", "#/history"],
      ["Settings", "⚙", "#/settings"],
    ];
    setChildren(tabbar, 
      ...tabs.map(([label, glyph, hash]) => {
        const active =
          (hash === "#/" && (route.name === "play" || route.name === "randomizer" || route.name === "linked" || route.name === "byId")) ||
          (hash === "#/library" && (route.name === "library" || route.name === "edit")) ||
          (hash === "#/history" && route.name === "history") ||
          (hash === "#/settings" && route.name === "settings");
        return h("button", {
          "aria-current": active ? "page" : "false",
          onclick: () => {
            mobilePane = "main";
            applyPanes();
            navigate(hash);
          },
        }, h("span", { class: "glyph", text: glyph }), label);
      }),
    );
  }

  /** Read from the stylesheet rather than repeating its breakpoint here. */
  function sidebarVisible()          {
    return getComputedStyle(side).display !== "none";
  }

  function libraryIsOnTheLeft()       {
    return {
      el: h("div", { class: "card" },
        h("h1", { text: "Your library" }),
        h("p", { class: "faint", text: "It is in the panel on the left: every folder and randomizer you have, with search at the top. Choose one to play it." }),
      ),
    };
  }

  function applyPanes()       {
    side.classList.toggle("is-active", mobilePane === "side");
    main.classList.toggle("is-hidden", mobilePane === "side");
  }

  function renderToasts()       {
    setChildren(toasts, 
      ...state.toasts.map((toast) =>
        h("div", { class: "toast", role: "status" },
          h("span", { text: toast.text }),
          toast.action ? button(toast.actionLabel ?? "Undo", () => {
            toast.action?.();
            state.dismissToast(toast.id);
          }) : null,
          button("✕", () => state.dismissToast(toast.id), { "aria-label": "Dismiss" }),
        ),
      ),
    );
  }

  function showShortcuts()       {
    // Where the keyboard came from, so it goes back there on close.
    const opener = document.activeElement                      ;
    const dialog = h("dialog", { "aria-label": "Keyboard shortcuts" },
      h("h2", { text: "Keyboard shortcuts" }),
      h("table", {},
        h("tbody", {},
          ...SHORTCUTS.map(([keys, what]) =>
            h("tr", {}, h("td", { style: { paddingRight: "16px" } }, h("kbd", { text: keys })), h("td", { text: what }))),
        ),
      ),
      button("Close", () => dialog.close(), { class: "primary gap-m" }),
    );
    openDialog(dialog, opener);
  }

  document.addEventListener("keydown", (e) => {
    if (isTyping(e)) return;
    if (e.key === "?") {
      e.preventDefault();
      showShortcuts();
    } else if (e.key === "/") {
      e.preventDefault();
      mobilePane = "side";
      applyPanes();
      (side.querySelector('input[type="search"]')                           )?.focus();
    }
  });

  window.addEventListener("hashchange", renderRoute);
  state.subscribe(renderToasts, ["toasts"]);
  renderRoute();
  renderToasts();
  return mascot;
}

// ---- src/main.ts -------------------------------------------------
async function start()                {
  const root = document.getElementById("app");
  if (!root) throw new Error("no #app element");
  root.replaceChildren(document.createTextNode("Loading…"));
  await state.load();
  root.replaceChildren();
  const mascot = mountApp(root);
  // The dice font is only asked for when the first die lands, which is when a
  // die's number is measured to centre it. Asking now means it is ready by then.
  void document.fonts?.load('16px "Orangey Dice"', "0123456789").catch(() => {});

  // Restore the last thing that was open, so reopening the tab mid-game does
  // not drop the GM back at a blank screen.
  if (!location.hash && state.prefs.lastPath && state.library.find(state.prefs.lastPath)) {
    navigate(`#/r/${encodeURIComponent(state.prefs.lastPath)}`);
  }

  // A debug handle for the browser test suite. Opt-in via ?debug so that an
  // ordinary session has nothing extra attached to the window.
  if (new URLSearchParams(location.search).has("debug")) {
    (globalThis                                      ).orangey = {
      state,
      rollRandomizer,
      effectiveFeel,
      decodeRandomizer,
      navigate,
      appBase,
      slideLink,
      backends: { IndexedDbBackend, MemoryBackend },
      mascot,
      mascotTicker,
      // The image store, so a browser test can put a picture in without a
      // file input. Behind ?debug like everything else here.
      images: { putImage, putImageData, imageUrl, imageUrlSync, imageDataUrl, pruneImages },
      // So a test can wait for what it wrote to be stored before its page
      // closes; otherwise a late write lands in the next test's fresh storage.
      storageSettled,
    };
  }
}

void start();

</script>
