const DEFAULT_FACES                   = ["Heads", "Tails"];

function flip(faces                  , rng              )             {
  const side = rng.int(0, 1)         ;
  return { side, face: faces[side], faces, seed: rng.seed };
}

function flipMany(faces                  , count        , rng              )               {
  const out               = [];
  for (let i = 0; i < count; i++) out.push(flip(faces, rng));
  return out;
}

// ---- src\core\dice\evaluate.ts -----------------------------------
/**
 * Evaluate a parsed dice expression against a RandomSource.
 *
 * Every die is recorded individually, kept or dropped, so the UI can show
 * "4d6kh3 → [6, 5, 2̶, 4] = 15" and a screen reader can say the same thing.
 */

                                              
                                                                     


                          
                
                
 

                             
               
                                                          
               
                                     
                   
                 
                                                                                  
                
                                          
                   
 

                             
                             
                
                        
                     
                      
                
                                                                               
              
              
                                                                          
                     
                     
                
 

function keepIndices(values          , node          )            {
  const kept = values.map(() => true);
  if (!node.keep) return kept;
  const order = values.map((v, i) => ({ v, i }));
  const { mode, n } = node.keep;
  // Sort descending for "high" modes, ascending for "low" ones. Ties break by
  // index so the display order of equal dice is stable.
  const high = mode === "kh" || mode === "dh";
  order.sort((a, b) => (high ? b.v - a.v : a.v - b.v) || a.i - b.i);
  if (mode === "kh" || mode === "kl") {
    for (let k = n; k < order.length; k++) kept[order[k].i] = false;
  } else {
    for (let k = 0; k < n; k++) kept[order[k].i] = false;
  }
  return kept;
}

function evalNode(node      , rng              )                                                      {
  if (node.kind === "const") return { value: node.value };
  const values           = [];
  for (let i = 0; i < node.count; i++) values.push(rng.int(1, node.sides));
  const kept = keepIndices(values, node);
  const dice = values.map((value, i) => ({ value, kept: kept[i] }));
  const value = dice.reduce((a, d) => a + (d.kept ? d.value : 0), 0);
  return { value, dice, sides: node.sides };
}

function boundsOf(node      )                               {
  if (node.kind === "const") return { min: node.value, max: node.value };
  let n = node.count;
  if (node.keep) n = node.keep.mode[0] === "k" ? node.keep.n : node.count - node.keep.n;
  return { min: n, max: n * node.sides };
}

function evaluate(expr            , rng              , input = expr.normalized)             {
  const terms               = expr.terms.map((t      ) => {
    const r = evalNode(t.node, rng);
    return {
      sign: t.sign,
      text: nodeText(t.node),
      dice: r.dice,
      sides: r.sides,
      value: r.value,
      subtotal: t.sign * r.value,
    };
  });

  let min = 0;
  let max = 0;
  for (const t of expr.terms) {
    const b = boundsOf(t.node);
    if (t.sign > 0) {
      min += b.min;
      max += b.max;
    } else {
      min -= b.max;
      max -= b.min;
    }
  }

  const total = terms.reduce((a, t) => a + t.subtotal, 0);
  const keptDice = terms.flatMap((t) => (t.dice ?? []).filter((d) => d.kept).map((d) => ({ d, sides: t.sides  })));
  const isMaximum = keptDice.length > 0 && keptDice.every(({ d, sides }) => d.value === sides);
  const isMinimum = keptDice.length > 0 && keptDice.every(({ d }) => d.value === 1);

  return { input, expression: expr.normalized, terms, total, min, max, isMaximum, isMinimum, seed: rng.seed };
}

function rollDice(input        , rng              )             {
  return evaluate(parse(input), rng, input);
}

// ---- src\core\dice\format.ts -------------------------------------
/** Turning a RollResult into the strings the UI and screen readers use. */

                                                            

function termDetail(t            )         {
  if (!t.dice) return t.text;
  const dice = t.dice.map((d) => (d.kept ? String(d.value) : `(${d.value})`)).join(", ");
  return `${t.text} [${dice}]`;
}

/** One line for the history log: "4d6kh3 [6, 5, (2), 4] = 15". */
function formatResult(r            )         {
  const detail = r.terms
    .map((t, i) => `${i === 0 ? (t.sign < 0 ? "-" : "") : t.sign < 0 ? " - " : " + "}${termDetail(t)}`)
    .join("");
  return `${detail} = ${r.total}`;
}

/** Spoken form; dropped dice are named rather than shown in brackets. */
function speakResult(r            )         {
  const parts = r.terms.map((t) => {
    if (!t.dice) return `${t.sign < 0 ? "minus " : ""}${t.value}`;
    const kept = t.dice.filter((d) => d.kept).map((d) => d.value);
    const dropped = t.dice.filter((d) => !d.kept).map((d) => d.value);
    let s = `${t.text}: ${kept.join(", ")}`;
    if (dropped.length) s += `, dropping ${dropped.join(", ")}`;
    return `${t.sign < 0 ? "minus " : ""}${s}`;
  });
  return `${parts.join("; ")}. Total ${r.total}.`;
}

/** Compact form for the big result panel. */
function totalText(r            )         {
  return String(r.total);
}

// ---- src\core\number.ts ------------------------------------------
class NumberSpecError extends Error {}

function validateSpec(spec            )                {
  if (!Number.isFinite(spec.min) || !Number.isFinite(spec.max)) return "minimum and maximum must be numbers";
  if (spec.max < spec.min) return "the maximum must not be below the minimum";
  if (!Number.isInteger(spec.count) || spec.count < 1) return "how many must be a whole number of at least 1";
  if (spec.count > 1000) return "at most 1000 numbers at a time";
  if (spec.integer) {
    if (!Number.isInteger(spec.min) || !Number.isInteger(spec.max)) return "whole-number draws need whole-number bounds";
    const range = spec.max - spec.min + 1;
    if (spec.unique && spec.count > range) return `only ${range} whole numbers lie in that range`;
  } else if (spec.unique) {
    return "unique results need whole numbers";
  }
  return null;
}

/** Partial Fisher-Yates over the range: O(count), no rejection loop. */
function uniqueIntegers(min        , max        , count        , rng              )           {
  const range = max - min + 1;
  if (range <= 100000) {
    const pool = new Int32Array(range);
    for (let i = 0; i < range; i++) pool[i] = min + i;
    const out           = [];
    for (let k = 0; k < count; k++) {
      const j = rng.int(k, range - 1);
      const tmp = pool[k];
      pool[k] = pool[j];
      pool[j] = tmp;
      out.push(pool[k]);
    }
    return out;
  }
  const seen = new Set        ();
  const out           = [];
  while (out.length < count) {
    const v = rng.int(min, max);
    if (!seen.has(v)) {
      seen.add(v);
      out.push(v);
    }
  }
  return out;
}

function drawNumbers(spec            , rng              )               {
  const problem = validateSpec(spec);
  if (problem) throw new NumberSpecError(problem);

  let values          ;
  if (spec.integer) {
    values = spec.unique
      ? uniqueIntegers(spec.min, spec.max, spec.count, rng)
      : Array.from({ length: spec.count }, () => rng.int(spec.min, spec.max));
  } else {
    const span = spec.max - spec.min;
    values = Array.from({ length: spec.count }, () => {
      const f = rng.float();
      // float() is [0,1); to include the maximum we accept the exact endpoint
      // only when the draw lands in the top ulp-sized slice, which keeps the
      // distribution uniform rather than doubling the endpoint's chance.
      const t = spec.inclusiveMax ? f * (1 + Number.EPSILON) : f;
      return spec.min + Math.min(t, 1) * span;
    });
  }
  return { values, spec, seed: rng.seed, ...extremesOf(values, spec) };
}

/** Whether a draw is as high, or as low, as its range allows. */
function extremesOf(values          , spec            )                                             {
  if (!spec.integer || values.length === 0) return { isMaximum: false, isMinimum: false };
  return {
    isMaximum: values.every((v) => v === spec.max),
    isMinimum: values.every((v) => v === spec.min),
  };
}

function formatNumbers(r              )         {
  const fmt = (v        ) => (r.spec.integer ? String(v) : v.toFixed(4).replace(/0+$/, "").replace(/\.$/, ""));
  return r.values.map(fmt).join(", ");
}

// ---- src\ui\roll.ts ----------------------------------------------
/**
 * Rolling any randomizer, in one place.
 *
 * The result is produced here, complete, before any animation starts
 * (decision D7) — the animation is only a way of arriving at it. That is what
 * lets "skip" be safe and what keeps the announced result and the drawn result
 * from ever disagreeing.
 */







                                                                                          
                                                           

                          
                           
                                                 
               
                                                                   
                  
                                    
                
                
                                          
                     
                                                                  
                 
                    
               
                     
                      
                      
                                                                            
                             
 

function rollRandomizer(r            , rng              )          {
  switch (r.type) {
    case "board":
      // A board has no outcome of its own: the board screen rolls what is on
      // it, one randomizer at a time, and each records its own history row.
      throw new Error("a board is rolled one randomizer at a time");
    case "list":
      return rollList(r, rng);
    case "dice": {
      const result = rollDice(r.expression, rng);
      return {
        kind: "dice",
        text: String(result.total),
        detail: formatResult(result),
        speak: speakResult(result),
        seed: rng.seed,
        dice: result,
        isMaximum: result.isMaximum,
        isMinimum: result.isMinimum,
      };
    }
    case "coin": {
      const result = flip(r.faces, rng);
      return {
        kind: "coin",
        text: result.face,
        speak: `${r.name}: ${result.face}.`,
        seed: rng.seed,
        side: result.side,
        reaction: r.faceReactions?.[result.side] ?? undefined,
      };
    }
    case "number": {
      const result = drawNumbers(r, rng);
      const text = formatNumbers(result);
      return {
        kind: "number",
        text,
        detail: `${r.count > 1 ? `${r.count} numbers` : "one number"} between ${r.min} and ${r.max}`,
        speak: `${r.name}: ${text}.`,
        seed: rng.seed,
        numbers: result.values,
        isMaximum: result.isMaximum,
        isMinimum: result.isMinimum,
      };
    }
  }
}

function rollList(r                , rng              )          {
  const index = pickWeightedIndex(r.items, rng);
  const item = r.items[index];
  const total = r.items.reduce((a, i) => a + (i.disabled || i.weight <= 0 ? 0 : i.weight), 0);
  const percent = total > 0 ? (item.weight / total) * 100 : 0;
  const pct = `${percent.toFixed(percent < 10 ? 1 : 0)}%`;
  return {
    kind: "list",
    text: item.label,
    detail: item.description ? `${item.description} · ${pct}` : pct,
    speak: `${r.name}: ${item.label}. Probability ${pct}.`,
    seed: rng.seed,
    itemIndex: index,
    image: item.image,
    reaction: item.reaction,
  };
}

function whyCannotRoll(r            )                {
  if (r.type === "board") return r.entries.length ? null : "This board has nothing on it yet.";
  if (r.type !== "list") return null;
  if (r.items.length === 0) return "This randomizer has no outcomes yet.";
  if (!r.items.some((i) => !i.disabled && i.weight > 0)) {
    return "No outcomes can come up: they are all disabled or weigh nothing.";
  }
  return null;
}

/**
 * The longest text this randomizer could ever put in the result panel.
 *
 * The panel reserves its height from this once, when the randomizer loads, so
 * that no roll ever changes the layout — we know every outcome in advance, so
 * there is no reason to discover the height one roll at a time. It is an upper
 * bound, not a prediction: dice report their widest total, a number draw its
 * widest row, a list its longest label.
 */
function longestOutcome(r            )         {
  const longest = (texts          ) => texts.reduce((a, b) => (b.length > a.length ? b : a), "");
  switch (r.type) {
    case "list": {
      // Disabled outcomes cannot come up, but enabling one must not resize
      // the panel, so every label counts.
      return longest(r.items.map((i) => i.label));
    }
    case "coin":
      return longest([...r.faces]);
    case "number": {
      const width = (v        ) => (r.integer ? String(Math.trunc(v)) : v.toFixed(4).replace(/0+$/, "").replace(/\.$/, ""));
      const widest = longest([width(r.min), width(r.max)]);
      return Array.from({ length: Math.max(1, Math.min(r.count, 100)) }, () => widest).join(", ");
    }
    case "board":
      // Each cell on a board sizes its own panel from its own randomizer.
      return "";
    case "dice": {
      // The bounds come from the expression, so one throwaway roll on its own
      // source tells us them without touching the app's sequence or history.
      try {
        const result = rollDice(r.expression, new SeededSource("fit"));
        return longest([String(result.min), String(result.max)]);
      } catch {
        return r.expression;
      }
    }
  }
}

// ---- src\ui\components\cell.ts -----------------------------------
/**
 * One randomizer on a board: its own wheel, dice or coin, its own result, and
 * its own Feel settings, in a cell small enough that several fit on a screen.
 *
 * It is the play screen's surface without the furniture — no presets, no link
 * dialog, no history panel — because a board carries those once for all of its
 * cells rather than once per cell.
 */

                                                            









                           
                  
                                                    
                        
                                            
               
                            
                                  
 

function createCell(randomizer            , opts                          = {})           {
  let rolling = false;
  const result = createResultPanel("Ready");
  const stage = h("div", { class: "stage cell-stage" });
  const tray = createDiceTray();
  const coin = createCoin();
  let wheel                                        = null;

  if (randomizer.type === "list" && randomizer.view === "wheel") {
    wheel = createWheel({
      items: () => (randomizer                                         ).items,
      id: () => randomizer.id,
      onActivate: () => void roll(),
      size: 260,
    });
    stage.append(wheel.el);
  } else if (randomizer.type === "dice") {
    stage.append(tray.el);
  } else if (randomizer.type === "coin") {
    stage.append(coin.el);
  }
  result.reserve(longestOutcome(randomizer));

  const feelNow = () => effectiveFeel(state.prefs.feel, randomizer.feel, state.prefs.animationsOff);

  async function roll()                {
    if (rolling) {
      skip();
      return;
    }
    const problem = whyCannotRoll(randomizer);
    if (problem) {
      result.clear(problem);
      state.tell({ type: "roll:fail", source: randomizer.type, reason: problem });
      return;
    }
    let outcome         ;
    try {
      outcome = rollRandomizer(randomizer, state.source());
    } catch (e) {
      result.clear((e         ).message);
      return;
    }
    const feel = feelNow();
    const animated =
      motionScale(feel.motion) !== 0 &&
      ((randomizer.type === "list" && wheel !== null && outcome.itemIndex !== undefined) ||
        (randomizer.type === "dice" && outcome.dice !== undefined) ||
        randomizer.type === "coin");

    rolling = true;
    opts.onRoll?.();
    if (animated) result.pending();
    else result.show(outcome);

    if (randomizer.type === "list" && wheel && outcome.itemIndex !== undefined) await wheel.spinTo(outcome.itemIndex, feel);
    else if (randomizer.type === "dice" && outcome.dice) await tray.show(outcome.dice, feel);
    else if (randomizer.type === "coin") await coin.show(outcome.text, feel);

    if (animated) result.show(outcome);
    // The landing, as on the play screen: the answer, the announcement and
    // Orangey's reaction all happen together, never at the start.
    state.tell({ type: "roll:land", source: randomizer.type, summary: summarize(outcome) });
    rolling = false;
    void state.record(randomizer, outcome);
  }

  function skip()       {
    wheel?.skip();
    tray.skip();
    coin.skip();
  }

  const el = h("div", { class: "cell", "data-randomizer": randomizer.id },
    h("h3", { class: "cell-name", text: randomizer.name }),
    stage,
    result.el,
  );

  return {
    el,
    roll,
    skip,
    get rolling() { return rolling; },
    get randomizer() { return randomizer; },
  };
}

/** A cell for a randomizer the board points at but the library no longer has. */
function createMissingCell(name        )              {
  return h("div", { class: "cell cell-missing" },
    h("h3", { class: "cell-name", text: name }),
    h("p", { class: "faint", text: "This randomizer is not in your library any more. Remove it from the board, or import it again." }),
  );
}

// ---- src\ui\components\chain.ts ----------------------------------
/**
 * A chain of randomizers: an outcome that sends you to another one.
 *
 * An encounter table whose worst result says "roll on the treasure table" is
 * why this exists. The outcome carries `goesTo`, and when it comes up that
 * randomizer opens beside the wheel that sent you there — and waits. It does
 * not roll itself: the table decides when the second roll happens, the way it
 * would pick up a second set of dice.
 *
 * Only the two newest stay full size. A third opens and the first becomes an
 * icon in the strip above, carrying its name and the answer it gave, because
 * three wheels across a laptop are three wheels nobody can read. Clicking an
 * icon brings that one back.
 *
 * The rule is `advanceChain` and `chainPlacement`, which know nothing about
 * the DOM. What is full size, what is an icon, what a chain does when it
 * arrives somewhere it has already been, and what it does when the randomizer
 * an outcome points at has been deleted are all questions a test can ask
 * directly rather than by clicking.
 */

                                                            


                                          


/** How many randomizers in a chain keep their full size. The rest are icons. */
const CHAIN_FULL_SIZE = 2;

/** Where an outcome points, and what that outcome was called on the wheel. */
                              
             
                
 

                            
             
                                                                           
               
                                                                             
               
                                                                        
                 
 

                               
                     
                                                                   
                      
 

                                        

/** The randomizer this outcome sends you to, when it sends you anywhere. */
function chainTarget(r            , outcome         )                     {
  if (r.type !== "list" || outcome.itemIndex === undefined) return null;
  const item = r.items[outcome.itemIndex];
  return item?.goesTo ? { id: item.goesTo, label: item.label } : null;
}

/**
 * The chain after the randomizer at `from` has rolled.
 *
 * @param look  the library: what a target id resolves to, or null if it is gone
 */
function advanceChain(
  links                      ,
  from        ,
  target                    ,
  look                                         ,
)               {
  // Rolling a randomizer again answers its question again, so whatever its
  // last answer had opened is no longer part of the chain. At the root that
  // is all of it: a fresh spin of the wheel starts a fresh chain.
  const kept = links.slice(0, from + 1);
  if (!target) return { links: kept, note: null };

  const already = kept.find((link) => link.id === target.id);
  if (already) {
    // Following it would put the same randomizer on screen twice and lead
    // straight back here. Saying so is more use than a chain that circles.
    return { links: kept, note: `${already.name} is already open here, so the chain stops rather than going round again.` };
  }

  const found = look(target.id);
  return {
    links: [...kept, { id: target.id, name: found?.name ?? target.label, from: target.label, found: found !== null }],
    note: null,
  };
}

/** Which links are full size and which are icons, with `focus` full size. */
function chainPlacement(count        , focus        )              {
  const at = Math.min(Math.max(focus, 0), Math.max(count - 1, 0));
  // Full size is the randomizer in focus and the one that sent you to it: the
  // newest pair until an icon is clicked, and that icon's pair afterwards.
  return Array.from({ length: count }, (_, i) => (i <= at && i > at - CHAIN_FULL_SIZE ? "full" : "icon"));
}

/** The play screen, as the chain needs to see it: its root link, and its card. */
                            
                                                                                    
               
                 
                                                                   
                    
                                                                                
                                             
 

                            
                                                       
                     
                                                                         
                    
                                                
                    
                                                                            
                
                                                                                 
                        
                  
 

function createChainRow(root           )            {
  const strip = h("div", { class: "chain-strip" });
  const open = h("div", { class: "chain-open" });
  const note = h("p", { class: "chain-note warning" });

  let links              = [];
  /** Per link, in step with `links`. The root's surface is the play card. */
  let holders                         = [];
  let cells                      = [];
  let answers                    = [];
  let focus = 0;
  let stopped                = null;

  function reset()       {
    links = [{ id: root.id(), name: root.name(), from: "", found: true }];
    holders = [null];
    cells = [null];
    answers = [null];
    focus = 0;
    stopped = null;
    render();
  }

  /** The surface for a link past the root: its own cell, or what is missing. */
  function build(i        )       {
    const link = links[i];
    const sender = links[i - 1]?.name ?? "";
    const from = h("p", { class: "faint chain-from", text: `${sender} rolled ${link.from}` });
    const found = state.library.findById(link.id)?.randomizer ?? null;
    if (!found) {
      // The same tone as a board's gap: the outcome still comes up and still
      // says where it meant to send you.
      cells[i] = null;
      holders[i] = h("div", { class: "chain-link cell cell-missing" },
        from,
        h("h3", { class: "cell-name", text: link.name }),
        h("p", { class: "faint", text: "This randomizer is not in your library any more. Import it again, or take the link off that outcome." }),
      );
      return;
    }
    const cell = createCell(found);
    cells[i] = cell;
    const rollThis = button("Roll", () => {
      // Pressing again while it is running means "get to the answer", which
      // is what the cell's own roll does with a roll already in flight.
      const skipping = cell.rolling;
      const done = cell.roll();
      if (skipping) return;
      rollThis.textContent = "Skip";
      void done.then(() => { rollThis.textContent = "Roll"; });
    }, { class: "primary chain-roll" });
    holders[i] = h("div", { class: "chain-link" }, from, cell.el, rollThis);
  }

  function follow(from        , target                    )       {
    const advance = advanceChain(links, from, target, (id) => state.library.findById(id)?.randomizer ?? null);
    links = advance.links;
    stopped = advance.note;
    // Everything the rolled randomizer had opened is gone, surfaces and all:
    // a stale holder kept by index would show the previous chain's answer.
    holders.length = from + 1;
    cells.length = from + 1;
    answers.length = from + 1;
    for (let i = from + 1; i < links.length; i++) build(i);
    focus = links.length - 1;
    render();
  }

  function icon(link           , i        )              {
    return h("button", {
      type: "button",
      class: "chain-icon",
      title: `Show ${link.name} at full size again`,
      onclick: () => { focus = i; render(); },
    },
      h("span", { class: "chain-icon-name", text: link.name }),
      h("span", { class: "chain-icon-answer", text: answers[i] ?? "not rolled" }),
    );
  }

  function render()       {
    const places = chainPlacement(links.length, focus);
    setChildren(strip, ...links.map((link, i) => (places[i] === "icon" ? icon(link, i) : null)));
    strip.hidden = !places.includes("icon");
    setChildren(open, ...links.map((_, i) => (i > 0 && places[i] === "full" ? holders[i] : null)));
    root.card.hidden = places[0] !== "full";
    note.textContent = stopped ?? "";
    note.hidden = stopped === null;
    root.layout(open.children.length > 0, root.card.hidden);
  }

  /**
   * A roll can be started by the play screen's button, by a chain link's own,
   * by the space bar or by a click on the wheel itself, and every one of them
   * ends in `state.record`. The chain watches for the roll that was recorded
   * rather than wrapping the four ways of starting one.
   */
  let seen = state.lastOutcome;
  const unsubscribe = state.subscribe(() => {
    const last = state.lastOutcome;
    if (last === seen) return;
    seen = last;
    if (!last) return;
    const i = links.findIndex((link) => link.id === last.randomizer.id);
    if (i < 0) return;
    answers[i] = last.outcome.text;
    follow(i, chainTarget(last.randomizer, last.outcome));
  }, ["outcome"]);

  function rollNewest()          {
    const places = chainPlacement(links.length, focus);
    for (let i = links.length - 1; i > 0; i--) {
      const cell = cells[i];
      if (places[i] === "full" && cell) {
        void cell.roll();
        return true;
      }
    }
    return false;
  }

  reset();

  return {
    strip,
    open,
    note,
    reset,
    rollNewest,
    destroy() {
      unsubscribe();
    },
  };
}

// ---- src\storage\zip.ts ------------------------------------------
/**
 * A minimal ZIP writer and reader for library export/import (plan C5).
 *
 * Hand-written because the sandbox had no package registry; it produces
 * ordinary ZIP files that any operating system can open, which is the whole
 * point of the feature. Entries are deflated where the platform offers
 * compression streams and stored otherwise.
 */

const encoder = new TextEncoder();

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    table[i] = c >>> 0;
  }
  return table;
})();

function crc32(bytes            )         {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

/** Shared with the link encoder: method 8 is deflated, 0 is stored as-is. */
async function deflate(bytes            )                                                {
  const CS = (globalThis                                                    ).CompressionStream;
  if (!CS) return { data: bytes, method: 0 };
  try {
    const stream = new Blob([bytes            ]).stream().pipeThrough(new CS("deflate-raw"));
    const out = new Uint8Array(await new Response(stream).arrayBuffer());
    return out.length < bytes.length ? { data: out, method: 8 } : { data: bytes, method: 0 };
  } catch {
    return { data: bytes, method: 0 };
  }
}

async function inflate(bytes            , method        )                      {
  if (method === 0) return bytes;
  const DS = (globalThis                                                        ).DecompressionStream;
  if (!DS) throw new Error("this browser cannot read compressed ZIP entries");
  const stream = new Blob([bytes            ]).stream().pipeThrough(new DS("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

                           
               
                                                                        
                
                                                                     
                     
 

/**
 * Which entries are pictures.
 *
 * They are kept as bytes on both sides: putting a PNG through a TextDecoder
 * on the way out of an archive and an encoder on the way back in does not
 * return the PNG.
 */
const PICTURE_ENTRY = /\.(png|jpe?g|webp|gif)$/i;

class Writer {
  parts               = [];
  length = 0;
  push(part            )       {
    this.parts.push(part);
    this.length += part.length;
  }
  u32(n        )       {
    const b = new Uint8Array(4);
    new DataView(b.buffer).setUint32(0, n >>> 0, true);
    this.push(b);
  }
  u16(n        )       {
    const b = new Uint8Array(2);
    new DataView(b.buffer).setUint16(0, n & 0xffff, true);
    this.push(b);
  }
  bytes()             {
    const out = new Uint8Array(this.length);
    let at = 0;
    for (const p of this.parts) {
      out.set(p, at);
      at += p.length;
    }
    return out;
  }
}

/** Build a ZIP archive. Folders are implied by the entry paths. */
async function createZip(entries            )                      {
  const w = new Writer();
  const central                                                                                                    = [];

  for (const entry of entries) {
    const name = encoder.encode(entry.path);
    const raw = entry.bytes ?? encoder.encode(entry.text ?? "");
    const { data, method } = await deflate(raw);
    const crc = crc32(raw);
    const offset = w.length;

    w.u32(0x04034b50);
    w.u16(20);
    w.u16(0x0800); // UTF-8 names
    w.u16(method);
    w.u16(0); // time
    w.u16(0); // date
    w.u32(crc);
    w.u32(data.length);
    w.u32(raw.length);
    w.u16(name.length);
    w.u16(0);
    w.push(name);
    w.push(data);

    central.push({ name, crc, size: raw.length, packed: data.length, method, offset });
  }

  const centralStart = w.length;
  for (const e of central) {
    w.u32(0x02014b50);
    w.u16(20);
    w.u16(20);
    w.u16(0x0800);
    w.u16(e.method);
    w.u16(0);
    w.u16(0);
    w.u32(e.crc);
    w.u32(e.packed);
    w.u32(e.size);
    w.u16(e.name.length);
    w.u16(0);
    w.u16(0);
    w.u16(0);
    w.u16(0);
    w.u32(0);
    w.u32(e.offset);
    w.push(e.name);
  }
  const centralSize = w.length - centralStart;

  w.u32(0x06054b50);
  w.u16(0);
  w.u16(0);
  w.u16(central.length);
  w.u16(central.length);
  w.u32(centralSize);
  w.u32(centralStart);
  w.u16(0);
  return w.bytes();
}

/** Read a ZIP archive produced by anything reasonable. */
async function readZip(bytes            )                      {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const decoder = new TextDecoder();

  // Find the end-of-central-directory record, scanning back over any comment.
  let eocd = -1;
  for (let i = bytes.length - 22; i >= 0 && i > bytes.length - 22 - 65536; i--) {
    if (view.getUint32(i, true) === 0x06054b50) {
      eocd = i;
      break;
    }
  }
  if (eocd < 0) throw new Error("this does not look like a ZIP file");

  const count = view.getUint16(eocd + 10, true);
  let at = view.getUint32(eocd + 16, true);
  const entries             = [];

  for (let i = 0; i < count; i++) {
    if (view.getUint32(at, true) !== 0x02014b50) throw new Error("the ZIP directory is damaged");
    const method = view.getUint16(at + 10, true);
    const packed = view.getUint32(at + 20, true);
    const nameLen = view.getUint16(at + 28, true);
    const extraLen = view.getUint16(at + 30, true);
    const commentLen = view.getUint16(at + 32, true);
    const offset = view.getUint32(at + 42, true);
    const path = decoder.decode(bytes.subarray(at + 46, at + 46 + nameLen));

    const localNameLen = view.getUint16(offset + 26, true);
    const localExtraLen = view.getUint16(offset + 28, true);
    const dataStart = offset + 30 + localNameLen + localExtraLen;
    const data = bytes.subarray(dataStart, dataStart + packed);

    if (!path.endsWith("/")) {
      const content = await inflate(data, method);
      entries.push(PICTURE_ENTRY.test(path) ? { path, bytes: content } : { path, text: decoder.decode(content) });
    }
    at += 46 + nameLen + extraLen + commentLen;
  }
  return entries;
}

// ---- src\model\link.ts -------------------------------------------
/**
 * A whole randomizer inside a link.
 *
 * A library link (`#/id/…`) is short and follows your edits, but it only works
 * on a device where that library is stored. This is the other kind: the wheel
 * itself — name, outcomes, weights, colours, Orangey's tags and the
 * randomizer's own animation settings — compressed into the address, so a deck
 * rolls it on anyone's machine with nothing installed and nothing shared in
 * advance.
 *
 * Two properties are worth knowing. The payload sits after the `#`, and
 * browsers never send a fragment to the server, so even the hosted copy never
 * sees anyone's encounter tables. And it is frozen: a deck made today rolls
 * the same wheel in a year, whatever has happened to the library since.
 *
 * What is deliberately left out: `created` and `modified`, which mean nothing
 * to a stranger, and the outcomes' ids, which are library bookkeeping and
 * would be the largest thing in the payload. They are made afresh on the way
 * in.
 */





/** `1` deflated, `0` stored: the first character says which. */
const DEFLATED = "1";
const STORED = "0";

/**
 * Past this many characters a link is long enough to be worth warning about:
 * every browser and both deck programs take it, but it is unwieldy to handle.
 */
const LINK_SOFT_LIMIT = 2000;

/**
 * And past this one Orangey will not offer it at all. Browsers go further,
 * but a link this long has stopped being something you can paste about.
 */
const LINK_HARD_LIMIT = 8000;

const linkEncoder = new TextEncoder();
const linkDecoder = new TextDecoder();

function toBase64Url(bytes            )         {
  let binary = "";
  // In chunks: spreading a large array into fromCharCode overflows the stack.
  for (let i = 0; i < bytes.length; i += 0x8000) {
    binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  }
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function fromBase64Url(text        )             {
  const padded = text.replace(/-/g, "+").replace(/_/g, "/");
  const binary = atob(padded + "=".repeat((4 - (padded.length % 4)) % 4));
  const out = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
  return out;
}

/** The randomizer as it travels: no timestamps, no outcome ids. */
function packRandomizer(r            )                          {
  const packed                          = { ...r };
  delete packed.created;
  delete packed.modified;
  if (r.type === "list") {
    packed.items = r.items.map((item) => {
      // No pictures, ever. The bytes are not in the link and inlining them
      // would make an address nobody can paste, so a wheel opened from a link
      // simply has none — and the id of a picture in someone else's library
      // would mean nothing here anyway.
      const { id: _id, image: _image, imageData: _imageData, ...rest } = item;
      return rest;
    });
  }
  for (const key of Object.keys(packed)) if (packed[key] === undefined) delete packed[key];
  return packed;
}

/** And back: timestamps and outcome ids made afresh, then validated. */
function unpackRandomizer(raw         )             {
  const check = new Check();
  if (!check.object("link", raw)) throw new ValidationError(check.issues);
  const o = { ...(raw                           ) };
  const now = nowIso();
  o.created ??= now;
  o.modified ??= now;
  if (Array.isArray(o.items)) {
    o.items = (o.items                       ).map((item) =>
      typeof item === "object" && item !== null ? { id: newId(), ...item } : item,
    );
  }
  if (!validateRandomizer(o, check, "link")) throw new ValidationError(check.issues);
  return o                         ;
}

/** The value that goes after `w=`. */
async function encodeRandomizer(r            )                  {
  const json = JSON.stringify(packRandomizer(r));
  const raw = linkEncoder.encode(json);
  const { data, method } = await deflate(raw);
  return (method === 8 ? DEFLATED : STORED) + toBase64Url(data);
}

/**
 * Read one back. Throws a ValidationError naming what is wrong, so a damaged
 * link can be explained rather than merely failing.
 */
async function decodeRandomizer(payload        )                      {
  const fail = (message        )        => {
    throw new ValidationError([{ path: "link", message }]);
  };
  if (!payload) fail("there is nothing after w=");
  const marker = payload[0];
  if (marker !== DEFLATED && marker !== STORED) fail("this link was made by a newer Orangey");
  let json        ;
  try {
    const bytes = fromBase64Url(payload.slice(1));
    json = linkDecoder.decode(await inflate(bytes, marker === DEFLATED ? 8 : 0));
  } catch {
    return fail("the link is damaged: it did not survive being copied");
  }
  let parsed         ;
  try {
    parsed = JSON.parse(json);
  } catch {
    return fail("the link is damaged: what it holds is not a randomizer");
  }
  return unpackRandomizer(parsed);
}

/**
 * The play surface: the screen a GM keeps open during a game.
 *
 * One tap to roll, the result in the largest type on screen, and nothing that
 * can be pressed by accident. The quick presets belong to the plain play
 * screen; with a randomizer open from the library they are replaced by a way
 * home, so that a stray press cannot swap out what the table is rolling.
 */


                                                            













                                        


const PRESETS = [4, 6, 8, 10, 12, 20, 100];

/**
 * @param node     a randomizer from the library, or null
 * @param linked   a randomizer that arrived inside a link, when there is one
 */
function createPlayView(
  node                    ,
  params             = { roll: false, present: false },
  linked                    = null,
)       {
  let randomizer             = node?.randomizer ?? linked ?? adHocDice("d20");
  let rolling = false;
  /** Opened from the library or from a link: either way, one fixed randomizer. */
  const fixed = node !== null || linked !== null;

  const result = createResultPanel(fixed ? "Ready" : "Pick something to roll");
  const stage = h("div", { class: "stage" });
  const rollButton = button("Roll", () => void doRoll(), { class: "primary roll-button", style: { width: "100%", minHeight: "52px", fontSize: "17px" } });

  let wheel                                        = null;
  const tray = createDiceTray();
  const coin = createCoin();

  function adHocDice(expression        )             {
    const r = emptyRandomizer("dice", expression)                                       ;
    r.expression = expression;
    return r;
  }

  function buildStage()       {
    wheel = null;
    setChildren(stage);
    if (randomizer.type === "list") {
      if (randomizer.view === "wheel") {
        wheel = createWheel({
          items: () => (randomizer.type === "list" ? randomizer.items : []),
          id: () => randomizer.id,
          onActivate: () => void doRoll(),
        });
        stage.append(wheel.el);
      } else {
        stage.append(renderOutcomeList());
      }
    } else if (randomizer.type === "dice") {
      stage.append(tray.el);
    } else if (randomizer.type === "coin") {
      stage.append(coin.el);
    }
  }

  function renderOutcomeList()              {
    const r = randomizer                                         ;
    const percents = displayPercents(r.items);
    return h("ul", { class: "outcome-list" },
      ...r.items.map((item, i) =>
        h("li", { class: item.disabled ? "disabled muted" : "" },
          h("span", { text: item.label }),
          h("span", { class: "faint", text: ` ${percents[i].toFixed(1)}%` }),
        ),
      ),
    );
  }

  /** The settings this roll uses: global, this randomizer's own, and the play-time switch. */
  const feelNow = () => effectiveFeel(state.prefs.feel, randomizer.feel, state.prefs.animationsOff);

  async function doRoll()                {
    if (rolling) {
      skip();
      return;
    }
    const problem = whyCannotRoll(randomizer);
    if (problem) {
      result.clear(problem);
      state.tell({ type: "roll:fail", source: randomizer.type, reason: problem });
      return;
    }
    let outcome         ;
    try {
      outcome = rollRandomizer(randomizer, state.source());
    } catch (e) {
      result.clear((e         ).message);
      state.tell({ type: "roll:fail", source: randomizer.type, reason: (e         ).message });
      return;
    }

    const feel = feelNow();
    const instant = motionScale(feel.motion) === 0;
    // A list shown as a list has nothing to animate, so it reveals at once.
    const willAnimate =
      !instant &&
      ((randomizer.type === "list" && wheel !== null && outcome.itemIndex !== undefined) ||
        (randomizer.type === "dice" && outcome.dice !== undefined) ||
        randomizer.type === "coin");
    rolling = true;
    rollButton.textContent = willAnimate ? "Skip" : "Roll";

    // The outcome is already decided; nothing shows it until the animation has
    // finished arriving at it, so the table finds out when the dice stop, not
    // when they start. The screen reader is told at the same moment.
    if (willAnimate) {
      result.pending();
      state.tell({ type: "roll:start", source: randomizer.type });
    } else result.show(outcome);

    if (randomizer.type === "list" && wheel && outcome.itemIndex !== undefined) {
      await wheel.spinTo(outcome.itemIndex, feel);
    } else if (randomizer.type === "dice" && outcome.dice) {
      await tray.show(outcome.dice, feel);
    } else if (randomizer.type === "coin") {
      await coin.show(outcome.text, feel);
    }

    if (willAnimate) result.show(outcome);
    // The landing: the result, the announcement and the mascot's reaction
    // all happen here, never at the start (plan C10).
    state.tell({ type: "roll:land", source: randomizer.type, summary: summarize(outcome) });
    rolling = false;
    rollButton.textContent = "Roll";
    void state.record(randomizer, outcome);
  }

  function skip()       {
    wheel?.skip();
    tray.skip();
    coin.skip();
  }

  // ---- quick bar -----------------------------------------------------------

  const expression = h("input", {
    type: "text",
    placeholder: "2d6 + 3",
    "aria-label": "Dice expression",
    spellcheck: "false",
    style: { maxWidth: "160px" },
  });
  const expressionError = h("span", { class: "faint" });
  expression.addEventListener("input", () => {
    const v = expression.value.trim();
    if (!v) {
      expressionError.textContent = "";
      expression.removeAttribute("aria-invalid");
      return;
    }
    const parsed = tryParse(v);
    expressionError.textContent = parsed.ok ? "" : parsed.error.message;
    if (parsed.ok) expression.removeAttribute("aria-invalid");
    else expression.setAttribute("aria-invalid", "true");
  });
  expression.addEventListener("keydown", (e) => {
    if ((e                 ).key !== "Enter") return;
    e.preventDefault();
    const parsed = tryParse(expression.value.trim());
    if (!parsed.ok) return;
    setRandomizer(adHocDice(parsed.expression.normalized));
    void doRoll();
  });

  const quickbar = h("div", { class: "quickbar" },
    ...PRESETS.map((sides) =>
      button(`d${sides}`, () => {
        setRandomizer(adHocDice(`d${sides}`));
        void doRoll();
      }, { class: "preset" }),
    ),
    button("Coin", () => {
      setRandomizer(emptyRandomizer("coin", "Coin"));
      void doRoll();
    }),
    button("1–100", () => {
      setRandomizer(emptyRandomizer("number", "Number"));
      void doRoll();
    }),
    expression,
    expressionError,
  );

  // With a randomizer open from the library the quick presets are replaced by
  // a way back to them: pressing one used to swap out the randomizer the table
  // was in the middle of, which is never what a press meant.
  const homeBar = h("div", { class: "quickbar home-bar" },
    button("← Home", () => navigate("#/"), { class: "ghost home-button", title: "Dice, coins and numbers" }),
  );

  function setRandomizer(next            )       {
    randomizer = next;
    title.textContent = next.type === "dice" ? (next                          ).expression : next.name;
    subtitle.textContent = next.description ?? describeType(next);
    editLink.style.display = node && next.id === node.randomizer?.id ? "" : "none";
    reserveResult();
    result.clear("Ready");
    buildStage();
    // Nothing the old randomizer opened has anything to do with this one.
    chain.reset();
  }

  /** Fix the result panel's height from what this randomizer can produce. */
  function reserveResult()       {
    result.reserve(longestOutcome(randomizer), { seed: state.prefs.seed !== null });
  }

  const title = h("h1", { text: randomizer.type === "dice" ? (randomizer                          ).expression : randomizer.name });
  const subtitle = h("p", { class: "muted", text: randomizer.description ?? describeType(randomizer) });
  const editLink = button("Edit", () => node && navigate(`#/edit/${encodeURIComponent(node.path)}`), { class: "ghost edit-link" });
  editLink.style.display = node ? "" : "none";

  // A wheel that arrived in a link is nobody's until it is saved. The button
  // is one more quiet item in this row rather than anything that interrupts a
  // game: it is not offered at all in full screen, where the row is hidden.
  const saveAdHoc = button(linked ? "Save to my library" : "Save to library", async () => {
    // Keep the identity it came with when nothing here already has it, so a
    // slide link by id finds this copy afterwards.
    const taken = state.library.findById(randomizer.id) !== null;
    const path = await state.library.create("", { ...randomizer, id: taken ? newId() : randomizer.id });
    state.toast("Saved to your library");
    navigate(`#/r/${encodeURIComponent(path)}`);
  }, { class: "ghost save-randomizer" });

  // The panel is about whatever is open, so its Clear takes only those rolls.
  // The quick screen has no one randomizer open — every preset press is a new
  // ad-hoc one — so there it is about everything, which is also all the table
  // can see from here.
  const recent = createRecentRolls({
    ids: () => (fixed ? [randomizer.id] : []),
    scopeName: () => randomizer.name,
  });

  const header = h("div", { class: "row" }, h("div", {}, title, subtitle), h("div", { class: "spacer" }), editLink, node ? null : saveAdHoc);

  // Orangey's place: the corner of the result panel, where he can react to
  // the number without ever sitting on the Roll button.
  result.el.append(h("div", { class: "mascot-slot" }));
  const playCard = h("div", { class: "card play-card" }, header, stage, result.el, rollButton);
  const el = h("div", { class: "play" },
    fixed ? homeBar : quickbar,
    playCard,
    recent.el,
  );

  /**
   * An outcome that points at another randomizer opens it beside this one.
   *
   * The chain's elements are put in as siblings of the play card rather than
   * as a box around it: the full-screen rules are written against
   * `.play > .card`, and a wrapper would quietly take the projector with it.
   * The two columns are a grid on `.play` that exists only while something is
   * open, which is what the classes here say.
   */
  const chain = createChainRow({
    id: () => randomizer.id,
    name: () => randomizer.name,
    card: playCard,
    layout: (open, wide) => {
      el.classList.toggle("has-chain", open);
      el.classList.toggle("chain-wide", wide);
    },
  });
  el.insertBefore(chain.strip, playCard);
  el.insertBefore(chain.open, recent.el);
  el.insertBefore(chain.note, recent.el);

  reserveResult();
  buildStage();
  // Settings can change the seed while this view is alive, and the seed line
  // is part of what the panel reserves room for.
  const unsubscribe = state.subscribe(() => {
    recent.refresh();
    reserveResult();
  }, ["history", "prefs"]);

  /* ---- presenting, and links for slides -------------------------------- */

  function presenting()          {
    return document.body.classList.contains("presenting");
  }

  function setPresenting(on         )       {
    document.body.classList.toggle("presenting", on);
    exitButton.hidden = !on;
    presentButton.textContent = on ? "Leave full screen" : "Full screen";
    if (on && document.documentElement.requestFullscreen) {
      void document.documentElement.requestFullscreen().catch(() => {
        /* the browser may refuse without a gesture; the layout still applies */
      });
    } else if (!on && document.fullscreenElement) {
      void document.exitFullscreen().catch(() => {});
    }
  }

  const exitButton = button("Leave full screen", () => setPresenting(false), { class: "leave-presenting" });
  exitButton.hidden = true;
  const presentButton = button("Full screen", () => setPresenting(!presenting()), { class: "ghost present-button" });

  /**
   * Two kinds of link, side by side.
   *
   * "With the wheel inside" carries the randomizer in the address, so it
   * rolls on anyone's machine and keeps rolling whatever happens to the
   * library — frozen at today's version, and longer. "To my library" is short
   * and follows every edit, but only works where the library is. The first is
   * offered first, because it is what most people pasting into a deck mean.
   */
  async function openLinkDialog()                {
    if (!fixed) return;
    const base = appBase();
    const rollOnOpen = h("input", { type: "checkbox", checked: true });
    const fullScreen = h("input", { type: "checkbox", checked: true });
    const field = h("input", { type: "text", readonly: true, "aria-label": "Link to paste onto a slide", spellcheck: "false" });
    const note = h("p", { class: "faint link-note" });
    const sizeNote = h("p", { class: "warning link-size" });

    let payload                = null;
    try {
      payload = await encodeRandomizer(randomizer);
    } catch {
      payload = null;
    }
    const embeddedLength = payload === null ? Infinity : wheelLink(base, payload, { roll: true, present: true }).length;
    const canEmbed = payload !== null && embeddedLength <= LINK_HARD_LIMIT;
    const canLibrary = node?.randomizer != null;
    if (!canEmbed && !canLibrary) {
      state.toast("This randomizer is too big to put in a link, and it is not in your library.");
      return;
    }

    let kind                         = canEmbed ? "embedded" : "library";
    const kinds = h("div", { class: "segmented link-kinds", role: "group", "aria-label": "What the link carries" });

    const refresh = () => {
      const opts = { roll: rollOnOpen.checked, present: fullScreen.checked };
      field.value = kind === "embedded" && payload
        ? wheelLink(base, payload, opts)
        : slideLink(base, node .randomizer .id, opts);
      note.textContent = kind === "embedded"
        ? "The wheel travels inside the link, so it works for anyone who opens the deck, on any machine, with nothing installed. It is a snapshot: editing the wheel afterwards does not change decks you have already made."
        : "Short, and it follows every edit you make. It points at the randomizer's identity rather than its file name, so renaming it or moving it to another folder will not break the deck — but it only works on a device where this library is stored.";
      const tooLong = kind === "embedded" && field.value.length > LINK_SOFT_LIMIT;
      sizeNote.hidden = !tooLong;
      if (tooLong) {
        sizeNote.textContent = `This link is ${field.value.length} characters. Slides and PowerPoint will take it, but it is unwieldy to handle;${canLibrary ? " a link to your library would be a few dozen." : " trimming the table would shorten it."}`;
      }
      for (const b of kinds.querySelectorAll("button")) {
        b.setAttribute("aria-pressed", b.dataset.kind === kind ? "true" : "false");
      }
    };

    const kindButton = (value                        , label        ) => {
      const b = button(label, () => { kind = value; refresh(); }, { class: `link-kind-${value}` });
      b.dataset.kind = value;
      return b;
    };
    setChildren(kinds,
      canEmbed ? kindButton("embedded", "With the wheel inside") : null,
      canLibrary ? kindButton("library", "To my library") : null,
    );

    rollOnOpen.addEventListener("change", refresh);
    fullScreen.addEventListener("change", refresh);
    refresh();

    const copied = h("span", { class: "faint" });
    const dialog = h("dialog", { class: "link-dialog", "aria-label": "Link for a slide" },
      h("h2", { text: "Link for a slide" }),
      h("p", { class: "faint", text:
        `Put this on a shape or an image in Google Slides or PowerPoint. Clicking it during the presentation opens ${randomizer.name} and rolls it; closing the tab returns you to the deck.` }),
      kinds.children.length > 1 ? kinds : null,
      field,
      h("div", { class: "row tight", style: { marginTop: "10px" } },
        h("label", { class: "row tight" }, rollOnOpen, "Roll as soon as it opens"),
        h("label", { class: "row tight" }, fullScreen, "Fill the screen"),
      ),
      isLinkableBase(base)
        ? null
        : h("p", { class: "warning", text:
            "This copy of Orangey is open from a file rather than a web address, so this link will not work from a slide — browsers refuse to follow a link from a web page to a local file. Open the published copy and make the link there." }),
      sizeNote,
      note,
      h("div", { class: "row", style: { marginTop: "14px" } },
        button("Copy", async () => {
          try {
            await navigator.clipboard.writeText(field.value);
            copied.textContent = "Copied";
          } catch {
            field.select();
            copied.textContent = "Press Ctrl+C to copy";
          }
        }, { class: "primary copy-link" }),
        copied,
        h("div", { class: "spacer" }),
        button("Close", () => dialog.close()),
      ),
    );
    dialog.addEventListener("close", () => dialog.remove());
    document.body.appendChild(dialog);
    dialog.showModal();
    field.select();
  }

  const linkButton = button("Link…", () => void openLinkDialog(), { class: "ghost link-button" });
  linkButton.hidden = !fixed;

  // Switch animation off for now without touching the settings — after the
  // fortieth roll of the evening nobody wants to watch the wheel.
  const animateBox = h("input", { type: "checkbox", checked: !state.prefs.animationsOff, "aria-label": "Animate rolls" });
  animateBox.addEventListener("change", () => void state.savePrefs({ animationsOff: !animateBox.checked }));
  const animateToggle = h("label", { class: "row tight animate-toggle faint" }, animateBox, "Animate");

  header.append(animateToggle, presentButton, linkButton, exitButton);

  if (params.present) setPresenting(true);
  if (params.roll) {
    // Wait a frame so the stage is laid out before the animation starts.
    requestAnimationFrame(() => void doRoll());
  }

  const onKey = (e               ) => {
    const target = e.target                      ;
    const typing = target && ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName);
    if (e.key === "Escape") {
      // Mid-roll, Escape means "get to the answer"; otherwise it leaves the
      // full-screen view, which is the only way out on a projector.
      if (rolling) skip();
      else if (document.body.classList.contains("presenting")) setPresenting(false);
      return;
    }
    if (typing) return;
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      // A chain is rolled from its newest end: that is the randomizer the
      // table is waiting on, and the one behind it has already answered.
      if (!chain.rollNewest()) void doRoll();
    }
  };
  document.addEventListener("keydown", onKey);

  return {
    el,
    destroy() {
      document.removeEventListener("keydown", onKey);
      // The full-screen class belongs to the app, which clears it before each
      // render: a view being torn down must not undo what the view replacing
      // it has already set up.
      chain.destroy();
      unsubscribe();
    },
  };
}

function describeType(r            )         {
  switch (r.type) {
    case "list":
      return `${r.items.filter((i) => !i.disabled && i.weight > 0).length} possible outcomes`;
    case "dice":
      return "Dice";
    case "coin":
      return `${r.faces[0]} or ${r.faces[1]}`;
    case "number":
      return `${r.min} to ${r.max}`;
    case "board":
      return `${r.entries.length} randomizer${r.entries.length === 1 ? "" : "s"}`;
  }
}
