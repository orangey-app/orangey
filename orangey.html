/**
 * A very small validation helper.
 *
 * The plan called for zod; the build sandbox has no package registry, so this
 * is the ~100 lines of it that the file format actually needs. It keeps the
 * property that mattered: every failure names the path that failed
 * ("items[3].weight"), because that is what makes an import report useful.
 */

                        
               
                  
 

class ValidationError extends Error {
  issues         ;
  constructor(issues         ) {
    super(issues.map((i) => `${i.path}: ${i.message}`).join("; "));
    this.name = "ValidationError";
    this.issues = issues;
  }
}

class Check {
  issues          = [];

  fail(path        , message        )       {
    this.issues.push({ path, message });
  }

  get ok()          {
    return this.issues.length === 0;
  }

  throwIfFailed()       {
    if (!this.ok) throw new ValidationError(this.issues);
  }

  object(path        , v         )                               {
    if (typeof v !== "object" || v === null || Array.isArray(v)) {
      this.fail(path, "expected an object");
      return false;
    }
    return true;
  }

  array(path        , v         , min = 0)                 {
    if (!Array.isArray(v)) {
      this.fail(path, "expected a list");
      return false;
    }
    if (v.length < min) {
      this.fail(path, `expected at least ${min} entr${min === 1 ? "y" : "ies"}`);
      return false;
    }
    return true;
  }

  string(path        , v         , opts                                 = {})              {
    if (typeof v !== "string") {
      this.fail(path, "expected text");
      return false;
    }
    if (opts.min !== undefined && v.length < opts.min) {
      this.fail(path, opts.min === 1 ? "must not be empty" : `must be at least ${opts.min} characters`);
      return false;
    }
    if (opts.max !== undefined && v.length > opts.max) {
      this.fail(path, `must be at most ${opts.max} characters`);
      return false;
    }
    return true;
  }

  number(path        , v         , opts                                                    = {})              {
    if (typeof v !== "number" || !Number.isFinite(v)) {
      this.fail(path, "expected a number");
      return false;
    }
    if (opts.integer && !Number.isInteger(v)) {
      this.fail(path, "expected a whole number");
      return false;
    }
    if (opts.min !== undefined && v < opts.min) {
      this.fail(path, `must be at least ${opts.min}`);
      return false;
    }
    if (opts.max !== undefined && v > opts.max) {
      this.fail(path, `must be at most ${opts.max}`);
      return false;
    }
    return true;
  }

  boolean(path        , v         )               {
    if (typeof v !== "boolean") {
      this.fail(path, "expected true or false");
      return false;
    }
    return true;
  }

  oneOf                  (path        , v         , allowed              )         {
    if (typeof v !== "string" || !allowed.includes(v     )) {
      this.fail(path, `expected one of ${allowed.join(", ")}`);
      return false;
    }
    return true;
  }
}

// ---- src/core/weighted.ts ----------------------------------------
/**
 * Weighted selection over a list of outcomes.
 *
 * Weights are non-negative reals and the app normalizes them (decision D6), so
 * {50,30,20} and {5,3,2} behave identically. An outcome is excluded when it is
 * disabled or its weight is zero; `disabled` is a separate flag so that turning
 * an outcome off and on again restores its original weight exactly.
 */

                                             

                           
                 
                     
 

class NotRollableError extends Error {
  constructor(msg = "no outcome can come up") {
    super(msg);
    this.name = "NotRollableError";
  }
}

/** The single definition of "can this outcome come up". */
function isRollable(item          )          {
  return !item.disabled && Number.isFinite(item.weight) && item.weight > 0;
}

/**
 * The same list with what has already been drawn taken out of play.
 *
 * Marked `disabled` rather than filtered: `Outcome.itemIndex`, the wheel's
 * colours and an outcome's chain target are all positions in this array, so
 * the order and the length have to survive. A drawn outcome is exactly an
 * outcome that cannot come up, which is what `disabled` already means.
 */
function withoutDrawn                                     (items              , drawn                     )      {
  return items.map((item) => (drawn.has(item.id) ? { ...item, disabled: true } : item));
}

function isValidWeight(w         )              {
  return typeof w === "number" && Number.isFinite(w) && w >= 0;
}

/** Indices of the outcomes that can come up, in list order. */
function rollableIndices(items                     )           {
  const out           = [];
  for (let i = 0; i < items.length; i++) if (isRollable(items[i])) out.push(i);
  return out;
}

function totalWeight(items                     )         {
  let t = 0;
  for (const it of items) if (isRollable(it)) t += it.weight;
  return t;
}

/**
 * Share of the total for each item, in list order. Non-rollable items get 0.
 * The shares of rollable items sum to 1 (up to floating point).
 */
function normalize(items                     )           {
  const total = totalWeight(items);
  if (total <= 0) return items.map(() => 0);
  return items.map((it) => (isRollable(it) ? it.weight / total : 0));
}

/** Percentages rounded for display, guaranteed to read as summing to 100. */
function displayPercents(items                     , decimals = 1)           {
  const shares = normalize(items);
  const f = 10 ** decimals;
  const rounded = shares.map((s) => Math.round(s * 100 * f) / f);
  // Largest-remainder correction so the column does not read 99.9 %.
  const live = rollableIndices(items);
  if (live.length === 0) return rounded;
  const sum = live.reduce((a, i) => a + rounded[i], 0);
  const drift = Math.round((100 - sum) * f) / f;
  if (drift !== 0) {
    let biggest = live[0];
    for (const i of live) if (shares[i] > shares[biggest]) biggest = i;
    rounded[biggest] = Math.round((rounded[biggest] + drift) * f) / f;
  }
  return rounded;
}

/** Cumulative weights over the rollable items, for binary search. */
                                  
                                                      
                    
                                                                                
                       
                
 

function buildCumulative(items                     )                  {
  const indices           = [];
  const cumulative           = [];
  let running = 0;
  for (let i = 0; i < items.length; i++) {
    if (!isRollable(items[i])) continue;
    running += items[i].weight;
    indices.push(i);
    cumulative.push(running);
  }
  return { indices, cumulative, total: running };
}

/** Index of the first cumulative entry strictly greater than x. */
function upperBound(cumulative                   , x        )         {
  let lo = 0;
  let hi = cumulative.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (cumulative[mid] > x) hi = mid;
    else lo = mid + 1;
  }
  return lo;
}

/**
 * Pick one outcome. Returns the index into the original array so callers can
 * keep their own item objects.
 */
function pickWeightedIndex(items                     , rng              )         {
  const table = buildCumulative(items);
  if (table.total <= 0) throw new NotRollableError();
  return pickFromTable(table, rng);
}

function pickFromTable(table                 , rng              )         {
  if (table.total <= 0) throw new NotRollableError();
  const x = rng.float() * table.total;
  const at = upperBound(table.cumulative, x);
  return table.indices[at];
}

/** Uniform pick over any array; used where weights do not apply. */
function pick   (items              , rng              )    {
  if (items.length === 0) throw new NotRollableError("empty list");
  return items[rng.int(0, items.length - 1)];
}

/**
 * Draw `count` distinct outcomes without replacement (bag mode's core; also
 * used by "random order" in 0.2). Throws if fewer rollable outcomes exist.
 */
function drawWithoutReplacement(
  items                     ,
  count        ,
  rng              ,
)           {
  const live = rollableIndices(items);
  if (count > live.length) {
    throw new NotRollableError(`asked for ${count} outcomes, only ${live.length} can come up`);
  }
  const pool = live.map((i) => ({ index: i, weight: items[i].weight }));
  const out           = [];
  for (let k = 0; k < count; k++) {
    // pickFromTable returns a position in `pool`, not in `items`.
    const poolPos = pickFromTable(buildCumulative(pool), rng);
    out.push(pool[poolPos].index);
    pool.splice(poolPos, 1);
  }
  return out;
}

/**
 * Colour maths: sRGB <-> OKLab, perceptual distance, WCAG contrast, and a
 * deuteranopia simulation. Everything the palette work in C8 needs, in one
 * dependency-free module.
 */

                                                       // 0..1
                                                        

function hexToRgb(hex        )      {
  const h = hex.trim().replace(/^#/, "");
  const full = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
  if (!/^[0-9a-fA-F]{6}$/.test(full)) throw new Error(`not a colour: ${hex}`);
  return {
    r: Number.parseInt(full.slice(0, 2), 16) / 255,
    g: Number.parseInt(full.slice(2, 4), 16) / 255,
    b: Number.parseInt(full.slice(4, 6), 16) / 255,
  };
}

function rgbToHex({ r, g, b }     )         {
  const c = (v        ) => Math.round(Math.min(1, Math.max(0, v)) * 255).toString(16).padStart(2, "0");
  return `#${c(r)}${c(g)}${c(b)}`;
}

function isHex(s         )              {
  return typeof s === "string" && /^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(s.trim());
}

const toLinear = (v        ) => (v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
const toGamma = (v        ) => (v <= 0.0031308 ? v * 12.92 : 1.055 * v ** (1 / 2.4) - 0.055);

function linearize({ r, g, b }     )      {
  return { r: toLinear(r), g: toLinear(g), b: toLinear(b) };
}
function delinearize({ r, g, b }     )      {
  return { r: toGamma(r), g: toGamma(g), b: toGamma(b) };
}

/** Björn Ottosson's OKLab. Perceptually uniform enough for "do these clash". */
function rgbToOklab(rgb     )        {
  const { r, g, b } = linearize(rgb);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return {
    L: 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s,
    a: 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s,
    b: 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s,
  };
}

function oklabToRgb({ L, a, b }       )      {
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return delinearize({
    r: 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    g: -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    b: -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
  });
}

const hexToOklab = (hex        )        => rgbToOklab(hexToRgb(hex));

/** Euclidean distance in OKLab. Roughly: 0.02 is "just noticeable". */
function deltaE(a       , b       )         {
  return Math.hypot(a.L - b.L, a.a - b.a, a.b - b.b);
}

function chroma({ a, b }       )         {
  return Math.hypot(a, b);
}

/** Hue angle in degrees, 0..360. */
function hueAngle({ a, b }       )         {
  const deg = (Math.atan2(b, a) * 180) / Math.PI;
  return deg < 0 ? deg + 360 : deg;
}

function hueDifference(a       , b       )         {
  const d = Math.abs(hueAngle(a) - hueAngle(b)) % 360;
  return d > 180 ? 360 - d : d;
}

/** Viénot's linear-RGB approximation of deuteranopia. Good enough to catch
 *  the red/green pairs that a wheel must not put side by side. */
function simulateDeuteranopia(rgb     )      {
  const { r, g, b } = linearize(rgb);
  return delinearize({
    r: 0.625 * r + 0.375 * g,
    g: 0.7 * r + 0.3 * g,
    b: 0.3 * g + 0.7 * b,
  });
}

function relativeLuminance(rgb     )         {
  const { r, g, b } = linearize(rgb);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

/** WCAG 2.1 contrast ratio, 1..21. */
function contrastRatio(a     , b     )         {
  const la = relativeLuminance(a);
  const lb = relativeLuminance(b);
  const [hi, lo] = la > lb ? [la, lb] : [lb, la];
  return (hi + 0.05) / (lo + 0.05);
}

const WHITE      = { r: 1, g: 1, b: 1 };
const BLACK      = { r: 0, g: 0, b: 0 };

                              
                                         
                             
                                                                           
               
                
                                                                                
                 
 

/**
 * Choose black or white label ink for a fill, nudging the fill's lightness in
 * small steps if neither reaches the target ratio. A pool colour that still
 * fails after `maxNudges` is a curation bug and the build test says so.
 */
function labelFor(fillHex        , target = 4.5, maxNudges = 6)              {
  let fill = fillHex;
  for (let n = 0; n <= maxNudges; n++) {
    const rgb = hexToRgb(fill);
    const onWhite = contrastRatio(rgb, WHITE);
    const onBlack = contrastRatio(rgb, BLACK);
    const useWhite = onWhite >= onBlack;
    const ratio = useWhite ? onWhite : onBlack;
    if (ratio >= target) {
      return { ink: useWhite ? "#ffffff" : "#000000", fill, ratio, nudges: n };
    }
    // Push away from mid-grey: darker if white ink is winning, lighter if black.
    const lab = rgbToOklab(rgb);
    lab.L = Math.min(1, Math.max(0, lab.L + (useWhite ? -0.02 : 0.02)));
    fill = rgbToHex(oklabToRgb(lab));
  }
  const rgb = hexToRgb(fill);
  const onWhite = contrastRatio(rgb, WHITE);
  const onBlack = contrastRatio(rgb, BLACK);
  const useWhite = onWhite >= onBlack;
  return {
    ink: useWhite ? "#ffffff" : "#000000",
    fill,
    ratio: Math.max(onWhite, onBlack),
    nudges: maxNudges + 1,
  };
}

function mix(aHex        , bHex        , t        )         {
  const a = hexToOklab(aHex);
  const b = hexToOklab(bHex);
  return rgbToHex(oklabToRgb({ L: a.L + (b.L - a.L) * t, a: a.a + (b.a - a.a) * t, b: a.b + (b.b - a.b) * t }));
}

// ---- src/core/wheel-geometry.ts ----------------------------------
/**
 * Wheel geometry: weights in, arcs out (plan C4).
 *
 * Angles are degrees measured clockwise from twelve o'clock. The pointer sits
 * at three o'clock, because labels are written along the radius, reading
 * outwards: whatever lands under a pointer on the right arrives horizontal and
 * reads left to right towards it. The wheel rotates; the pointer never moves.
 */

                                             


                          
                                               
                
                     
                   
                   
                                     
                
 

                                
                                                                            
                    
                                                             
                      
 

/**
 * One segment per rollable outcome, in list order. Disabled outcomes and
 * zero-weight outcomes take no space at all — the remaining segments simply
 * grow to fill the wheel.
 */
function layout(items                     , opts                = {})            {
  const pad = opts.padAngle ?? 0.25;
  const shares = normalize(items);
  const live           = [];
  for (let i = 0; i < items.length; i++) if (isRollable(items[i])) live.push(i);
  if (live.length === 0) return [];

  // With one live outcome a gap would leave a visible seam in a full circle.
  const usePad = live.length > 1 ? pad : 0;
  let angle = opts.startAngle ?? 0;
  const out            = [];
  for (const index of live) {
    const span = shares[index] * 360;
    // A slice thinner than the gap would otherwise end before it starts; the
    // gap never takes more than half of it.
    const gap = Math.min(usePad, span / 2);
    const start = angle + gap / 2;
    const end = angle + span - gap / 2;
    out.push({ index, startAngle: start, endAngle: end, midAngle: (start + end) / 2, share: shares[index] });
    angle += span;
  }
  return out;
}

/** Where the pointer sits, in the same degrees as the segments: three o'clock. */
const POINTER_ANGLE = 90;

/**
 * The most a winning label may lean away from horizontal when the wheel stops.
 * Only an outcome taking nearly half the wheel or more is affected: its
 * landing point is kept this close to the segment's middle, so the label under
 * the pointer never tips over past vertical.
 */
const MAX_LANDING_TILT = 75;

const rad = (deg        ) => ((deg - 90) * Math.PI) / 180;

function pointOnCircle(cx        , cy        , r        , deg        )                   {
  return [cx + r * Math.cos(rad(deg)), cy + r * Math.sin(rad(deg))];
}

/**
 * SVG path for an annular segment. `inner` of 0 gives a pie slice.
 * A segment spanning the whole circle is drawn as two arcs, because a single
 * 360° arc collapses to nothing in SVG.
 */
function arcPath(seg         , cx        , cy        , outer        , inner = 0)         {
  const span = seg.endAngle - seg.startAngle;
  if (span >= 359.999) {
    const p = (r        ) => `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx - 0.001} ${cy - r} Z`;
    return inner > 0 ? `${p(outer)} ${p(inner)}` : p(outer);
  }
  const large = span > 180 ? 1 : 0;
  const [x1, y1] = pointOnCircle(cx, cy, outer, seg.startAngle);
  const [x2, y2] = pointOnCircle(cx, cy, outer, seg.endAngle);
  if (inner <= 0) {
    return `M ${cx} ${cy} L ${x1} ${y1} A ${outer} ${outer} 0 ${large} 1 ${x2} ${y2} Z`;
  }
  const [x3, y3] = pointOnCircle(cx, cy, inner, seg.endAngle);
  const [x4, y4] = pointOnCircle(cx, cy, inner, seg.startAngle);
  return `M ${x1} ${y1} A ${outer} ${outer} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${inner} ${inner} 0 ${large} 0 ${x4} ${y4} Z`;
}

                           
                                                           
                   
                                                                               
                       
                   
 

/**
 * Plan a spin that ends with the pointer inside `segment`.
 *
 * The result is decided before this is called (decision D7); all this does is
 * choose a pleasant-looking way to arrive there. The landing point is drawn
 * uniformly within the segment but kept clear of both edges, so the pointer
 * never appears to sit exactly on a boundary — which looks like a bug even
 * when it is not — and within MAX_LANDING_TILT of the middle, so the winning
 * label arrives readable.
 */
function planSpin(
  segment         ,
  rng              ,
  opts                                                                    = {},
)           {
  const turns = Math.max(0, Math.round(opts.turns ?? 6));
  const margin = opts.edgeMargin ?? 0.06;
  const span = segment.endAngle - segment.startAngle;
  // Half the window the landing may fall in, measured from the middle: clear
  // of both edges, and never so far from the middle that the label tips over.
  const half = Math.min(span / 2 - span * margin, MAX_LANDING_TILT);
  const landing = segment.midAngle - half + rng.float() * Math.max(0, 2 * half);

  const current = opts.currentRotation ?? 0;
  // Rotation that brings `landing` under the pointer, then whole turns on top,
  // always forwards from where the wheel is now.
  const base = ((POINTER_ANGLE - landing - current) % 360 + 360) % 360;
  return { rotation: current + base + turns * 360, landingAngle: landing, segment };
}

/** Which segment is under the pointer at a given rotation. For tests. */
function segmentAtPointer(segments                    , rotation        )                 {
  const at = (((POINTER_ANGLE - rotation) % 360) + 360) % 360;
  for (const s of segments) {
    const start = ((s.startAngle % 360) + 360) % 360;
    const end = start + (s.endAngle - s.startAngle);
    if ((at >= start && at <= end) || (at + 360 >= start && at + 360 <= end)) return s;
  }
  return null;
}

/** Room for one label written along a segment's radius. */
                                  
                   
                                                                                    
                
                                                                                          
                
                                                                            
                 
 

/**
 * How much text a slice can carry along its radius.
 *
 * Along the radius the length is bounded by the wheel, not by the slice; the
 * slice only has to be as wide as the letters are tall. A slice narrows towards
 * the hub, so the text is anchored at the rim and may run inwards only as far
 * as the slice is still `lineHeight` × the font size wide. Returns null when not
 * even a few letters would fit — the list and the result panel name the slice
 * instead.
 */
function radialLabelRoom(
  span        ,
  opts                                                                        ,
)                         {
  const lineHeight = opts.lineHeight ?? 1.15;
  const fontSize = span >= 40 ? 13 : span >= 20 ? 12 : span >= 12 ? 11 : span >= 8.5 ? 10 : 9;
  // Chord width of the slice at radius r is 2 r sin(span / 2); past a half
  // circle the slice is wider than its chord, so cap the half-angle at 90°.
  const halfSine = Math.sin((Math.min(span, 180) * Math.PI) / 360);
  const narrowest = halfSine > 0 ? (lineHeight * fontSize) / (2 * halfSine) : Infinity;
  const inner = Math.max(opts.hub, narrowest);
  const length = opts.outer - inner;
  // A rough average advance for a semibold sans is 0.6 em.
  if (length < (opts.minChars ?? 3) * 0.6 * fontSize) return null;
  return { fontSize, outer: opts.outer, inner, length };
}

/**
 * What a slice shows when its outcome has a picture: the picture alone (the
 * default), the name alone, or both side by side. Slices without a picture
 * always show their name.
 */
const SLICE_CONTENTS = ["pictures", "names", "both"]         ;
                                                           

/** A picture's round medallion: its centre's distance from the wheel's centre, and its diameter. */
                                 
                 
               
 

                              
                                   
                                
 

/** Room left between the medallion and the name, so the two never touch. */
const MEDALLION_GAP = 4;
/** Below this a medallion is a coloured dot, not a picture anyone can read. */
const MEDALLION_MIN = 18;

/**
 * What goes in one slice, and where.
 *
 * `rim` is how far out anything may reach (the pointer covers the last few
 * pixels) and `hub` how far in. A slice shows a picture or a name, never one
 * laid over the other: with "both", the picture moves out to the rim and the
 * name gets what is left between it and the hub; when that is too little for
 * even a few letters, the picture gives way, because someone who asked for
 * both has said the names matter.
 */
function sliceLayout(
  span        ,
  opts                                                                                                        ,
)              {
  const labelRoom = (outer        ) => (opts.labels ? radialLabelRoom(span, { outer, hub: opts.hub }) : null);
  const plain = { medallion: null, label: labelRoom(opts.rim) };
  if (!opts.picture || opts.content === "names" || span < 12) return plain;

  // Chord of the slice at radius r is 2 r sin(span / 2); 0.85 of it keeps the
  // medallion off the slice's edges.
  const fit = 0.85 * 2 * Math.sin((Math.min(span, 180) * Math.PI) / 360);
  if (opts.content === "pictures") {
    const centre = opts.radius * 0.62;
    const side = Math.min(opts.radius * 0.4, centre * fit);
    return { medallion: { centre, side }, label: null };
  }

  // Both: the medallion's outer edge at the rim, so centre = rim - side / 2,
  // and the chord there has to hold it: side <= (rim - side / 2) * fit.
  const side = Math.min(opts.radius * 0.3, (opts.rim * fit) / (1 + fit / 2));
  if (side < MEDALLION_MIN) return plain;
  const medallion = { centre: opts.rim - side / 2, side };
  const label = labelRoom(medallion.centre - side / 2 - MEDALLION_GAP);
  return label || !opts.labels ? { medallion, label } : plain;
}

/**
 * The longest start of `label` that fits in `width`, with an ellipsis when
 * anything had to go. `measure` returns a string's advance at the font in use.
 */
function fitLabelToWidth(label        , width        , measure                          )         {
  if (measure(label) <= width) return label;
  const chars = Array.from(label);
  let lo = 0;
  let hi = chars.length;
  // Binary search on the kept prefix length; `lo` always fits.
  while (lo < hi) {
    const mid = Math.ceil((lo + hi) / 2);
    if (measure(`${chars.slice(0, mid).join("").trimEnd()}…`) <= width) lo = mid;
    else hi = mid - 1;
  }
  return lo === 0 ? "…" : `${chars.slice(0, lo).join("").trimEnd()}…`;
}

                               
                                                                        
                
                           
              
                                                
                
 

/**
 * Which slice of a long list the ticker should actually build.
 *
 * A list of five thousand outcomes is five thousand rows of DOM, so the strip
 * is capped. Capping it at the first `size` rows works until the winner is
 * beyond them: the strip then scrolls to a row that was never built and the
 * ticker lands on nothing. So the window follows the winner instead, with a
 * few rows of run-up in front of it for the roll to travel through.
 */
function tickerWindow(liveCount        , position        , size = 80, tail = 3)               {
  const start = Math.max(0, position - tail);
  const end = Math.min(liveCount, start + size);
  return { start, end, local: position - start };
}

// ---- src/model/randomizer.ts -------------------------------------
/**
 * The randomizer types (plan C2).
 *
 * "Choice", "weighted choice" and "wheel" are one type with two views
 * (decision D5): a list of weighted outcomes. Uniform choice is equal weights.
 */





                                              

/** The types that can be rolled. A board is not one of them; it holds them. */
const ROLLABLE_TYPES = ["list", "dice", "coin", "number"]         ;
const RANDOMIZER_TYPES = [...ROLLABLE_TYPES, "board"]         ;
                                                           
                                                               

/**
 * How many randomizers one board may hold. Past a dozen the cells are too
 * small to read across the table, which is what a board is for.
 */
const BOARD_LIMIT = 12;

/**
 * How many outcomes a wheel may offer to choose from. One is no choice at
 * all, and past a dozen the cards stop being something to choose between at
 * a glance and become a list to read.
 */
const OFFER_MIN = 2;
const OFFER_MAX = 12;

/**
 * What Orangey does when a particular outcome comes up. Wheels and coins have
 * no natural top or bottom the way dice do, so the game master tags outcomes
 * instead: the file says what he does ("cheer", "wince"), never which
 * animation plays, so new poses need no format change.
 */
const OUTCOME_REACTIONS = ["cheer", "wince"]         ;
                                                                 

                                 
             
                       
               
                       
                  
                  
                   
                                                                                   
                      
 

                                            
             
                
                 
                                                                                  
                     
                       
                 
                                                       
                                                       
                             
     
                                                                          
                                                                       
     
                 
     
                                                                            
                                                                               
                                                                            
                    
     
                     
     
                                                                               
                                                                             
                                                          
     
                  
 

                                                        
               
                    
                         
                                                                              
                               
     
                                                                        
                                                                         
     
                        
     
                                                                            
                                                                             
                                                                             
                                  
     
                 
 

                                                        
               
                     
 

                                                        
               
                          
                                                                       
                                                                   
 

                                                          
                 
              
              
                   
                        
                
                  
 

/**
 * A board: several randomizers on one screen, rolled together or one at a
 * time. It refers to them by id, so renaming or moving one does not break the
 * board, and carries the name each had when it was added — enough to say what
 * is missing when a randomizer has been deleted.
 */
                             
             
               
 

                                                         
                
                        
 

/** Everything that can actually be rolled. */
                                                                                           
                                                    

function isBoard(r            )                       {
  return r.type === "board";
}

function newId()         {
  const c = globalThis.crypto          ;
  if (typeof c.randomUUID === "function") return c.randomUUID();
  const b = new Uint8Array(16);
  c.getRandomValues(b);
  return [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
}

function nowIso()         {
  return new Date().toISOString();
}

function touch                      (r   )    {
  return { ...r, modified: nowIso() };
}

function makeItem(label        , weight = 1, extra                    = {})           {
  return { id: newId(), label, weight, ...extra };
}

function emptyRandomizer(type                , name        )             {
  const base = { id: newId(), name, created: nowIso(), modified: nowIso() };
  switch (type) {
    case "list":
      return { ...base, type: "list", view: "wheel", items: [makeItem("First outcome"), makeItem("Second outcome")] };
    case "dice":
      return { ...base, type: "dice", expression: "d20" };
    case "coin":
      return { ...base, type: "coin", faces: ["Heads", "Tails"] };
    case "number":
      return { ...base, type: "number", min: 1, max: 100, integer: true, inclusiveMax: true, count: 1, unique: false };
    case "board":
      return { ...base, type: "board", entries: [] };
  }
}

/** Does this randomizer have anything that can come up right now? */
function canRoll(r            )          {
  // A board rolls what is on it; on its own it has nothing to come up.
  if (r.type === "board") return r.entries.length > 0;
  if (r.type !== "list") return true;
  return r.items.some(isRollable);
}

function validateRandomizer(v         , check = new Check(), path = "randomizer")          {
  if (!check.object(path, v)) return false;
  const o = v                           ;
  check.string(`${path}.id`, o.id, { min: 1 });
  check.string(`${path}.name`, o.name, { min: 1, max: 120 });
  if (o.description !== undefined) check.string(`${path}.description`, o.description, { max: 2000 });
  if (o.tags !== undefined && check.array(`${path}.tags`, o.tags)) {
    (o.tags             ).forEach((t, i) => check.string(`${path}.tags[${i}]`, t, { min: 1, max: 40 }));
  }
  if (o.feel !== undefined && !check.object(`${path}.feel`, o.feel)) return false;
  if (o.created !== undefined) check.string(`${path}.created`, o.created, { min: 1 });
  if (o.modified !== undefined) check.string(`${path}.modified`, o.modified, { min: 1 });
  if (!check.oneOf(`${path}.type`, o.type, RANDOMIZER_TYPES)) return false;

  switch (o.type) {
    case "list": {
      if (o.view !== undefined) check.oneOf(`${path}.view`, o.view, ["wheel", "list"]         );
      if (o.withoutReplacement !== undefined) check.boolean(`${path}.withoutReplacement`, o.withoutReplacement);
      if (o.slices !== undefined) check.oneOf(`${path}.slices`, o.slices, SLICE_CONTENTS);
      if (o.offer !== undefined) check.number(`${path}.offer`, o.offer, { min: OFFER_MIN, max: OFFER_MAX, integer: true });
      if (check.array(`${path}.items`, o.items, 1)) {
        (o.items             ).forEach((it, i) => validateItem(it, check, `${path}.items[${i}]`));
      }
      break;
    }
    case "dice":
      check.string(`${path}.expression`, o.expression, { min: 1, max: 200 });
      break;
    case "coin":
      if (check.array(`${path}.faces`, o.faces, 2)) {
        const faces = o.faces             ;
        if (faces.length !== 2) check.fail(`${path}.faces`, "a coin has exactly two faces");
        faces.slice(0, 2).forEach((f, i) => check.string(`${path}.faces[${i}]`, f, { min: 1, max: 60 }));
      }
      if (o.faceReactions !== undefined && check.array(`${path}.faceReactions`, o.faceReactions)) {
        const fr = o.faceReactions             ;
        if (fr.length !== 2) check.fail(`${path}.faceReactions`, "one entry per face");
        fr.slice(0, 2).forEach((v, i) => {
          if (v !== null) check.oneOf(`${path}.faceReactions[${i}]`, v, OUTCOME_REACTIONS);
        });
      }
      break;
    case "board": {
      if (check.array(`${path}.entries`, o.entries)) {
        const entries = o.entries             ;
        if (entries.length > BOARD_LIMIT) check.fail(`${path}.entries`, `a board holds at most ${BOARD_LIMIT} randomizers`);
        const seen = new Set        ();
        entries.forEach((e, i) => {
          if (!check.object(`${path}.entries[${i}]`, e)) return;
          const entry = e                           ;
          check.string(`${path}.entries[${i}].id`, entry.id, { min: 1 });
          check.string(`${path}.entries[${i}].name`, entry.name, { min: 1, max: 120 });
          if (typeof entry.id === "string") {
            // The same randomizer twice would roll itself against itself and
            // give two answers to one question.
            if (seen.has(entry.id)) check.fail(`${path}.entries[${i}].id`, "already on this board");
            seen.add(entry.id);
          }
        });
      }
      break;
    }
    case "number":
      check.number(`${path}.min`, o.min);
      check.number(`${path}.max`, o.max);
      check.boolean(`${path}.integer`, o.integer);
      check.boolean(`${path}.inclusiveMax`, o.inclusiveMax);
      check.number(`${path}.count`, o.count, { min: 1, max: 1000, integer: true });
      check.boolean(`${path}.unique`, o.unique);
      if (typeof o.min === "number" && typeof o.max === "number" && o.max < o.min) {
        check.fail(`${path}.max`, "must not be below the minimum");
      }
      break;
  }
  return check.ok;
}

/** A picture small enough to sit in a file: 1600px on its long edge, at most. */
const IMAGE_MAX_EDGE = 1600;

function validateItem(v         , check       , path        )       {
  if (!check.object(path, v)) return;
  const o = v                           ;
  check.string(`${path}.id`, o.id, { min: 1 });
  check.string(`${path}.label`, o.label, { min: 1, max: 200 });
  check.number(`${path}.weight`, o.weight, { min: 0 });
  if (o.disabled !== undefined) check.boolean(`${path}.disabled`, o.disabled);
  if (o.description !== undefined) check.string(`${path}.description`, o.description, { max: 2000 });
  if (o.color !== undefined && !isHex(o.color)) check.fail(`${path}.color`, "expected a colour like #a33a30");
  if (o.reaction !== undefined) check.oneOf(`${path}.reaction`, o.reaction, OUTCOME_REACTIONS);
  if (o.image !== undefined) check.string(`${path}.image`, o.image, { min: 1, max: 200 });
  if (o.goesTo !== undefined) check.string(`${path}.goesTo`, o.goesTo, { min: 1, max: 200 });
  if (o.imageData !== undefined) {
    // Only a picture, and only inline: a file arriving with a link in this
    // field would be asking the app to fetch something when a wheel is drawn.
    if (check.string(`${path}.imageData`, o.imageData, { min: 1 }) && !/^data:image\/(png|jpeg|webp|gif);base64,/.test(o.imageData          )) {
      check.fail(`${path}.imageData`, "expected an inline picture (a data:image/… URL)");
    }
  }
  if (o.metadata !== undefined && check.object(`${path}.metadata`, o.metadata)) {
    for (const [k, mv] of Object.entries(o.metadata                           )) {
      if (!["string", "number", "boolean"].includes(typeof mv)) {
        check.fail(`${path}.metadata.${k}`, "expected text, a number or true/false");
      }
    }
  }
}

// ---- src/model/file.ts -------------------------------------------
/**
 * The .orangey.json file format (plan C3, decision D10).
 *
 * Rules that the round-trip test enforces:
 *   - UTF-8, LF, two-space indent, keys in a fixed order, so Git diffs stay
 *     readable and a file edited by hand does not churn;
 *   - unknown keys are preserved, so a file written by a newer Orangey and
 *     re-saved by an older one does not silently lose information;
 *   - a file whose version is newer than we know opens read-only rather than
 *     being guessed at.
 */




const FORMAT = "orangey";
const FORMAT_VERSION = 1;
const FILE_SUFFIX = ".orangey.json";

                              
                        
                  
                         
                                                                          
                                    
 

const RANDOMIZER_KEY_ORDER = [
  "id", "type", "name", "description", "tags", "view", "withoutReplacement", "slices",
  "expression", "faces", "faceReactions", "min", "max", "integer", "inclusiveMax", "count", "unique",
  "feel", "created", "modified", "items", "entries",
  // Appended, never inserted (P10): files written before a key existed keep
  // their exact bytes when saved again.
  "offer",
];
const ITEM_KEY_ORDER = ["id", "label", "weight", "disabled", "description", "color", "reaction", "image", "goesTo", "metadata", "imageData"];

function ordered(obj                         , order          )                          {
  const out                          = {};
  for (const k of order) if (obj[k] !== undefined) out[k] = obj[k];
  for (const k of Object.keys(obj)) if (!(k in out) && obj[k] !== undefined) out[k] = obj[k];
  return out;
}

function serialize(file             )         {
  const r = file.randomizer                                      ;
  const body = ordered(r, RANDOMIZER_KEY_ORDER);
  if (Array.isArray(body.items)) {
    body.items = (body.items                             ).map((i) => ordered(i, ITEM_KEY_ORDER));
  }
  const doc                          = {
    format: FORMAT,
    version: file.version ?? FORMAT_VERSION,
    ...(file.unknown ?? {}),
    randomizer: body,
  };
  return `${JSON.stringify(doc, null, 2)}\n`;
}

                               
                    
                                                                              
                    
                     
 

function parseFile(text        )               {
  let doc         ;
  try {
    doc = JSON.parse(text);
  } catch (e) {
    throw new ValidationError([{ path: "file", message: `not valid JSON (${(e         ).message})` }]);
  }
  const check = new Check();
  if (!check.object("file", doc)) check.throwIfFailed();
  const o = doc                           ;

  if (o.format !== FORMAT) {
    // Be generous about what we accept: a bare randomizer object is a common
    // thing to paste, and rejecting it on a technicality helps nobody.
    if (o.type && o.name) return parseFile(serialize({ format: FORMAT, version: FORMAT_VERSION, randomizer: o                          }));
    check.fail("file.format", `expected "${FORMAT}"`);
    check.throwIfFailed();
  }
  if (!check.number("file.version", o.version, { min: 1, integer: true })) check.throwIfFailed();

  const version = o.version          ;
  const readOnly = version > FORMAT_VERSION;
  const warnings           = [];
  if (readOnly) {
    warnings.push(
      `This file was made with a newer Orangey (format version ${version}). It is open for reading only.`,
    );
  }

  const migrated = migrate(o.randomizer, Math.min(version, FORMAT_VERSION));
  if (!validateRandomizer(migrated, check)) check.throwIfFailed();

  const known = new Set(["format", "version", "randomizer"]);
  const unknown                          = {};
  for (const [k, v] of Object.entries(o)) if (!known.has(k)) unknown[k] = v;

  return {
    file: {
      format: FORMAT,
      version,
      randomizer: migrated              ,
      ...(Object.keys(unknown).length ? { unknown } : {}),
    },
    readOnly,
    warnings,
  };
}

/**
 * Version migrations. Version 1 is the first, so there is nothing to do yet;
 * the chain exists so that adding version 2 is a one-line change here rather
 * than a rewrite of the loader.
 */
function migrate(randomizer         , fromVersion        )          {
  let r = randomizer;
  for (let v = fromVersion; v < FORMAT_VERSION; v++) {
    const step = MIGRATIONS[v];
    if (step) r = step(r);
  }
  return r;
}

const MIGRATIONS                                          = {};

function wrap(randomizer            )              {
  return { format: FORMAT, version: FORMAT_VERSION, randomizer };
}

/** Filename for a randomizer: slug of its name plus the double extension. */
function slugify(name        )         {
  const s = name
    .normalize("NFKD")
    .replace(/[̀-ͯ]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 64);
  return s || "untitled";
}

function fileNameFor(name        , taken                    = [])         {
  const base = slugify(name);
  let candidate = `${base}${FILE_SUFFIX}`;
  let n = 2;
  const lower = new Set(taken.map((t) => t.toLowerCase()));
  while (lower.has(candidate.toLowerCase())) {
    candidate = `${base}-${n}${FILE_SUFFIX}`;
    n++;
  }
  return candidate;
}

// ---- src/storage/paths.ts ----------------------------------------
/** Library paths: "/"-separated, no leading slash, folders have no trailing slash. */

const ROOT = "";

function join(...parts          )         {
  return parts.filter((p) => p !== "" && p !== ROOT).join("/");
}

function parent(path        )         {
  const i = path.lastIndexOf("/");
  return i < 0 ? ROOT : path.slice(0, i);
}

function basename(path        )         {
  const i = path.lastIndexOf("/");
  return i < 0 ? path : path.slice(i + 1);
}

function segments(path        )           {
  return path === ROOT ? [] : path.split("/");
}

function isInside(path        , folder        )          {
  if (folder === ROOT) return true;
  return path === folder || path.startsWith(`${folder}/`);
}

/** Folder and file names the user types; keep them usable on every OS. */
function sanitizeName(name        )         {
  return name
    .replace(/[\\/:*?"<>|]/g, "-")
    .replace(/\s+/g, " ")
    .replace(/^[. ]+|[. ]+$/g, "")
    .slice(0, 80);
}

/** Natural sort: "Chapter 2" before "Chapter 10" (decision D11). */
function naturalCompare(a        , b        )         {
  return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
}

// ---- src/storage/library.ts --------------------------------------
/**
 * The library: a folder tree of .orangey.json files (plan C5, decision D11).
 *
 * There is deliberately no index file. The folder tree IS the library, so a
 * library kept in Dropbox or Git cannot develop a conflict between the files
 * and an index that claims to describe them. Ordering is alphabetical with
 * natural number handling; per-user extras (favourites, recents) live in the
 * app database, not in the user's files.
 */






                        
               
                          
 

/**
 * Where the image store keeps its files, at the top of the library.
 *
 * It is named here rather than in `images.ts` because the tree builder has to
 * know the name to leave it out, and a folder importing the store it is
 * meant to ignore would be a cycle.
 */
const IMAGE_DIR = "images";

                                 
                                                             
                                                                                     
                         
                             
                                       
                                      
                                                       
     
                                                                              
                                                                              
                                                                        
                                             
     
                                               
                                                             
                                     
                                                
                                      
 

                              
                          
               
               
                           
                                                                                   
                                 
                     
                 
     
                                                                           
    
                                                                            
                                                                             
                                                                    
     
                                   
 

                            
                    
                                                                              
                                                     
                 
 

const isRandomizerFile = (name        ) => name.toLowerCase().endsWith(FILE_SUFFIX);

class LibraryService {
  backend                ;
  #tree                     = null;
  /**
   * Every node by path and by randomizer id.
   *
   * `find` and `findById` are called from render loops — the tree draws one
   * row per file and each asks — and both used to walk the whole tree. The
   * maps are rebuilt in one pass whenever the tree changes, which is far less
   * often than they are read.
   */
  #byPath = new Map                     ();
  #byId = new Map                     ();
  #pending = new Map                ();
  #timer                                       = null;
  #writeDelayMs        ;
  #listeners = new Set            ();
  #errorListeners = new Set                          ();
  /** Resolves when every debounced write has hit the backend. */
  #flushing                = Promise.resolve();

  constructor(backend                , writeDelayMs = 400) {
    this.backend = backend;
    this.#writeDelayMs = writeDelayMs;
  }

  /**
   * Told when the shape of the library changes: a file created, renamed,
   * moved or deleted, or the whole tree re-read.
   *
   * Not when a randomizer's contents change. `save()` is called on every
   * keystroke in the editor, and a tree that redrew each time would throw
   * away the row the user is typing in — the editor updates its own preview.
   */
  onChange(fn            )             {
    this.#listeners.add(fn);
    return () => this.#listeners.delete(fn);
  }

  /**
   * Told when a flush could not write. This is the failure signal the UI acts
   * on: the change stays queued, so the app must say so rather than let a
   * person keep typing into a file that is no longer being saved.
   */
  onError(fn                          )             {
    this.#errorListeners.add(fn);
    return () => this.#errorListeners.delete(fn);
  }

  #emit()       {
    for (const fn of this.#listeners) fn();
  }

  get tree()              {
    return this.#tree ?? { kind: "folder", path: "", name: "Library", children: [] };
  }

  async refresh()                       {
    this.#tree = await this.#readFolder("", "Library");
    this.#reindex();
    this.#emit();
    return this.#tree;
  }

  /** Rebuild the lookups from the tree. Depth first, so the first id wins. */
  #reindex()       {
    this.#byPath = new Map();
    this.#byId = new Map();
    const walk = (node             )       => {
      this.#byPath.set(node.path, node);
      const id = node.randomizer?.id;
      if (id && !this.#byId.has(id)) this.#byId.set(id, node);
      for (const child of node.children ?? []) walk(child);
    };
    if (this.#tree) walk(this.#tree);
  }

  /** The order `#readFolder` produces: folders by name, then files by title. */
  #sortChildren(folder             )       {
    const children = folder.children ?? [];
    const folders = children.filter((c) => c.kind === "folder").sort((a, b) => naturalCompare(a.name, b.name));
    const files = children.filter((c) => c.kind === "file").sort((a, b) => naturalCompare(this.#title(a), this.#title(b)));
    folder.children = [...folders, ...files];
  }

  /**
   * Put a node in its folder, or say it could not be done.
   *
   * A patch is only safe when the tree is loaded and the folder is in it; a
   * caller that gets false falls back to a full `refresh()`.
   */
  #attach(parentPath        , node             )          {
    const parent_ = this.#byPath.get(parentPath);
    if (!parent_ || parent_.kind !== "folder") return false;
    parent_.children = [...(parent_.children ?? []), node];
    this.#sortChildren(parent_);
    this.#reindex();
    this.#emit();
    return true;
  }

  /** Take a node out of the tree. False when it was not there to take. */
  #detach(path        )          {
    const node = this.#byPath.get(path);
    if (!node || node === this.#tree) return false;
    const parent_ = this.#byPath.get(parent(path));
    if (!parent_?.children) return false;
    parent_.children = parent_.children.filter((c) => c !== node);
    return true;
  }

  async #readFolder(path        , name        )                       {
    const entries = await this.backend.list(path);
    // The image store's folder is the app's bookkeeping, not part of anyone's
    // library, so it is never a folder you can open, move or save into. Only
    // at the top: a folder of pictures the user made themselves is theirs.
    const wanted = entries.filter(
      (e) => !(path === "" && e.kind === "folder" && e.name === IMAGE_DIR) && (e.kind === "folder" || isRandomizerFile(e.name)),
    );
    // Together rather than one after another: a library of two hundred files
    // was two hundred round trips to the backend, each waiting for the last.
    const children = await Promise.all(
      wanted.map((e) =>
        e.kind === "folder" ? this.#readFolder(join(path, e.name), e.name) : this.#readFile(join(path, e.name), e.name),
      ),
    );
    const folders = children.filter((c) => c.kind === "folder");
    const files = children.filter((c) => c.kind === "file");
    folders.sort((a, b) => naturalCompare(a.name, b.name));
    files.sort((a, b) => naturalCompare(this.#title(a), this.#title(b)));
    return { kind: "folder", path, name, children: [...folders, ...files] };
  }

  #title(node             )         {
    return node.randomizer?.name ?? node.name;
  }

  async #readFile(path        , name        )                       {
    try {
      const text = await this.backend.read(path);
      const out = parseFile(text);
      return {
        kind: "file",
        path,
        name,
        randomizer: out.file.randomizer,
        readOnly: out.readOnly,
        ...(out.file.unknown ? { extras: out.file.unknown } : {}),
      };
    } catch (e) {
      const message = e instanceof ValidationError ? e.issues.map((i) => `${i.path}: ${i.message}`).join("; ") : String(e);
      return { kind: "file", path, name, randomizer: null, error: message };
    }
  }

  /** Every file in the tree, depth first. */
  files(node              = this.tree)                {
    if (node.kind === "file") return [node];
    return (node.children ?? []).flatMap((c) => this.files(c));
  }

  folders(node              = this.tree)                {
    if (node.kind === "file") return [];
    return [node, ...(node.children ?? []).flatMap((c) => this.folders(c))];
  }

  find(path        )                     {
    if (!this.#tree) return path === "" ? this.tree : null;
    return this.#byPath.get(path) ?? null;
  }

  findById(id        )                     {
    return this.#byId.get(id) ?? null;
  }

  /** Search names, tags, descriptions and outcome labels. */
  search(query        )              {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    const hits              = [];
    for (const node of this.files()) {
      const r = node.randomizer;
      if (!r) continue;
      if (r.name.toLowerCase().includes(q)) {
        hits.push({ node, reason: "name", detail: r.name });
        continue;
      }
      if (r.tags?.some((t) => t.toLowerCase().includes(q))) {
        hits.push({ node, reason: "tag", detail: r.tags.find((t) => t.toLowerCase().includes(q))  });
        continue;
      }
      if (r.type === "list") {
        const item = r.items.find((i) => i.label.toLowerCase().includes(q));
        if (item) {
          hits.push({ node, reason: "outcome", detail: item.label });
          continue;
        }
      }
      if (r.description?.toLowerCase().includes(q)) {
        hits.push({ node, reason: "description", detail: r.description });
      }
    }
    return hits;
  }

  // ---- mutations -----------------------------------------------------------

  async createFolder(parentPath        , name        )                  {
    const clean = sanitizeName(name) || "New folder";
    const existing = (await this.backend.list(parentPath)).map((e) => e.name.toLowerCase());
    let final = clean;
    let n = 2;
    while (existing.includes(final.toLowerCase())) final = `${clean} ${n++}`;
    const path = join(parentPath, final);
    await this.backend.mkdir(path);
    // One node into the tree rather than re-reading every file in the
    // library: a create used to cost a full walk of the folder structure.
    if (!this.#attach(parentPath, { kind: "folder", path, name: final, children: [] })) await this.refresh();
    return path;
  }

  async create(parentPath        , randomizer            )                  {
    const taken = (await this.backend.list(parentPath)).map((e) => e.name);
    const path = join(parentPath, fileNameFor(randomizer.name, taken));
    await this.backend.write(path, serialize(wrap(randomizer)));
    if (!this.#attach(parentPath, { kind: "file", path, name: basename(path), randomizer })) await this.refresh();
    return path;
  }

  /** Queue a save. Repeated calls for the same file coalesce (plan C5). */
  save(path        , randomizer            )       {
    const node = this.find(path);
    this.#pending.set(path, serialize({ ...wrap(randomizer), unknown: node?.extras }));
    if (node) node.randomizer = randomizer;
    if (this.#timer) clearTimeout(this.#timer);
    this.#timer = setTimeout(() => void this.flush().catch(() => {}), this.#writeDelayMs);
  }

  get hasUnsavedChanges()          {
    return this.#pending.size > 0;
  }

  async flush()                {
    if (this.#timer) {
      clearTimeout(this.#timer);
      this.#timer = null;
    }
    // `#flushing` must never hold a rejected promise: a `then` chained onto
    // one is skipped, which is how a single failed write used to stop the app
    // saving for the rest of the session.
    //
    // The batch is taken inside the run rather than here, so that one run's
    // snapshot, writes and restores are serialised against every other run's.
    // Snapshotting at call time instead lets a second flush lift a newer text
    // out of `#pending` before an earlier, slower flush fails — the guard
    // below then sees an empty map, puts the older text back, and the next
    // flush writes it over the newer one.
    const run = this.#flushing.then(async () => {
      const batch = [...this.#pending.entries()];
      this.#pending.clear();
      const failures            = [];
      for (const [path, text] of batch) {
        try {
          await this.backend.write(path, text);
        } catch (e) {
          failures.push(e);
          // Back into the queue, so the change is not lost and a later flush
          // can write it — but never over a newer edit of the same file.
          if (!this.#pending.has(path)) this.#pending.set(path, text);
        }
      }
      if (failures.length) {
        for (const fn of this.#errorListeners) fn(failures[0]);
        throw failures[0];
      }
    });
    this.#flushing = run.catch(() => {});
    await run;
  }

  async rename(path        , newName        )                  {
    await this.flush();
    const node = this.find(path);
    if (!node) throw new Error(`nothing at ${path}`);
    if (node.kind === "folder") {
      const clean = sanitizeName(newName) || basename(path);
      const target = join(parent(path), clean);
      if (target !== path) await this.backend.move(path, target);
      await this.refresh();
      return target;
    }
    const randomizer = { ...node.randomizer , name: newName, modified: new Date().toISOString() };
    const taken = (await this.backend.list(parent(path))).map((e) => e.name).filter((n) => n !== basename(path));
    const target = join(parent(path), fileNameFor(newName, taken));
    await this.backend.write(path, serialize({ ...wrap(randomizer), unknown: node.extras }));
    if (target !== path) await this.backend.move(path, target);
    // A renamed file stays in its folder but may sort somewhere else in it.
    if (this.#detach(path)) {
      node.path = target;
      node.name = basename(target);
      node.randomizer = randomizer;
      if (!this.#attach(parent(target), node)) await this.refresh();
    } else {
      await this.refresh();
    }
    return target;
  }

  async move(path        , toFolder        )                  {
    await this.flush();
    const name = basename(path);
    const taken = (await this.backend.list(toFolder)).map((e) => e.name);
    const finalName = taken.includes(name) && this.find(path)?.kind === "file"
      ? fileNameFor(this.find(path) .randomizer?.name ?? name.replace(FILE_SUFFIX, ""), taken)
      : name;
    const target = join(toFolder, finalName);
    if (target === path) return path;
    const node = this.find(path);
    await this.backend.move(path, target);
    // Only a file can be patched across: a folder carries a subtree whose
    // every path changes, which is what a full re-read is for.
    if (node?.kind === "file" && this.#detach(path)) {
      node.path = target;
      node.name = finalName;
      if (!this.#attach(toFolder, node)) await this.refresh();
    } else {
      await this.refresh();
    }
    return target;
  }

  async duplicate(path        )                  {
    await this.flush();
    const node = this.find(path);
    if (!node?.randomizer) throw new Error(`nothing to duplicate at ${path}`);
    const copy             = {
      ...node.randomizer,
      id: newId(),
      name: `${node.randomizer.name} (copy)`,
      created: new Date().toISOString(),
      modified: new Date().toISOString(),
    };
    if (copy.type === "list") copy.items = copy.items.map((i) => ({ ...i, id: newId() }));
    return this.create(parent(path), copy);
  }

  async remove(path        )                {
    await this.flush();
    await this.backend.remove(path);
    // Dropping the node drops everything under it, which is what the backend
    // just did on disk.
    if (this.#detach(path)) {
      this.#reindex();
      this.#emit();
    } else {
      await this.refresh();
    }
  }

  /**
   * Import a whole library from ZIP entries. Files that already exist are
   * handled by `onCollision`, which answers "replace", "keep-both" or "skip"
   * per file — the UI asks the user; tests answer programmatically.
   */
  async importArchive(
    entries                                  ,
    onCollision                                                             ,
  )                                                                                {
    await this.flush();
    const result = { added: 0, replaced: 0, skipped: 0, failed: 0 };
    for (const entry of entries) {
      if (!isRandomizerFile(entry.path)) continue;
      let parsed;
      try {
        parsed = parseFile(entry.text);
      } catch {
        result.failed++;
        continue;
      }
      const folder = parent(entry.path);
      if (folder) await this.backend.mkdir(folder);
      const exists = this.find(entry.path) !== null;
      if (!exists) {
        // Two files sharing an id make every link and board entry pointing at
        // it ambiguous, so an arrival that clashes with a file already here
        // is given a new one. The text is otherwise passed through untouched.
        const clash = this.findById(parsed.file.randomizer.id);
        await this.backend.write(
          entry.path,
          clash && clash.path !== entry.path
            ? serialize({ ...parsed.file, randomizer: { ...parsed.file.randomizer, id: newId() } })
            : entry.text,
        );
        result.added++;
        continue;
      }
      const answer = await onCollision(entry.path);
      if (answer === "skip") {
        result.skipped++;
      } else if (answer === "replace") {
        await this.backend.write(entry.path, entry.text);
        result.replaced++;
      } else {
        const taken = (await this.backend.list(folder)).map((e) => e.name);
        const copy = { ...parsed.file.randomizer, id: newId() };
        await this.backend.write(join(folder, fileNameFor(copy.name, taken)), serialize(wrap(copy)));
        result.added++;
      }
    }
    await this.refresh();
    return result;
  }

  /** Every folder in the tree with its depth, for a folder picker. */
  folderList()                                                  {
    return this.folders().map((f) => ({ path: f.path, name: f.path === "" ? "Library" : f.name, depth: segments(f.path).length }));
  }

  /** Depth of a node, for indenting the tree. */
  depth(path        )         {
    return segments(path).length;
  }
}

// ---- src/storage/memory.ts ---------------------------------------
/**
 * An in-memory library backend.
 *
 * It is the reference implementation the shared backend test suite runs
 * against, and it is what the app falls back to if neither OPFS nor a chosen
 * folder is available — a session with no persistence is better than an app
 * that refuses to start.
 */

                                                          


const memoryEncoder = new TextEncoder();
const memoryDecoder = new TextDecoder();

class MemoryBackend                           {
           kind = "memory";
           label = "This session only";
           writable = true;
  /**
   * One map for both kinds of file. A file is held as whatever it was written
   * as, and converted on the way out, so moving or removing a folder does not
   * have to know which of its files are pictures.
   */
  #files = new Map                             ();
  #folders = new Set        ([""]);

  async list(path        )                   {
    const out          = [];
    for (const f of this.#folders) {
      if (f !== "" && parent(f) === path) out.push({ name: basename(f), kind: "folder" });
    }
    for (const f of this.#files.keys()) {
      if (parent(f) === path) out.push({ name: basename(f), kind: "file" });
    }
    return out;
  }

  async read(path        )                  {
    const content = this.#files.get(path);
    if (content === undefined) throw new Error(`no file at ${path}`);
    return typeof content === "string" ? content : memoryDecoder.decode(content);
  }

  async write(path        , contents        )                {
    this.#ensureFolders(parent(path));
    this.#files.set(path, contents);
  }

  async readBytes(path        )                      {
    const content = this.#files.get(path);
    if (content === undefined) throw new Error(`no file at ${path}`);
    return typeof content === "string" ? memoryEncoder.encode(content) : content;
  }

  async writeBytes(path        , bytes            )                {
    this.#ensureFolders(parent(path));
    // A copy: the caller may reuse or resize the buffer it handed us, and a
    // file that changes under the library is a bug with no witness.
    this.#files.set(path, bytes.slice());
  }

  async mkdir(path        )                {
    this.#ensureFolders(path);
  }

  async move(from        , to        )                {
    if (this.#files.has(from)) {
      this.#ensureFolders(parent(to));
      this.#files.set(to, this.#files.get(from) );
      this.#files.delete(from);
      return;
    }
    if (!this.#folders.has(from)) throw new Error(`nothing at ${from}`);
    this.#ensureFolders(to);
    for (const f of [...this.#folders]) {
      if (f === from || f.startsWith(`${from}/`)) {
        this.#folders.delete(f);
        this.#folders.add(to + f.slice(from.length));
      }
    }
    for (const [p, content] of [...this.#files]) {
      if (p.startsWith(`${from}/`)) {
        this.#files.delete(p);
        this.#files.set(to + p.slice(from.length), content);
      }
    }
  }

  async remove(path        )                {
    if (this.#files.delete(path)) return;
    if (!this.#folders.has(path)) throw new Error(`nothing at ${path}`);
    for (const f of [...this.#folders]) if (f === path || f.startsWith(`${path}/`)) this.#folders.delete(f);
    for (const p of [...this.#files.keys()]) if (p.startsWith(`${path}/`)) this.#files.delete(p);
  }

  #ensureFolders(path        )       {
    if (path === "") return;
    const parts = path.split("/");
    for (let i = 1; i <= parts.length; i++) this.#folders.add(parts.slice(0, i).join("/"));
  }

  /** Test helper: everything the backend holds, for assertions. */
  snapshot()                         {
    return Object.fromEntries([...this.#files].map(([p, c]) => [p, typeof c === "string" ? c : memoryDecoder.decode(c)]));
  }
}

// ---- src/storage/fsdir.ts ----------------------------------------
/**
 * A library backend over any FileSystemDirectoryHandle.
 *
 * Both storage backends the browser offers have the same shape, so they share
 * this implementation: OPFS hands us a private root, and the File System
 * Access API hands us a folder the user picked. The only differences are the
 * label, and that a picked folder can be revoked.
 */

                                                          



                                           

class DirectoryBackend                           {
           kind                ;
           label        ;
  writable = true;
  #root           ;

  constructor(root           , kind                , label        ) {
    this.#root = root;
    this.kind = kind;
    this.label = label;
  }

  async #dir(path        , create = false)                     {
    let dir = this.#root;
    for (const part of segments(path)) {
      dir = await dir.getDirectoryHandle(part, { create });
    }
    return dir;
  }

  async list(path        )                   {
    const dir = await this.#dir(path);
    const out          = [];
    // @ts-ignore - async iteration over directory entries
    for await (const [name, handle] of dir.entries()) {
      if (name.startsWith(".")) continue;
      out.push({ name, kind: handle.kind === "directory" ? "folder" : "file" });
    }
    return out;
  }

  async read(path        )                  {
    const dir = await this.#dir(parent(path));
    const handle = await dir.getFileHandle(basename(path));
    const file = await handle.getFile();
    return file.text();
  }

  async write(path        , contents        )                {
    await this.#writeFile(path, contents);
  }

  /**
   * Pictures are written as themselves. A .png in the library folder is a .png
   * on the disk, so the owner can open it, edit it in whatever they draw with,
   * and drop a new one over it.
   */
  async readBytes(path        )                      {
    const dir = await this.#dir(parent(path));
    const handle = await dir.getFileHandle(basename(path));
    const file = await handle.getFile();
    return new Uint8Array(await file.arrayBuffer());
  }

  async writeBytes(path        , bytes            )                {
    await this.#writeFile(path, bytes);
  }

  /**
   * Write through a temporary file and rename, so an interrupted write cannot
   * leave a half-written randomizer behind. Where rename is unavailable we
   * write in place and accept the smaller guarantee rather than failing.
   */
  async #writeFile(path        , contents                     )                {
    const dir = await this.#dir(parent(path), true);
    const name = basename(path);
    const tmpName = `.${name}.tmp`;
    try {
      const tmp = await dir.getFileHandle(tmpName, { create: true });
      const stream = await tmp.createWritable();
      await stream.write(contents                            );
      await stream.close();
      // @ts-ignore - move() is not in every lib.dom yet
      if (typeof tmp.move === "function") {
        // @ts-ignore
        await tmp.move(dir, name);
        return;
      }
      const target = await dir.getFileHandle(name, { create: true });
      const out = await target.createWritable();
      await out.write(contents                            );
      await out.close();
      await dir.removeEntry(tmpName).catch(() => {});
    } catch {
      const target = await dir.getFileHandle(name, { create: true });
      const out = await target.createWritable();
      await out.write(contents                            );
      await out.close();
      // Whatever went wrong above may still have made the temp file, and a
      // folder of ".forest.orangey.json.tmp" is the user's folder, not ours.
      await dir.removeEntry(tmpName).catch(() => {});
    }
  }

  async mkdir(path        )                {
    await this.#dir(path, true);
  }

  async move(from        , to        )                {
    const fromDir = await this.#dir(parent(from));
    let handle                  ;
    try {
      handle = await fromDir.getFileHandle(basename(from));
    } catch {
      handle = await fromDir.getDirectoryHandle(basename(from));
    }
    const toDir = await this.#dir(parent(to), true);
    // @ts-ignore - move() where available is atomic and cheap
    if (typeof (handle                      ).move === "function") {
      // @ts-ignore
      await handle.move(toDir, basename(to));
      return;
    }
    if (handle.kind === "file") {
      // Bytes, not text: a folder being moved may hold pictures, and a PNG
      // that went out through a TextDecoder would arrive unopenable.
      await this.writeBytes(to, await this.readBytes(from));
      await this.remove(from);
      return;
    }
    await this.#copyTree(from, to);
    await this.remove(from);
  }

  async #copyTree(from        , to        )                {
    await this.mkdir(to);
    for (const entry of await this.list(from)) {
      const src = `${from}/${entry.name}`;
      const dst = `${to}/${entry.name}`;
      if (entry.kind === "folder") await this.#copyTree(src, dst);
      else await this.writeBytes(dst, await this.readBytes(src));
    }
  }

  async remove(path        )                {
    const dir = await this.#dir(parent(path));
    await dir.removeEntry(basename(path), { recursive: true });
  }
}

/**
 * The origin-private filesystem, but only where it can be written to.
 *
 * Safari up to 18 — every browser on an iPhone or iPad running iOS 18, since
 * they all use its engine — hands out the directory and lists it, and has no
 * `createWritable()`: reads succeed and every write throws. A library that
 * can be listed but not written to is worse than none, because the first
 * write is the starters, the next is the person's first wheel, and each of
 * them fails after the app has already opened. So the check is a write: one
 * small file, made and removed, and any failure at all sends the caller on
 * to IndexedDB, which those browsers do have.
 */
async function openOpfs()                                   {
  try {
    const root = await navigator.storage.getDirectory();
    const library = await root.getDirectoryHandle("library", { create: true });
    const backend = new DirectoryBackend(library, "opfs", "Browser storage");
    await backend.write(PROBE_NAME, "");
    await backend.remove(PROBE_NAME);
    return backend;
  } catch {
    return null;
  }
}

/** Dot-prefixed so that a probe left behind by a crash never shows in the tree. */
const PROBE_NAME = ".orangey-write-probe";

function canPickFolder()          {
  return typeof (globalThis                                     ).showDirectoryPicker === "function";
}

/** What this browser can do about keeping a library, as far as the advice cares. */
                             
                         
     
                                                                              
                                                                               
                                                                      
     
               
                                                                           
                      
 

function storageEnv()             {
  const nav = globalThis.navigator                                                      ;
  const displayStandalone = typeof globalThis.matchMedia === "function" && globalThis.matchMedia("(display-mode: standalone)").matches;
  return {
    canPickFolder: canPickFolder(),
    ios: typeof nav?.standalone === "boolean",
    standalone: nav?.standalone === true || displayStandalone,
  };
}

/**
 * What to tell someone whose library cannot live in a folder.
 *
 * A folder is where the library is safest, and most browsers that cannot pick
 * one are Safari, which clears the storage of a site nobody has opened for
 * about a week — unless it runs as a home-screen (iPhone, iPad) or Dock (Mac)
 * app. The one-time notice is for the case where that matters most and the
 * fix is one tap away: an iPhone or iPad, in a browser tab. Nowhere else.
 */
function storageAdvice(env            )                                                     {
  if (env.canPickFolder) return { note: null, homeScreenNotice: false };
  if (env.ios) {
    return env.standalone
      ? {
          note: "On iPhone and iPad no browser can keep the library in a folder, so it lives in Orangey's own storage. Running from the Home Screen keeps it safe from Safari's clear-out; export a ZIP now and then as your backup.",
          homeScreenNotice: false,
        }
      : {
          note: "On iPhone and iPad no browser can keep the library in a folder, and Safari clears the storage of a site nobody has opened for about a week. Add Orangey to your Home Screen (Share, then Add to Home Screen) and the library stays; export a ZIP now and then as your backup.",
          homeScreenNotice: true,
        };
  }
  return {
    note: "This browser cannot keep the library in a folder; Chrome and Edge can, on Windows, Mac and Linux. Safari may clear the storage of a site nobody has opened for about a week, which adding it to the Dock (File, then Add to Dock) prevents. Either way, export a ZIP now and then as your backup.",
    homeScreenNotice: false,
  };
}

async function pickFolder()                                   {
  if (!canPickFolder()) return null;
  // @ts-ignore - not in every lib.dom
  const handle            = await globalThis.showDirectoryPicker({ id: "orangey-library", mode: "readwrite" });
  const permission = await (handle                                                                      )
    .requestPermission?.({ mode: "readwrite" });
  const backend = new DirectoryBackend(handle, "fsa", handle.name);
  if (permission === "denied") backend.writable = false;
  // Remember the folder: a directory handle can be stored in IndexedDB and
  // reopened next time, so the choice survives a reload instead of quietly
  // falling back to browser storage.
  await appdb.set("folderHandle", handle);
  return backend;
}

/**
 * Reopen the folder chosen last time, if the browser still lets us.
 * Returns the backend when permission is already granted, "ask" when the user
 * has to click to grant it again (browsers require a gesture), or null when
 * no folder was ever chosen.
 */
async function reopenFolder()                                           {
  const handle = await appdb.get           ("folderHandle");
  if (!handle) return null;
  try {
    const query = (handle                                                                    ).queryPermission;
    const state = query ? await query.call(handle, { mode: "readwrite" }) : "granted";
    if (state === "granted") return new DirectoryBackend(handle, "fsa", handle.name);
    return "ask";
  } catch {
    return null;
  }
}

/** Grant access again after a reload; must be called from a click. */
async function regrantFolder()                                   {
  const handle = await appdb.get           ("folderHandle");
  if (!handle) return null;
  const request = (handle                                                                      ).requestPermission;
  const state = request ? await request.call(handle, { mode: "readwrite" }) : "granted";
  return state === "granted" ? new DirectoryBackend(handle, "fsa", handle.name) : null;
}

async function forgetFolder()                {
  await appdb.set("folderHandle", null);
}

/** The name of the remembered folder, for the reconnect prompt. */
async function rememberedFolderName()                         {
  const handle = await appdb.get           ("folderHandle");
  return handle?.name ?? null;
}

// ---- src/storage/idb.ts ------------------------------------------
/**
 * A library backend on IndexedDB.
 *
