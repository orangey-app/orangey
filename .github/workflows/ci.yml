name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - run: npm test
      - run: npm run build:single
      - name: Browser tests
        run: |
          CHROME_PATH="$(which google-chrome || which chromium-browser || which chromium)"
          echo "using $CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: orangey-html
          path: dist/orangey.html
